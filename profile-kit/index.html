<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "HFMono";
        src: url("assets/fonts/consolab.ttf") format("truetype");
        font-weight: 700;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #defs {
        position: absolute;
        width: 0;
        height: 0;
      }
      .scene {
        position: absolute;
        inset: 0;
        visibility: hidden;
      }
      .scene svg,
      .scene img {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      .band {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 760px;
        background: linear-gradient(#000 0, rgba(0, 0, 0, 0.92) 330px, rgba(0, 0, 0, 0.55) 560px, rgba(0, 0, 0, 0) 760px);
      }
      .title {
        position: absolute;
        left: 0;
        right: 0;
        top: 300px;
        text-align: center;
        font-family: "HFMono", monospace;
        font-weight: 700;
        font-size: 92px;
        line-height: 1.12;
        letter-spacing: 0.06em;
        color: #fff;
        text-shadow: 0 0 18px rgba(255, 255, 255, 0.45), 0 0 4px rgba(0, 0, 0, 1);
      }
      .title b {
        color: #ff3b30;
        text-shadow: 0 0 22px rgba(214, 42, 42, 0.8), 0 0 4px rgba(0, 0, 0, 1);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <svg id="defs" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="spot" cx="0.5" cy="0" r="1">
            <stop offset="0" stop-color="#fff" stop-opacity="0.34" />
            <stop offset="0.55" stop-color="#fff" stop-opacity="0.06" />
            <stop offset="1" stop-color="#fff" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="hb" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#2a2a2a" />
            <stop offset="1" stop-color="#000" />
          </radialGradient>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16" /></filter>
          <filter id="glowS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" /></filter>
        </defs>
      </svg>
      <!-- 0: profile photo (square content centered, y 420..1500) -->
      <div class="scene clip" id="s0" data-start="0" data-duration="1" data-track-index="0">
        <svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(0 420)">
            <polygon points="380,-20 700,-20 1000,1080 80,1080" fill="url(#spot)" />
            <g id="avStairs"></g>
            <g id="avFig"></g>
          </g>
        </svg>
      </div>
      <!-- 1-4: highlight covers (icon inside the round crop around 540,960) -->
      <div class="scene clip" id="s1" data-start="1" data-duration="1" data-track-index="1"><svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"><g class="hl"></g></svg></div>
      <div class="scene clip" id="s2" data-start="2" data-duration="1" data-track-index="2"><svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"><g class="hl"></g></svg></div>
      <div class="scene clip" id="s3" data-start="3" data-duration="1" data-track-index="3"><svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"><g class="hl"></g></svg></div>
      <div class="scene clip" id="s4" data-start="4" data-duration="1" data-track-index="4"><svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"><g class="hl"></g></svg></div>
      <!-- 5-9: reel covers (title inside the 3:4 grid crop, y 240..1680) -->
      <div class="scene clip" id="s5" data-start="5" data-duration="1" data-track-index="5"><img src="assets/frames/01.jpg" /><div class="band"></div><div class="title">MOTIVATION<br />VS <b>DISCIPLINE</b></div></div>
      <div class="scene clip" id="s6" data-start="6" data-duration="1" data-track-index="6"><img src="assets/frames/02.jpg" /><div class="band"></div><div class="title">WHY YOU'RE<br />STILL <b>STUCK</b></div></div>
      <div class="scene clip" id="s7" data-start="7" data-duration="1" data-track-index="7"><img src="assets/frames/03.jpg" /><div class="band"></div><div class="title">WINNER VS <b>LOSER</b><br />MORNING</div></div>
      <div class="scene clip" id="s8" data-start="8" data-duration="1" data-track-index="8"><img src="assets/frames/04.jpg" /><div class="band"></div><div class="title">HOW LOVE<br />SLOWLY <b>DIES</b></div></div>
      <div class="scene clip" id="s9" data-start="9" data-duration="1" data-track-index="9"><img src="assets/frames/05.jpg" /><div class="band"></div><div class="title">LOVE IS<br />A <b>BRIDGE</b></div></div>
    </div>
    <script>
      (() => {
        const NS = "http://www.w3.org/2000/svg";
        const el = (tag, attrs, parent) => {
          const n = document.createElementNS(NS, tag);
          for (const k in attrs) n.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(n);
          return n;
        };
        const pl = (...pts) => "M" + pts.map((p) => p.join(" ")).join(" L");
        const round = { fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" };

        // Stickman: glow copy, black outline, white limbs (same look as the reels).
        function fig(g, f, w) {
          const limbs = [pl(f.neck, f.hip), pl(f.hip, f.lk, f.lf), pl(f.hip, f.rk, f.rf), pl(f.sh, f.le, f.lh), pl(f.sh, f.re, f.rh)];
          const glow = el("g", { filter: "url(#glow)", opacity: 0.75 }, g);
          for (const d of limbs) el("path", { d, stroke: "#fff", "stroke-width": w * 1.5, ...round }, glow);
          el("circle", { cx: f.head[0], cy: f.head[1], r: f.r * 1.15, fill: "#fff" }, glow);
          for (const d of limbs) el("path", { d, stroke: "#000", "stroke-width": w + 16, ...round }, g);
          el("circle", { cx: f.head[0], cy: f.head[1], r: f.r + 8, fill: "#000" }, g);
          for (const d of limbs) el("path", { d, stroke: "#fff", "stroke-width": w, ...round }, g);
          el("circle", { cx: f.head[0], cy: f.head[1], r: f.r, fill: "#fff" }, g);
        }
        // Stone stairs going up to the right; the top step edge is the red accent.
        function stairs(g, x0, y0, sw, sh, n) {
          for (let k = 0; k < n; k++) {
            const x = x0 + k * sw, y = y0 - (k + 1) * sh;
            el("rect", { x, y, width: 2000, height: (k + 1) * sh, fill: k % 2 ? "#c9c2b5" : "#d3ccbf" }, g);
            el("rect", { x, y, width: 2000, height: 8, fill: k === n - 1 ? "#d62a2a" : "#f2ede4" }, g);
          }
        }
        function hlBg(g) {
          el("rect", { x: 0, y: 0, width: 1080, height: 1920, fill: "#000" }, g);
          el("circle", { cx: 540, cy: 960, r: 540, fill: "url(#hb)" }, g);
        }

        // ---- 0: profile photo: glowing doer stepping up the stairs ----
        const avS = document.getElementById("avStairs");
        stairs(avS, 470, 950, 170, 130, 3);
        el("rect", { x: 0, y: 950, width: 1080, height: 200, fill: "#0b0b0b" }, avS);
        fig(document.getElementById("avFig"), {
          head: [646, 338], r: 62,
          neck: [626, 420], hip: [590, 600], sh: [622, 445],
          lk: [715, 560], lf: [745, 690],
          rk: [608, 720], rf: [534, 820],
          le: [702, 505], lh: [764, 446],
          re: [572, 535], rh: [514, 588],
        }, 34);

        const hls = [...document.querySelectorAll(".hl")];
        // START HERE: waving stickman
        hlBg(hls[0]);
        fig(hls[0], {
          head: [540, 700], r: 58, neck: [540, 778], hip: [540, 965], sh: [540, 800],
          lk: [505, 1070], lf: [478, 1180], rk: [575, 1070], rf: [602, 1180],
          le: [472, 880], lh: [452, 970], re: [632, 760], rh: [660, 660],
        }, 30);
        // DISCIPLINE: stairs, doer on top with a raised fist
        hlBg(hls[1]);
        stairs(hls[1], 330, 1180, 100, 85, 4);
        el("rect", { x: 0, y: 1180, width: 1080, height: 740, fill: "#000" }, hls[1]);
        fig(hls[1], {
          head: [683, 618], r: 36, neck: [683, 664], hip: [683, 752], sh: [683, 680],
          lk: [668, 798], lf: [660, 832], rk: [700, 798], rf: [708, 832],
          le: [650, 715], lh: [640, 760], re: [722, 640], rh: [736, 584],
        }, 20);
        // OVERTHINKING: hands on head, question marks (one red)
        hlBg(hls[2]);
        fig(hls[2], {
          head: [540, 880], r: 60, neck: [540, 962], hip: [540, 1130], sh: [540, 985],
          lk: [515, 1215], lf: [495, 1300], rk: [565, 1215], rf: [585, 1300],
          le: [438, 905], lh: [486, 852], re: [642, 905], rh: [594, 852],
        }, 28);
        [[420, 760, "#fff"], [540, 720, "#ff3b30"], [660, 760, "#fff"]].forEach(([x, y, c]) => {
          const t = el("text", { x, y, fill: c, "font-family": "HFMono, monospace", "font-weight": 700, "font-size": 110, "text-anchor": "middle" }, hls[2]);
          t.textContent = "?";
        });
        // LOVE: glowing red heart
        hlBg(hls[3]);
        const heart = "M540 1130 C 360 1010 310 900 375 822 C 430 758 510 772 540 842 C 570 772 650 758 705 822 C 770 900 720 1010 540 1130 Z";
        el("path", { d: heart, fill: "#d62a2a", filter: "url(#glow)", opacity: 0.9 }, hls[3]);
        el("path", { d: heart, fill: "#d62a2a", stroke: "#000", "stroke-width": 10 }, hls[3]);
        el("path", { d: "M430 860 C 450 835 480 830 500 845", stroke: "#ff8a80", "stroke-width": 14, ...round }, hls[3]);

        const scenes = [...document.querySelectorAll(".scene")];
        function render(t) {
          const idx = Math.max(0, Math.min(scenes.length - 1, Math.floor(t)));
          scenes.forEach((s, i) => (s.style.visibility = i === idx ? "visible" : "hidden"));
        }

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.to(clock, { t: 10, duration: 10, ease: "none", onUpdate: () => render(clock.t) }, 0);
        window.__timelines["main"] = tl;
        render(0);
        tl.seek(0);
      })();
    </script>
  </body>
</html>
