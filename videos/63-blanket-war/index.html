    <script>
      (function () {
        const DUR = 16;
        const FL = 600, BX0 = 380, BX1 = 520, BTOP = 410, TOPF = 404, SX = 250;
        const THIGH = 80, SHIN = 78, LEG = 154;
        const UARM = 64, FARM = 60, TORSO = 116, NECK = 12, HEADR = 31;
        const NS = "http://www.w3.org/2000/svg";
        const svgEl = (tag, attrs, parent) => {
          const e = document.createElementNS(NS, tag);
          for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(e);
          return e;
        };
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, p) => a + (b - a) * p;
        const ease = (p) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(p, 0, 1));
        const backOut = (p) => { p = clamp(p, 0, 1); const s = 2.2; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
        const win = (t, a, b) => ease((t - a) / (b - a));
        const rad = (x) => (x * Math.PI) / 180;
        const down = (a, f) => [Math.sin(rad(a)) * f, Math.cos(rad(a))];
        const up = (a, f) => [Math.sin(rad(a)) * f, -Math.cos(rad(a))];
        const r1 = (v) => Math.round(v * 10) / 10;
        const E = (id) => document.getElementById(id);
        let seed = 31;
        const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

        // ---------- rig v2 (from reel 05): blended poses, head/arm follow-through, breathing ----------
        function makeFig(parent, front, back, glow, id) {
          const g = svgEl("g", { id }, parent);
          if (glow) parent.insertBefore(svgEl("use", { href: "#" + id, filter: "url(#blur)", opacity: 0.45 }), g);
          const parts = { g };
          for (const [n, col] of [["armB", back], ["legB", back], ["torso", front], ["legF", front], ["armF", front]]) {
            const o = svgEl("path", { fill: "none", stroke: "#000", "stroke-width": 34, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            const w = svgEl("path", { fill: "none", stroke: col, "stroke-width": 22, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            parts[n] = [o, w];
          }
          parts.head = svgEl("circle", { r: HEADR, fill: front, stroke: "#000", "stroke-width": 6 }, g);
          return parts;
        }
        function ik(a, b, l1, l2, pick) {
          let dx = b[0] - a[0], dy = b[1] - a[1];
          let d = Math.hypot(dx, dy);
          const maxd = l1 + l2 - 0.5;
          if (d > maxd) {
            b = [a[0] + (dx / d) * maxd, a[1] + (dy / d) * maxd];
            dx = b[0] - a[0];
            dy = b[1] - a[1];
            d = maxd;
          }
          d = Math.max(d, Math.abs(l1 - l2) + 1);
          const al = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
          const base = Math.atan2(dy, dx);
          const c1 = [a[0] + Math.cos(base + al) * l1, a[1] + Math.sin(base + al) * l1];
          const c2 = [a[0] + Math.cos(base - al) * l1, a[1] + Math.sin(base - al) * l1];
          return [pick(c1, c2), b];
        }
        const P = (pts) => "M" + pts.map((p) => r1(p[0]) + " " + r1(p[1])).join("L");
        const setD = (pair, d) => {
          pair[0].setAttribute("d", d);
          pair[1].setAttribute("d", d);
        };
        // flat pose: hx hy torso head ax ay bx by | per arm a*/b*: sh el w tx ty
        function drawFig(parts, s, f) {
          const hip = [s.hx, s.hy];
          const tu = up(s.torso, f);
          const sh = [hip[0] + tu[0] * TORSO, hip[1] + tu[1] * TORSO];
          const nk = [hip[0] + tu[0] * (TORSO + NECK), hip[1] + tu[1] * (TORSO + NECK)];
          const hu = up(s.torso + s.head, f);
          const hc = [nk[0] + hu[0] * HEADR, nk[1] + hu[1] * HEADR];
          setD(parts.torso, P([hip, sh, nk]));
          parts.head.setAttribute("cx", r1(hc[0]));
          parts.head.setAttribute("cy", r1(hc[1]));
          const knee = (c1, c2) => (c1[0] * f > c2[0] * f ? c1 : c2);
          const elbow = (c1, c2) => (c1[1] - 0.5 * f * c1[0] > c2[1] - 0.5 * f * c2[0] ? c1 : c2);
          [["legF", [s.ax, s.ay]], ["legB", [s.bx, s.by]]].forEach(([n, ft]) => {
            const [kn, fo] = ik(hip, ft, THIGH, SHIN, knee);
            setD(parts[n], P([hip, kn, fo]));
          });
          const hands = [];
          [["armF", "a"], ["armB", "b"]].forEach(([n, k]) => {
            const u = down(s[k + "sh"], f);
            const el = [sh[0] + u[0] * UARM, sh[1] + u[1] * UARM];
            const v = down(s[k + "sh"] + s[k + "el"], f);
            const fk = [el[0] + v[0] * FARM, el[1] + v[1] * FARM];
            const w = clamp(s[k + "w"], 0, 1);
            const hand = [lerp(fk[0], s[k + "tx"], w), lerp(fk[1], s[k + "ty"], w)];
            const [e2, h2] = ik(sh, hand, UARM, FARM, elbow);
            setD(parts[n], P([sh, e2, h2]));
            hands.push(h2);
          });
          return { head: hc, hands, hip };
        }
        const KER = [-4, -3, -2, -1, 0, 1, 2, 3, 4].map((k) => [k * 0.03, Math.exp(-((k / 2.3) ** 2))]);
        function blend(raw, t) {
          const out = {};
          let ws = 0;
          for (const [dt, w] of KER) {
            const p = raw(clamp(t + dt, 0, DUR));
            for (const k in p) out[k] = (out[k] || 0) + p[k] * w;
            ws += w;
          }
          for (const k in out) out[k] /= ws;
          return out;
        }
        const LAGGED = ["head", "ash", "ael", "aw", "atx", "aty", "bsh", "bel", "bw", "btx", "bty"];
        function livePose(raw, t, phase) {
          const s = blend(raw, t);
          const lag = blend(raw, t - 0.05);
          for (const k of LAGGED) s[k] = lag[k];
          const br = Math.sin(t * 1.9 + phase);
          s.hy += br * 1.3;
          s.torso += br * 0.8;
          s.head += Math.sin(t * 1.2 + phase * 2) * 1.6;
          return s;
        }
        const ARMS = { ash: 8, ael: 12, aw: 0, atx: 0, aty: 0, bsh: -4, bel: 10, bw: 0, btx: 0, bty: 0 };
        const base = (o) => ({ hx: 0, hy: 0, torso: 3, head: 0, ax: 0, ay: FL, bx: 0, by: FL, ...ARMS, ...o });
        function standOn(x, f, fy) {
          return base({ hx: x, hy: fy - Math.sqrt(LEG * LEG - 15 * 15), ax: x + f * 15, ay: fy, bx: x - f * 15, by: fy });
        }
        const mixPose = (a, b, p) => {
          const o = {};
          for (const k in a) o[k] = lerp(a[k], b[k], p);

        };

        // ---------- "blanket war": newly married daily life montage. NIGHT: she rolls the whole blanket into a burrito, he shivers. MORNING: brushing teeth side by side, hip bumps. BREAKFAST: she proudly serves a burnt pancake, he eats it all "DELICIOUS!". NIGHT AGAIN: tug of war over the blanket... then she opens it and lets him in ----------
        // remake of a 3.7x outlier (Animationtv1, "Newly couple daily life"), see viral/2026-11-04-check.md
        const cam = E("svg").children[1];
        for (const el of Array.from(cam.children)) {

        }
        const W = E("world");

        const beams = E("beams");

        const stand = FL - Math.sqrt(LEG * LEG - 15 * 15);

        const SC = [0, 3.6, 6.0, 8.6];
        const LABELS = ["NIGHT.", "MORNING.", "BREAKFAST.", "NIGHT AGAIN."];
        const T_ROLL = 0.4, T_TUG1 = 1.7, T_YANK = 2.3, T_ZZZ = 2.5;
        const T_BUMP1 = 4.4, T_BUMP2 = 5.1, T_LAUGH = 5.5;
        const T_OFFER = 6.2, T_TAKE = 6.7, T_EAT = 6.9, T_YUM = 7.6, T_CLASP = 7.9;
        const T_WAR = 8.8, T_OPEN = 10.0, T_HOLD = 10.5;

        const SHE = 460, HE = 625;
        const sceneAt = (s) => (s < SC[1] ? 0 : s < SC[2] ? 1 : s < SC[3] ? 2 : 3);

        // ---- background: warm room glow (day), blue tint + moon (night)
        const glow = svgEl("circle", { cx: 560, cy: FL - 260, r: 460, fill: "url(#fireGlow)", opacity: 0.3 }, backG);
        svgEl("polygon", { points: `460,${FL - 520} 660,${FL - 520} 780,${FL} 340,${FL}`, fill: "url(#beam)", filter: "url(#soft)", opacity: 0.16 }, beams);
        svgEl("rect", { x: 140, y: FL - 400, width: 160, height: 260, fill: "#1e2430", stroke: "#2c2c2c", "stroke-width": 6 }, backG);
        const moon = svgEl("circle", { cx: 230, cy: FL - 330, r: 26, fill: "#f3efd8", opacity: 0 }, backG);

        const warm = svgEl("ellipse", { cx: 540, cy: FL - 200, rx: 320, ry: 240, fill: "url(#fireGlow)", opacity: 0 }, backG);

        // ---- BED (seen from the foot end): headboard, pillows, heads, bodies, blanket, footboard
        const bedG = svgEl("g", {}, roomG);

        svgEl("rect", { x: 345, y: 325, width: 390, height: 70, rx: 18, fill: "#4a3528", stroke: "#000", "stroke-width": 4 }, bedG);

        svgEl("rect", { x: 330, y: 470, width: 420, height: 170, fill: "#d9d9d9", stroke: "#000", "stroke-width": 5 }, bedG);
        const bodH = svgEl("rect", { width: 130, height: 190, rx: 40, fill: "#ffffff", stroke: "#000", "stroke-width": 5 }, bedG);
        const bodS = svgEl("rect", { width: 130, height: 190, rx: 40, fill: "#ffffff", stroke: "#000", "stroke-width": 5 }, bedG);
        const bunB = svgEl("circle", { r: 15, fill: "#ffffff", stroke: "#000", "stroke-width": 6 }, bedG);
        const headS = svgEl("circle", { r: 36, fill: "#ffffff", stroke: "#000", "stroke-width": 6 }, bedG);
        const headH = svgEl("circle", { r: 36, fill: "#ffffff", stroke: "#000", "stroke-width": 6 }, bedG);
        const blanket = svgEl("path", { fill: "#5b7fe0", stroke: "#000", "stroke-width": 6, "stroke-linejoin": "round" }, bedG);
        const wrap = svgEl("path", { fill: "none", stroke: "#3c5bb5", "stroke-width": 5, "stroke-linecap": "round" }, bedG);
        const fold = svgEl("path", { fill: "none", stroke: "#ffffff", "stroke-width": 5, opacity: 0.7 }, bedG);
        const gripS = svgEl("circle", { r: 13, fill: "#ffffff", stroke: "#000", "stroke-width": 5, opacity: 0 }, bedG);
        const gripH = svgEl("circle", { r: 13, fill: "#ffffff", stroke: "#000", "stroke-width": 5, opacity: 0 }, bedG);
        svgEl("rect", { x: 310, y: 590, width: 460, height: 70, rx: 14, fill: "#3b2a20", stroke: "#000", "stroke-width": 6 }, bedG);
        const brr = Array.from({ length: 2 }, () => svgEl("path", { fill: "none", stroke: "#bfe0ff", "stroke-width": 5, "stroke-linecap": "round", opacity: 0 }, bedG));
        const zzz = Array.from({ length: 3 }, (_, i) => { const tx = svgEl("text", { "font-family": "HFMono, monospace", "font-weight": 700, "font-size": 30 - i * 4, fill: "#fff", opacity: 0 }, bedG); tx.textContent = "Z"; return tx; });

        // ---- BATHROOM: sink counter + mirror
        const bathG = svgEl("g", {}, roomG);
        svgEl("rect", { x: 420, y: FL - 470, width: 240, height: 170, rx: 10, fill: "#28323f", stroke: "#000", "stroke-width": 6 }, bathG);
        svgEl("path", { d: `M450 ${FL - 440} L500 ${FL - 390} M470 ${FL - 445} L530 ${FL - 385}`, stroke: "#4a5a6e", "stroke-width": 6 }, bathG);
        svgEl("rect", { x: 400, y: FL - 230, width: 280, height: 40, rx: 8, fill: "#cfcfcf", stroke: "#000", "stroke-width": 5 }, bathG);

        svgEl("path", { d: `M540 ${FL - 230} L540 ${FL - 262} L566 ${FL - 262}`, fill: "none", stroke: "#bdbdbd", "stroke-width": 8 }, bathG);

        // ---- KITCHEN: stove with smoking pan
        const kitG = svgEl("g", {}, roomG);
        svgEl("rect", { x: 250, y: FL - 200, width: 150, height: 200, fill: "#2c2c2c", stroke: "#000", "stroke-width": 5 }, kitG);
        svgEl("rect", { x: 262, y: FL - 150, width: 126, height: 110, rx: 6, fill: "#1a1a1a", stroke: "#000", "stroke-width": 4 }, kitG);
        svgEl("path", { d: `M270 ${FL - 214} L360 ${FL - 214} M360 ${FL - 214} L410 ${FL - 230}`, stroke: "#000", "stroke-width": 12, "stroke-linecap": "round" }, kitG);
        svgEl("path", { d: `M270 ${FL - 214} L360 ${FL - 214} M360 ${FL - 214} L410 ${FL - 230}`, stroke: "#6a6a6a", "stroke-width": 6, "stroke-linecap": "round" }, kitG);
        const smoke = Array.from({ length: 5 }, () => svgEl("circle", { fill: "#6d6d6d", stroke: "#000", "stroke-width": 3, opacity: 0 }, fxG));

        const bun = svgEl("circle", { r: 15, fill: "#ffffff", stroke: "#000", "stroke-width": 6 }, figG);
        const her = makeFig(figG, "#ffffff", "#e2e2e2", true, "her");
        figG.insertBefore(bun, her.g.previousSibling);
        const him = makeFig(figG, "#ffffff", "#dedede", true, "him");
        const brushS = svgEl("g", { opacity: 0 }, fxG), brushH = svgEl("g", { opacity: 0 }, fxG);
        [brushS, brushH].forEach((g, i) => { svgEl("line", { x1: 0, y1: 0, x2: 0, y2: -44, stroke: "#000", "stroke-width": 10, "stroke-linecap": "round" }, g); svgEl("line", { x1: 0, y1: 0, x2: 0, y2: -44, stroke: i ? "#5bd0ff" : "#ff7aa8", "stroke-width": 5, "stroke-linecap": "round" }, g); svgEl("rect", { x: -4, y: -52, width: 10, height: 12, fill: "#fff", stroke: "#000", "stroke-width": 2 }, g); });
        const foam = Array.from({ length: 6 }, () => svgEl("circle", { r: 6, fill: "#fff", stroke: "#000", "stroke-width": 2, opacity: 0 }, fxG));
        const plate = svgEl("g", { opacity: 0 }, fxG);
        svgEl("ellipse", { cx: 0, cy: 0, rx: 46, ry: 12, fill: "#f0f0f0", stroke: "#000", "stroke-width": 4 }, plate);
        const cake = svgEl("ellipse", { cx: 0, cy: -10, rx: 30, ry: 10, fill: "#1a1a1a", stroke: "#000", "stroke-width": 3 }, plate);
        const fork = svgEl("path", { d: "M0 0 L0 -36 M-6 -36 L-6 -48 M0 -36 L0 -50 M6 -36 L6 -48 M-6 -36 L6 -36", stroke: "#cfcfcf", "stroke-width": 4, "stroke-linecap": "round", fill: "none", opacity: 0 }, fxG);
        const sweat = svgEl("path", { d: "M0 -14 Q10 2 0 8 Q-10 2 0 -14 Z", fill: "#7cc8ff", stroke: "#000", "stroke-width": 3, opacity: 0 }, fxG);
        const HEART = "M0 18 C-40 -8 -30 -40 0 -22 C30 -40 40 -8 0 18 Z";
        const heart = svgEl("path", { d: HEART, fill: "#ff3b30", stroke: "#000", "stroke-width": 4, opacity: 0 }, fxG);
        const smallH = Array.from({ length: 3 }, () => svgEl("path", { d: HEART, fill: "#ff6a9a", stroke: "#000", "stroke-width": 3, opacity: 0 }, fxG));
        const bubble = (txt, w, size = 30, col = "#111") => {
          const g = svgEl("g", { opacity: 0 }, fxG);
          svgEl("rect", { x: -w / 2, y: -40, width: w, height: 70, rx: 30, fill: "#fff", stroke: "#000", "stroke-width": 5 }, g);
          svgEl("path", { d: "M-8 28 L-20 58 L12 28 Z", fill: "#fff", stroke: "#000", "stroke-width": 5, "stroke-linejoin": "round" }, g);
          svgEl("rect", { x: -12, y: 22, width: 22, height: 10, fill: "#fff" }, g);
          const tx = svgEl("text", { x: 0, y: 12, "font-family": "HFMono, monospace", "font-weight": 700, "font-size": size, fill: col, "text-anchor": "middle" }, g);
          tx.textContent = txt;
          return g;
        };
        const bHey1 = bubble("HEY!", 120, 30, "#ff3b30"), bHey2 = bubble("HEY!", 120, 30, "#ff3b30");
        const bTada = bubble("TA-DA!", 160, 30);
        const bYum = bubble("DELICIOUS!", 230, 30);
        const bMine = bubble("MINE!", 140, 30, "#ff3b30"), bNo = bubble("NO, MINE!", 200, 30, "#ff3b30");
        const bCome = bubble("COME HERE.", 220, 30);

        const reachTo = (s, k, p, hand = "a") => { if (s[hand + "w"] < 1e-6) { s[hand + "tx"] = p[0]; s[hand + "ty"] = p[1]; s[hand + "w"] = k; return s; } s[hand + "w"] = Math.max(s[hand + "w"], k); s[hand + "tx"] = lerp(s[hand + "tx"], p[0], k); s[hand + "ty"] = lerp(s[hand + "ty"], p[1], k); return s; };
        const hold = (s, a, b, r = 0.2) => win(s, a, a + r) * (1 - win(s, b - r, b));
        function herRaw(s) {
          const sc = sceneAt(s);
          const st = standOn(SHE, 1, FL); st.head = 2;
          if (sc === 1) {
            reachTo(st, 1, [SHE + 30, stand - 132 + 7 * Math.sin(s * 38)]);
            const b1 = hold(s, T_BUMP1 - 0.1, T_BUMP1 + 0.35, 0.12); st.hx += 26 * b1; st.ax += 26 * b1; st.bx += 26 * b1; st.torso -= 10 * b1;
            const b2 = hold(s, T_BUMP2, T_BUMP2 + 0.4, 0.1); st.hx -= 22 * b2; st.ax -= 22 * b2; st.bx -= 22 * b2; st.torso += 8 * b2;
          } else if (sc === 2) {
            const off = hold(s, SC[2] + 0.1, T_TAKE + 0.1, 0.25); reachTo(st, off, [SHE + 85, stand - 95]); reachTo(st, off, [SHE + 70, stand - 88], "b");
            const cl = win(s, T_CLASP, T_CLASP + 0.3); reachTo(st, cl, [SHE + 30, stand - 112]); reachTo(st, cl, [SHE + 22, stand - 106], "b");
            st.hy -= 10 * Math.abs(Math.sin(s * 9)) * cl;
          }
          return st;
        }
        function himRaw(s) {
          const sc = sceneAt(s);
          const st = standOn(HE, -1, FL); st.head = 4;
          if (sc === 1) {
            reachTo(st, 1, [HE - 30, stand - 132 + 7 * Math.sin(s * 35 + 1)]);
            const b1 = hold(s, T_BUMP1, T_BUMP1 + 0.4, 0.1); st.hx += 22 * b1; st.ax += 22 * b1; st.bx += 22 * b1; st.torso -= 8 * b1;
            const b2 = hold(s, T_BUMP2 - 0.1, T_BUMP2 + 0.35, 0.12); st.hx -= 26 * b2; st.ax -= 26 * b2; st.bx -= 26 * b2; st.torso += 10 * b2;
          } else if (sc === 2) {
            const tk = win(s, T_TAKE, T_TAKE + 0.25); reachTo(st, tk, [HE - 60, stand - 92], "b");
            const e = hold(s, T_EAT, T_YUM + 0.2, 0.1);
            if (e > 0) { const c = 0.5 - 0.5 * Math.cos((s - T_EAT) * 2 * Math.PI * 1.9); reachTo(st, e, [lerp(HE - 55, HE - 22, c), lerp(stand - 105, stand - 140, c)]); }
            const y = hold(s, T_YUM, SC[3], 0.15); reachTo(st, y, [HE - 40, stand - 170]);
          }
          return st;
        }

        const slam = (words, times, t, red) => words.map((w, i) => {
          const q = clamp((t - times[i]) / 0.2, 0, 1);
          if (q <= 0) return `<span class="w" style="opacity:0">${w}</span>`;
          const sc = lerp(2.3, 1, backOut(q)), bl = (1 - q) * 6;
          return `<span class="w" style="transform:scale(${sc.toFixed(3)});filter:blur(${bl.toFixed(1)}px);${red.includes(i) ? "color:#ff3b30;" : ""}">${w}</span>`;
        }).join("");
        const label = document.createElement("div");
        label.style.cssText = "position:absolute;left:0;right:0;top:400px;text-align:center;font-family:HFMono,monospace;font-weight:700;font-size:34px;letter-spacing:0.3em;color:#9a9a9a;opacity:0";
        E("stage").appendChild(label);
        const dim = document.createElement("div");
        dim.style.cssText = "position:absolute;inset:0;background:#000;opacity:0";
        E("stage").appendChild(dim);
        const card = document.createElement("div");
        card.id = "card";
        card.style.cssText = "position:absolute;left:90px;right:90px;top:640px;text-align:center;font-family:HFMono,monospace;font-weight:700;color:#fff;letter-spacing:0.08em";
        card.innerHTML = `<div id="cm1" style="font-size:60px;line-height:1.25;text-shadow:0 0 18px rgba(255,255,255,0.35)"></div>
          <div id="cm2" style="font-size:46px;line-height:1.35;margin-top:22px;text-shadow:0 0 14px rgba(255,255,255,0.25)"></div>
          <div id="cq" style="opacity:0;margin-top:110px;font-size:29px;line-height:1.5;color:#bdbdbd;letter-spacing:0.05em">"A SUCCESSFUL MARRIAGE REQUIRES<br/>FALLING IN LOVE MANY TIMES,<br/>ALWAYS WITH THE SAME PERSON."<div style="margin-top:22px;font-size:24px;color:#8a8a8a;letter-spacing:0.2em">MIGNON McLAUGHLIN</div></div>`;
        E("stage").appendChild(card);
        const fade = document.createElement("div");
        fade.style.cssText = "position:absolute;inset:0;background:#000;opacity:0";
        E("stage").appendChild(fade);

        const blanketPath = (xL, xR, top) => `M${r1(xL)} 640 L${r1(xL)} ${r1(top + 22)} Q${r1(xL)} ${r1(top)} ${r1(xL + 34)} ${r1(top)} L${r1(xR - 34)} ${r1(top)} Q${r1(xR)} ${r1(top)} ${r1(xR)} ${r1(top + 22)} L${r1(xR)} 640 Z`;

        function render(t) {
          const s = t, sc = sceneAt(s), night = sc === 0 || sc === 3;
          let kick = 0;
          const hit = (tr, k, d) => { if (t >= tr) kick += k * Math.exp(-(t - tr) / d); };
          hit(T_YANK, 0.7, 0.15); hit(T_BUMP1, 0.5, 0.12); hit(T_BUMP2, 0.5, 0.12);
          const local = s - SC[sc];
          const cs = (night ? 2.0 : 1.9) * (1 + 0.012 * local), cx = 540, cy = night ? 475 : 440;
          const scl = cs * (1 + 0.05 * Math.min(kick, 1.5));
          const shx = Math.sin(t * 67) * 8 * Math.min(kick, 1), shy = Math.cos(t * 59) * 6 * Math.min(kick, 1);
          cam.setAttribute("transform", `translate(${r1(540 + shx)} ${r1(1180 + shy)}) scale(${scl.toFixed(4)}) translate(${r1(-cx)} ${r1(-cy)})`);
          bedG.setAttribute("opacity", night ? 1 : 0); bathG.setAttribute("opacity", sc === 1 ? 1 : 0); kitG.setAttribute("opacity", sc === 2 ? 1 : 0);
          figG.setAttribute("opacity", night ? 0 : 1);
          nightT.setAttribute("opacity", night ? 0.45 : 0); moon.setAttribute("opacity", night ? 1 : 0);
          glow.setAttribute("opacity", night ? 0.12 : 0.3); beams.setAttribute("opacity", night ? 0.3 : 1);

          // ---- bed
          let xL = 340, xR = 740, top = 455, hs = 450, hh = 630, shiver = 0, burrito = 0;
          if (sc === 0) {
            burrito = win(s, T_ROLL, T_ROLL + 0.5);
            const tug = hold(s, T_TUG1, T_YANK, 0.2);
            xL = lerp(340, 352, burrito); xR = lerp(740, 552, burrito) + 70 * tug; top = lerp(455, 442, burrito);
            shiver = win(s, T_ROLL + 0.5, T_ROLL + 0.8) * (1 - 0.7 * tug);
            gripH.setAttribute("opacity", tug.toFixed(3)); gripH.setAttribute("cx", r1(xR - 18)); gripH.setAttribute("cy", r1(top + 4));
            gripS.setAttribute("opacity", 0);
          } else if (sc === 3) {
            const war = hold(s, T_WAR, T_OPEN + 0.1, 0.15), open = win(s, T_OPEN, T_OPEN + 0.45);
            const sway = Math.sin((s - T_WAR) * 2 * Math.PI * 1.3) * war;
            const c = 540 + 60 * sway, wdt = 280;
            xL = lerp(lerp(352, c - wdt / 2, win(s, T_WAR - 0.2, T_WAR + 0.1)), 340, open);
            xR = lerp(lerp(552, c + wdt / 2, win(s, T_WAR - 0.2, T_WAR + 0.1)), 740, open);
            burrito = 1 - win(s, T_WAR - 0.2, T_WAR + 0.1);
            top = lerp(lerp(442, 452, 1 - burrito), 455, open);
            hs = lerp(450, 485, open); hh = lerp(630, 595, open);
            hs += 10 * sway * (1 - open); hh += 10 * sway * (1 - open);
            shiver = (sway < -0.2 ? 0.6 : 0) * (1 - open);
            const g = Math.max(war, 0) * (1 - open);
            gripS.setAttribute("opacity", g.toFixed(3)); gripS.setAttribute("cx", r1(xL + 22)); gripS.setAttribute("cy", r1(top + 4));
            gripH.setAttribute("opacity", g.toFixed(3)); gripH.setAttribute("cx", r1(xR - 22)); gripH.setAttribute("cy", r1(top + 4));
            hit(T_WAR, 0, 1);
          }
          const jit = 3.5 * Math.sin(t * 70) * shiver;
          headS.setAttribute("cx", r1(hs)); headS.setAttribute("cy", 418);
          headH.setAttribute("cx", r1(hh + jit)); headH.setAttribute("cy", 418);
          bunB.setAttribute("cx", r1(hs - 30)); bunB.setAttribute("cy", 392);
          bodS.setAttribute("x", r1(hs - 65)); bodS.setAttribute("y", 450);
          bodH.setAttribute("x", r1(hh - 65 + jit)); bodH.setAttribute("y", 450);
          blanket.setAttribute("d", blanketPath(xL, xR, top));
          wrap.setAttribute("d", `M${r1(xL + 30)} ${r1(top + 40)} Q${r1((xL + xR) / 2)} ${r1(top + 70)} ${r1(xR - 20)} ${r1(top + 30)} M${r1(xL + 20)} ${r1(top + 100)} Q${r1((xL + xR) / 2)} ${r1(top + 130)} ${r1(xR - 20)} ${r1(top + 90)}`);
          wrap.setAttribute("opacity", burrito.toFixed(3));
          fold.setAttribute("d", `M${r1(xL + 10)} ${r1(top + 26)} L${r1(xR - 10)} ${r1(top + 26)}`);
          brr.forEach((p, i) => { const sd = i ? 1 : -1; p.setAttribute("d", `M${r1(hh + sd * 52)} 396 l${sd * 8} 8 l${-sd * 8} 8 l${sd * 8} 8 l${-sd * 8} 8`); p.setAttribute("opacity", (shiver * (0.6 + 0.4 * Math.sin(t * 20 + i))).toFixed(3)); });
          zzz.forEach((z, i) => { const q = frac((s - T_ZZZ) * 0.7 + i / 3), on = sc === 0 && s > T_ZZZ; z.setAttribute("x", r1(hs + 30 + 40 * q + i * 6)); z.setAttribute("y", r1(380 - 90 * q)); z.setAttribute("opacity", on ? Math.sin(Math.PI * q).toFixed(3) : 0); });

          // ---- standing scenes
          const hp = drawFig(her, livePose(herRaw, s, 1.4), 1);
          const mp = drawFig(him, livePose(himRaw, s, 0.3), -1);
          bun.setAttribute("cx", r1(hp.head[0] - 25)); bun.setAttribute("cy", r1(hp.head[1] - 16));
          const day1 = sc === 1 ? 1 : 0;
          brushS.setAttribute("opacity", day1); brushS.setAttribute("transform", `translate(${r1(hp.hands[0][0])} ${r1(hp.hands[0][1])}) rotate(60)`);
          brushH.setAttribute("opacity", day1); brushH.setAttribute("transform", `translate(${r1(mp.hands[0][0])} ${r1(mp.hands[0][1])}) rotate(-60)`);
          foam.forEach((f, i) => { const k = i % 3, who = i < 3 ? hp : mp, q = frac(s * 1.5 + k / 3), sd = i < 3 ? 1 : -1; f.setAttribute("cx", r1(who.head[0] + sd * (34 + 16 * q))); f.setAttribute("cy", r1(who.head[1] + 20 - 30 * q)); f.setAttribute("opacity", day1 ? Math.sin(Math.PI * q).toFixed(3) : 0); });
          // breakfast: plate goes from her hands to his, he eats, sweat, "DELICIOUS!"
          const day2 = sc === 2;
          const ph = s < T_TAKE + 0.12 ? hp.hands[0] : mp.hands[1];
          plate.setAttribute("opacity", day2 ? 1 : 0); plate.setAttribute("transform", `translate(${r1(ph[0])} ${r1(ph[1] + 6)})`);
          const left = 1 - clamp((s - T_EAT) / (T_YUM - T_EAT), 0, 1);
          cake.setAttribute("rx", r1(30 * Math.max(0.05, left))); cake.setAttribute("opacity", left > 0.06 ? 1 : 0);
          fork.setAttribute("opacity", day2 && s > T_TAKE ? 1 : 0); fork.setAttribute("transform", `translate(${r1(mp.hands[0][0])} ${r1(mp.hands[0][1])}) rotate(-20)`);
          smoke.forEach((m, i) => {
            const q = frac(s * 0.9 + i / 5), fromPlate = i % 2 === 0;
            const ox = fromPlate ? ph[0] : 330, oy = fromPlate ? ph[1] - 10 : FL - 222;
            const on = day2 && (fromPlate ? left > 0.2 : true);
            m.setAttribute("cx", r1(ox + 14 * Math.sin(q * 6 + i))); m.setAttribute("cy", r1(oy - 110 * q)); m.setAttribute("r", r1(8 + 14 * q));
            m.setAttribute("opacity", on ? (0.8 * Math.sin(Math.PI * q)).toFixed(3) : 0);
          });
          const sw = day2 ? win(s, T_EAT + 0.2, T_EAT + 0.4) : 0;
          sweat.setAttribute("opacity", sw.toFixed(3)); sweat.setAttribute("transform", `translate(${r1(mp.head[0] - 40)} ${r1(mp.head[1] - 20 + 14 * frac(s * 1.2))})`);
          // speech
          const bub = (g, a, b, p) => { const k = hold(s, a, b, 0.1); g.setAttribute("opacity", k.toFixed(3)); g.setAttribute("transform", `translate(${r1(p[0])} ${r1(p[1])}) scale(${(0.6 + 0.4 * backOut(k)).toFixed(3)})`); };
          bub(bHey1, T_BUMP1 + 0.1, T_BUMP1 + 0.7, [mp.head[0] + 30, mp.head[1] - 110]);
          bub(bHey2, T_BUMP2 + 0.1, T_BUMP2 + 0.7, [hp.head[0] - 30, hp.head[1] - 110]);
          bub(bTada, SC[2] + 0.15, T_TAKE, [hp.head[0] - 10, hp.head[1] - 110]);
          bub(bYum, T_YUM, SC[3] - 0.05, [mp.head[0] + 20, mp.head[1] - 110]);
          bub(bMine, T_WAR + 0.1, T_WAR + 0.7, [hs - 20, 300]);
          bub(bNo, T_WAR + 0.6, T_WAR + 1.2, [hh + 20, 300]);
          bub(bCome, T_OPEN - 0.05, T_HOLD + 0.2, [hs - 10, 300]);
          // little hearts: laughing at the sink, and her joy at breakfast
          smallH.forEach((h, k) => {
            const t0 = k < 2 ? T_LAUGH + k * 0.15 : T_CLASP + 0.1, q = clamp((s - t0) / 0.8, 0, 1);
            const p = k === 0 ? hp.head : k === 1 ? mp.head : hp.head;
            h.setAttribute("opacity", q > 0 && q < 1 ? Math.sin(Math.PI * q).toFixed(3) : 0);
            h.setAttribute("transform", `translate(${r1(p[0] + (k === 1 ? -10 : 10))} ${r1(p[1] - 40 - 60 * q)}) scale(0.45)`);
          });
          const hq = clamp((s - T_HOLD) / 0.4, 0, 1), beat = 1 + 0.08 * Math.max(0, Math.sin(t * 7)) * (hq >= 1 ? 1 : 0);
          heart.setAttribute("opacity", sc === 3 && hq > 0 ? 1 : 0);
          heart.setAttribute("transform", `translate(540 300) scale(${(backOut(hq) * 1.1 * beat).toFixed(3)})`);
          warm.setAttribute("opacity", (0.7 * win(s, T_OPEN, T_OPEN + 0.8)).toFixed(3));

          // scene label
          const lk = Math.min(win(local, 0, 0.2), 1 - win(local, 1.3, 1.6));
          label.textContent = LABELS[sc]; label.style.opacity = (sc < 3 || s < T_H1 - 0.3 ? lk : 0).toFixed(3);

          E("h1").innerHTML = slam(["THE", "WEDDING", "WAS", "ONE", "DAY."], [T_H1, T_H1 + 0.13, T_H1 + 0.26, T_H1 + 0.39, T_H1 + 0.52], t, []);
          E("h2").innerHTML = slam(["THE", "BLANKET", "WAR", "IS", "FOREVER."], [T_H2, T_H2 + 0.13, T_H2 + 0.26, T_H2 + 0.39, T_H2 + 0.52], t, [1, 2]);
          E("h1").style.opacity = (1 - 0.45 * win(t, T_H2 - 0.1, T_H2 + 0.2)).toFixed(3);
          dim.style.opacity = (0.8 * win(t, T_CARD - 0.4, T_CARD)).toFixed(3);
          E("head").style.opacity = (1 - win(t, T_CARD - 0.4, T_CARD)).toFixed(3);
          E("cm1").innerHTML = slam(["MARRY", "YOUR"], [T_CARD, T_CARD + 0.2], t, []);
          E("cm2").innerHTML = slam(["BEST", "FRIEND."], [T_CARD + 0.7, T_CARD + 0.85], t, [1]);
          E("cq").style.opacity = win(t, T_CARD + 1.5, T_CARD + 2.0).toFixed(3);
          fade.style.opacity = win(t, DUR - 0.3, DUR - 0.02).toFixed(3);
        }

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
        window.__timelines["main"] = tl;
        render(0);
        tl.seek(0);
      })();
    </script>
