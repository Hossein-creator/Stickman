<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "HFMono";
        src: url("assets/fonts/consolab.ttf") format("truetype");
        font-weight: 700;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        transform-origin: 540px 1150px;
      }
      #stage svg {
        position: absolute;
        inset: 0;
      }
      .label {
        position: absolute;
        font-family: "HFMono", monospace;
        font-weight: 700;
        font-size: 34px;
        letter-spacing: 0.22em;
        color: #f2f2f2;
        white-space: nowrap;
        text-shadow: 0 0 14px rgba(255, 255, 255, 0.25);
      }
      #lab-ot {
        left: 104px;
        top: 690px;
      }
      #lab-doer {
        left: 520px;
        top: 650px;
      }
      #punch {
        position: absolute;
        left: 0;
        right: 0;
        top: 190px;
        text-align: center;
        font-family: "HFMono", monospace;
        font-weight: 700;
        font-size: 38px;
        letter-spacing: 0.12em;
        line-height: 1.55;
        color: #fff;
        text-shadow: 0 0 16px rgba(255, 255, 255, 0.3);
      }
      #punch .ghost {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="13"
      data-width="1080"
      data-height="1920"
    >
      <div id="stage" class="clip" data-start="0" data-duration="13" data-track-index="0">
        <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="beamWarm" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
              <stop offset="0.55" stop-color="#fff6e8" stop-opacity="0.17" />
              <stop offset="1" stop-color="#fff6e8" stop-opacity="0.04" />
            </linearGradient>
            <linearGradient id="beamCold" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#cfd8ff" stop-opacity="0.4" />
              <stop offset="0.6" stop-color="#cfd8ff" stop-opacity="0.11" />
              <stop offset="1" stop-color="#cfd8ff" stop-opacity="0.03" />
            </linearGradient>
            <radialGradient id="poolGrad">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.35" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#151515" />
              <stop offset="0.35" stop-color="#070707" />
              <stop offset="1" stop-color="#000000" />
            </linearGradient>
            <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#55585d" />
              <stop offset="0.45" stop-color="#b4b7bd" />
              <stop offset="1" stop-color="#4c4f54" />
            </linearGradient>
            <linearGradient id="steelH" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#9ea1a7" />
              <stop offset="1" stop-color="#45484c" />
            </linearGradient>
            <linearGradient id="lockRed" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ff4a3d" />
              <stop offset="1" stop-color="#a3141a" />
            </linearGradient>
            <linearGradient id="reflFade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff" stop-opacity="1" />
              <stop offset="1" stop-color="#fff" stop-opacity="0" />
            </linearGradient>
            <mask id="reflMask" maskUnits="userSpaceOnUse" x="0" y="1350" width="1080" height="570">
              <rect x="0" y="1350" width="1080" height="380" fill="url(#reflFade)" />
            </mask>
            <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="16" />
            </filter>
            <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="22" />
            </filter>
          </defs>

          <rect x="0" y="1350" width="1080" height="570" fill="url(#floorGrad)" />

          <polygon id="beamC" points="380,0 470,0 640,1350 200,1350" fill="url(#beamCold)" filter="url(#soft)" />
          <polygon id="beamO" points="830,0 920,0 1110,1350 650,1350" fill="url(#beamWarm)" filter="url(#soft)" />

          <g id="world">
            <ellipse id="poolC" cx="420" cy="1352" rx="300" ry="36" fill="url(#poolGrad)" />
            <ellipse id="poolO" cx="880" cy="1352" rx="210" ry="30" fill="url(#poolGrad)" />
            <!-- cage: roof and back wall -->
            <polygon points="80,800 780,800 806,776 106,776" fill="#18191b" />
            <g id="backBars"></g>
            <rect x="100" y="772" width="712" height="8" fill="#3a3c40" />
            <!-- figures inside -->
            <g id="ot"></g>
            <use id="doerGlow" href="#doer" filter="url(#blur)" opacity="0.4" />
            <g id="doer"></g>
            <!-- cage: front -->
            <g id="frontBars"></g>
            <g id="door">
              <rect x="625" y="800" width="10" height="540" fill="url(#steel)" />
              <rect x="775" y="800" width="10" height="540" fill="url(#steel)" />
              <rect x="663" y="800" width="9" height="540" fill="url(#steel)" />
              <rect x="701" y="800" width="9" height="540" fill="url(#steel)" />
              <rect x="739" y="800" width="9" height="540" fill="url(#steel)" />
              <rect x="630" y="1000" width="150" height="9" fill="url(#steelH)" />
              <rect x="630" y="1240" width="150" height="9" fill="url(#steelH)" />
              <rect x="619" y="1086" width="20" height="16" rx="3" fill="#6d7075" />
            </g>
            <rect x="72" y="792" width="716" height="16" fill="url(#steelH)" />
            <rect x="72" y="1334" width="716" height="16" fill="url(#steelH)" />
            <g id="lock">
              <g id="shackle">
                <path d="M-11 -12 V-24 A11 11 0 0 1 11 -24 V-12" fill="none" stroke="#9a9da3" stroke-width="6" stroke-linecap="round" />
              </g>
              <rect x="-17" y="-13" width="34" height="28" rx="5" fill="url(#lockRed)" stroke="#5a0b0e" stroke-width="2" />
              <circle cx="0" cy="-1" r="3.6" fill="#2a0507" />
              <rect x="-1.5" y="0" width="3" height="7" fill="#2a0507" />
            </g>
            <g id="pops"></g>
          </g>

          <g mask="url(#reflMask)" opacity="0.3">
            <use href="#world" transform="translate(0 2700) scale(1 -1)" />
          </g>
          <rect x="0" y="1349" width="1080" height="2" fill="#2a2a2a" opacity="0.6" />
        </svg>

        <div id="lab-ot" class="label">OVERTHINKER</div>
        <div id="lab-doer" class="label">DOER</div>
        <div id="punch">
          <div id="l1"></div>
          <div id="l2"></div>
        </div>
      </div>

      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="13" data-track-index="1"></audio>
    </div>

    <script>
      (function () {
        const DUR = 13;
        const FLOOR = 1350;
        const THIGH = 80, SHIN = 78, LEG = 154;
        const UARM = 64, FARM = 60, TORSO = 116, NECK = 12, HEADR = 31;
        const NS = "http://www.w3.org/2000/svg";
        const svgEl = (tag, attrs) => {
          const e = document.createElementNS(NS, tag);
          for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
          return e;
        };
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, p) => a + (b - a) * p;
        const ease = (p) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(p, 0, 1));
        const easeOut = (p) => 1 - Math.pow(1 - clamp(p, 0, 1), 3);
        const win = (t, a, b) => ease((t - a) / (b - a));
        const rad = (d) => (d * Math.PI) / 180;
        const down = (a, f) => [Math.sin(rad(a)) * f, Math.cos(rad(a))];
        const up = (a, f) => [Math.sin(rad(a)) * f, -Math.cos(rad(a))];
        const r1 = (v) => Math.round(v * 10) / 10;
        const E = (id) => document.getElementById(id);

        // ---------- cage bars ----------
        const frontBars = [];
        for (let x = 80; x <= 580; x += 50) {
          const b = svgEl("rect", { x: x - 5, y: 800, width: 10, height: 540, fill: "url(#steel)" });
          E("frontBars").appendChild(b);
          frontBars.push({ x, el: b });
        }
        for (let x = 106; x <= 806; x += 50) {
          E("backBars").appendChild(svgEl("rect", { x: x - 3, y: 776, width: 6, height: 552, fill: "#2c2e31" }));
        }

        // ---------- stick figure rig ----------
        function makeFig(parent, front, back) {
          const parts = {};
          const order = [["armB", back], ["legB", back], ["torso", front], ["legF", front], ["armF", front]];
          for (const [n, col] of order) {
            const o = svgEl("path", { fill: "none", stroke: "#000", "stroke-width": 34, "stroke-linecap": "round", "stroke-linejoin": "round" });
            const w = svgEl("path", { fill: "none", stroke: col, "stroke-width": 22, "stroke-linecap": "round", "stroke-linejoin": "round" });
            parent.append(o, w);
            parts[n] = [o, w];
          }
          parts.head = svgEl("circle", { r: HEADR, fill: front, stroke: "#000", "stroke-width": 6 });
          parent.appendChild(parts.head);
          return parts;
        }
        function ik(a, b, l1, l2, pick) {
          let dx = b[0] - a[0], dy = b[1] - a[1];
          let d = Math.hypot(dx, dy);
          const maxd = l1 + l2 - 0.5;
          if (d > maxd) {
            b = [a[0] + (dx / d) * maxd, a[1] + (dy / d) * maxd];
            dx = b[0] - a[0];
            dy = b[1] - a[1];
            d = maxd;
          }
          d = Math.max(d, Math.abs(l1 - l2) + 1);
          const al = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
          const base = Math.atan2(dy, dx);
          const c1 = [a[0] + Math.cos(base + al) * l1, a[1] + Math.sin(base + al) * l1];
          const c2 = [a[0] + Math.cos(base - al) * l1, a[1] + Math.sin(base - al) * l1];
          return [pick(c1, c2), b];
        }
        const P = (pts) => "M" + pts.map((p) => r1(p[0]) + " " + r1(p[1])).join("L");
        const setD = (pair, d) => {
          pair[0].setAttribute("d", d);
          pair[1].setAttribute("d", d);
        };
        function joints(s) {
          const tu = up(s.torso, s.f);
          const sh = [s.hip[0] + tu[0] * TORSO, s.hip[1] + tu[1] * TORSO];
          const nk = [s.hip[0] + tu[0] * (TORSO + NECK), s.hip[1] + tu[1] * (TORSO + NECK)];
          const hu = up(s.torso + s.head, s.f);
          return { sh, nk, hc: [nk[0] + hu[0] * HEADR, nk[1] + hu[1] * HEADR] };
        }
        // pose: {hip, f, torso, head, feet:[near, far], arms:[{sh,el,t,w},{sh,el}]}
        function drawFig(parts, s) {
          const f = s.f, hip = s.hip;
          const { sh, nk, hc } = joints(s);
          setD(parts.torso, P([hip, sh, nk]));
          parts.head.setAttribute("cx", r1(hc[0]));
          parts.head.setAttribute("cy", r1(hc[1]));
          const legPick = (c1, c2) => (c1[0] * f > c2[0] * f ? c1 : c2);
          ["legF", "legB"].forEach((n, i) => {
            const [kn, ft] = ik(hip, s.feet[i], THIGH, SHIN, legPick);
            setD(parts[n], P([hip, kn, ft]));
          });
          ["armF", "armB"].forEach((n, i) => {
            const a = s.arms[i];
            const u = down(a.sh, f);
            const el = [sh[0] + u[0] * UARM, sh[1] + u[1] * UARM];
            const v = down(a.sh + a.el, f);
            let hand = [el[0] + v[0] * FARM, el[1] + v[1] * FARM];
            if (a.w && a.t) hand = [lerp(hand[0], a.t[0], a.w), lerp(hand[1], a.t[1], a.w)];
            const pick = (c1, c2) =>
              Math.hypot(c1[0] - el[0], c1[1] - el[1]) < Math.hypot(c2[0] - el[0], c2[1] - el[1]) ? c1 : c2;
            const [e2, h2] = ik(sh, hand, UARM, FARM, pick);
            setD(parts[n], P([sh, e2, h2]));
          });
        }

        // ---------- walking on the floor ----------
        function makeTrack(f, A, B, t0, md, stride, n) {
          const S = [{ A, B }];
          for (let k = 1; k <= n; k++) {
            const pv = S[k - 1];
            const back = pv.A[0] * f < pv.B[0] * f ? "A" : "B";
            const front = back === "A" ? "B" : "A";
            const nx = { A: pv.A, B: pv.B, mv: back };
            nx[back] = [pv[front][0] + (k === n ? 14 : stride) * f, FLOOR];
            S.push(nx);
          }
          return { f, S, t0, md, n, end: t0 + n * md };
        }
        const hipFor = (st) => {
          const hx = (st.A[0] + st.B[0]) / 2;
          let hy = -1e9;
          for (const ft of [st.A, st.B]) {
            const dx = ft[0] - hx;
            hy = Math.max(hy, ft[1] - Math.sqrt(Math.max(0, LEG * LEG - dx * dx)));
          }
          return [hx, hy];
        };
        function trackAt(tr, t) {
          if (t <= tr.t0 || t >= tr.end) {
            const st = t <= tr.t0 ? tr.S[0] : tr.S[tr.n];
            return { A: st.A, B: st.B, hip: hipFor(st), moving: 0, phase: 0 };
          }
          const k = Math.floor((t - tr.t0) / tr.md) + 1;
          const p = (t - tr.t0 - (k - 1) * tr.md) / tr.md;
          const st0 = tr.S[k - 1], st1 = tr.S[k];
          const foot = st1.mv, other = foot === "A" ? "B" : "A";
          const pf = clamp(p / 0.8, 0, 1);
          const o = { moving: 1, phase: ((t - tr.t0) / tr.md) * Math.PI };
          o[other] = st0[other];
          o[foot] = [lerp(st0[foot][0], st1[foot][0], ease(pf)), FLOOR - Math.sin(Math.PI * pf) * 22];
          const h0 = hipFor(st0), h1 = hipFor(st1);
          o.hip = [lerp(h0[0], h1[0], ease(p)), lerp(h0[1], h1[1], ease(p)) - Math.sin(Math.PI * p) * 4];
          return o;
        }
        function keyAt(K, t) {
          let i = 0;
          while (i < K.length - 2 && t >= K[i + 1][0]) i++;
          const [ta, a] = K[i], [tb, b] = K[i + 1];
          const p = ease((t - ta) / (tb - ta));
          const o = {};
          for (const k in a) o[k] = lerp(a[k], b[k], p);
          return o;
        }

        // ---------- the lock and the door ----------
        const L0 = [630, 1120];
        function lockAt(t) {
          if (t < 2.75) {
            const wob = t > 2.4 ? Math.sin((t - 2.4) * 30) * 4 * (1 - (t - 2.4) / 0.35) : 0;
            return { x: L0[0], y: L0[1], rot: wob, open: 0 };
          }
          if (t < 3.05) {
            const e = ease((t - 2.75) / 0.3);
            return { x: L0[0] - 14 * e, y: L0[1] + 6 * e, rot: -10 * e, open: e };
          }
          const dt = t - 3.05, G = 4200, y0 = L0[1] + 6, rest = 1310;
          const t1 = Math.sqrt((2 * (rest - y0)) / G);
          let y;
          if (dt < t1) y = y0 + 0.5 * G * dt * dt;
          else {
            const v = G * t1 * 0.25, d2 = dt - t1, tb = (2 * v) / G;
            y = d2 < tb ? rest - (v * d2 - 0.5 * G * d2 * d2) : rest;
          }
          const fall = clamp(dt / t1, 0, 1);
          return { x: L0[0] - 14 - 58 * easeOut(dt / 0.5), y, rot: -10 + 100 * easeOut(fall), open: 1 };
        }
        const doorAng = (t) => 82 * easeOut((t - 3.9) / 1.1);
        const doorEdge = (t) => [780 - 150 * Math.cos(rad(doorAng(t))) + 4, 1150];

        // ---------- OVERTHINKER: paces, ? marks, shakes the bars, sits ----------
        const otParts = makeFig(E("ot"), "#9a9a9a", "#7c7c7c");
        const O1 = makeTrack(1, [240, FLOOR], [262, FLOOR], 0.3, 0.38, 44, 4);
        const O2 = makeTrack(-1, O1.S[4].A, O1.S[4].B, 2.05, 0.38, 44, 4);
        const KO = [
          [0.0, { torso: 4, head: 14, fSh: 30, fEl: 122, bSh: 5, bEl: 8, sit: 0, shk: 0 }],
          [3.55, { torso: 4, head: 14, fSh: 30, fEl: 122, bSh: 5, bEl: 8, sit: 0, shk: 0 }],
          [3.85, { torso: 2, head: -6, fSh: 74, fEl: 10, bSh: 68, bEl: 14, sit: 0, shk: 1 }],
          [5.05, { torso: 2, head: -6, fSh: 74, fEl: 10, bSh: 68, bEl: 14, sit: 0, shk: 1 }],
          [5.35, { torso: 3, head: 0, fSh: 8, fEl: 8, bSh: 4, bEl: 8, sit: 0, shk: 0 }],
          [5.75, { torso: 4, head: 10, fSh: 30, fEl: 122, bSh: 5, bEl: 8, sit: 0, shk: 0 }],
          [6.45, { torso: 4, head: 10, fSh: 30, fEl: 122, bSh: 5, bEl: 8, sit: 0, shk: 0 }],
          [7.45, { torso: 30, head: 36, fSh: 40, fEl: 42, bSh: 32, bEl: 42, sit: 1, shk: 0 }],
          [13, { torso: 30, head: 36, fSh: 40, fEl: 42, bSh: 32, bEl: 42, sit: 1, shk: 0 }],
        ];
        function otPose(t) {
          const tr = t < 1.95 ? trackAt(O1, t) : trackAt(O2, t);
          const f = t < 1.95 ? 1 : t < 5.4 ? -1 : 1;
          const q = keyAt(KO, t);
          const hx0 = tr.hip[0];
          const sit = q.sit;
          const jitter = q.shk * Math.sin(t * 56) * 5;
          const nearF = [lerp(tr.A[0], hx0 + f * 70, sit), lerp(tr.A[1], FLOOR, sit)];
          const farF = [lerp(tr.B[0], hx0 + f * 52, sit), lerp(tr.B[1], FLOOR, sit)];
          const breathe = sit > 0.99 ? Math.sin((t - 7.45) * 2.2) * 2 : 0;
          const swing = tr.moving ? Math.sin(tr.phase) * 14 : 0;
          return {
            hip: [lerp(hx0, hx0 - f * 22, sit) + jitter, lerp(tr.hip[1], FLOOR - 36, sit) + breathe],
            f,
            torso: q.torso,
            head: q.head + (q.shk ? Math.sin(t * 31) * 4 : 0),
            feet: [nearF, farF],
            arms: [
              { sh: q.fSh, el: q.fEl },
              { sh: q.bSh - swing, el: q.bEl },
            ],
            shk: q.shk,
          };
        }

        // ---------- DOER: walks to the door, pulls the lock, pushes the door, walks out ----------
        const doerParts = makeFig(E("doer"), "#ffffff", "#e2e2e2");
        const D1 = makeTrack(1, [470, FLOOR], [495, FLOOR], 1.0, 0.5, 45, 2);
        const D2 = makeTrack(1, D1.S[2].A, D1.S[2].B, 5.1, 0.38, 58, 6);
        const KD = [
          [0.0, { torso: 2, head: 0, fSh: 6, fEl: 10, w: 0, bSh: -4, bEl: 8 }],
          [0.5, { torso: 2, head: 0, fSh: 6, fEl: 10, w: 0, bSh: -4, bEl: 8 }],
          [0.9, { torso: 4, head: 14, fSh: 6, fEl: 10, w: 0, bSh: -4, bEl: 8 }],
          [2.05, { torso: 6, head: 14, fSh: 6, fEl: 10, w: 0, bSh: -4, bEl: 8 }],
          [2.4, { torso: 8, head: 12, fSh: 50, fEl: 20, w: 1, bSh: -4, bEl: 8 }],
          [3.05, { torso: 8, head: 12, fSh: 50, fEl: 20, w: 1, bSh: -4, bEl: 8 }],
          [3.4, { torso: 6, head: 26, fSh: 10, fEl: 12, w: 0, bSh: -4, bEl: 8 }],
          [3.72, { torso: 6, head: 22, fSh: 10, fEl: 12, w: 0, bSh: -4, bEl: 8 }],
          [3.95, { torso: 12, head: 4, fSh: 60, fEl: 10, w: 1, bSh: -4, bEl: 8 }],
          [4.5, { torso: 12, head: 4, fSh: 60, fEl: 10, w: 1, bSh: -4, bEl: 8 }],
          [4.9, { torso: 4, head: 0, fSh: 8, fEl: 14, w: 0, bSh: -4, bEl: 10 }],
          [7.5, { torso: 4, head: 0, fSh: 8, fEl: 14, w: 0, bSh: -4, bEl: 10 }],
          [8.2, { torso: -3, head: -18, fSh: 18, fEl: 10, w: 0, bSh: -14, bEl: 10 }],
          [10.5, { torso: -3, head: -18, fSh: 18, fEl: 10, w: 0, bSh: -14, bEl: 10 }],
          [11.0, { torso: 2, head: 8, fSh: 6, fEl: 10, w: 0, bSh: -4, bEl: 8 }],
          [13, { torso: 2, head: 8, fSh: 6, fEl: 10, w: 0, bSh: -4, bEl: 8 }],
        ];
        function doerPose(t) {
          const tr = t < 3 ? trackAt(D1, t) : trackAt(D2, t);
          const f = t < 10.65 ? 1 : -1;
          const q = keyAt(KD, t);
          const swing = tr.moving ? Math.sin(tr.phase) * 22 : 0;
          const lk = lockAt(t);
          const target = t < 3.5 ? [lk.x - 8, lk.y] : doorEdge(t);
          const A = tr.A, B = tr.B;
          return {
            hip: tr.hip,
            f,
            torso: q.torso + (tr.moving ? 5 : 0),
            head: q.head,
            feet: f > 0 ? [A, B] : [B, A],
            arms: [
              { sh: q.fSh + swing, el: q.fEl + (tr.moving ? 10 : 0), t: target, w: q.w },
              { sh: q.bSh - swing, el: q.bEl + (tr.moving ? 10 : 0) },
            ],
          };
        }

        // ---------- "?" pops over the overthinker ----------
        const POPS = [[1.15, 38], [1.9, -34], [2.7, 30], [5.6, 40], [5.85, -36], [6.1, 4]];
        const pops = POPS.map(([tp, dx]) => {
          const j = joints(otPose(tp));
          const el = svgEl("text", {
            "text-anchor": "middle",
            "font-family": "HFMono",
            "font-weight": "700",
            "font-size": 74,
            fill: "#d4d4d4",
          });
          el.textContent = "?";
          E("pops").appendChild(el);
          return { tp, x: j.hc[0] + dx, y: j.hc[1] - 62 - (dx === 4 ? 30 : 0), el };
        });

        // ---------- text ----------
        const L1 = "THE LOCK WAS NEVER CLOSED.";
        const L2 = "ONLY ONE OF THEM CHECKED.";
        function typeLine(node, text, t, t0, cps) {
          const n = clamp(Math.floor((t - t0) * cps), 0, text.length);
          node.innerHTML = "<span>" + text.slice(0, n) + '</span><span class="ghost">' + text.slice(n) + "</span>";
          node.style.opacity = n > 0 ? 1 : 0;
        }

        // ---------- per-frame render ----------
        const stage = E("stage"), door = E("door"), lock = E("lock"), shackle = E("shackle");
        const beamC = E("beamC"), beamO = E("beamO"), poolC = E("poolC"), poolO = E("poolO"), glow = E("doerGlow");
        const labOt = E("lab-ot");
        function render(t) {
          const op = otPose(t);
          drawFig(otParts, op);
          drawFig(doerParts, doerPose(t));

          for (const b of frontBars) {
            const near = clamp(1 - Math.abs(b.x - op.hip[0]) / 130, 0, 1);
            const dx = op.shk * near * Math.sin(t * 56 + b.x) * 3;
            b.el.setAttribute("transform", "translate(" + dx.toFixed(2) + " 0)");
          }

          const c = Math.max(0.16, Math.cos(rad(doorAng(t))));
          door.setAttribute("transform", "translate(780 0) scale(" + c.toFixed(4) + " 1) translate(-780 0)");

          const lk = lockAt(t);
          lock.setAttribute("transform", "translate(" + r1(lk.x) + " " + r1(lk.y) + ") rotate(" + r1(lk.rot) + ") scale(1.5)");
          shackle.setAttribute("transform", "translate(0 " + r1(-12 * lk.open) + ") rotate(" + r1(42 * lk.open) + " 11 -12)");

          const opened = win(t, 3.9, 5.0);
          const out = win(t, 6.6, 7.6);
          beamO.setAttribute("opacity", (0.12 + 0.35 * opened + 0.5 * out).toFixed(3));
          poolO.setAttribute("opacity", (0.1 + 0.3 * opened + 0.6 * out).toFixed(3));
          const dim = win(t, 6.6, 8.4);
          beamC.setAttribute("opacity", (0.8 - 0.45 * dim).toFixed(3));
          poolC.setAttribute("opacity", (0.85 - 0.5 * dim).toFixed(3));
          glow.setAttribute("opacity", (0.38 + 0.5 * out).toFixed(3));
          labOt.style.opacity = (1 - 0.45 * dim).toFixed(3);

          for (const p of pops) {
            const a = t - p.tp;
            const vis = a >= 0 && a < 1.0;
            const s = vis ? (a < 0.18 ? 1.25 * easeOut(a / 0.18) : 1.25 - 0.25 * ease((a - 0.18) / 0.12)) : 0;
            const o = vis ? 1 - ease((a - 0.7) / 0.3) : 0;
            p.el.setAttribute("transform", "translate(" + r1(p.x) + " " + r1(p.y - 18 * clamp(a, 0, 1)) + ") scale(" + s.toFixed(3) + ")");
            p.el.setAttribute("opacity", o.toFixed(3));
          }

          typeLine(E("l1"), L1, t, 8.6, 30);
          typeLine(E("l2"), L2, t, 10.0, 30);
          stage.style.transform = "scale(" + (1 + 0.035 * ease(t / DUR)).toFixed(4) + ")";
        }

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
        window.__timelines["main"] = tl;
        render(0);
        tl.seek(0);
      })();
    </script>
  </body>
</html>
