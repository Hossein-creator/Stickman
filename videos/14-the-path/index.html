<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "HFMono";
        src: url("assets/fonts/consolab.ttf") format("truetype");
        font-weight: 700;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      #stage svg {
        position: absolute;
        inset: 0;
      }
      .mono {
        position: absolute;
        font-family: "HFMono", monospace;
        font-weight: 700;
        white-space: nowrap;
      }
      /* everything readable stays inside the Instagram safe area: x 120-960, y 220-1500 */
      #head {
        position: absolute;
        left: 0;
        right: 0;
        top: 222px;
        text-align: center;
        font-family: "HFMono", monospace;
        font-weight: 700;
        font-size: 38px;
        letter-spacing: 0.12em;
        line-height: 1.45;
        color: #fff;
        text-shadow: 0 0 16px rgba(255, 255, 255, 0.3);
      }
      #head .ghost {
        visibility: hidden;
      }
      #ctr {
        position: absolute;
        left: 0;
        right: 0;
        top: 430px;
        text-align: center;
        font-family: "HFMono", monospace;
        font-weight: 700;
        white-space: nowrap;
      }
      #ctr .lbl {
        font-size: 26px;
        letter-spacing: 0.24em;
        color: #9a9a9a;
        vertical-align: middle;
      }
      #num {
        display: inline-block;
        min-width: 2.4ch;
        font-size: 58px;
        letter-spacing: 0.08em;
        color: #fff;
        vertical-align: middle;
        text-shadow: 0 0 14px rgba(255, 255, 255, 0.35);
      }
      #tag {
        display: inline-block;
        min-width: 5.2ch;
        padding: 6px 12px 4px;
        font-size: 26px;
        letter-spacing: 0.18em;
        vertical-align: middle;
        visibility: hidden;
      }
      #tag.fail {
        visibility: visible;
        background: #d62a2a;
        color: #fff;
      }
      #tag.pass {
        visibility: visible;
        background: #fff;
        color: #000;
        box-shadow: 0 0 22px rgba(255, 255, 255, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="14" data-track-index="0">
        <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
              <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.12" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0.04" />
            </linearGradient>
            <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.32" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="dustG" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#b5b5b5" stop-opacity="0.8" />
              <stop offset="1" stop-color="#b5b5b5" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="ply" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#d9c29b" />
              <stop offset="1" stop-color="#8f7858" />
            </linearGradient>
            <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#000" stop-opacity="0.45" />
              <stop offset="1" stop-color="#000" stop-opacity="1" />
            </linearGradient>
            <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="12" />
            </filter>
            <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="16" />
            </filter>
          </defs>
          <!-- world: floor at world y 600 -> screen y 1400, world x 400 -> screen x 540 -->
          <g transform="translate(540 1400) scale(1.45) translate(-400 -600)">
            <g id="beams"></g>
            
            <use href="#world" transform="translate(0 1200) scale(1 -1)" opacity="0.16" />
            <rect x="-200" y="600" width="1200" height="260" fill="url(#floorFade)" />
            <rect x="-200" y="599" width="1200" height="2" fill="#2a2a2a" />
            <g id="world"></g>
          </g>
        </svg>
        <div id="ctr"><span class="lbl">DAY</span> <span id="num">00</span></div>
        <div id="head">
          <div id="h1"></div>
          <div id="h2"></div>
        </div>
      </div>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="14" data-track-index="1"></audio>
    </div>

    <script>
      (function () {
        const DUR = 14;
        const FL = 600, BX0 = 380, BX1 = 520, BTOP = 410, TOPF = 404, SX = 250;
        const THIGH = 80, SHIN = 78, LEG = 154;
        const UARM = 64, FARM = 60, TORSO = 116, NECK = 12, HEADR = 31;
        const NS = "http://www.w3.org/2000/svg";
        const svgEl = (tag, attrs, parent) => {
          const e = document.createElementNS(NS, tag);
          for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(e);
          return e;
        };
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, p) => a + (b - a) * p;
        const ease = (p) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(p, 0, 1));
        const backOut = (p) => { p = clamp(p, 0, 1); const s = 2.2; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
        const win = (t, a, b) => ease((t - a) / (b - a));
        const rad = (x) => (x * Math.PI) / 180;
        const down = (a, f) => [Math.sin(rad(a)) * f, Math.cos(rad(a))];
        const up = (a, f) => [Math.sin(rad(a)) * f, -Math.cos(rad(a))];
        const r1 = (v) => Math.round(v * 10) / 10;
        const E = (id) => document.getElementById(id);
        let seed = 31;
        const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

        // ---------- rig v2 (from reel 05): blended poses, head/arm follow-through, breathing ----------
        function makeFig(parent, front, back, glow, id) {
          const g = svgEl("g", { id }, parent);
          if (glow) parent.insertBefore(svgEl("use", { href: "#" + id, filter: "url(#blur)", opacity: 0.45 }), g);
          const parts = { g };
          for (const [n, col] of [["armB", back], ["legB", back], ["torso", front], ["legF", front], ["armF", front]]) {
            const o = svgEl("path", { fill: "none", stroke: "#000", "stroke-width": 34, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            const w = svgEl("path", { fill: "none", stroke: col, "stroke-width": 22, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            parts[n] = [o, w];
          }
          parts.head = svgEl("circle", { r: HEADR, fill: front, stroke: "#000", "stroke-width": 6 }, g);
          return parts;
        }
        function ik(a, b, l1, l2, pick) {
          let dx = b[0] - a[0], dy = b[1] - a[1];
          let d = Math.hypot(dx, dy);
          const maxd = l1 + l2 - 0.5;
          if (d > maxd) {
            b = [a[0] + (dx / d) * maxd, a[1] + (dy / d) * maxd];
            dx = b[0] - a[0];
            dy = b[1] - a[1];
            d = maxd;
          }
          d = Math.max(d, Math.abs(l1 - l2) + 1);
          const al = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
          const base = Math.atan2(dy, dx);
          const c1 = [a[0] + Math.cos(base + al) * l1, a[1] + Math.sin(base + al) * l1];
          const c2 = [a[0] + Math.cos(base - al) * l1, a[1] + Math.sin(base - al) * l1];
          return [pick(c1, c2), b];
        }
        const P = (pts) => "M" + pts.map((p) => r1(p[0]) + " " + r1(p[1])).join("L");
        const setD = (pair, d) => {
          pair[0].setAttribute("d", d);
          pair[1].setAttribute("d", d);
        };
        // flat pose: hx hy torso head ax ay bx by | per arm a*/b*: sh el w tx ty
        function drawFig(parts, s, f) {
          const hip = [s.hx, s.hy];
          const tu = up(s.torso, f);
          const sh = [hip[0] + tu[0] * TORSO, hip[1] + tu[1] * TORSO];
          const nk = [hip[0] + tu[0] * (TORSO + NECK), hip[1] + tu[1] * (TORSO + NECK)];
          const hu = up(s.torso + s.head, f);
          const hc = [nk[0] + hu[0] * HEADR, nk[1] + hu[1] * HEADR];
          setD(parts.torso, P([hip, sh, nk]));
          parts.head.setAttribute("cx", r1(hc[0]));
          parts.head.setAttribute("cy", r1(hc[1]));
          const knee = (c1, c2) => (c1[0] * f > c2[0] * f ? c1 : c2);
          const elbow = (c1, c2) => (c1[1] - 0.5 * f * c1[0] > c2[1] - 0.5 * f * c2[0] ? c1 : c2);
          [["legF", [s.ax, s.ay]], ["legB", [s.bx, s.by]]].forEach(([n, ft]) => {
            const [kn, fo] = ik(hip, ft, THIGH, SHIN, knee);
            setD(parts[n], P([hip, kn, fo]));
          });
          const hands = [];
          [["armF", "a"], ["armB", "b"]].forEach(([n, k]) => {
            const u = down(s[k + "sh"], f);
            const el = [sh[0] + u[0] * UARM, sh[1] + u[1] * UARM];
            const v = down(s[k + "sh"] + s[k + "el"], f);
            const fk = [el[0] + v[0] * FARM, el[1] + v[1] * FARM];
            const w = clamp(s[k + "w"], 0, 1);
            const hand = [lerp(fk[0], s[k + "tx"], w), lerp(fk[1], s[k + "ty"], w)];
            const [e2, h2] = ik(sh, hand, UARM, FARM, elbow);
            setD(parts[n], P([sh, e2, h2]));
            hands.push(h2);
          });
          return { head: hc, hands, hip };
        }
        const KER = [-4, -3, -2, -1, 0, 1, 2, 3, 4].map((k) => [k * 0.03, Math.exp(-((k / 2.3) ** 2))]);
        function blend(raw, t) {
          const out = {};
          let ws = 0;
          for (const [dt, w] of KER) {
            const p = raw(clamp(t + dt, 0, DUR));
            for (const k in p) out[k] = (out[k] || 0) + p[k] * w;
            ws += w;
          }
          for (const k in out) out[k] /= ws;
          return out;
        }
        const LAGGED = ["head", "ash", "ael", "aw", "atx", "aty", "bsh", "bel", "bw", "btx", "bty"];
        function livePose(raw, t, phase) {
          const s = blend(raw, t);
          const lag = blend(raw, t - 0.05);
          for (const k of LAGGED) s[k] = lag[k];
          const br = Math.sin(t * 1.9 + phase);
          s.hy += br * 1.3;
          s.torso += br * 0.8;
          s.head += Math.sin(t * 1.2 + phase * 2) * 1.6;
          return s;
        }
        const ARMS = { ash: 8, ael: 12, aw: 0, atx: 0, aty: 0, bsh: -4, bel: 10, bw: 0, btx: 0, bty: 0 };
        const base = (o) => ({ hx: 0, hy: 0, torso: 3, head: 0, ax: 0, ay: FL, bx: 0, by: FL, ...ARMS, ...o });
        function standOn(x, f, fy) {
          return base({ hx: x, hy: fy - Math.sqrt(LEG * LEG - 15 * 15), ax: x + f * 15, ay: fy, bx: x - f * 15, by: fy });
        }
        const mixPose = (a, b, p) => {
          const o = {};
          for (const k in a) o[k] = lerp(a[k], b[k], p);
          return o;
        };

        // ---------- scene: he walks the same line every day and wears a path, while the other waits for motivation ----------
        const W = E("world");
        const STRIDE = 176;
        const PX0 = 140, PX1 = 420, SEG = 16;
        const groundG = svgEl("g", {}, W);
        svgEl("rect", { x: PX0 - 30, y: FL + 4, width: PX1 - PX0 + 60, height: 60, rx: 6, fill: "#101010" }, groundG);
        const segs = [];
        for (let x = PX0; x < PX1; x += SEG) segs.push(svgEl("rect", { x, y: FL + 14, width: SEG + 0.5, height: 36, fill: "#ffffff", opacity: 0 }, groundG));
        const pathGlow = svgEl("rect", { x: PX0, y: FL + 10, width: PX1 - PX0, height: 44, rx: 10, fill: "#ffffff", filter: "url(#blur)", opacity: 0 }, groundG);
        const seatG = svgEl("g", {}, W);
        svgEl("rect", { x: 520, y: 528, width: 86, height: 72, rx: 6, fill: "#3b3b3b", stroke: "#000", "stroke-width": 3 }, seatG);
        svgEl("rect", { x: 520, y: 528, width: 86, height: 8, rx: 3, fill: "#5a5a5a" }, seatG);
        const figG = svgEl("g", {}, W);
        const lazy = makeFig(figG, "#8a8a8a", "#6c6c6c", false, false, "lazy");
        const hero = makeFig(figG, "#ffffff", "#e2e2e2", true, "hero");
        // motivation bar floats above the one who waits (outside #world, so it is not mirrored)
        const barG = svgEl("g", {}, W.parentNode);
        svgEl("text", { x: 563, y: 206, "text-anchor": "middle", "font-family": "HFMono", "font-weight": 700, "font-size": 16, "letter-spacing": 3, fill: "#a0a0a0" }, barG).textContent = "MOTIVATION";
        svgEl("rect", { x: 508, y: 216, width: 110, height: 16, rx: 3, fill: "#0a0a0a", stroke: "#8a8a8a", "stroke-width": 2 }, barG);
        const barFill = svgEl("rect", { x: 511, y: 219, width: 10, height: 10, rx: 1, fill: "#d62a2a" }, barG);
        const barTxt = svgEl("text", { x: 563, y: 254, "text-anchor": "middle", "font-family": "HFMono", "font-weight": 700, "font-size": 18, fill: "#d62a2a" }, barG);
        const env = (p, a, b, c, d) => ease((p - a) / (b - a)) * (1 - ease((p - c) / (d - c)));

        // laps: [start, end, from x, to x]
        const LAPS = [[0.8, 1.9, 150, 400], [2.1, 3.2, 400, 150], [3.5, 4.6, 150, 400], [4.8, 5.9, 400, 150], [6.2, 7.3, 150, 400]];
        const START_X = 150;
        const posAt = (t) => {
          let x = START_X;
          for (const [a, b, x0, x1] of LAPS) if (t >= a) x = lerp(x0, x1, ease((t - a) / (b - a)));
          return x;
        };
        const dirAt = (t) => { let d = 1; for (let i = 0; i < LAPS.length; i++) if (t >= LAPS[i][0] - 0.3) d = LAPS[i][3] > LAPS[i][2] ? 1 : -1; return d; };
        const sxAt = (t) => {
          let s = 1;
          for (let i = 0; i < LAPS.length; i++) {
            const d = LAPS[i][3] > LAPS[i][2] ? 1 : -1, prev = i ? (LAPS[i - 1][3] > LAPS[i - 1][2] ? 1 : -1) : d;
            if (t >= LAPS[i][0] - 0.3) s = lerp(prev, d, win(t, LAPS[i][0] - 0.3, LAPS[i][0] - 0.05));
          }
          return s;
        };
        // distance walked so far (for the stride phase) and how many times each path segment was crossed
        const DT = 1 / 120, TAB = [], CROSS = segs.map(() => []);
        {
          let dist = 0, prev = posAt(0);
          for (let i = 0; i <= 14 * 120; i++) {
            const t = i * DT, x = posAt(t);
            dist += Math.abs(x - prev);
            TAB.push(dist);
            segs.forEach((_, k) => {
              const cx = PX0 + k * SEG + SEG / 2;
              if ((prev - cx) * (x - cx) < 0) CROSS[k].push(t);
            });
            prev = x;
          }
        }
        const distAt = (t) => TAB[clamp(Math.round(t * 120), 0, TAB.length - 1)];
        const frac = (v) => v - Math.floor(v);
        const STAND = FL - Math.sqrt(LEG * LEG - 15 * 15);
        function heroRaw(t) {
          const hx = posAt(t), p = distAt(t) / STRIDE;
          const feet = [0, 0.5].map((o) => {
            const q = frac(p + o + 1e-6);
            if (q < 0.5) return [hx + STRIDE * (0.25 - q) * 0.5, FL];
            const s = (q - 0.5) / 0.5;
            return [hx + STRIDE * (-0.25 + 0.5 * ease(s)) * 0.5, FL - Math.sin(Math.PI * s) * 22];
          });
          const moving = LAPS.reduce((m, [a, b]) => Math.max(m, env(t, a, a + 0.2, b - 0.2, b)), 0);
          const sw = Math.sin(p * Math.PI * 2) * 26 * moving;
          const end = win(t, 7.6, 8.4);
          return base({
            hx, hy: STAND + 1.5 * Math.abs(Math.sin(p * Math.PI * 2)) * moving, torso: 3 + 5 * moving - 5 * end, head: -2 * end,
            ax: feet[0][0], ay: feet[0][1], bx: feet[1][0], by: feet[1][1],
            ash: 8 + sw + 14 * end, ael: 12 + 10 * moving, bsh: -4 - sw - 12 * end, bel: 10 + 10 * moving,
          });
        }
        // the one who waits: slumped on the block, hands hanging, head down
        function lazyRaw(t) {
          const sigh = env(t, 5.2, 5.6, 5.9, 6.4);
          return base({
            hx: 563, hy: 516, torso: -4 - 3 * sigh, head: 22 + 8 * sigh,
            ax: 500, ay: FL, bx: 516, by: FL,
            ash: -18, ael: 24, aw: 1, atx: 522, aty: 548,
            bsh: -10, bel: 26, bw: 1, btx: 536, bty: 552,
          });
        }
        const flip = (g, hx, sx) => g.setAttribute("transform", `translate(${r1(hx)} 0) scale(${sx.toFixed(3)} 1) translate(${r1(-hx)} 0)`);

        const typed = (id, text, t, t0, cps) => {
          const n = clamp(Math.floor((t - t0) * cps), 0, text.length);
          E(id).innerHTML = "<span>" + text.slice(0, n) + '</span><span class="ghost">' + text.slice(n) + "</span>";
        };
        const pad = (n) => String(n).padStart(2, "0");

        // ---------- per-frame render ----------
        function render(t) {
          flip(hero.g, posAt(t), sxAt(t));
          drawFig(hero, livePose(heroRaw, t, 0.4), 1);
          flip(lazy.g, 563, -1);
          drawFig(lazy, livePose(lazyRaw, t, 2.0), 1);
          // the path wears in: each crossing lights its segment more
          let sum = 0;
          segs.forEach((s, k) => {
            const n = CROSS[k].filter((tc) => tc < t - 0.15).length;
            const v = Math.min(1, n * 0.22);
            sum += v;
            s.setAttribute("opacity", (v * 0.9).toFixed(3));
          });
          pathGlow.setAttribute("opacity", (0.55 * (sum / segs.length) * win(t, 6.0, 8.0)).toFixed(3));
          // motivation bar: twitches, never fills
          const bar = 10 + 6 * Math.max(0, Math.sin(t * 1.3)) + 4 * win(t, 2, 8);
          barFill.setAttribute("width", r1(bar));
          barTxt.textContent = Math.round((bar / 104) * 100) + "%";
          const day = 1 + Math.floor(29 * clamp((t - 0.8) / 6.5, 0, 1));
          E("num").textContent = pad(day);
          typed("h1", "MOTIVATION NEVER SHOWED UP.", t, 9.8, 26);
          typed("h2", "THE PATH WAS BUILT ANYWAY.", t, 11.2, 26);
        }

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
        window.__timelines["main"] = tl;
        render(0);
        tl.seek(0);
      })();
    </script>
  </body>
</html>
