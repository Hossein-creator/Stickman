<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "HFMono";
        src: url("assets/fonts/consolab.ttf") format("truetype");
        font-weight: 700;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      #stage svg {
        position: absolute;
        inset: 0;
      }
      .mono {
        position: absolute;
        font-family: "HFMono", monospace;
        font-weight: 700;
        white-space: nowrap;
      }
      /* everything readable stays inside the Instagram safe area: x 120-960, y 220-1500 */
      #head {
        position: absolute;
        left: 0;
        right: 0;
        top: 222px;
        text-align: center;
        font-family: "HFMono", monospace;
        font-weight: 700;
        font-size: 38px;
        letter-spacing: 0.12em;
        line-height: 1.45;
        color: #fff;
        text-shadow: 0 0 16px rgba(255, 255, 255, 0.3);
      }
      #head .ghost {
        visibility: hidden;
      }
      #ctr {
        position: absolute;
        left: 0;
        right: 0;
        top: 430px;
        text-align: center;
        font-family: "HFMono", monospace;
        font-weight: 700;
        white-space: nowrap;
      }
      #ctr .lbl {
        font-size: 26px;
        letter-spacing: 0.24em;
        color: #9a9a9a;
        vertical-align: middle;
      }
      #num {
        display: inline-block;
        min-width: 2.4ch;
        font-size: 58px;
        letter-spacing: 0.08em;
        color: #fff;
        vertical-align: middle;
        text-shadow: 0 0 14px rgba(255, 255, 255, 0.35);
      }
      #tag {
        display: inline-block;
        min-width: 5.2ch;
        padding: 6px 12px 4px;
        font-size: 26px;
        letter-spacing: 0.18em;
        vertical-align: middle;
        visibility: hidden;
      }
      #tag.fail {
        visibility: visible;
        background: #d62a2a;
        color: #fff;
      }
      #tag.pass {
        visibility: visible;
        background: #fff;
        color: #000;
        box-shadow: 0 0 22px rgba(255, 255, 255, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="14" data-track-index="0">
        <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
              <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.12" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0.04" />
            </linearGradient>
            <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.32" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="dustG" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#b5b5b5" stop-opacity="0.8" />
              <stop offset="1" stop-color="#b5b5b5" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="ply" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#d9c29b" />
              <stop offset="1" stop-color="#8f7858" />
            </linearGradient>
            <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#000" stop-opacity="0.45" />
              <stop offset="1" stop-color="#000" stop-opacity="1" />
            </linearGradient>
            <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="12" />
            </filter>
            <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="16" />
            </filter>
                      <linearGradient id="doorLight" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff6dc" />
              <stop offset="1" stop-color="#ffd98a" />
            </linearGradient>
            <radialGradient id="phoneGlow" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#8fbaff" stop-opacity="0.75" />
              <stop offset="1" stop-color="#8fbaff" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="warmPool" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#ffe2a0" stop-opacity="0.45" />
              <stop offset="1" stop-color="#ffe2a0" stop-opacity="0" />
            </radialGradient>
          </defs>
          <!-- world: floor at world y 600 -> screen y 1400, world x 400 -> screen x 540 -->
          <g transform="translate(540 1400) scale(1.45) translate(-400 -600)">
            <g id="beams"></g>
            <g id="back"></g>
            
            <use href="#world" transform="translate(0 1200) scale(1 -1)" opacity="0.16" />
            <rect x="-200" y="600" width="1200" height="260" fill="url(#floorFade)" />
            <rect x="-200" y="599" width="1200" height="2" fill="#2a2a2a" />
            <g id="world"></g>
          </g>
        </svg>
        <div id="ctr"><span class="lbl">NOTIFICATIONS</span> <span id="num">00</span></div>
        <div id="head">
          <div id="h1"></div>
          <div id="h2"></div>
        </div>
      </div>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="14" data-track-index="1"></audio>
    </div>

    <script>
      (function () {
        const DUR = 14;
        const FL = 600, BX0 = 380, BX1 = 520, BTOP = 410, TOPF = 404, SX = 250;
        const THIGH = 80, SHIN = 78, LEG = 154;
        const UARM = 64, FARM = 60, TORSO = 116, NECK = 12, HEADR = 31;
        const NS = "http://www.w3.org/2000/svg";
        const svgEl = (tag, attrs, parent) => {
          const e = document.createElementNS(NS, tag);
          for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(e);
          return e;
        };
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, p) => a + (b - a) * p;
        const ease = (p) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(p, 0, 1));
        const backOut = (p) => { p = clamp(p, 0, 1); const s = 2.2; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
        const win = (t, a, b) => ease((t - a) / (b - a));
        const rad = (x) => (x * Math.PI) / 180;
        const down = (a, f) => [Math.sin(rad(a)) * f, Math.cos(rad(a))];
        const up = (a, f) => [Math.sin(rad(a)) * f, -Math.cos(rad(a))];
        const r1 = (v) => Math.round(v * 10) / 10;
        const E = (id) => document.getElementById(id);
        let seed = 31;
        const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

        // ---------- rig v2 (from reel 05): blended poses, head/arm follow-through, breathing ----------
        function makeFig(parent, front, back, glow, id) {
          const g = svgEl("g", { id }, parent);
          if (glow) parent.insertBefore(svgEl("use", { href: "#" + id, filter: "url(#blur)", opacity: 0.45 }), g);
          const parts = { g };
          for (const [n, col] of [["armB", back], ["legB", back], ["torso", front], ["legF", front], ["armF", front]]) {
            const o = svgEl("path", { fill: "none", stroke: "#000", "stroke-width": 34, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            const w = svgEl("path", { fill: "none", stroke: col, "stroke-width": 22, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            parts[n] = [o, w];
          }
          parts.head = svgEl("circle", { r: HEADR, fill: front, stroke: "#000", "stroke-width": 6 }, g);
          return parts;
        }
        function ik(a, b, l1, l2, pick) {
          let dx = b[0] - a[0], dy = b[1] - a[1];
          let d = Math.hypot(dx, dy);
          const maxd = l1 + l2 - 0.5;
          if (d > maxd) {
            b = [a[0] + (dx / d) * maxd, a[1] + (dy / d) * maxd];
            dx = b[0] - a[0];
            dy = b[1] - a[1];
            d = maxd;
          }
          d = Math.max(d, Math.abs(l1 - l2) + 1);
          const al = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
          const base = Math.atan2(dy, dx);
          const c1 = [a[0] + Math.cos(base + al) * l1, a[1] + Math.sin(base + al) * l1];
          const c2 = [a[0] + Math.cos(base - al) * l1, a[1] + Math.sin(base - al) * l1];
          return [pick(c1, c2), b];
        }
        const P = (pts) => "M" + pts.map((p) => r1(p[0]) + " " + r1(p[1])).join("L");
        const setD = (pair, d) => {
          pair[0].setAttribute("d", d);
          pair[1].setAttribute("d", d);
        };
        // flat pose: hx hy torso head ax ay bx by | per arm a*/b*: sh el w tx ty
        function drawFig(parts, s, f) {
          const hip = [s.hx, s.hy];
          const tu = up(s.torso, f);
          const sh = [hip[0] + tu[0] * TORSO, hip[1] + tu[1] * TORSO];
          const nk = [hip[0] + tu[0] * (TORSO + NECK), hip[1] + tu[1] * (TORSO + NECK)];
          const hu = up(s.torso + s.head, f);
          const hc = [nk[0] + hu[0] * HEADR, nk[1] + hu[1] * HEADR];
          setD(parts.torso, P([hip, sh, nk]));
          parts.head.setAttribute("cx", r1(hc[0]));
          parts.head.setAttribute("cy", r1(hc[1]));
          const knee = (c1, c2) => (c1[0] * f > c2[0] * f ? c1 : c2);
          const elbow = (c1, c2) => (c1[1] - 0.5 * f * c1[0] > c2[1] - 0.5 * f * c2[0] ? c1 : c2);
          [["legF", [s.ax, s.ay]], ["legB", [s.bx, s.by]]].forEach(([n, ft]) => {
            const [kn, fo] = ik(hip, ft, THIGH, SHIN, knee);
            setD(parts[n], P([hip, kn, fo]));
          });
          const hands = [];
          [["armF", "a"], ["armB", "b"]].forEach(([n, k]) => {
            const u = down(s[k + "sh"], f);
            const el = [sh[0] + u[0] * UARM, sh[1] + u[1] * UARM];
            const v = down(s[k + "sh"] + s[k + "el"], f);
            const fk = [el[0] + v[0] * FARM, el[1] + v[1] * FARM];
            const w = clamp(s[k + "w"], 0, 1);
            const hand = [lerp(fk[0], s[k + "tx"], w), lerp(fk[1], s[k + "ty"], w)];
            const [e2, h2] = ik(sh, hand, UARM, FARM, elbow);
            setD(parts[n], P([sh, e2, h2]));
            hands.push(h2);
          });
          return { head: hc, hands, hip };
        }
        const KER = [-4, -3, -2, -1, 0, 1, 2, 3, 4].map((k) => [k * 0.03, Math.exp(-((k / 2.3) ** 2))]);
        function blend(raw, t) {
          const out = {};
          let ws = 0;
          for (const [dt, w] of KER) {
            const p = raw(clamp(t + dt, 0, DUR));
            for (const k in p) out[k] = (out[k] || 0) + p[k] * w;
            ws += w;
          }
          for (const k in out) out[k] /= ws;
          return out;
        }
        const LAGGED = ["head", "ash", "ael", "aw", "atx", "aty", "bsh", "bel", "bw", "btx", "bty"];
        function livePose(raw, t, phase) {
          const s = blend(raw, t);
          const lag = blend(raw, t - 0.05);
          for (const k of LAGGED) s[k] = lag[k];
          const br = Math.sin(t * 1.9 + phase);
          s.hy += br * 1.3;
          s.torso += br * 0.8;
          s.head += Math.sin(t * 1.2 + phase * 2) * 1.6;
          return s;
        }
        const ARMS = { ash: 8, ael: 12, aw: 0, atx: 0, aty: 0, bsh: -4, bel: 10, bw: 0, btx: 0, bty: 0 };
        const base = (o) => ({ hx: 0, hy: 0, torso: 3, head: 0, ax: 0, ay: FL, bx: 0, by: FL, ...ARMS, ...o });
        function standOn(x, f, fy) {
          return base({ hx: x, hy: fy - Math.sqrt(LEG * LEG - 15 * 15), ax: x + f * 15, ay: fy, bx: x - f * 15, by: fy });
        }
        const mixPose = (a, b, p) => {
          const o = {};
          for (const k in a) o[k] = lerp(a[k], b[k], p);
          return o;
        };

        // ---------- scene: a door marked GOAL, a man, a phone that keeps pulling him back ----------
        const beams = E("beams");
        const beam = svgEl("polygon", { points: "190,-90 290,-90 380,600 100,600", fill: "url(#beam)", filter: "url(#soft)", opacity: 0.35 }, beams);
        const W = E("world");
        const doorG = svgEl("g", {}, W);
        const figG = svgEl("g", {}, W);
        const fxG = svgEl("g", {}, W);

        // the door (its label lives outside the reflected world so it is not mirrored)
        const DX = 535, DW = 110, DH = 360;
        const doorPool = svgEl("ellipse", { cx: DX + DW / 2 - 60, cy: FL, rx: 160, ry: 26, fill: "url(#warmPool)", opacity: 0.4 }, doorG);
        const doorHalo = svgEl("rect", { x: DX - 30, y: FL - DH - 30, width: DW + 60, height: DH + 30, rx: 20, fill: "#ffe2a0", filter: "url(#soft)", opacity: 0.25 }, doorG);
        const doorIn = svgEl("rect", { x: DX, y: FL - DH, width: DW, height: DH, fill: "url(#doorLight)", opacity: 0.55 }, doorG);
        svgEl("rect", { x: DX - 7, y: FL - DH - 7, width: DW + 14, height: DH + 7, fill: "none", stroke: "#000", "stroke-width": 16 }, doorG);
        svgEl("rect", { x: DX - 7, y: FL - DH - 7, width: DW + 14, height: DH + 7, fill: "none", stroke: "#cfcfcf", "stroke-width": 8 }, doorG);
        const doorRay = svgEl("polygon", { points: `${DX},${FL - DH} ${DX},${FL} ${DX - 260},${FL + 40} ${DX - 220},${FL - DH - 60}`, fill: "#ffe2a0", filter: "url(#soft)", opacity: 0.08 }, doorG);
        const goal = svgEl("text", { x: DX + DW / 2, y: FL - DH - 22, "text-anchor": "middle", "font-family": "HFMono", "font-weight": 700, "font-size": 19, fill: "#f0e0b8", "letter-spacing": 4 }, W.parentNode);
        goal.textContent = "GOAL";

        // ---------- the walk: forward, buzz, backward while staring at the phone ----------
        // stops land on half strides (x = 110 + 80 n) so both feet are planted
        const X0 = 110, STRIDE = 160;
        const K = [[0, 110], [0.3, 110], [1.6, 270], [2.7, 270], [3.25, 190], [3.4, 190], [4.4, 350], [5.5, 350], [6.0, 270], [6.05, 270], [6.6, 430], [7.4, 430], [9.0, 590], [DUR, 590]];
        const hipX = (t) => {
          for (let i = 1; i < K.length; i++) if (t < K[i][0]) return lerp(K[i - 1][1], K[i][1], ease((t - K[i - 1][0]) / (K[i][0] - K[i - 1][0])));
          return K[K.length - 1][1];
        };
        const BUZZ = [1.62, 4.42, 6.62];
        const COUNT = [3, 12, 37];
        const LATE = [8.1, 8.9, 9.7, 10.6]; // the phone on the floor keeps buzzing, ignored
        const LCOUNT = [52, 64, 81, 99];
        const look = (t) => win(t, 1.62, 1.9) * (1 - win(t, 3.25, 3.55)) + win(t, 4.42, 4.7) * (1 - win(t, 6.0, 6.3)) + win(t, 6.62, 6.8) * (1 - win(t, 6.92, 7.05));
        const THROW = 7.15, LANDP = 7.75;
        const frac = (v) => v - Math.floor(v);
        const stand = FL - Math.sqrt(LEG * LEG - 15 * 15);
        function manRaw(t) {
          const hx = hipX(t), p = (hx - X0) / STRIDE;
          const feet = [0, 0.5].map((o) => {
            const q = frac(p + o + 1e-6);
            if (q < 0.5) return [hx + STRIDE * (0.25 - q), FL];
            const s = (q - 0.5) / 0.5;
            return [hx + STRIDE * (-0.25 + 0.5 * ease(s)), FL - Math.sin(Math.PI * s) * 18];
          });
          const lk = clamp(look(t), 0, 1);
          const sw = Math.sin(Math.PI * 2 * p) * (1 - lk);
          const bob = 4 * Math.abs(Math.sin(Math.PI * 2 * p));
          const wind = win(t, 6.92, 7.1) * (1 - win(t, 7.12, 7.35));
          const free = win(t, 7.4, 8.0);
          const legH = Math.sqrt(LEG * LEG - (STRIDE * 0.25) ** 2);
          return base({
            hx, hy: lerp(stand, FL - legH, 0.6) + bob + 3 * lk, torso: 4 + 8 * lk - 8 * wind - 3 * free, head: 30 * lk - 4 * free,
            ax: feet[0][0], ay: feet[0][1], bx: feet[1][0], by: feet[1][1],
            ash: 8 + 22 * sw - 80 * wind, ael: 14 + 30 * wind, aw: lk, atx: hx + 46, aty: stand - 62,
            bsh: -4 - 22 * sw, bel: 12, bw: lk, btx: hx + 40, bty: stand - 58,
          });
        }
        const man = makeFig(figG, "#ffffff", "#e2e2e2", true, "man");
        // phone: screen + glow + red badge
        const phGlow = svgEl("circle", { r: 70, fill: "url(#phoneGlow)", opacity: 0 }, fxG);
        const ph = svgEl("g", {}, fxG);
        svgEl("rect", { x: -9, y: -16, width: 18, height: 32, rx: 4, fill: "#111", stroke: "#000", "stroke-width": 2 }, ph);
        const scr = svgEl("rect", { x: -6.5, y: -12.5, width: 13, height: 25, rx: 2, fill: "#2a3a55" }, ph);
        const badgeG = svgEl("g", { opacity: 0 }, fxG);
        svgEl("circle", { r: 14, fill: "#e0322b", stroke: "#000", "stroke-width": 2.5 }, badgeG);
        const badgeT = svgEl("text", { y: 5, "text-anchor": "middle", "font-family": "HFMono", "font-weight": 700, "font-size": 13, fill: "#fff" }, badgeG);

        const typed = (id, text, t, t0, cps) => {
          const n = clamp(Math.floor((t - t0) * cps), 0, text.length);
          E(id).innerHTML = "<span>" + text.slice(0, n) + '</span><span class="ghost">' + text.slice(n) + "</span>";
        };
        const pad = (n) => String(n).padStart(2, "0");

        // ---------- per-frame render ----------
        function render(t) {
          const j = drawFig(man, livePose(manRaw, t, 0.3), 1);
          // phone: in his hand until the throw, then an arc back to the floor where it buzzes alone
          let pp, rot;
          const hand = j.hands[0];
          if (t < THROW) {
            pp = [hand[0] + 4, hand[1] - 6];
            rot = 20 * (1 - look(t));
          } else {
            const q = clamp((t - THROW) / (LANDP - THROW), 0, 1);
            const start = [360, 300];
            pp = [lerp(start[0], 110, q), lerp(start[1], FL - 6, q) - Math.sin(Math.PI * q) * 140];
            rot = q < 1 ? -720 * q : 90;
          }
          const allB = BUZZ.concat(LATE);
          const bz = allB.reduce((v, b) => v + (t > b && t < b + 0.5 ? 1 : 0), 0);
          const shake = bz ? Math.sin(t * 90) * 6 : 0;
          ph.setAttribute("transform", `translate(${r1(pp[0])} ${r1(pp[1])}) rotate(${r1(rot + shake)})`);
          const lit = Math.max(clamp(look(t), 0, 1), bz ? 1 : 0, t > LANDP ? 0.35 : 0);
          scr.setAttribute("fill", lit > 0.5 ? "#9cc4ff" : "#2a3a55");
          phGlow.setAttribute("cx", r1(pp[0]));
          phGlow.setAttribute("cy", r1(pp[1]));
          phGlow.setAttribute("opacity", (lit * (0.8 + 0.2 * Math.sin(t * 9))).toFixed(3));

          // badge pops up with each buzz
          let n = 0, bt = -9;
          BUZZ.forEach((b, i) => { if (t >= b) { n = COUNT[i]; bt = b; } });
          LATE.forEach((b, i) => { if (t >= b) { n = LCOUNT[i]; bt = b; } });
          const ba = (t - bt) / 0.9;
          badgeG.setAttribute("opacity", ba >= 0 && ba < 1 ? (1 - ease((ba - 0.6) / 0.4)).toFixed(3) : 0);
          badgeG.setAttribute("transform", `translate(${r1(pp[0] + 16)} ${r1(pp[1] - 28 - 10 * ease(ba))}) scale(${backOut(ba / 0.3).toFixed(3)})`);
          badgeT.textContent = n;
          E("num").textContent = pad(n);
          E("num").style.color = t > LATE[0] ? "#7a7a7a" : "#ffffff";

          // the door brightens as he gets close and opens wide when he steps in
          const near = clamp((hipX(t) - 110) / 480, 0, 1);
          const inn = win(t, 8.6, 9.6);
          doorIn.setAttribute("opacity", (0.45 + 0.45 * near * near + 0.1 * inn).toFixed(3));
          doorHalo.setAttribute("opacity", (0.2 + 0.5 * inn).toFixed(3));
          doorRay.setAttribute("opacity", (0.06 + 0.3 * inn).toFixed(3));
          doorPool.setAttribute("opacity", (0.35 + 0.6 * inn).toFixed(3));
          beam.setAttribute("points", `${r1(hipX(t) - 50)},-90 ${r1(hipX(t) + 50)},-90 ${r1(hipX(t) + 140)},600 ${r1(hipX(t) - 140)},600`);
          beam.setAttribute("opacity", (0.35 * (1 - inn)).toFixed(3));

          typed("h1", "YOU'RE NOT LAZY.", t, 9.8, 22);
          typed("h2", "YOU'RE DISTRACTED.", t, 10.8, 22);
        }

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
        window.__timelines["main"] = tl;
        render(0);
        tl.seek(0);
      })();
