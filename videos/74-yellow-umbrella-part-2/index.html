      @font-face {

        margin: 0;

      html,

        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      #stage svg {
        position: absolute;
        inset: 0;
      }
      .mono {
        position: absolute;
        font-family: "HFMono", monospace;
        font-weight: 700;
        white-space: nowrap;
      }
      /* everything readable stays inside the Instagram safe area: x 120-960, y 220-1500 */
      #head {
        position: absolute;
        left: 0;
        right: 0;
        top: 222px;
        text-align: center;
        font-family: "HFMono", monospace;
        font-weight: 700;
        font-size: 38px;
        letter-spacing: 0.12em;
        line-height: 1.45;
        color: #fff;
        text-shadow: 0 0 16px rgba(255, 255, 255, 0.3);
      }
      #head .ghost {
        visibility: hidden;
      }
      #ctr {
        position: absolute;
        left: 0;

        vertical-align: middle;

      #tag {
        display: inline-block;
        min-width: 5.2ch;
        padding: 6px 12px 4px;
        font-size: 26px;
        letter-spacing: 0.18em;
        vertical-align: middle;
        visibility: hidden;

      #tag.pass {
        visibility: visible;

        color: #000;

                      <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">

    <script>
      (function () {
        const DUR = 36;
        const FL = 600, BX0 = 380, BX1 = 520, BTOP = 410, TOPF = 404, SX = 250;
        const THIGH = 80, SHIN = 78, LEG = 154;
        const UARM = 64, FARM = 60, TORSO = 116, NECK = 12, HEADR = 31;
        const NS = "http://www.w3.org/2000/svg";
        const svgEl = (tag, attrs, parent) => {
          const e = document.createElementNS(NS, tag);
          for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(e);
          return e;
        };
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, p) => a + (b - a) * p;
        const ease = (p) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(p, 0, 1));
        const backOut = (p) => { p = clamp(p, 0, 1); const s = 2.2; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
        const win = (t, a, b) => ease((t - a) / (b - a));
        const rad = (x) => (x * Math.PI) / 180;
        const down = (a, f) => [Math.sin(rad(a)) * f, Math.cos(rad(a))];
        const up = (a, f) => [Math.sin(rad(a)) * f, -Math.cos(rad(a))];
        const r1 = (v) => Math.round(v * 10) / 10;
        const E = (id) => document.getElementById(id);
        let seed = 31;
        const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

        // ---------- rig v2 (from reel 05): blended poses, head/arm follow-through, breathing ----------
        function makeFig(parent, front, back, glow, id) {
          const g = svgEl("g", { id }, parent);
          if (glow) parent.insertBefore(svgEl("use", { href: "#" + id, filter: "url(#blur)", opacity: 0.45 }), g);
          const parts = { g };
          for (const [n, col] of [["armB", back], ["legB", back], ["torso", front], ["legF", front], ["armF", front]]) {
            const o = svgEl("path", { fill: "none", stroke: "#000", "stroke-width": 34, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            const w = svgEl("path", { fill: "none", stroke: col, "stroke-width": 22, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            parts[n] = [o, w];
          }
          parts.head = svgEl("circle", { r: HEADR, fill: front, stroke: "#000", "stroke-width": 6 }, g);
          return parts;
        }
        function ik(a, b, l1, l2, pick) {
          let dx = b[0] - a[0], dy = b[1] - a[1];
          let d = Math.hypot(dx, dy);
          const maxd = l1 + l2 - 0.5;
          if (d > maxd) {
            b = [a[0] + (dx / d) * maxd, a[1] + (dy / d) * maxd];
            dx = b[0] - a[0];
            dy = b[1] - a[1];
            d = maxd;
          }
          d = Math.max(d, Math.abs(l1 - l2) + 1);
          const al = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
          const base = Math.atan2(dy, dx);
          const c1 = [a[0] + Math.cos(base + al) * l1, a[1] + Math.sin(base + al) * l1];
          const c2 = [a[0] + Math.cos(base - al) * l1, a[1] + Math.sin(base - al) * l1];
          return [pick(c1, c2), b];
        }
        const P = (pts) => "M" + pts.map((p) => r1(p[0]) + " " + r1(p[1])).join("L");
        const setD = (pair, d) => {
          pair[0].setAttribute("d", d);
          pair[1].setAttribute("d", d);
        };
        // flat pose: hx hy torso head ax ay bx by | per arm a*/b*: sh el w tx ty
        function drawFig(parts, s, f) {
          const hip = [s.hx, s.hy];
          const tu = up(s.torso, f);
          const sh = [hip[0] + tu[0] * TORSO, hip[1] + tu[1] * TORSO];
          const nk = [hip[0] + tu[0] * (TORSO + NECK), hip[1] + tu[1] * (TORSO + NECK)];
          const hu = up(s.torso + s.head, f);
          const hc = [nk[0] + hu[0] * HEADR, nk[1] + hu[1] * HEADR];
          setD(parts.torso, P([hip, sh, nk]));
          parts.head.setAttribute("cx", r1(hc[0]));
          parts.head.setAttribute("cy", r1(hc[1]));
          const knee = (c1, c2) => (c1[0] * f > c2[0] * f ? c1 : c2);
          const elbow = (c1, c2) => (c1[1] - 0.5 * f * c1[0] > c2[1] - 0.5 * f * c2[0] ? c1 : c2);
          [["legF", [s.ax, s.ay]], ["legB", [s.bx, s.by]]].forEach(([n, ft]) => {
            const [kn, fo] = ik(hip, ft, THIGH, SHIN, knee);
            setD(parts[n], P([hip, kn, fo]));
          });
          const hands = [];
          [["armF", "a"], ["armB", "b"]].forEach(([n, k]) => {
            const u = down(s[k + "sh"], f);
            const el = [sh[0] + u[0] * UARM, sh[1] + u[1] * UARM];
            const v = down(s[k + "sh"] + s[k + "el"], f);
            const fk = [el[0] + v[0] * FARM, el[1] + v[1] * FARM];
            const w = clamp(s[k + "w"], 0, 1);
            const hand = [lerp(fk[0], s[k + "tx"], w), lerp(fk[1], s[k + "ty"], w)];
            const [e2, h2] = ik(sh, hand, UARM, FARM, elbow);
            setD(parts[n], P([sh, e2, h2]));
            hands.push(h2);
          });
          return { head: hc, hands, hip };
        }
        const KER = [-4, -3, -2, -1, 0, 1, 2, 3, 4].map((k) => [k * 0.03, Math.exp(-((k / 2.3) ** 2))]);
        function blend(raw, t) {
          const out = {};
          let ws = 0;
          for (const [dt, w] of KER) {
            const p = raw(clamp(t + dt, 0, DUR));
            for (const k in p) out[k] = (out[k] || 0) + p[k] * w;
            ws += w;
          }
          for (const k in out) out[k] /= ws;
          return out;
        }
        const LAGGED = ["head", "ash", "ael", "aw", "atx", "aty", "bsh", "bel", "bw", "btx", "bty"];
        function livePose(raw, t, phase) {
          const s = blend(raw, t);
          const lag = blend(raw, t - 0.05);
          for (const k of LAGGED) s[k] = lag[k];
          const br = Math.sin(t * 1.9 + phase);
          s.hy += br * 1.3;
          s.torso += br * 0.8;
          s.head += Math.sin(t * 1.2 + phase * 2) * 1.6;
          return s;
        }
        const ARMS = { ash: 8, ael: 12, aw: 0, atx: 0, aty: 0, bsh: -4, bel: 10, bw: 0, btx: 0, bty: 0 };
        const base = (o) => ({ hx: 0, hy: 0, torso: 3, head: 0, ax: 0, ay: FL, bx: 0, by: FL, ...ARMS, ...o });
        function standOn(x, f, fy) {
          return base({ hx: x, hy: fy - Math.sqrt(LEG * LEG - 15 * 15), ax: x + f * 15, ay: fy, bx: x - f * 15, by: fy });
        }
        const mixPose = (a, b, p) => {
          const o = {};
          for (const k in a) o[k] = lerp(a[k], b[k], p);
          return o;
        };

        // ===== shared lib for the series "THE YELLOW UMBRELLA" (series/yellow-umbrella/lib.js) =====
        // each part = this lib + partN.js, concatenated by series/yellow-umbrella/make.sh into videos/NN/tools/body.js
        const cam = E("svg").children[1];
        for (const el of Array.from(cam.children)) {
          const fill = el.getAttribute("fill") || "";
          if (fill.includes("floorFade") || fill === "#2a2a2a") { el.setAttribute("x", -2400); el.setAttribute("width", 6000); }
        }
        const W = E("world"), backG = E("back");
        const frac = (v) => v - Math.floor(v);
        const stand = FL - Math.sqrt(LEG * LEG - 15 * 15);
        const hold = (s, a, b, r = 0.2) => win(s, a, a + r) * (1 - win(s, b - r, b));
        const reachTo = (s, k, p, hand = "a") => { if (s[hand + "w"] < 1e-6) { s[hand + "tx"] = p[0]; s[hand + "ty"] = p[1]; s[hand + "w"] = k; return s; } s[hand + "w"] = Math.max(s[hand + "w"], k); s[hand + "tx"] = lerp(s[hand + "tx"], p[0], k); s[hand + "ty"] = lerp(s[hand + "ty"], p[1], k); return s; };
        const YEL = "#ffd23a";
        // ---- layers (back to front) ----
        const skyG = svgEl("g", {}, backG);
        const setG = svgEl("g", {}, backG);
        const propG = svgEl("g", {}, W);
        const inG = svgEl("g", {}, W);      // actors inside a house (behind the wall)
        const wallG = svgEl("g", {}, W);
        const figG = svgEl("g", {}, W);
        const fxG = svgEl("g", {}, W);
        const rainG = svgEl("g", {}, W);
        // ---- sky ----
        const SKY = {};
        for (const [n, c] of [["storm", "#26303c"], ["night", "#0b1640"], ["day", "#7aa8d8"], ["warm", "#3a2a22"], ["gray", "#4a5560"]]) SKY[n] = svgEl("rect", { x: -3000, y: -2000, width: 7000, height: 2600, fill: c, opacity: 0 }, skyG);
        const sun = svgEl("circle", { r: 40, fill: "#ffd060", opacity: 0 }, skyG);
        const moon = svgEl("circle", { r: 30, fill: "#f3efd8", opacity: 0 }, skyG);
        const bow = svgEl("g", { opacity: 0 }, skyG);
        ["#ff3b30", "#ff9500", "#ffd23a", "#34c759", "#0a84ff", "#8e5bd6"].forEach((c, i) => svgEl("path", { d: `M${-60 + i * 14} ${FL} A ${520 - i * 14} ${520 - i * 14} 0 0 1 ${980 - i * 14} ${FL}`, fill: "none", stroke: c, "stroke-width": 14, opacity: 0.55 }, bow));
        // ---- sets ----
        const SETS = {};
        const mk = (n) => (SETS[n] = svgEl("g", { opacity: 0 }, setG));
        const lamp = (g, x) => { svgEl("circle", { cx: x + 40, cy: FL - 470, r: 160, fill: "url(#fireGlow)", opacity: 0.35 }, g); svgEl("rect", { x: x - 6, y: FL - 480, width: 12, height: 480, fill: "#222", stroke: "#000", "stroke-width": 3 }, g); svgEl("path", { d: `M${x} ${FL - 478} q30 -14 50 4`, fill: "none", stroke: "#222", "stroke-width": 10 }, g); svgEl("ellipse", { cx: x + 50, cy: FL - 468, rx: 16, ry: 9, fill: "#ffe7a8" }, g); };
        // bus stop (shelter x 560..840)
        { const g = mk("stop");
          svgEl("rect", { x: -2400, y: FL - 700, width: 6000, height: 700, fill: "#1d232b", opacity: 0.6 }, g);
          for (let i = 0; i < 9; i++) svgEl("rect", { x: -900 + i * 300, y: FL - 620 + (i % 3) * 30, width: 180, height: 620, fill: "#151a20" }, g);
          for (let i = 0; i < 26; i++) svgEl("rect", { x: -880 + (i % 9) * 300 + (i % 2) * 70, y: FL - 560 + Math.floor(i / 9) * 90, width: 34, height: 44, fill: "#ffcf7a", opacity: 0.35 }, g);
          lamp(g, 300); lamp(g, 1180);
          svgEl("rect", { x: 575, y: FL - 340, width: 250, height: 260, fill: "#9fb8c8", opacity: 0.14, stroke: "#5a6a78", "stroke-width": 4 }, g);
          for (const x of [570, 830]) svgEl("rect", { x: x - 6, y: FL - 392, width: 12, height: 392, fill: "#3a4048", stroke: "#000", "stroke-width": 3 }, g);
          svgEl("rect", { x: 536, y: FL - 404, width: 330, height: 22, rx: 4, fill: "#4a525c", stroke: "#000", "stroke-width": 4 }, g);
          svgEl("rect", { x: 600, y: FL - 92, width: 200, height: 14, fill: "#6b4a30", stroke: "#000", "stroke-width": 3 }, g);
          svgEl("rect", { x: 1236, y: FL - 330, width: 8, height: 330, fill: "#555" }, g);
          svgEl("circle", { cx: 1240, cy: FL - 352, r: 30, fill: "#2a7ad8", stroke: "#000", "stroke-width": 4 }, g);
          const tx = svgEl("text", { x: 1240, y: FL - 344, "font-family": "HFMono, monospace", "font-weight": 700, "font-size": 22, fill: "#fff", "text-anchor": "middle" }, g); tx.textContent = "BUS"; }
        // street (wide, for running)
        { const g = mk("road");
          svgEl("rect", { x: -2400, y: FL - 700, width: 6000, height: 700, fill: "#1d232b", opacity: 0.6 }, g);
          for (let i = 0; i < 16; i++) svgEl("rect", { x: -1400 + i * 260, y: FL - 640 + (i % 4) * 40, width: 170, height: 640, fill: "#151a20" }, g);
          for (let i = 0; i < 12; i++) lamp(g, -1200 + i * 420);
          for (let i = 0; i < 10; i++) svgEl("ellipse", { cx: -1100 + i * 380, cy: FL + 6, rx: 70, ry: 8, fill: "#8fb0d0", opacity: 0.25 }, g); }
        // her house: wall with a window hole (wall goes in front of inside actors)
        const roomLight = svgEl("rect", { x: 560, y: FL - 400, width: 220, height: 230, fill: "#ffcf7a", opacity: 0 }, setG);
        { const g = mk("house");
          svgEl("rect", { x: -2400, y: FL - 900, width: 6000, height: 900, fill: "#141a24" }, g);
          lamp(g, 1000); }
        const wall = svgEl("g", { opacity: 0 }, wallG);
        svgEl("path", { d: `M250 ${FL - 600} H1080 V${FL + 40} H250 Z M560 ${FL - 400} V${FL - 170} H780 V${FL - 400} Z`, fill: "#3a3330", "fill-rule": "evenodd", stroke: "#000", "stroke-width": 6 }, wall);
        svgEl("path", { d: `M230 ${FL - 600} L665 ${FL - 820} L1100 ${FL - 600} Z`, fill: "#4a2a24", stroke: "#000", "stroke-width": 6 }, wall);
        svgEl("rect", { x: 552, y: FL - 408, width: 236, height: 246, fill: "none", stroke: "#6b4a30", "stroke-width": 14 }, wall);
        svgEl("rect", { x: 664, y: FL - 400, width: 12, height: 230, fill: "#6b4a30" }, wall);
        svgEl("rect", { x: 540, y: FL - 172, width: 260, height: 18, fill: "#6b4a30", stroke: "#000", "stroke-width": 3 }, wall);
        svgEl("rect", { x: 880, y: FL - 300, width: 130, height: 300, fill: "#2a2018", stroke: "#000", "stroke-width": 5 }, wall);
        svgEl("circle", { cx: 990, cy: FL - 150, r: 7, fill: "#d4af37" }, wall);
        // wedding hall
        { const g = mk("hall");
          svgEl("rect", { x: -2400, y: FL - 900, width: 6000, height: 900, fill: "#3a2a22" }, g);
          svgEl("circle", { cx: 640, cy: FL - 600, r: 420, fill: "url(#fireGlow)", opacity: 0.45 }, g);
          for (let i = 0; i < 8; i++) svgEl("rect", { x: -200 + i * 220, y: FL - 900, width: 40, height: 900, fill: "#2c1f19" }, g);
          svgEl("rect", { x: 180, y: FL - 330, width: 150, height: 330, fill: "#1a2232", stroke: "#000", "stroke-width": 6 }, g);
