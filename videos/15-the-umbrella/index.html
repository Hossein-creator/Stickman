<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "HFMono";
        src: url("assets/fonts/consolab.ttf") format("truetype");
        font-weight: 700;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      #stage svg {
        position: absolute;
        inset: 0;
      }
      .mono {
        position: absolute;
        font-family: "HFMono", monospace;
        font-weight: 700;
        white-space: nowrap;
      }
      /* everything readable stays inside the Instagram safe area: x 120-960, y 220-1500 */
      #head {
        position: absolute;
        left: 0;
        right: 0;
        top: 222px;
        text-align: center;
        font-family: "HFMono", monospace;
        font-weight: 700;
        font-size: 38px;
        letter-spacing: 0.12em;
        line-height: 1.45;
        color: #fff;
        text-shadow: 0 0 16px rgba(255, 255, 255, 0.3);
      }
      #head .ghost {
        visibility: hidden;
      }
      #ctr {
        position: absolute;
        left: 0;
        right: 0;
        top: 430px;
        text-align: center;
        font-family: "HFMono", monospace;
        font-weight: 700;
        white-space: nowrap;
      }
      #ctr .lbl {
        font-size: 26px;
        letter-spacing: 0.24em;
        color: #9a9a9a;
        vertical-align: middle;
      }
      #num {
        display: inline-block;
        min-width: 2.4ch;
        font-size: 58px;
        letter-spacing: 0.08em;
        color: #fff;
        vertical-align: middle;
        text-shadow: 0 0 14px rgba(255, 255, 255, 0.35);
      }
      #tag {
        display: inline-block;
        min-width: 5.2ch;
        padding: 6px 12px 4px;
        font-size: 26px;
        letter-spacing: 0.18em;
        vertical-align: middle;
        visibility: hidden;
      }
      #tag.fail {
        visibility: visible;
        background: #d62a2a;
        color: #fff;
      }
      #tag.pass {
        visibility: visible;
        background: #fff;
        color: #000;
        box-shadow: 0 0 22px rgba(255, 255, 255, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="14" data-track-index="0">
        <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
              <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.12" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0.04" />
            </linearGradient>
            <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.32" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="dustG" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#b5b5b5" stop-opacity="0.8" />
              <stop offset="1" stop-color="#b5b5b5" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="ply" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#d9c29b" />
              <stop offset="1" stop-color="#8f7858" />
            </linearGradient>
            <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#000" stop-opacity="0.45" />
              <stop offset="1" stop-color="#000" stop-opacity="1" />
            </linearGradient>
            <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="12" />
            </filter>
            <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="16" />
            </filter>
          
          </defs>
          <!-- world: floor at world y 600 -> screen y 1400, world x 400 -> screen x 540 -->
          <g transform="translate(540 1400) scale(1.45) translate(-400 -600)">
            <g id="beams"></g>
            <g id="back"></g>
            
            <use href="#world" transform="translate(0 1200) scale(1 -1)" opacity="0.16" />
            <rect x="-200" y="600" width="1200" height="260" fill="url(#floorFade)" />
            <rect x="-200" y="599" width="1200" height="2" fill="#2a2a2a" />
            <g id="world"></g>
          </g>
        </svg>
        
        <div id="head">
          <div id="h1"></div>
          <div id="h2"></div>
        </div>
      </div>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="14" data-track-index="1"></audio>
    </div>

    <script>
      (function () {
        const DUR = 14;
        const FL = 600, BX0 = 380, BX1 = 520, BTOP = 410, TOPF = 404, SX = 250;
        const THIGH = 80, SHIN = 78, LEG = 154;
        const UARM = 64, FARM = 60, TORSO = 116, NECK = 12, HEADR = 31;
        const NS = "http://www.w3.org/2000/svg";
        const svgEl = (tag, attrs, parent) => {
          const e = document.createElementNS(NS, tag);
          for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(e);
          return e;
        };
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, p) => a + (b - a) * p;
        const ease = (p) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(p, 0, 1));
        const backOut = (p) => { p = clamp(p, 0, 1); const s = 2.2; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
        const win = (t, a, b) => ease((t - a) / (b - a));
        const rad = (x) => (x * Math.PI) / 180;
        const down = (a, f) => [Math.sin(rad(a)) * f, Math.cos(rad(a))];
        const up = (a, f) => [Math.sin(rad(a)) * f, -Math.cos(rad(a))];
        const r1 = (v) => Math.round(v * 10) / 10;
        const E = (id) => document.getElementById(id);
        let seed = 31;
        const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

        // ---------- rig v2 (from reel 05): blended poses, head/arm follow-through, breathing ----------
        function makeFig(parent, front, back, glow, id) {
          const g = svgEl("g", { id }, parent);
          if (glow) parent.insertBefore(svgEl("use", { href: "#" + id, filter: "url(#blur)", opacity: 0.45 }), g);
          const parts = { g };
          for (const [n, col] of [["armB", back], ["legB", back], ["torso", front], ["legF", front], ["armF", front]]) {
            const o = svgEl("path", { fill: "none", stroke: "#000", "stroke-width": 34, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            const w = svgEl("path", { fill: "none", stroke: col, "stroke-width": 22, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            parts[n] = [o, w];
          }
          parts.head = svgEl("circle", { r: HEADR, fill: front, stroke: "#000", "stroke-width": 6 }, g);
          return parts;
        }
        function ik(a, b, l1, l2, pick) {
          let dx = b[0] - a[0], dy = b[1] - a[1];
          let d = Math.hypot(dx, dy);
          const maxd = l1 + l2 - 0.5;
          if (d > maxd) {
            b = [a[0] + (dx / d) * maxd, a[1] + (dy / d) * maxd];
            dx = b[0] - a[0];
            dy = b[1] - a[1];
            d = maxd;
          }
          d = Math.max(d, Math.abs(l1 - l2) + 1);
          const al = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
          const base = Math.atan2(dy, dx);
          const c1 = [a[0] + Math.cos(base + al) * l1, a[1] + Math.sin(base + al) * l1];
          const c2 = [a[0] + Math.cos(base - al) * l1, a[1] + Math.sin(base - al) * l1];
          return [pick(c1, c2), b];
        }
        const P = (pts) => "M" + pts.map((p) => r1(p[0]) + " " + r1(p[1])).join("L");
        const setD = (pair, d) => {
          pair[0].setAttribute("d", d);
          pair[1].setAttribute("d", d);
        };
        // flat pose: hx hy torso head ax ay bx by | per arm a*/b*: sh el w tx ty
        function drawFig(parts, s, f) {
          const hip = [s.hx, s.hy];
          const tu = up(s.torso, f);
          const sh = [hip[0] + tu[0] * TORSO, hip[1] + tu[1] * TORSO];
          const nk = [hip[0] + tu[0] * (TORSO + NECK), hip[1] + tu[1] * (TORSO + NECK)];
          const hu = up(s.torso + s.head, f);
          const hc = [nk[0] + hu[0] * HEADR, nk[1] + hu[1] * HEADR];
          setD(parts.torso, P([hip, sh, nk]));
          parts.head.setAttribute("cx", r1(hc[0]));
          parts.head.setAttribute("cy", r1(hc[1]));
          const knee = (c1, c2) => (c1[0] * f > c2[0] * f ? c1 : c2);
          const elbow = (c1, c2) => (c1[1] - 0.5 * f * c1[0] > c2[1] - 0.5 * f * c2[0] ? c1 : c2);
          [["legF", [s.ax, s.ay]], ["legB", [s.bx, s.by]]].forEach(([n, ft]) => {
            const [kn, fo] = ik(hip, ft, THIGH, SHIN, knee);
            setD(parts[n], P([hip, kn, fo]));
          });
          const hands = [];
          [["armF", "a"], ["armB", "b"]].forEach(([n, k]) => {
            const u = down(s[k + "sh"], f);
            const el = [sh[0] + u[0] * UARM, sh[1] + u[1] * UARM];
            const v = down(s[k + "sh"] + s[k + "el"], f);
            const fk = [el[0] + v[0] * FARM, el[1] + v[1] * FARM];
            const w = clamp(s[k + "w"], 0, 1);
            const hand = [lerp(fk[0], s[k + "tx"], w), lerp(fk[1], s[k + "ty"], w)];
            const [e2, h2] = ik(sh, hand, UARM, FARM, elbow);
            setD(parts[n], P([sh, e2, h2]));
            hands.push(h2);
          });
          return { head: hc, hands, hip };
        }
        const KER = [-4, -3, -2, -1, 0, 1, 2, 3, 4].map((k) => [k * 0.03, Math.exp(-((k / 2.3) ** 2))]);
        function blend(raw, t) {
          const out = {};
          let ws = 0;
          for (const [dt, w] of KER) {
            const p = raw(clamp(t + dt, 0, DUR));
            for (const k in p) out[k] = (out[k] || 0) + p[k] * w;
            ws += w;
          }
          for (const k in out) out[k] /= ws;
          return out;
        }
        const LAGGED = ["head", "ash", "ael", "aw", "atx", "aty", "bsh", "bel", "bw", "btx", "bty"];
        function livePose(raw, t, phase) {
          const s = blend(raw, t);
          const lag = blend(raw, t - 0.05);
          for (const k of LAGGED) s[k] = lag[k];
          const br = Math.sin(t * 1.9 + phase);
          s.hy += br * 1.3;
          s.torso += br * 0.8;
          s.head += Math.sin(t * 1.2 + phase * 2) * 1.6;
          return s;
        }
        const ARMS = { ash: 8, ael: 12, aw: 0, atx: 0, aty: 0, bsh: -4, bel: 10, bw: 0, btx: 0, bty: 0 };
        const base = (o) => ({ hx: 0, hy: 0, torso: 3, head: 0, ax: 0, ay: FL, bx: 0, by: FL, ...ARMS, ...o });
        function standOn(x, f, fy) {
          return base({ hx: x, hy: fy - Math.sqrt(LEG * LEG - 15 * 15), ax: x + f * 15, ay: fy, bx: x - f * 15, by: fy });
        }
        const mixPose = (a, b, p) => {
          const o = {};
          for (const k in a) o[k] = lerp(a[k], b[k], p);
          return o;
        };

        // ---------- scene: rain, one red umbrella, two people ----------
        const beams = E("beams");
        const beam = svgEl("polygon", { points: "340,-90 460,-90 600,600 200,600", fill: "url(#beam)", filter: "url(#soft)", opacity: 0.4 }, beams);
        const W = E("world");
        const figG = svgEl("g", {}, W);
        const umbG = svgEl("g", {}, W);
        const rainG = svgEl("g", {}, W);

        // umbrella: hand H, tilt a (deg from vertical); canopy rim center sits 165 up the shaft
        const SHAFT = 165, R = 98, DOME = 66;
        const shaft = svgEl("path", { fill: "none", stroke: "#111", "stroke-width": 6, "stroke-linecap": "round" }, umbG);
        const hook = svgEl("path", { fill: "none", stroke: "#111", "stroke-width": 7, "stroke-linecap": "round" }, umbG);
        const canopy = svgEl("g", {}, umbG);
        let cd = `M${-R} 0 Q${-R} ${-DOME * 0.9} 0 ${-DOME} Q${R} ${-DOME * 0.9} ${R} 0`;
        for (let i = 0; i < 6; i++) {
          const x1 = R - (2 * R * (i + 1)) / 6, xm = R - (2 * R * (i + 0.5)) / 6;
          cd += ` Q${r1(xm)} -12 ${r1(x1)} 0`;
        }
        svgEl("path", { d: cd + "Z", fill: "#d62a2a", stroke: "#000", "stroke-width": 4, "stroke-linejoin": "round" }, canopy);
        for (const x of [-R / 3, R / 3]) svgEl("path", { d: `M0 ${-DOME} Q${x * 0.6} ${-DOME * 0.7} ${x} -6`, fill: "none", stroke: "#8f1616", "stroke-width": 3 }, canopy);
        svgEl("path", { d: `M0 ${-DOME} L0 ${-DOME - 14}`, stroke: "#111", "stroke-width": 5, "stroke-linecap": "round" }, canopy);
        const umbGlow = svgEl("ellipse", { rx: 120, ry: 60, fill: "#ff4433", filter: "url(#soft)", opacity: 0 }, umbG);
        umbG.insertBefore(umbGlow, shaft);

        // keyframes [time, hand x, hand y, tilt]
        const UK = [[0, 345, 382, -8], [3.5, 345, 382, -8], [4.3, 398, 378, 24], [6.7, 398, 378, 24], [7.5, 400, 372, 0]];
        const umbAt = (t) => {
          let s = UK[0].slice(1);
          for (let i = 1; i < UK.length; i++) {
            const p = ease((t - UK[i - 1][0]) / (UK[i][0] - UK[i - 1][0]));
            if (t > UK[i - 1][0]) s = s.map((v, j) => lerp(UK[i - 1][j + 1], UK[i][j + 1], p));
          }
          const [hx, hy, a] = s;
          return { H: [hx, hy], a, C: [hx + Math.sin(rad(a)) * SHAFT, hy - Math.cos(rad(a)) * SHAFT], open: backOut((t - 1.6) / 0.5) };
        };
        // is a point sheltered by the canopy (in its tilted column)?
        function sheltered(u, x, y) {
          const dx = x - u.C[0], dy = y - u.C[1], c = Math.cos(rad(u.a)), s = Math.sin(rad(u.a));
          const lx = dx * c + dy * s, ly = -dx * s + dy * c;
          const w = R * clamp(u.open, 0, 1.05);
          return Math.abs(lx) < w && ly > -DOME * (1 - (lx / R) ** 2) * clamp(u.open, 0, 1);
        }

        // rain
        const NR = 150, rain = [];
        for (let i = 0; i < NR; i++) {
          rain.push({
            x: -30 + rnd() * 860, v: 950 + rnd() * 350, ph: rnd() * 1000,
            line: svgEl("line", { stroke: "#a9bdd1", "stroke-width": 2.2, "stroke-linecap": "round", opacity: 0 }, rainG),
            sp: svgEl("ellipse", { rx: 7, ry: 2.2, fill: "#a9bdd1", opacity: 0 }, rainG),
          });
        }
        const drips = [0, 1, 2, 3].map(() => svgEl("circle", { r: 3, fill: "#bcd0e2", opacity: 0 }, rainG));

        // ---------- figures ----------
        const man = makeFig(figG, "#ffffff", "#e2e2e2", true, "man");
        const wom = makeFig(figG, "#ffffff", "#e2e2e2", true, "wom");
        const tail = svgEl("ellipse", { rx: 12, ry: 21, fill: "#ffffff", stroke: "#000", "stroke-width": 5 }, wom.g);
        wom.g.insertBefore(tail, wom.head);
        const stand = FL - Math.sqrt(LEG * LEG - 15 * 15);
        const lf = (t, a) => Math.sin(Math.PI * clamp((t - a) / 0.4, 0, 1));
        function manRaw(t) {
          const wet = win(t, 3.9, 4.6) * (1 - win(t, 7.0, 7.6));
          const shiv = wet * Math.sin(t * 38) * 1.2;
          const x = 300 + 45 * win(t, 6.8, 7.6);
          const u = umbAt(t);
          return base({
            hx: x, hy: stand + 5 * wet, torso: 3 + 6 * wet + shiv + 4 * win(t, 7.5, 8.2), head: 12 * wet - 2 * win(t, 7.5, 8.2),
            ax: 315 + 45 * win(t, 6.8, 7.2), ay: FL - 16 * lf(t, 6.8), bx: 285 + 45 * win(t, 7.2, 7.6), by: FL - 16 * lf(t, 7.2),
            aw: 1, atx: u.H[0] - 3, aty: u.H[1] + 6,
            bsh: lerp(-4, 30, wet), bel: lerp(10, 70, wet),
          });
        }
        function womRaw(t) {
          const wet = win(t, 1.7, 2.4) * (1 - win(t, 4.0, 4.6));
          const shiv = wet * Math.sin(t * 41) * 1.2;
          const x = 480 - 25 * win(t, 6.6, 7.3);
          const reach = win(t, 6.7, 7.3);
          const u = umbAt(t);
          return base({
            hx: x, hy: stand + 6 * wet, torso: 3 + 12 * wet + shiv + 3 * reach, head: 10 * wet - 6 * win(t, 4.6, 5.2) + 4 * reach,
            ax: 465 - 25 * win(t, 6.6, 7.0), ay: FL - 16 * lf(t, 6.6), bx: 495 - 25 * win(t, 6.9, 7.3), by: FL - 16 * lf(t, 6.9),
            // hugs herself while wet, then reaches for the handle
            ash: 8, ael: 12, aw: Math.max(wet, reach), atx: lerp(466, u.H[0] + 4, reach), aty: lerp(366, u.H[1] - 8, reach),
            bsh: -4, bel: 10, bw: wet, btx: 478, bty: 360,
          });
        }
        const WHITE = "#ffffff", WET = "#aebfd0";
        const hexLerp = (a, b, p) => {
          const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
          return "#" + pa.map((v, i) => Math.round(lerp(v, pb[i], clamp(p, 0, 1))).toString(16).padStart(2, "0")).join("");
        };
        function tint(parts, p) {
          const c = hexLerp(WHITE, WET, p);
          for (const n of ["torso", "legF", "armF"]) parts[n][1].setAttribute("stroke", c);
          for (const n of ["legB", "armB"]) parts[n][1].setAttribute("stroke", hexLerp("#e2e2e2", "#97a8b9", p));
          parts.head.setAttribute("fill", c);
        }

        const typed = (id, text, t, t0, cps) => {
          const n = clamp(Math.floor((t - t0) * cps), 0, text.length);
          E(id).innerHTML = "<span>" + text.slice(0, n) + '</span><span class="ghost">' + text.slice(n) + "</span>";
        };

        // ---------- per-frame render ----------
        function render(t) {
          drawFig(man, livePose(manRaw, t, 0.3), 1);
          const jw = drawFig(wom, livePose(womRaw, t, 1.9), -1);
          tail.setAttribute("cx", r1(jw.head[0] + 27));
          tail.setAttribute("cy", r1(jw.head[1] + 8));
          tail.setAttribute("transform", `rotate(-20 ${r1(jw.head[0] + 27)} ${r1(jw.head[1] + 8)})`);
          // soaked: she while the umbrella is his, he while it is hers; they dry a little at the end
          tint(man, win(t, 4.0, 5.2) * (1 - 0.5 * win(t, 8, 10)));
          tint(wom, win(t, 1.8, 3.0) * (1 - win(t, 4.4, 7)) * 1 + 0);

          const u = umbAt(t), op = clamp(u.open, 0, 1.08);
          shaft.setAttribute("d", P([u.H, [u.C[0] + Math.sin(rad(u.a)) * 20, u.C[1] - Math.cos(rad(u.a)) * 20]]));
          hook.setAttribute("d", `M${r1(u.H[0])} ${r1(u.H[1])} q0 18 -12 18 q-10 0 -10 -9`);
          canopy.setAttribute("transform", `translate(${r1(u.C[0])} ${r1(u.C[1])}) rotate(${r1(u.a)}) scale(${(0.14 + 0.86 * op).toFixed(3)} ${(0.35 + 0.65 * op).toFixed(3)})`);
          umbGlow.setAttribute("cx", r1(u.C[0]));
          umbGlow.setAttribute("cy", r1(u.C[1] - 20));
          umbGlow.setAttribute("opacity", (0.35 * win(t, 7.5, 8.8)).toFixed(3));

          const amt = win(t, 1.0, 2.2) * (1 - 0.35 * win(t, 8.6, 10));
          rain.forEach((d, i) => {
            const p = (d.ph + t * d.v) % 1000, y = -400 + p, x = d.x - p * 0.06;
            const on = i < NR * amt && !sheltered(u, x, y);
            d.line.setAttribute("x1", r1(x));
            d.line.setAttribute("y1", r1(y - 26));
            d.line.setAttribute("x2", r1(x - 3));
            d.line.setAttribute("y2", r1(y));
            d.line.setAttribute("opacity", on && y < FL ? 0.55 : 0);
            const near = y > FL - 40 && y < FL + 30;
            d.sp.setAttribute("cx", r1(x));
            d.sp.setAttribute("cy", FL);
            d.sp.setAttribute("opacity", i < NR * amt && near && !sheltered(u, x, FL - 2) ? 0.5 : 0);
            if (y >= FL) d.line.setAttribute("opacity", 0);
          });
          // drips run off both rim ends
          drips.forEach((c, j) => {
            const side = j % 2 ? 1 : -1, cs = Math.cos(rad(u.a)), sn = Math.sin(rad(u.a));
            const rx = u.C[0] + side * R * op * cs, ry = u.C[1] + side * R * op * sn;
            const q = ((t * 1.6 + j * 0.37) % 1);
            c.setAttribute("cx", r1(rx));
            c.setAttribute("cy", r1(ry + q * q * (FL - ry)));
            c.setAttribute("opacity", t > 2.1 ? (0.8 * (1 - q)).toFixed(3) : 0);
          });
          beam.setAttribute("opacity", (0.4 + 0.25 * win(t, 7.6, 9)).toFixed(3));

          typed("h1", "LOVE ISN'T STAYING DRY.", t, 9.8, 26);
          typed("h2", "IT'S MAKING ROOM FOR TWO.", t, 11.0, 26);
        }

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
        window.__timelines["main"] = tl;
        render(0);
        tl.seek(0);
      })();
    </script>
