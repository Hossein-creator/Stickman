<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "HFMono";
        src: url("assets/fonts/consolab.ttf") format("truetype");
        font-weight: 700;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      #stage svg {
        position: absolute;
        inset: 0;
      }
      .mono {
        position: absolute;
        font-family: "HFMono", monospace;
        font-weight: 700;
        white-space: nowrap;
      }
      .main {
        font-size: 34px;
        letter-spacing: 0.2em;
        color: #fff;
        text-shadow: 0 0 12px rgba(0, 0, 0, 0.8);
      }
      .sub {
        font-size: 24px;
        letter-spacing: 0.16em;
        color: #d2d2d2;
        text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
      }
      #lab-t {
        left: 124px;
        top: 414px;
      }
      #sub-t {
        left: 124px;
        top: 458px;
      }
      #lab-b {
        left: 124px;
        top: 997px;
        color: #b9b9b9;
      }
      #sub-b {
        left: 124px;
        top: 1041px;
      }
      #head {
        position: absolute;
        left: 0;
        right: 0;
        top: 222px;
        text-align: center;
        font-family: "HFMono", monospace;
        font-weight: 700;
        font-size: 36px;
        letter-spacing: 0.12em;
        line-height: 1.45;
        color: #fff;
        text-shadow: 0 0 16px rgba(255, 255, 255, 0.3);
      }
      #head .ghost {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="14"
      data-width="1080"
      data-height="1920"
    >
      <div id="stage" class="clip" data-start="0" data-duration="14" data-track-index="0">
        <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <clipPath id="clipP" clipPathUnits="userSpaceOnUse">
              <rect x="310" y="288" width="800" height="455" />
            </clipPath>
            <linearGradient id="skyDusk" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#151a3a" />
              <stop offset="0.65" stop-color="#43325e" />
              <stop offset="1" stop-color="#b0605a" />
            </linearGradient>
            <linearGradient id="lampCone" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffd38a" stop-opacity="0.7" />
              <stop offset="1" stop-color="#ffd38a" stop-opacity="0.12" />
            </linearGradient>
            <radialGradient id="phoneGlow">
              <stop offset="0" stop-color="#8ab8ff" stop-opacity="0.75" />
              <stop offset="1" stop-color="#8ab8ff" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="warmGlow">
              <stop offset="0" stop-color="#ffcf87" stop-opacity="0.55" />
              <stop offset="1" stop-color="#ffcf87" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="heartGlow">
              <stop offset="0" stop-color="#ff3b3b" stop-opacity="0.6" />
              <stop offset="1" stop-color="#ff3b3b" stop-opacity="0" />
            </radialGradient>
            <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="14" />
            </filter>
            <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="18" />
            </filter>
          </defs>
          <g transform="translate(80 400) scale(1.15) translate(-310 -288)"><g clip-path="url(#clipP)" id="roomT"></g></g>
          <g transform="translate(80 983) scale(1.15) translate(-310 -288)"><g clip-path="url(#clipP)" id="roomB"></g></g>
          <!-- panels sit inside the Instagram full-screen safe area -->
          <rect x="79" y="399" width="922" height="525" fill="none" stroke="#3a3a3a" stroke-width="2" />
          <rect x="79" y="982" width="922" height="525" fill="none" stroke="#3a3a3a" stroke-width="2" />
          <g id="badge" transform="translate(540 953)">
            <circle r="54" fill="#000" stroke="#3b3b3b" stroke-width="6" />
            <circle id="badgeArc" r="54" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="339.3" stroke-dashoffset="339.3" transform="rotate(-90)" />
            <text y="-10" text-anchor="middle" font-family="HFMono" font-weight="700" font-size="17" fill="#bdbdbd" letter-spacing="3">WEEK</text>
            <text id="badgeTxt" y="22" text-anchor="middle" font-family="HFMono" font-weight="700" font-size="30" fill="#fff">1</text>
          </g>
        </svg>
        <div id="lab-t" class="mono main">CHARGE IT</div>
        <div id="sub-t" class="mono sub"></div>
        <div id="lab-b" class="mono main">DRAIN IT</div>
        <div id="sub-b" class="mono sub"></div>
        <div id="head">
          <div>SAME COUCH.</div>
          <div id="h2"></div>
          <div id="h3"></div>
        </div>
      </div>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="14" data-track-index="1"></audio>
    </div>

    <script>
      (function () {
        const DUR = 14;
        const FL = 730;
        const THIGH = 80, SHIN = 78;
        const UARM = 64, FARM = 60, TORSO = 116, NECK = 12, HEADR = 31;
        const NS = "http://www.w3.org/2000/svg";
        const svgEl = (tag, attrs, parent) => {
          const e = document.createElementNS(NS, tag);
          for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(e);
          return e;
        };
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, p) => a + (b - a) * p;
        const lerp2 = (a, b, p) => [lerp(a[0], b[0], p), lerp(a[1], b[1], p)];
        const ease = (p) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(p, 0, 1));
        const easeOut = (p) => 1 - Math.pow(1 - clamp(p, 0, 1), 3);
        const backOut = (p) => { p = clamp(p, 0, 1); const s = 2.2; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
        const win = (t, a, b) => ease((t - a) / (b - a));
        const rad = (d) => (d * Math.PI) / 180;
        const down = (a, f) => [Math.sin(rad(a)) * f, Math.cos(rad(a))];
        const up = (a, f) => [Math.sin(rad(a)) * f, -Math.cos(rad(a))];
        const r1 = (v) => Math.round(v * 10) / 10;
        const E = (id) => document.getElementById(id);
        const hexLerp = (a, b, p) => {
          const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16));
          const pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
          return "rgb(" + pa.map((v, i) => Math.round(lerp(v, pb[i], p))).join(",") + ")";
        };
        const HEART = "M0 7 C -16 -5 -11 -19 0 -10 C 11 -19 16 -5 0 7 Z";

        // ---------- living room with a couch; visible part of the room is x 310-1110, y 288-743 ----------
        function buildRoom(g, good) {
          const R = {};
          svgEl("rect", { x: 0, y: 0, width: 1421, height: 730, fill: good ? "#3a2f45" : "#1b1e2c" }, g);
          svgEl("rect", { x: 0, y: 730, width: 1421, height: 75, fill: "#2b231f" }, g);
          svgEl("rect", { x: 0, y: 722, width: 1421, height: 8, fill: "#15131a" }, g);
          // window with dusk sky and a picture frame
          svgEl("rect", { x: 330, y: 330, width: 150, height: 150, fill: "#15141f" }, g);
          svgEl("rect", { x: 340, y: 340, width: 130, height: 130, fill: "url(#skyDusk)", opacity: good ? 1 : 0.55 }, g);
          svgEl("rect", { x: 401, y: 340, width: 8, height: 130, fill: "#15141f" }, g);
          // floor lamp (on only in the good room)
          svgEl("rect", { x: 1078, y: 420, width: 6, height: 310, fill: "#0d0d10" }, g);
          svgEl("polygon", { points: "1050,420 1112,420 1100,380 1062,380", fill: good ? "#f0cf8f" : "#33343d", stroke: "#000", "stroke-width": 3 }, g);
          if (good) {
            R.glow = svgEl("circle", { cx: 1081, cy: 430, r: 150, fill: "url(#warmGlow)", opacity: 0.8 }, g);
            svgEl("polygon", { points: "1056,420 1106,420 1180,730 980,730", fill: "url(#lampCone)", filter: "url(#soft)", opacity: 0.35 }, g);
          }
          // couch: backrest, arms, seat, legs (figures sit on top of the seat)
          const c1 = good ? "#6a4a5e" : "#33384c", c2 = good ? "#7d586f" : "#3d4358";
          svgEl("rect", { x: 405, y: 466, width: 620, height: 150, rx: 26, fill: c1, stroke: "#000", "stroke-width": 3 }, g);
          svgEl("rect", { x: 380, y: 598, width: 670, height: 62, rx: 16, fill: c2, stroke: "#000", "stroke-width": 3 }, g);
          svgEl("rect", { x: 368, y: 548, width: 54, height: 128, rx: 18, fill: c1, stroke: "#000", "stroke-width": 3 }, g);
          svgEl("rect", { x: 1008, y: 548, width: 54, height: 128, rx: 18, fill: c1, stroke: "#000", "stroke-width": 3 }, g);
          for (const x of [400, 1020]) svgEl("rect", { x, y: 676, width: 12, height: 54, fill: "#211b18" }, g);
          R.figs = svgEl("g", {}, g);
          R.fx = svgEl("g", {}, g);
          // the love battery (top right of the panel)
          const B = svgEl("g", { transform: "translate(842 318)" }, g);
          R.batGlow = svgEl("rect", { x: -14, y: -14, width: 192, height: 88, rx: 22, fill: "#ffffff", filter: "url(#soft)", opacity: 0 }, B);
          svgEl("rect", { x: 0, y: 0, width: 164, height: 60, rx: 12, fill: "#0c0c10", stroke: "#e6e6e6", "stroke-width": 5 }, B);
          svgEl("rect", { x: 166, y: 18, width: 12, height: 24, rx: 4, fill: "#e6e6e6" }, B);
          R.batFill = svgEl("rect", { x: 7, y: 7, width: 150, height: 46, rx: 7, fill: "#ffffff" }, B);
          R.batTxt = svgEl("text", { x: 82, y: 41, "text-anchor": "middle", "font-family": "HFMono", "font-weight": 700, "font-size": 28, fill: "#fff", stroke: "#000", "stroke-width": 6, "paint-order": "stroke", "stroke-linejoin": "round" }, B);
          R.batHeart = svgEl("path", { d: HEART, fill: "#e0322b", stroke: "#000", "stroke-width": 2, transform: "translate(-30 32) scale(1.3)" }, B);
          R.pops = svgEl("g", {}, B);
          return R;
        }
        const RT = buildRoom(E("roomT"), true);
        const RB = buildRoom(E("roomB"), false);

        // battery level over time: steps that ease in over 0.4 s
        const levelAt = (steps, t) => {
          let v = steps[0][1];
          for (let i = 1; i < steps.length; i++) v = lerp(v, steps[i][1], ease((t - steps[i][0]) / 0.4));
          return v;
        };
        const LT = [[0, 40], [1.4, 60], [3.2, 80], [5.2, 100]];
        const LB = [[0, 60], [1.4, 45], [3.6, 25], [5.6, 10], [7.4, 3]];
        function battery(R, steps, t, good) {
          const v = levelAt(steps, t);
          const low = v < 20;
          const blink = low && t > 7.4 ? (Math.sin(t * 9) > 0 ? 1 : 0.35) : 1;
          R.batFill.setAttribute("width", r1(Math.max(4, 150 * v / 100)));
          R.batFill.setAttribute("fill", low ? "#e0322b" : "#ffffff");
          R.batFill.setAttribute("opacity", blink);
          R.batTxt.textContent = Math.round(v) + "%";
          R.batGlow.setAttribute("opacity", good ? (0.55 * win(t, 5.2, 5.8) * (0.8 + 0.2 * Math.sin(t * 4))).toFixed(3) : 0);
          R.batHeart.setAttribute("opacity", good ? 1 : 0.35 + 0.65 * (v / 60));
          R.batHeart.setAttribute("fill", hexLerp("#4f1515", "#e0322b", clamp(v / 60, 0, 1)));
          // +20 / -20 pop-ups at each step
          while (R.pops.firstChild) R.pops.removeChild(R.pops.firstChild);
          steps.slice(1).forEach(([ts, val], i) => {
            const a = (t - ts) / 1.1;
            if (a <= 0 || a >= 1) return;
            const d = Math.round(val - steps[i][1]);
            const tx = svgEl("text", { x: 82, y: r1(96 + 30 * ease(a)), "text-anchor": "middle", "font-family": "HFMono", "font-weight": 700, "font-size": 30, fill: good ? "#ffffff" : "#ff4a3d", opacity: (1 - a).toFixed(3) }, R.pops);
            tx.textContent = (d > 0 ? "+" : "") + d;
          });
        }

        // ---------- rig (seated, from reel 04) ----------
        function makeFig(parent, front, back, hair, glow, id) {
          const g = svgEl("g", { id }, parent);
          if (glow) parent.insertBefore(svgEl("use", { href: "#" + id, filter: "url(#blur)", opacity: 0.4 }), g);
          const parts = { g };
          for (const [n, col] of [["armB", back], ["legB", back], ["torso", front], ["legF", front], ["armF", front]]) {
            const o = svgEl("path", { fill: "none", stroke: "#000", "stroke-width": 34, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            const w = svgEl("path", { fill: "none", stroke: col, "stroke-width": 22, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            parts[n] = [o, w];
          }
          if (hair) parts.hair = svgEl("circle", { r: 15, fill: front, stroke: "#000", "stroke-width": 5 }, g);
          parts.head = svgEl("circle", { r: HEADR, fill: front, stroke: "#000", "stroke-width": 6 }, g);
          return parts;
        }
        function ik(a, b, l1, l2, pick) {
          let dx = b[0] - a[0], dy = b[1] - a[1];
          let d = Math.hypot(dx, dy);
          const maxd = l1 + l2 - 0.5;
          if (d > maxd) {
            b = [a[0] + (dx / d) * maxd, a[1] + (dy / d) * maxd];
            dx = b[0] - a[0];
            dy = b[1] - a[1];
            d = maxd;
          }
          d = Math.max(d, Math.abs(l1 - l2) + 1);
          const al = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
          const base = Math.atan2(dy, dx);
          const c1 = [a[0] + Math.cos(base + al) * l1, a[1] + Math.sin(base + al) * l1];
          const c2 = [a[0] + Math.cos(base - al) * l1, a[1] + Math.sin(base - al) * l1];
          return [pick(c1, c2), b];
        }
        const P = (pts) => "M" + pts.map((p) => r1(p[0]) + " " + r1(p[1])).join("L");
        const setD = (pair, d) => {
          pair[0].setAttribute("d", d);
          pair[1].setAttribute("d", d);
        };
        function drawFig(parts, s) {
          const f = s.f, hip = s.hip;
          const tu = up(s.torso, f);
          const sh = [hip[0] + tu[0] * TORSO, hip[1] + tu[1] * TORSO];
          const nk = [hip[0] + tu[0] * (TORSO + NECK), hip[1] + tu[1] * (TORSO + NECK)];
          const hu = up(s.torso + s.head, f);
          const hc = [nk[0] + hu[0] * HEADR, nk[1] + hu[1] * HEADR];
          setD(parts.torso, P([hip, sh, nk]));
          parts.head.setAttribute("cx", r1(hc[0]));
          parts.head.setAttribute("cy", r1(hc[1]));
          if (parts.hair) {
            parts.hair.setAttribute("cx", r1(hc[0] - f * 27));
            parts.hair.setAttribute("cy", r1(hc[1] - 12));
          }
          const legPick = (c1, c2) => (c1[0] * f > c2[0] * f ? c1 : c2);
          ["legF", "legB"].forEach((n, i) => {
            const [kn, ft] = ik(hip, s.feet[i], THIGH, SHIN, legPick);
            setD(parts[n], P([hip, kn, ft]));
          });
          const hands = [];
          ["armF", "armB"].forEach((n, i) => {
            const a = s.arms[i];
            const u = down(52, f);
            const el = [sh[0] + u[0] * UARM, sh[1] + u[1] * UARM];
            const pick = (c1, c2) => (Math.hypot(c1[0] - el[0], c1[1] - el[1]) < Math.hypot(c2[0] - el[0], c2[1] - el[1]) ? c1 : c2);
            const [e2, h2] = ik(sh, a.t, UARM, FARM, pick);
            setD(parts[n], P([sh, e2, h2]));
            hands.push(h2);
          });
          return { head: hc, hands };
        }
        // smooth motion: Gaussian blend of the raw pose over time (seek-safe), plus breathing
        const KER = [-4, -3, -2, -1, 0, 1, 2, 3, 4].map((k) => [k * 0.03, Math.exp(-((k / 2.3) ** 2))]);
        function live(raw, t, phase) {
          let ws = 0;
          const o = { torso: 0, head: 0, hx: 0, hy: 0, a0: 0, a1: 0, b0: 0, b1: 0 };
          for (const [dt, w] of KER) {
            const p = raw(clamp(t + dt, 0, DUR));
            o.torso += p.torso * w; o.head += p.head * w;
            o.hx += p.hip[0] * w; o.hy += p.hip[1] * w;
            o.a0 += p.arms[0].t[0] * w; o.a1 += p.arms[0].t[1] * w;
            o.b0 += p.arms[1].t[0] * w; o.b1 += p.arms[1].t[1] * w;
            ws += w;
          }
          const base = raw(t), br = Math.sin(t * 1.9 + phase);
          return {
            ...base, hip: [o.hx / ws, o.hy / ws + br * 1.2], torso: o.torso / ws + br * 0.8, head: o.head / ws + Math.sin(t * 1.2 + phase) * 1.5,
            arms: [{ t: [o.a0 / ws, o.a1 / ws] }, { t: [o.b0 / ws, o.b1 / ws] }],
          };
        }
        function keyAt(K, t) {
          let i = 0;
          while (i < K.length - 2 && t >= K[i + 1][0]) i++;
          const [ta, a] = K[i], [tb, b] = K[i + 1];
          const p = ease((t - ta) / (tb - ta));
          const o = {};
          for (const k in a) o[k] = lerp(a[k], b[k] === undefined ? a[k] : b[k], p);
          return o;
        }
        function path(stops, t) {
          if (t <= stops[0][0]) return stops[0][1];
          for (let i = 1; i < stops.length; i++) {
            if (t <= stops[i][0]) {
              const [ta, a] = stops[i - 1], [tb, b] = stops[i];
              return tb - ta < 1e-6 ? b : lerp2(a, b, ease((t - ta) / (tb - ta)));
            }
          }
          return stops[stops.length - 1][1];
        }

        // ---------- the couples ----------
        // top: turned toward each other; bottom: turned away, each on a phone
        const TM = { hip: [625, 598], feet: [[700, FL], [716, FL]], lap: [[668, 590], [656, 594]] };
        const TW = { hip: [805, 598], feet: [[748, FL], [732, FL]], lap: [[762, 590], [774, 594]] };
        const BM = { hip: [560, 598], feet: [[486, FL], [470, FL]], lap: [[516, 590], [528, 594]] };
        const BW = { hip: [880, 598], feet: [[954, FL], [970, FL]], lap: [[922, 590], [910, 594]] };
        const HANDS = [715, 572];
        const laugh = (t, a, b) => (t > a && t < b ? Math.abs(Math.sin((t - a) * 22)) * 4 * (1 - (t - a) / (b - a)) : 0);
        function topMan(t) {
          const q = keyAt([[0, { torso: 4, head: 0 }], [0.6, { torso: 4, head: 0 }], [1.0, { torso: 10, head: 4 }], [2.4, { torso: 10, head: 4 }], [2.8, { torso: 2, head: -12 }], [3.8, { torso: 2, head: -12 }], [4.2, { torso: 6, head: 2 }], [4.6, { torso: 6, head: 2 }], [5.1, { torso: 20, head: 6 }], [DUR, { torso: 20, head: 6 }]], t);
          const hf = path([[0.6, TM.lap[0]], [1.0, HANDS], [2.4, HANDS], [2.8, TM.lap[0]], [4.6, TM.lap[0]], [5.1, [792, 476]]], t);
          return { hip: [TM.hip[0], TM.hip[1] - laugh(t, 2.6, 3.9)], f: 1, torso: q.torso, head: q.head, feet: TM.feet, arms: [{ t: hf }, { t: TM.lap[1] }] };
        }
        function topWom(t) {
          const q = keyAt([[0, { torso: 4, head: 0 }], [0.6, { torso: 4, head: 0 }], [1.0, { torso: 8, head: 4 }], [2.4, { torso: 8, head: 4 }], [2.8, { torso: 0, head: -14 }], [3.8, { torso: 0, head: -14 }], [4.2, { torso: 4, head: 0 }], [4.8, { torso: 4, head: 0 }], [5.3, { torso: 16, head: 16 }], [DUR, { torso: 16, head: 16 }]], t);
          const hf = path([[0.6, TW.lap[0]], [1.0, HANDS], [2.4, HANDS], [2.8, TW.lap[0]], [4.8, TW.lap[0]], [5.3, [690, 520]]], t);
          return { hip: [TW.hip[0], TW.hip[1] - laugh(t, 2.65, 3.9)], f: -1, torso: q.torso, head: q.head, feet: TW.feet, arms: [{ t: hf }, { t: TW.lap[1] }] };
        }
        const PHM = [498, 506], PHW = [942, 506];
        function botMan(t) {
          const on = win(t, 0.3, 0.7);
          const hf = path([[0.3, BM.lap[0]], [0.7, PHM]], t);
          return { hip: [BM.hip[0], BM.hip[1] - laugh(t, 4.6, 5.9)], f: -1, torso: 4 + 8 * on, head: 28 * on - (t > 4.6 && t < 5.9 ? 14 : 0) * win(t, 4.6, 4.8), feet: BM.feet, arms: [{ t: hf }, { t: BM.lap[1] }] };
        }
        function botWom(t) {
          const on = win(t, 0.4, 0.8);
          const reach = win(t, 2.4, 2.9) * (1 - win(t, 3.7, 4.1));
          const q = keyAt([[0, { torso: 4, head: 0 }], [7.0, { torso: 4, head: 0 }], [7.5, { torso: -4, head: 0 }], [DUR, { torso: -4, head: 0 }]], t);
          const hf = path([[0.4, BW.lap[0]], [0.8, PHW], [7.0, PHW], [7.4, BW.lap[0]]], t);
          const hb = lerp2(BW.lap[1], [722, 586], reach);
          const head = 30 * on * (1 - reach) - 16 * reach + (t > 7.0 ? 8 * win(t, 7.0, 7.5) : 0);
          return { hip: BW.hip, f: 1, torso: q.torso + 6 * on - 8 * reach, head, feet: BW.feet, arms: [{ t: hf }, { t: hb }] };
        }
        const figs = {
          tm: makeFig(RT.figs, "#ffffff", "#e2e2e2", false, true, "tm"),
          tw: makeFig(RT.figs, "#ffffff", "#e2e2e2", true, true, "tw"),
          bm: makeFig(RB.figs, "#9a9a9a", "#7c7c7c", false, false, "bm"),
          bw: makeFig(RB.figs, "#9a9a9a", "#7c7c7c", true, false, "bw"),
        };
        const phones = [0, 1].map(() => {
          const glow = svgEl("circle", { r: 110, fill: "url(#phoneGlow)", opacity: 0 }, RB.fx);
          const ph = svgEl("g", {}, RB.fx);
          svgEl("rect", { x: -11, y: -19, width: 22, height: 38, rx: 4, fill: "#111", stroke: "#000", "stroke-width": 2 }, ph);
          svgEl("rect", { x: -8, y: -15, width: 16, height: 30, rx: 2, fill: "#9cc4ff" }, ph);
          return { glow, ph };
        });

        // ---------- labels ----------
        const SUBT = [[0.6, "HOLDS HER HAND"], [2.6, "MAKES HER LAUGH"], [4.6, "A HUG"], [5.6, "FULL"]];
        const SUBB = [[0.4, "PHONES"], [2.4, "HER HAND"], [3.4, "IGNORED"], [4.6, "HE LAUGHS ALONE"], [7.2, "EMPTY"]];
        const subAt = (Lst, t) => {
          let s = "", t0 = 0;
          for (const [tt, txt] of Lst) if (t >= tt) { s = txt; t0 = tt; }
          return s.slice(0, clamp(Math.floor((t - t0) * 40), 0, s.length));
        };
        const typed = (id, text, t, t0, cps) => {
          const n = clamp(Math.floor((t - t0) * cps), 0, text.length);
          E(id).innerHTML = "<span>" + text.slice(0, n) + '</span><span class="ghost">' + text.slice(n) + "</span>";
        };

        // ---------- per-frame render ----------
        function render(t) {
          drawFig(figs.tm, live(topMan, t, 0));
          drawFig(figs.tw, live(topWom, t, 1.7));
          const jbm = drawFig(figs.bm, live(botMan, t, 0.6));
          const jbw = drawFig(figs.bw, live(botWom, t, 2.3));
          [jbm.hands[0], t < 7.2 ? jbw.hands[0] : null].forEach((h, i) => {
            const p = phones[i], on = t > (i ? 0.6 : 0.5) && h;
            p.ph.setAttribute("opacity", on ? 1 : 0);
            p.glow.setAttribute("opacity", on ? (0.75 + 0.15 * Math.sin(t * (8 + i * 3))).toFixed(3) : 0);
            if (h) {
              p.ph.setAttribute("transform", `translate(${r1(h[0])} ${r1(h[1])}) rotate(${i ? 10 : -10})`);
              p.glow.setAttribute("cx", r1(h[0]));
              p.glow.setAttribute("cy", r1(h[1]));
            }
          });
          battery(RT, LT, t, true);
          battery(RB, LB, t, false);
          RT.glow.setAttribute("opacity", (0.8 + 0.15 * win(t, 5.2, 6)).toFixed(3));

          E("badgeTxt").textContent = String(1 + Math.floor(51 * ease(t / 9.5)));
          E("badgeArc").setAttribute("stroke-dashoffset", (339.3 * (1 - clamp(t / 9.5, 0, 1))).toFixed(1));
          E("sub-t").textContent = subAt(SUBT, t);
          E("sub-b").textContent = subAt(SUBB, t);
          E("sub-b").style.color = t > 7.2 ? "#ff4a3d" : "#d2d2d2";
          typed("h2", "SMALL THINGS CHARGE IT.", t, 9.8, 26);
          typed("h3", "SMALL THINGS DRAIN IT.", t, 10.9, 26);
        }

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
        window.__timelines["main"] = tl;
        render(0);
        tl.seek(0);
      })();
    </script>
  </body>
</html>
