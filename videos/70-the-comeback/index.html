    <script>
      (function () {
        const DUR = 14;
        const FL = 600, BX0 = 380, BX1 = 520, BTOP = 410, TOPF = 404, SX = 250;
        const THIGH = 80, SHIN = 78, LEG = 154;
        const UARM = 64, FARM = 60, TORSO = 116, NECK = 12, HEADR = 31;
        const NS = "http://www.w3.org/2000/svg";
        const svgEl = (tag, attrs, parent) => {
          const e = document.createElementNS(NS, tag);
          for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(e);
          return e;
        };
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, p) => a + (b - a) * p;
        const ease = (p) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(p, 0, 1));
        const backOut = (p) => { p = clamp(p, 0, 1); const s = 2.2; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
        const win = (t, a, b) => ease((t - a) / (b - a));
        const rad = (x) => (x * Math.PI) / 180;
        const down = (a, f) => [Math.sin(rad(a)) * f, Math.cos(rad(a))];
        const up = (a, f) => [Math.sin(rad(a)) * f, -Math.cos(rad(a))];
        const r1 = (v) => Math.round(v * 10) / 10;
        const E = (id) => document.getElementById(id);
        let seed = 31;
        const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

        // ---------- rig v2 (from reel 05): blended poses, head/arm follow-through, breathing ----------
        function makeFig(parent, front, back, glow, id) {
          const g = svgEl("g", { id }, parent);
          if (glow) parent.insertBefore(svgEl("use", { href: "#" + id, filter: "url(#blur)", opacity: 0.45 }), g);
          const parts = { g };
          for (const [n, col] of [["armB", back], ["legB", back], ["torso", front], ["legF", front], ["armF", front]]) {
            const o = svgEl("path", { fill: "none", stroke: "#000", "stroke-width": 34, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            const w = svgEl("path", { fill: "none", stroke: col, "stroke-width": 22, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            parts[n] = [o, w];
          }
          parts.head = svgEl("circle", { r: HEADR, fill: front, stroke: "#000", "stroke-width": 6 }, g);
          return parts;
        }
        function ik(a, b, l1, l2, pick) {
          let dx = b[0] - a[0], dy = b[1] - a[1];
          let d = Math.hypot(dx, dy);
          const maxd = l1 + l2 - 0.5;
          if (d > maxd) {
            b = [a[0] + (dx / d) * maxd, a[1] + (dy / d) * maxd];
            dx = b[0] - a[0];
            dy = b[1] - a[1];
            d = maxd;
          }
          d = Math.max(d, Math.abs(l1 - l2) + 1);
          const al = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
          const base = Math.atan2(dy, dx);
          const c1 = [a[0] + Math.cos(base + al) * l1, a[1] + Math.sin(base + al) * l1];
          const c2 = [a[0] + Math.cos(base - al) * l1, a[1] + Math.sin(base - al) * l1];
          return [pick(c1, c2), b];
        }
        const P = (pts) => "M" + pts.map((p) => r1(p[0]) + " " + r1(p[1])).join("L");
        const setD = (pair, d) => {
          pair[0].setAttribute("d", d);
          pair[1].setAttribute("d", d);
        };
        // flat pose: hx hy torso head ax ay bx by | per arm a*/b*: sh el w tx ty
        function drawFig(parts, s, f) {
          const hip = [s.hx, s.hy];
          const tu = up(s.torso, f);
          const sh = [hip[0] + tu[0] * TORSO, hip[1] + tu[1] * TORSO];
          const nk = [hip[0] + tu[0] * (TORSO + NECK), hip[1] + tu[1] * (TORSO + NECK)];
          const hu = up(s.torso + s.head, f);
          const hc = [nk[0] + hu[0] * HEADR, nk[1] + hu[1] * HEADR];
          setD(parts.torso, P([hip, sh, nk]));
          parts.head.setAttribute("cx", r1(hc[0]));
          parts.head.setAttribute("cy", r1(hc[1]));
          const knee = (c1, c2) => (c1[0] * f > c2[0] * f ? c1 : c2);
          const elbow = (c1, c2) => (c1[1] - 0.5 * f * c1[0] > c2[1] - 0.5 * f * c2[0] ? c1 : c2);
          [["legF", [s.ax, s.ay]], ["legB", [s.bx, s.by]]].forEach(([n, ft]) => {
            const [kn, fo] = ik(hip, ft, THIGH, SHIN, knee);
            setD(parts[n], P([hip, kn, fo]));
          });
          const hands = [];
          [["armF", "a"], ["armB", "b"]].forEach(([n, k]) => {
            const u = down(s[k + "sh"], f);
            const el = [sh[0] + u[0] * UARM, sh[1] + u[1] * UARM];
            const v = down(s[k + "sh"] + s[k + "el"], f);
            const fk = [el[0] + v[0] * FARM, el[1] + v[1] * FARM];
            const w = clamp(s[k + "w"], 0, 1);
            const hand = [lerp(fk[0], s[k + "tx"], w), lerp(fk[1], s[k + "ty"], w)];
            const [e2, h2] = ik(sh, hand, UARM, FARM, elbow);
            setD(parts[n], P([sh, e2, h2]));
            hands.push(h2);
          });
          return { head: hc, hands, hip };
        }
        const KER = [-4, -3, -2, -1, 0, 1, 2, 3, 4].map((k) => [k * 0.03, Math.exp(-((k / 2.3) ** 2))]);
        function blend(raw, t) {
          const out = {};
          let ws = 0;
          for (const [dt, w] of KER) {
            const p = raw(clamp(t + dt, 0, DUR));
            for (const k in p) out[k] = (out[k] || 0) + p[k] * w;
            ws += w;
          }
          for (const k in out) out[k] /= ws;
          return out;
        }
        const LAGGED = ["head", "ash", "ael", "aw", "atx", "aty", "bsh", "bel", "bw", "btx", "bty"];
        function livePose(raw, t, phase) {
          const s = blend(raw, t);
          const lag = blend(raw, t - 0.05);
          for (const k of LAGGED) s[k] = lag[k];
          const br = Math.sin(t * 1.9 + phase);
          s.hy += br * 1.3;
          s.torso += br * 0.8;
          s.head += Math.sin(t * 1.2 + phase * 2) * 1.6;
          return s;
        }
        const ARMS = { ash: 8, ael: 12, aw: 0, atx: 0, aty: 0, bsh: -4, bel: 10, bw: 0, btx: 0, bty: 0 };
        const base = (o) => ({ hx: 0, hy: 0, torso: 3, head: 0, ax: 0, ay: FL, bx: 0, by: FL, ...ARMS, ...o });
        function standOn(x, f, fy) {
          return base({ hx: x, hy: fy - Math.sqrt(LEG * LEG - 15 * 15), ax: x + f * 15, ay: fy, bx: x - f * 15, by: fy });
        }
        const mixPose = (a, b, p) => {
          const o = {};
          for (const k in a) o[k] = lerp(a[k], b[k], p);
          return o;
        };

        // ---------- "the comeback": NIGHT: after a fight she pushes him out of the door with a pillow, "OUT!", throws the pillow after him, slams the door. He sits down on the doormat hugging the pillow, Zzz. NEXT MORNING: the door opens and he's standing there with breakfast on a tray and a flower, "SORRY." She melts and pulls him in ----------
        // remake of a 40.0x outlier (Koin Studios TZ, "Waitara Is Back! The Comeback of a Husband"), see viral/2026-11-06-check.md
        const cam = E("svg").children[1];
        for (const el of Array.from(cam.children)) {
          const fill = el.getAttribute("fill") || "";
          if (fill.includes("floorFade") || fill === "#2a2a2a") { el.setAttribute("x", -1400); el.setAttribute("width", 3400); }
        }
        const W = E("world");
        const backG = E("back");
        const beams = E("beams");
        const roomG = svgEl("g", {}, W);
        const figG = svgEl("g", {}, W);
        const fxG = svgEl("g", {}, W);
        const frac = (v) => v - Math.floor(v);
        const stand = FL - Math.sqrt(LEG * LEG - 15 * 15);

        const T_OUT = 0.3, T_PUSH = 0.5, T_THROW = 1.0, T_HIT = 1.3, T_SLAM = 1.15, T_KNOCK = 1.6, T_SIT = 2.2, T_ZZZ = 2.7, T_DAY = 3.8;
        const T_OPEN = 4.2, T_SORRY = 4.6, T_GASP = 5.3, T_PULL = 6.0, T_HUG = 6.3, T_HOLD = 6.7;
        const T_H1 = 7.4, T_H2 = 8.3, T_CARD = 9.4;
        const DX = 540, DW = 140, SHE = 600, HE = 760;
        const night = (s) => s < T_DAY;

        const glowC = svgEl("circle", { cx: 560, cy: FL - 260, r: 460, fill: "url(#fireGlow)", opacity: 0.3 }, backG);
        svgEl("polygon", { points: `460,${FL - 520} 660,${FL - 520} 780,${FL} 340,${FL}`, fill: "url(#beam)", filter: "url(#soft)", opacity: 0.16 }, beams);
        const nightT = svgEl("rect", { x: -1400, y: -1400, width: 3400, height: 3400, fill: "#0b1640", opacity: 0 }, backG);
        const moon = svgEl("circle", { cx: 860, cy: FL - 420, r: 30, fill: "#f3efd8", opacity: 0 }, backG);
        const sun = svgEl("circle", { cx: 860, cy: FL - 420, r: 34, fill: "#ffd060", opacity: 0 }, backG);
        // house wall + door frame, warm room behind the door
        svgEl("rect", { x: 300, y: FL - 470, width: 520, height: 470, fill: "#3a3330", stroke: "#000", "stroke-width": 6 }, backG);
        svgEl("rect", { x: DX - 12, y: FL - 342, width: DW + 24, height: 342, fill: "#2a2018", stroke: "#000", "stroke-width": 6 }, backG);
        const room = svgEl("rect", { x: DX, y: FL - 330, width: DW, height: 330, fill: "#ffcf7a", opacity: 0.9 }, backG);
        svgEl("rect", { x: 360, y: FL - 300, width: 110, height: 100, fill: "#1c2230", stroke: "#000", "stroke-width": 5 }, backG);
        const winLit = svgEl("rect", { x: 360, y: FL - 300, width: 110, height: 100, fill: "#ffcf7a", stroke: "#000", "stroke-width": 5, opacity: 0 }, backG);
        svgEl("rect", { x: DX + 10, y: FL - 14, width: DW - 20, height: 14, fill: "#7a5a3a", stroke: "#000", "stroke-width": 3 }, roomG);
        const warm = svgEl("ellipse", { cx: 640, cy: FL - 160, rx: 300, ry: 220, fill: "url(#fireGlow)", opacity: 0 }, backG);

        const herG = svgEl("g", {}, figG);
        const bun = svgEl("circle", { r: 15, fill: "#ffffff", stroke: "#000", "stroke-width": 6 }, herG);
        const her = makeFig(herG, "#ffffff", "#e2e2e2", true, "her");
        herG.insertBefore(bun, her.g.previousSibling);
        const doorP = svgEl("rect", { x: DX, y: FL - 330, width: DW, height: 330, fill: "#6b4a30", stroke: "#000", "stroke-width": 5 }, figG);
        const knob = svgEl("circle", { r: 8, fill: "#d4af37", stroke: "#000", "stroke-width": 3 }, figG);
        const him = makeFig(figG, "#ffffff", "#dedede", true, "him");
        const pillow = svgEl("rect", { x: -34, y: -20, width: 68, height: 40, rx: 16, fill: "#e8e8f8", stroke: "#000", "stroke-width": 4 }, fxG);
        const tray = svgEl("g", { opacity: 0 }, fxG);
        svgEl("rect", { x: -60, y: -6, width: 120, height: 12, rx: 4, fill: "#8a5a3a", stroke: "#000", "stroke-width": 4 }, tray);
        svgEl("ellipse", { cx: -28, cy: -12, rx: 24, ry: 7, fill: "#f0f0f0", stroke: "#000", "stroke-width": 3 }, tray);
        svgEl("ellipse", { cx: -34, cy: -16, rx: 9, ry: 5, fill: "#ffd84a", stroke: "#000", "stroke-width": 2 }, tray);
        svgEl("ellipse", { cx: -20, cy: -16, rx: 9, ry: 5, fill: "#ffd84a", stroke: "#000", "stroke-width": 2 }, tray);
        svgEl("rect", { x: 6, y: -30, width: 20, height: 24, rx: 3, fill: "#fff", stroke: "#000", "stroke-width": 3 }, tray);
        svgEl("line", { x1: 44, y1: -6, x2: 44, y2: -46, stroke: "#2f8a3a", "stroke-width": 4 }, tray);
        svgEl("circle", { cx: 44, cy: -52, r: 10, fill: "#ff3b30", stroke: "#000", "stroke-width": 3 }, tray);
        const steam = Array.from({ length: 2 }, () => svgEl("path", { fill: "none", stroke: "#fff", "stroke-width": 4, "stroke-linecap": "round", opacity: 0 }, fxG));
        const zzz = Array.from({ length: 3 }, (_, i) => { const tx = svgEl("text", { "font-family": "HFMono, monospace", "font-weight": 700, "font-size": 30 - i * 4, fill: "#fff", opacity: 0 }, fxG); tx.textContent = "Z"; return tx; });
        const HEART = "M0 18 C-40 -8 -30 -40 0 -22 C30 -40 40 -8 0 18 Z";
        const heart = svgEl("path", { d: HEART, fill: "#ff3b30", stroke: "#000", "stroke-width": 4, opacity: 0 }, fxG);
        const smallH = Array.from({ length: 3 }, () => svgEl("path", { d: HEART, fill: "#ff6a9a", stroke: "#000", "stroke-width": 3, opacity: 0 }, fxG));
        const bubble = (txt, w, size = 30, col = "#111") => {
          const g = svgEl("g", { opacity: 0 }, fxG);
          svgEl("rect", { x: -w / 2, y: -40, width: w, height: 70, rx: 30, fill: "#fff", stroke: "#000", "stroke-width": 5 }, g);
          svgEl("path", { d: "M-8 28 L-20 58 L12 28 Z", fill: "#fff", stroke: "#000", "stroke-width": 5, "stroke-linejoin": "round" }, g);
          svgEl("rect", { x: -12, y: 22, width: 22, height: 10, fill: "#fff" }, g);
          const tx = svgEl("text", { x: 0, y: 12, "font-family": "HFMono, monospace", "font-weight": 700, "font-size": size, fill: col, "text-anchor": "middle" }, g);
          tx.textContent = txt;
          return g;
        };
        const bOut = bubble("OUT!", 120, 30, "#ff3b30"), bKnock = bubble("KNOCK KNOCK...", 270), bSorry = bubble("SORRY.", 150), bAww = bubble("AWW...", 150);

        const reachTo = (s, k, p, hand = "a") => { if (s[hand + "w"] < 1e-6) { s[hand + "tx"] = p[0]; s[hand + "ty"] = p[1]; s[hand + "w"] = k; return s; } s[hand + "w"] = Math.max(s[hand + "w"], k); s[hand + "tx"] = lerp(s[hand + "tx"], p[0], k); s[hand + "ty"] = lerp(s[hand + "ty"], p[1], k); return s; };
        const hold = (s, a, b, r = 0.2) => win(s, a, a + r) * (1 - win(s, b - r, b));
        function herRaw(s) {
          const st = standOn(SHE, 1, FL); st.head = 2;
          if (s < T_DAY) {
            const push = hold(s, T_PUSH - 0.1, T_THROW, 0.12); reachTo(st, push, [SHE + 110, stand - 120]); st.torso += 14 * push; st.hx += 20 * push; st.ax += 10 * push;
            const thr = hold(s, T_THROW - 0.1, T_SLAM + 0.2, 0.1); reachTo(st, thr, [SHE + 90, stand - 190]);
            reachTo(st, win(s, T_THROW, T_SLAM), [SHE - 10, stand - 140], "b");
            return st;
          }
          const cross = 1 - win(s, T_GASP - 0.1, T_GASP + 0.1); reachTo(st, cross, [SHE + 26, stand - 104]); reachTo(st, cross, [SHE + 14, stand - 98], "b");
          const gasp = hold(s, T_GASP, T_PULL, 0.15); reachTo(st, gasp, [SHE + 60, stand - 150]); reachTo(st, gasp, [SHE + 50, stand - 144], "b"); st.head -= 8 * gasp;
          const pull = hold(s, T_PULL, T_HUG + 0.1, 0.12); reachTo(st, pull, [SHE + 120, stand - 100]); st.torso -= 10 * pull;
          if (s > T_HUG) { const k = win(s, T_HUG, T_HUG + 0.4); const hug = standOn(lerp(SHE, 640, k), 1, FL); hug.torso = 8 * k; reachTo(hug, k, [690, stand - 150]); reachTo(hug, k, [680, stand - 120], "b"); return hug; }
          return st;
        }
        function himRaw(s) {
          if (s < T_DAY) {
            const back = win(s, T_PUSH, T_PUSH + 0.5), x = lerp(HE - 60, HE + 20, ease(back));
            const st = standOn(x, -1, FL); st.head = 4; st.torso -= 14 * hold(s, T_PUSH, T_PUSH + 0.6, 0.1);
            const hit = hold(s, T_HIT - 0.05, T_HIT + 0.4, 0.05); st.head += 20 * hit;
            reachTo(st, win(s, T_HIT, T_HIT + 0.3), [x - 30, stand - 100]); reachTo(st, win(s, T_HIT, T_HIT + 0.3), [x - 14, stand - 96], "b");
            const kn = hold(s, T_KNOCK, T_SIT, 0.1); if (kn > 0) { st.hx -= 60 * kn; st.ax -= 50 * kn; st.bx -= 50 * kn; reachTo(st, kn, [DX + DW + 4 + 6 * Math.sin(s * 30), stand - 150 + 8 * Math.sin(s * 30)]); }
            const sitK = win(s, T_SIT, T_SIT + 0.5);
            if (sitK > 0) {
              const sx = DX + DW + 70;
              const sit = base({ hx: sx, hy: FL - 44, torso: -8, head: 22, ax: sx - 80, ay: FL, bx: sx - 96, by: FL - 2 });
              reachTo(sit, 1, [sx - 40, FL - 110]); reachTo(sit, 1, [sx - 30, FL - 100], "b");
              return mixPose(st, sit, sitK);
            }
            return st;
          }
          const x = s > T_HUG ? lerp(HE - 40, 690, win(s, T_HUG, T_HUG + 0.4)) : HE - 40;
          const st = standOn(x, -1, FL); st.head = 6;
          const off = 1 - win(s, T_HUG, T_HUG + 0.3);
          const lift = hold(s, T_SORRY - 0.2, T_HUG, 0.2);
          reachTo(st, off, [x - lerp(40, 70, lift), stand - lerp(80, 110, lift)]); reachTo(st, off, [x - lerp(20, 50, lift), stand - lerp(78, 108, lift)], "b");
          st.head += 16 * hold(s, T_SORRY, T_GASP, 0.15);
          if (s > T_HUG) { const k = win(s, T_HUG, T_HUG + 0.4); reachTo(st, k, [x - 50, stand - 135]); reachTo(st, k, [x - 40, stand - 70], "b"); }
          return st;
        }

        const slam = (words, times, t, red) => words.map((w, i) => {
          const q = clamp((t - times[i]) / 0.2, 0, 1);
          if (q <= 0) return `<span class="w" style="opacity:0">${w}</span>`;
          const sc = lerp(2.3, 1, backOut(q)), bl = (1 - q) * 6;
          return `<span class="w" style="transform:scale(${sc.toFixed(3)});filter:blur(${bl.toFixed(1)}px);${red.includes(i) ? "color:#ff3b30;" : ""}">${w}</span>`;
        }).join("");
        const label = document.createElement("div");
        label.style.cssText = "position:absolute;left:0;right:0;top:400px;text-align:center;font-family:HFMono,monospace;font-weight:700;font-size:34px;letter-spacing:0.3em;color:#9a9a9a;opacity:0";
        E("stage").appendChild(label);
        const dim = document.createElement("div");
        dim.style.cssText = "position:absolute;inset:0;background:#000;opacity:0";
        E("stage").appendChild(dim);
        const card = document.createElement("div");
        card.id = "card";
        card.style.cssText = "position:absolute;left:90px;right:90px;top:640px;text-align:center;font-family:HFMono,monospace;font-weight:700;color:#fff;letter-spacing:0.08em";
        card.innerHTML = `<div id="cm1" style="font-size:60px;line-height:1.25;text-shadow:0 0 18px rgba(255,255,255,0.35)"></div>
          <div id="cm2" style="font-size:46px;line-height:1.35;margin-top:22px;text-shadow:0 0 14px rgba(255,255,255,0.25)"></div>
          <div id="cq" style="opacity:0;margin-top:110px;font-size:29px;line-height:1.5;color:#bdbdbd;letter-spacing:0.05em">"AN APOLOGY IS THE SUPERGLUE<br/>OF LIFE. IT CAN REPAIR<br/>JUST ABOUT ANYTHING."<div style="margin-top:22px;font-size:24px;color:#8a8a8a;letter-spacing:0.2em">LYNN JOHNSTON</div></div>`;
        E("stage").appendChild(card);
        const fade = document.createElement("div");
        fade.style.cssText = "position:absolute;inset:0;background:#000;opacity:0";
        E("stage").appendChild(fade);

        function render(t) {
          const s = t;
          let kick = 0;
          const hit = (tr, k, d) => { if (t >= tr) kick += k * Math.exp(-(t - tr) / d); };
          hit(T_SLAM + 0.15, 1.0, 0.15); hit(T_HIT, 0.4, 0.12);
          const cs = (night(s) ? 1.9 : 2.0) * (s > T_HUG ? 1 + 0.08 * ease(clamp((s - T_HUG) / 1.2, 0, 1)) : 1);
          const sc = cs * (1 + 0.05 * Math.min(kick, 1.5));
          const shx = Math.sin(t * 67) * 8 * Math.min(kick, 1), shy = Math.cos(t * 59) * 6 * Math.min(kick, 1);
          cam.setAttribute("transform", `translate(${r1(540 + shx)} ${r1(1180 + shy)}) scale(${sc.toFixed(4)}) translate(-660 -440)`);
          // door: open (thin, swung inward) or closed
          const open = s < T_DAY ? 1 - win(s, T_SLAM, T_SLAM + 0.15) : win(s, T_OPEN, T_OPEN + 0.3);
          doorP.setAttribute("width", r1(DW * (1 - 0.86 * open)));
          knob.setAttribute("cx", r1(DX + DW * (1 - 0.86 * open) - 20)); knob.setAttribute("cy", FL - 160); knob.setAttribute("opacity", open < 0.5 ? 1 : 0);
          room.setAttribute("opacity", (0.9 * open).toFixed(3));
          herG.setAttribute("opacity", open > 0.05 ? 1 : 0);
          nightT.setAttribute("opacity", night(s) ? 0.5 : 0); moon.setAttribute("opacity", night(s) ? 1 : 0); sun.setAttribute("opacity", night(s) ? 0 : 1);
          glowC.setAttribute("opacity", night(s) ? 0.12 : 0.35); winLit.setAttribute("opacity", night(s) && s < T_SIT ? 0.8 : 0);
          const hp = drawFig(her, livePose(herRaw, s, 1.4), 1);
          const mp = drawFig(him, livePose(himRaw, s, 0.3), -1);
          bun.setAttribute("cx", r1(hp.head[0] - 25)); bun.setAttribute("cy", r1(hp.head[1] - 16));
          // pillow: her hand, thrown at his head, then hugged by him; gone in the morning
          let pp, pr = 0;
          if (s < T_THROW) pp = hp.hands[0];
          else if (s < T_HIT) { const q = (s - T_THROW) / (T_HIT - T_THROW); pp = [lerp(hp.hands[0][0], mp.head[0], q), lerp(hp.hands[0][1], mp.head[1], q) - 60 * Math.sin(Math.PI * q)]; pr = 300 * q; }
          else pp = [(mp.hands[0][0] + mp.hands[1][0]) / 2, (mp.hands[0][1] + mp.hands[1][1]) / 2];
          pillow.setAttribute("opacity", night(s) ? 1 : 0); pillow.setAttribute("transform", `translate(${r1(pp[0])} ${r1(pp[1])}) rotate(${r1(pr)})`);
          // tray in the morning
          const th = s > T_HUG ? mp.hands[1] : [(mp.hands[0][0] + mp.hands[1][0]) / 2, (mp.hands[0][1] + mp.hands[1][1]) / 2];
          tray.setAttribute("opacity", night(s) ? 0 : 1); tray.setAttribute("transform", `translate(${r1(th[0])} ${r1(th[1] - 4)})`);
          steam.forEach((p, i) => { const q = frac(t * 1.6 + i / 2); p.setAttribute("d", `M${r1(th[0] + 10 + i * 10)} ${r1(th[1] - 36 - 30 * q)} q8 -10 0 -20`); p.setAttribute("opacity", night(s) ? 0 : Math.sin(Math.PI * q).toFixed(3)); });
          zzz.forEach((z, i) => { const q = frac((s - T_ZZZ) * 0.7 + i / 3), on = night(s) && s > T_ZZZ; z.setAttribute("x", r1(mp.head[0] + 30 + 40 * q + i * 6)); z.setAttribute("y", r1(mp.head[1] - 40 - 90 * q)); z.setAttribute("opacity", on ? Math.sin(Math.PI * q).toFixed(3) : 0); });
          // speech
          const bub = (g, a, b, p) => { const k = hold(s, a, b, 0.1); g.setAttribute("opacity", k.toFixed(3)); g.setAttribute("transform", `translate(${r1(p[0])} ${r1(p[1])}) scale(${(0.6 + 0.4 * backOut(k)).toFixed(3)})`); };
          bub(bOut, T_OUT, T_SLAM, [hp.head[0] - 20, hp.head[1] - 110]);
          bub(bKnock, T_KNOCK + 0.1, T_SIT + 0.1, [mp.head[0] + 40, mp.head[1] - 110]);
          bub(bSorry, T_SORRY, T_GASP + 0.2, [mp.head[0] + 30, mp.head[1] - 110]);
          bub(bAww, T_GASP + 0.1, T_HUG, [hp.head[0] - 40, hp.head[1] - 110]);
          smallH.forEach((h, k) => { const q = clamp((s - T_GASP - 0.2 - k * 0.15) / 0.8, 0, 1); h.setAttribute("opacity", q > 0 && q < 1 ? Math.sin(Math.PI * q).toFixed(3) : 0); h.setAttribute("transform", `translate(${r1(hp.head[0] + 20 - k * 20)} ${r1(hp.head[1] - 40 - 60 * q)}) scale(0.45)`); });
          const hq = clamp((s - T_HOLD) / 0.4, 0, 1), beat = 1 + 0.08 * Math.max(0, Math.sin(t * 7)) * (hq >= 1 ? 1 : 0);
          heart.setAttribute("opacity", hq > 0 ? 1 : 0);
          heart.setAttribute("transform", `translate(${r1((mp.head[0] + hp.head[0]) / 2)} ${r1(Math.min(mp.head[1], hp.head[1]) - 110)}) scale(${(backOut(hq) * 1.1 * beat).toFixed(3)})`);
          warm.setAttribute("opacity", (0.8 * win(s, T_GASP, T_GASP + 0.8)).toFixed(3));
          label.textContent = night(s) ? "THE NIGHT AFTER THE FIGHT." : "NEXT MORNING.";
          const l0 = night(s) ? 0 : T_DAY;
          label.style.opacity = Math.min(win(s, l0, l0 + 0.2), 1 - win(s, l0 + 1.4, l0 + 1.7)).toFixed(3);

          E("h1").innerHTML = slam(["SHE", "KICKED", "HIM", "OUT."], [T_H1, T_H1 + 0.13, T_H1 + 0.26, T_H1 + 0.4], t, [1]);
          E("h2").innerHTML = slam(["HE", "CAME", "BACK", "WITH", "BREAKFAST."], [T_H2, T_H2 + 0.13, T_H2 + 0.26, T_H2 + 0.39, T_H2 + 0.52], t, []);
          E("h1").style.opacity = (1 - 0.45 * win(t, T_H2 - 0.1, T_H2 + 0.2)).toFixed(3);
          dim.style.opacity = (0.8 * win(t, T_CARD - 0.4, T_CARD)).toFixed(3);
          E("head").style.opacity = (1 - win(t, T_CARD - 0.4, T_CARD)).toFixed(3);
          E("cm1").innerHTML = slam(["SAY", "SORRY"], [T_CARD, T_CARD + 0.2], t, []);
          E("cm2").innerHTML = slam(["WITH", "ACTIONS."], [T_CARD + 0.7, T_CARD + 0.85], t, [1]);
          E("cq").style.opacity = win(t, T_CARD + 1.5, T_CARD + 2.0).toFixed(3);
          fade.style.opacity = win(t, DUR - 0.3, DUR - 0.02).toFixed(3);
        }

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
        window.__timelines["main"] = tl;
        render(0);
        tl.seek(0);
      })();
    </script>
  </body>
</html>
