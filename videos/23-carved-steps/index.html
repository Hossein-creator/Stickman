<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "HFMono";
        src: url("assets/fonts/consolab.ttf") format("truetype");
        font-weight: 700;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      #stage svg {
        position: absolute;
        inset: 0;
      }
      .mono {
        position: absolute;
        font-family: "HFMono", monospace;
        font-weight: 700;
        white-space: nowrap;
      }
      /* everything readable stays inside the Instagram safe area: x 120-960, y 220-1500 */
      #head {
        position: absolute;
        left: 0;
        right: 0;
        top: 222px;
        text-align: center;
        font-family: "HFMono", monospace;
        font-weight: 700;
        font-size: 38px;
        letter-spacing: 0.12em;
        line-height: 1.45;
        color: #fff;
        text-shadow: 0 0 16px rgba(255, 255, 255, 0.3);
      }
      #head .ghost {
        visibility: hidden;
      }
      #ctr {
        position: absolute;
        left: 0;
        right: 0;
        top: 430px;
        text-align: center;
        font-family: "HFMono", monospace;
        font-weight: 700;
        white-space: nowrap;
      }
      #ctr .lbl {
        font-size: 26px;
        letter-spacing: 0.24em;
        color: #9a9a9a;
        vertical-align: middle;
      }
      #num {
        display: inline-block;
        min-width: 2.4ch;
        font-size: 58px;
        letter-spacing: 0.08em;
        color: #fff;
        vertical-align: middle;
        text-shadow: 0 0 14px rgba(255, 255, 255, 0.35);
      }
      #tag {
        display: inline-block;
        min-width: 5.2ch;
        padding: 6px 12px 4px;
        font-size: 26px;
        letter-spacing: 0.18em;
        vertical-align: middle;
        visibility: hidden;
      }
      #tag.fail {
        visibility: visible;
        background: #d62a2a;
        color: #fff;
      }
      #tag.pass {
        visibility: visible;
        background: #fff;
        color: #000;
        box-shadow: 0 0 22px rgba(255, 255, 255, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="14" data-track-index="0">
        <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
              <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.12" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0.04" />
            </linearGradient>
            <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.32" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="dustG" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#b5b5b5" stop-opacity="0.8" />
              <stop offset="1" stop-color="#b5b5b5" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="ply" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#d9c29b" />
              <stop offset="1" stop-color="#8f7858" />
            </linearGradient>
            <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#000" stop-opacity="0.45" />
              <stop offset="1" stop-color="#000" stop-opacity="1" />
            </linearGradient>
            <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="12" />
            </filter>
            <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="16" />
            </filter>
                      <linearGradient id="rock" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#5a5a5a" />
              <stop offset="0.25" stop-color="#3c3c3c" />
              <stop offset="1" stop-color="#202020" />
            </linearGradient>
            <radialGradient id="topGlow" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>
          </defs>
          <!-- world: floor at world y 600 -> screen y 1400, world x 400 -> screen x 540 -->
          <g transform="translate(540 1400) scale(1.45) translate(-400 -600)">
            <g id="beams"></g>
            <g id="back"></g>
            
            <use href="#world" transform="translate(0 1200) scale(1 -1)" opacity="0.16" />
            <rect x="-200" y="600" width="1200" height="260" fill="url(#floorFade)" />
            <rect x="-600" y="858" width="2000" height="1400" fill="#000" />
            <rect x="-200" y="599" width="1200" height="2" fill="#2a2a2a" />
            <g id="world"></g>
          </g>
        </svg>
        
        <div id="head">
          <div id="h1"></div>
          <div id="h2"></div>
        </div>
      </div>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="14" data-track-index="1"></audio>
    </div>

    <script>
      (function () {
        const DUR = 14;
        const FL = 600, BX0 = 380, BX1 = 520, BTOP = 410, TOPF = 404, SX = 250;
        const THIGH = 80, SHIN = 78, LEG = 154;
        const UARM = 64, FARM = 60, TORSO = 116, NECK = 12, HEADR = 31;
        const NS = "http://www.w3.org/2000/svg";
        const svgEl = (tag, attrs, parent) => {
          const e = document.createElementNS(NS, tag);
          for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(e);
          return e;
        };
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, p) => a + (b - a) * p;
        const ease = (p) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(p, 0, 1));
        const backOut = (p) => { p = clamp(p, 0, 1); const s = 2.2; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
        const win = (t, a, b) => ease((t - a) / (b - a));
        const rad = (x) => (x * Math.PI) / 180;
        const down = (a, f) => [Math.sin(rad(a)) * f, Math.cos(rad(a))];
        const up = (a, f) => [Math.sin(rad(a)) * f, -Math.cos(rad(a))];
        const r1 = (v) => Math.round(v * 10) / 10;
        const E = (id) => document.getElementById(id);
        let seed = 31;
        const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

        // ---------- rig v2 (from reel 05): blended poses, head/arm follow-through, breathing ----------
        function makeFig(parent, front, back, glow, id) {
          const g = svgEl("g", { id }, parent);
          if (glow) parent.insertBefore(svgEl("use", { href: "#" + id, filter: "url(#blur)", opacity: 0.45 }), g);
          const parts = { g };
          for (const [n, col] of [["armB", back], ["legB", back], ["torso", front], ["legF", front], ["armF", front]]) {
            const o = svgEl("path", { fill: "none", stroke: "#000", "stroke-width": 34, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            const w = svgEl("path", { fill: "none", stroke: col, "stroke-width": 22, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            parts[n] = [o, w];
          }
          parts.head = svgEl("circle", { r: HEADR, fill: front, stroke: "#000", "stroke-width": 6 }, g);
          return parts;
        }
        function ik(a, b, l1, l2, pick) {
          let dx = b[0] - a[0], dy = b[1] - a[1];
          let d = Math.hypot(dx, dy);
          const maxd = l1 + l2 - 0.5;
          if (d > maxd) {
            b = [a[0] + (dx / d) * maxd, a[1] + (dy / d) * maxd];
            dx = b[0] - a[0];
            dy = b[1] - a[1];
            d = maxd;
          }
          d = Math.max(d, Math.abs(l1 - l2) + 1);
          const al = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
          const base = Math.atan2(dy, dx);
          const c1 = [a[0] + Math.cos(base + al) * l1, a[1] + Math.sin(base + al) * l1];
          const c2 = [a[0] + Math.cos(base - al) * l1, a[1] + Math.sin(base - al) * l1];
          return [pick(c1, c2), b];
        }
        const P = (pts) => "M" + pts.map((p) => r1(p[0]) + " " + r1(p[1])).join("L");
        const setD = (pair, d) => {
          pair[0].setAttribute("d", d);
          pair[1].setAttribute("d", d);
        };
        // flat pose: hx hy torso head ax ay bx by | per arm a*/b*: sh el w tx ty
        function drawFig(parts, s, f) {
          const hip = [s.hx, s.hy];
          const tu = up(s.torso, f);
          const sh = [hip[0] + tu[0] * TORSO, hip[1] + tu[1] * TORSO];
          const nk = [hip[0] + tu[0] * (TORSO + NECK), hip[1] + tu[1] * (TORSO + NECK)];
          const hu = up(s.torso + s.head, f);
          const hc = [nk[0] + hu[0] * HEADR, nk[1] + hu[1] * HEADR];
          setD(parts.torso, P([hip, sh, nk]));
          parts.head.setAttribute("cx", r1(hc[0]));
          parts.head.setAttribute("cy", r1(hc[1]));
          const knee = (c1, c2) => (c1[0] * f > c2[0] * f ? c1 : c2);
          const elbow = (c1, c2) => (c1[1] - 0.5 * f * c1[0] > c2[1] - 0.5 * f * c2[0] ? c1 : c2);
          [["legF", [s.ax, s.ay]], ["legB", [s.bx, s.by]]].forEach(([n, ft]) => {
            const [kn, fo] = ik(hip, ft, THIGH, SHIN, knee);
            setD(parts[n], P([hip, kn, fo]));
          });
          const hands = [];
          [["armF", "a"], ["armB", "b"]].forEach(([n, k]) => {
            const u = down(s[k + "sh"], f);
            const el = [sh[0] + u[0] * UARM, sh[1] + u[1] * UARM];
            const v = down(s[k + "sh"] + s[k + "el"], f);
            const fk = [el[0] + v[0] * FARM, el[1] + v[1] * FARM];
            const w = clamp(s[k + "w"], 0, 1);
            const hand = [lerp(fk[0], s[k + "tx"], w), lerp(fk[1], s[k + "ty"], w)];
            const [e2, h2] = ik(sh, hand, UARM, FARM, elbow);
            setD(parts[n], P([sh, e2, h2]));
            hands.push(h2);
          });
          return { head: hc, hands, hip };
        }
        const KER = [-4, -3, -2, -1, 0, 1, 2, 3, 4].map((k) => [k * 0.03, Math.exp(-((k / 2.3) ** 2))]);
        function blend(raw, t) {
          const out = {};
          let ws = 0;
          for (const [dt, w] of KER) {
            const p = raw(clamp(t + dt, 0, DUR));
            for (const k in p) out[k] = (out[k] || 0) + p[k] * w;
            ws += w;
          }
          for (const k in out) out[k] /= ws;
          return out;
        }
        const LAGGED = ["head", "ash", "ael", "aw", "atx", "aty", "bsh", "bel", "bw", "btx", "bty"];
        function livePose(raw, t, phase) {
          const s = blend(raw, t);
          const lag = blend(raw, t - 0.05);
          for (const k of LAGGED) s[k] = lag[k];
          const br = Math.sin(t * 1.9 + phase);
          s.hy += br * 1.3;
          s.torso += br * 0.8;
          s.head += Math.sin(t * 1.2 + phase * 2) * 1.6;
          return s;
        }
        const ARMS = { ash: 8, ael: 12, aw: 0, atx: 0, aty: 0, bsh: -4, bel: 10, bw: 0, btx: 0, bty: 0 };
        const base = (o) => ({ hx: 0, hy: 0, torso: 3, head: 0, ax: 0, ay: FL, bx: 0, by: FL, ...ARMS, ...o });
        function standOn(x, f, fy) {
          return base({ hx: x, hy: fy - Math.sqrt(LEG * LEG - 15 * 15), ax: x + f * 15, ay: fy, bx: x - f * 15, by: fy });
        }
        const mixPose = (a, b, p) => {
          const o = {};
          for (const k in a) o[k] = lerp(a[k], b[k], p);
          return o;
        };

        // ---------- scene: men sit at the foot of a cliff. Nobody throws a rope. One carves steps and climbs ----------
        const cam = E("svg").children[1];
        const W = E("world");
        const beams = E("beams");
        const backG = E("back");
        const wallG = svgEl("g", {}, W);
        const stepG = svgEl("g", {}, W);
        const figG = svgEl("g", {}, W);
        const fxG = svgEl("g", {}, W);
        const WX = 520, RISE = 90, NSTEP = 8, TOPY = FL - RISE * (NSTEP + 1), HX = 496;
        const T0 = 1.0, PER = 1.0, T_TOP = T0 + NSTEP * PER;     // 9.0

        // light from above the cliff
        const topBeam = svgEl("polygon", { points: `560,-1400 820,-1400 900,${TOPY} 520,${TOPY}`, fill: "url(#beam)", filter: "url(#soft)", opacity: 0.55 }, beams);
        svgEl("polygon", { points: `150,-400 330,-400 460,600 40,600`, fill: "url(#beam)", filter: "url(#soft)", opacity: 0.12 }, beams);
        const topPool = svgEl("ellipse", { cx: 700, cy: TOPY, rx: 260, ry: 40, fill: "url(#topGlow)" }, backG);
        // the cliff
        svgEl("rect", { x: WX, y: TOPY, width: 700, height: FL - TOPY, fill: "url(#rock)", stroke: "#000", "stroke-width": 6 }, wallG);
        for (let i = 0; i < 26; i++) {
          const y = TOPY + 20 + rnd() * (FL - TOPY - 40), x = WX + 20 + rnd() * 380;
          svgEl("path", { d: `M${r1(x)} ${r1(y)} l${r1(10 + rnd() * 30)} ${r1(rnd() * 14 - 7)} l${r1(rnd() * 20)} ${r1(10 + rnd() * 12)}`, fill: "none", stroke: "#1a1a1a", "stroke-width": 3 }, wallG);
        }
        svgEl("rect", { x: WX, y: TOPY - 4, width: 700, height: 8, fill: "#e8e8e8" }, wallG);
        const lvl = (k) => FL - RISE * k;
        // steps grow out of the wall as he carves them
        const steps = [];
        for (let k = 1; k <= NSTEP; k++) steps.push(svgEl("rect", { x: WX, y: lvl(k), width: 0, height: 14, rx: 3, fill: "#8a8a8a", stroke: "#000", "stroke-width": 4 }, stepG));
        const chips = [];
        for (let i = 0; i < 8; i++) chips.push(svgEl("circle", { r: 3, fill: "#d8d8d8" }, fxG));

        // ---------- crowd at the foot of the cliff ----------
        const CX = [30, 120, 210, 300, 395];
        const crowd = CX.map((x, i) => {
          const box = svgEl("g", {}, figG);
          return { x, box, parts: makeFig(box, "#8a8a8a", "#6e6e6e", false, "c" + i) };
        });
        const hero = makeFig(figG, "#ffffff", "#dedede", true, "hero");
        const tint = (parts, front, back) => {
          for (const n of ["torso", "legF", "armF"]) parts[n][1].setAttribute("stroke", front);
          for (const n of ["legB", "armB"]) parts[n][1].setAttribute("stroke", back);
          parts.head.setAttribute("fill", front);
        };
        const mix = (a, b, p) => { const v = Math.round(lerp(a, b, p)); return `rgb(${v},${v},${v})`; };

        const floorSit = (x, f, look) => base({ hx: x, hy: FL - 24, torso: 20 - 14 * look, head: 26 - 46 * look, ax: x + f * 66, ay: FL, bx: x + f * 52, by: FL, ash: 30, ael: 30, aw: 1, atx: x + f * 60, aty: FL - 92, bsh: 20, bel: 30, bw: 1, btx: x + f * 52, bty: FL - 88 });
        const legH = Math.sqrt(LEG * LEG - 15 * 15);
        // one carve-and-climb cycle from level k to k+1
        function climbPose(x, k, q, f) {
          const L0 = lvl(k), L1 = lvl(k + 1);
          const s = standOn(x, f, L0);
          if (q < 0.55) {
            // two strikes on the wall at thigh height
            const c = (q / 0.275) % 1, hit = Math.sin(Math.PI * Math.min(1, c / 0.6));
            s.torso = 10 + 16 * hit; s.head = 10 + 8 * hit;
            s.aw = 1; s.atx = lerp(x - f * 10, WX - 8, hit); s.aty = lerp(L0 - 250, L0 - 100, hit);
            s.bw = 1; s.btx = WX - 6; s.bty = L0 - 190;
            return s;
          }
          const a = win(q, 0.55, 0.75), h = win(q, 0.62, 0.92), b = win(q, 0.75, 0.95);
          s.ax = x + f * 15; s.ay = lerp(L0, L1, a) - Math.sin(Math.PI * a) * 30;
          s.bx = x - f * 15; s.by = lerp(L0, L1, b) - Math.sin(Math.PI * b) * 26;
          s.hy = lerp(L0, L1, h) - legH + 10 * Math.sin(Math.PI * h);
          s.torso = 12 - 6 * h; s.head = -6;
          s.aw = 1; s.atx = WX - 6; s.aty = lerp(L0 - 230, L1 - 230, h);
          s.bw = 1; s.btx = WX - 4; s.bty = lerp(L0 - 180, L1 - 180, h);
          return s;
        }
        function heroRaw(t) {
          if (t < T0) { const s = standOn(HX, 1, FL); s.head = -28 * win(t, 0.2, 0.7); return s; }
          if (t < T_TOP) { const k = Math.floor((t - T0) / PER); return climbPose(HX, k, (t - T0 - k * PER) / PER, 1); }
          // last pull onto the top, step into the light, then look down and reach
          const L0 = lvl(NSTEP);
          const p = win(t, T_TOP, T_TOP + 0.7);
          if (t < T_TOP + 0.8) {
            const s = standOn(lerp(HX, 600, p), 1, lerp(L0, TOPY, Math.min(1, p * 1.4)));
            s.torso = 18 * Math.sin(Math.PI * p); s.head = -10;
            return s;
          }
          const turn = win(t, 10.6, 10.9), reach = win(t, 11.0, 11.4);
          const s = standOn(600, 1, TOPY);
          s.head = -18 * (1 - turn) + 34 * turn; s.torso = 3 + 22 * reach;
          s.aw = reach; s.atx = 520; s.aty = TOPY - 40 + 60 * reach;
          s.ash = lerp(8, 30, 1 - turn); s.bsh = 140 * (1 - turn) * win(t, 9.9, 10.2);
          return s;
        }
        const heroF = (t) => (t < 10.75 ? 1 : -1);
        // the second man: stands up, walks to the wall, starts climbing the same steps
        const T2 = 10.0;
        function secondRaw(t) {
          const x0 = CX[4];
          if (t < T2) return floorSit(x0, 1, win(t, 4.0, 5.0));
          if (t < T2 + 0.5) return mixPose(floorSit(x0, 1, 1), standOn(x0, 1, FL), win(t, T2, T2 + 0.5));
          if (t < T2 + 1.1) {
            const q = win(t, T2 + 0.5, T2 + 1.1), hx = lerp(x0, HX, q), u = hx - x0, ST = 2 * (HX - x0);
            const p = u / ST, fr = (v) => v - Math.floor(v);
            const feet = [0, 0.5].map((o) => { const qq = fr(p + o + 1e-6); if (qq < 0.5) return [hx + ST * (0.25 - qq), FL]; const s2 = (qq - 0.5) / 0.5; return [hx + ST * (-0.25 + 0.5 * ease(s2)), FL - Math.sin(Math.PI * s2) * 16]; });
            return base({ hx, hy: FL - Math.sqrt(LEG * LEG - (ST * 0.25) ** 2) * 0.98, torso: 6, head: -10, ax: feet[0][0], ay: feet[0][1], bx: feet[1][0], by: feet[1][1] });
          }
          const tt = t - T2 - 1.2;
          if (tt < 0) return standOn(HX, 1, FL);
          const k = Math.min(1, Math.floor(tt / 0.8));
          const q = clamp((tt - k * 0.8) / 0.8, 0, 1);
          return climbPose(HX, k, 0.55 + 0.45 * q, 1);
        }

        const typed = (id, text, t, t0, cps) => {
          const n = clamp(Math.floor((t - t0) * cps), 0, text.length);
          E(id).innerHTML = "<span>" + text.slice(0, n) + '</span><span class="ghost">' + text.slice(n) + "</span>";
        };
        const fade = document.createElement("div");
        fade.style.cssText = "position:absolute;inset:0;background:#000;opacity:0";
        E("stage").appendChild(fade);

        // ---------- per-frame render ----------
        function render(t) {
          const z = win(t, 1.6, 10.0);
          const s = lerp(1.55, 0.94, z), wy = 600, sy = lerp(1480, 1460, z);
          // follow him up while he climbs, then settle on the wide shot
          const hy = t < T0 ? FL : t < T_TOP ? lvl(Math.min(NSTEP, (t - T0) / PER)) : TOPY;
          const follow = lerp(0, (FL - hy) * 0.55, 1 - win(t, 9.2, 10.4)) * (1 - z * 0.3);
          cam.setAttribute("transform", `translate(540 ${r1(sy + follow * s)}) scale(${s.toFixed(4)}) translate(-400 ${r1(-wy)})`);

          // steps appear on the strikes
          steps.forEach((st, i) => {
            const tc = T0 + i * PER;
            const g = win(t, tc + 0.1, tc + 0.5);
            st.setAttribute("x", r1(WX - 44 * g)); st.setAttribute("width", r1(44 * g + 2));
          });
          // rock chips on each strike
          const k = Math.floor((t - T0) / PER), q = (t - T0 - k * PER) / PER;
          chips.forEach((c, i) => {
            const hitT = (i % 2) * 0.275 + 0.165, dt = q - hitT;
            const on = t > T0 && t < T_TOP && dt > 0 && dt < 0.2;
            c.setAttribute("cx", r1(WX - 10 - dt * 300 * (0.5 + (i % 4) * 0.2)));
            c.setAttribute("cy", r1(lvl(k) - 100 - dt * 200 + dt * dt * 3000 + (i % 3) * 6));
            c.setAttribute("opacity", on ? 1 : 0);
          });

          drawFig(hero, livePose(heroRaw, t, 0.3), heroF(t));
          crowd.forEach((c, i) => {
            if (i === 4) {
              drawFig(c.parts, livePose(secondRaw, t, 2.2), 1);
              const w = win(t, T2 + 0.3, T2 + 2.4);
              tint(c.parts, mix(138, 255, w), mix(110, 222, w));
              return;
            }
            const look = win(t, 5.5 + i * 0.4, 6.2 + i * 0.4) * (i % 2 ? 1 : 0.4);
            drawFig(c.parts, livePose((tt) => floorSit(c.x, i === 0 ? -1 : 1, look), t, i), i === 0 ? -1 : 1);
          });
          topBeam.setAttribute("opacity", (0.45 + 0.25 * win(t, T_TOP, T_TOP + 0.8)).toFixed(3));
          topPool.setAttribute("opacity", (0.7 + 0.3 * win(t, T_TOP, T_TOP + 0.8)).toFixed(3));

          typed("h1", "NOBODY THREW HIM A ROPE.", t, 0.4, 24);
          typed("h2", "SO HE CARVED HIS OWN STEPS.", t, 10.0, 22);
          E("h1").style.color = `rgba(255,255,255,${(1 - 0.55 * win(t, 9.8, 10.2)).toFixed(3)})`;
          fade.style.opacity = win(t, 13.35, 13.95).toFixed(3);
        }

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
        window.__timelines["main"] = tl;
        render(0);
        tl.seek(0);
      })();
