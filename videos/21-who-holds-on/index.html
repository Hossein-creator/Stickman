<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "HFMono";
        src: url("assets/fonts/consolab.ttf") format("truetype");
        font-weight: 700;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      #stage svg {
        position: absolute;
        inset: 0;
      }
      .mono {
        position: absolute;
        font-family: "HFMono", monospace;
        font-weight: 700;
        white-space: nowrap;
      }
      /* everything readable stays inside the Instagram safe area: x 120-960, y 220-1500 */
      #head {
        position: absolute;
        left: 0;
        right: 0;
        top: 222px;
        text-align: center;
        font-family: "HFMono", monospace;
        font-weight: 700;
        font-size: 38px;
        letter-spacing: 0.12em;
        line-height: 1.45;
        color: #fff;
        text-shadow: 0 0 16px rgba(255, 255, 255, 0.3);
      }
      #head .ghost {
        visibility: hidden;
      }
      #ctr {
        position: absolute;
        left: 0;
        right: 0;
        top: 430px;
        text-align: center;
        font-family: "HFMono", monospace;
        font-weight: 700;
        white-space: nowrap;
      }
      #ctr .lbl {
        font-size: 26px;
        letter-spacing: 0.24em;
        color: #9a9a9a;
        vertical-align: middle;
      }
      #num {
        display: inline-block;
        min-width: 2.4ch;
        font-size: 58px;
        letter-spacing: 0.08em;
        color: #fff;
        vertical-align: middle;
        text-shadow: 0 0 14px rgba(255, 255, 255, 0.35);
      }
      #tag {
        display: inline-block;
        min-width: 5.2ch;
        padding: 6px 12px 4px;
        font-size: 26px;
        letter-spacing: 0.18em;
        vertical-align: middle;
        visibility: hidden;
      }
      #tag.fail {
        visibility: visible;
        background: #d62a2a;
        color: #fff;
      }
      #tag.pass {
        visibility: visible;
        background: #fff;
        color: #000;
        box-shadow: 0 0 22px rgba(255, 255, 255, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="14" data-track-index="0">
        <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
              <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.12" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0.04" />
            </linearGradient>
            <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.32" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="dustG" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#b5b5b5" stop-opacity="0.8" />
              <stop offset="1" stop-color="#b5b5b5" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="ply" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#d9c29b" />
              <stop offset="1" stop-color="#8f7858" />
            </linearGradient>
            <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#000" stop-opacity="0.45" />
              <stop offset="1" stop-color="#000" stop-opacity="1" />
            </linearGradient>
            <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="12" />
            </filter>
            <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="16" />
            </filter>
          
          </defs>
          <!-- world: floor at world y 600 -> screen y 1400, world x 400 -> screen x 540 -->
          <g transform="translate(540 1400) scale(1.45) translate(-400 -600)">
            <g id="beams"></g>
            <g id="back"></g>
            
            <use href="#world" transform="translate(0 1200) scale(1 -1)" opacity="0.16" />
            <rect x="-200" y="600" width="1200" height="260" fill="url(#floorFade)" />
            <rect x="-600" y="858" width="2000" height="1400" fill="#000" />
            <rect x="-200" y="599" width="1200" height="2" fill="#2a2a2a" />
            <g id="world"></g>
          </g>
        </svg>
        <style>
  #tmr { position: absolute; left: 0; right: 0; top: 410px; text-align: center; font-family: "HFMono", monospace; font-weight: 700; font-size: 64px; letter-spacing: 0.06em; color: #fff; text-shadow: 0 0 16px rgba(255, 255, 255, 0.35); }
  .lb { position: absolute; top: 560px; width: 200px; margin-left: -100px; text-align: center; font-family: "HFMono", monospace; font-weight: 700; font-size: 24px; letter-spacing: 0.14em; color: #fff; }
  #told { position: absolute; padding: 8px 14px; border-radius: 14px; background: #6a6a6a; color: #111; font-family: "HFMono", monospace; font-weight: 700; font-size: 23px; letter-spacing: 0.06em; opacity: 0; }
</style>
<div id="tmr">0:07</div>
<div class="lb" id="lb0">TALENT</div>
<div class="lb" id="lb1">MOTIVATION</div>
<div class="lb" id="lb2">DISCIPLINE</div>
<div class="lb" id="lb3">DOUBTED</div>
<div id="told">TOLD YOU.</div>
        <div id="head">
          <div id="h1"></div>
          <div id="h2"></div>
        </div>
      </div>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="14" data-track-index="1"></audio>
    </div>

    <script>
      (function () {
        const DUR = 14;
        const FL = 600, BX0 = 380, BX1 = 520, BTOP = 410, TOPF = 404, SX = 250;
        const THIGH = 80, SHIN = 78, LEG = 154;
        const UARM = 64, FARM = 60, TORSO = 116, NECK = 12, HEADR = 31;
        const NS = "http://www.w3.org/2000/svg";
        const svgEl = (tag, attrs, parent) => {
          const e = document.createElementNS(NS, tag);
          for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(e);
          return e;
        };
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, p) => a + (b - a) * p;
        const ease = (p) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(p, 0, 1));
        const backOut = (p) => { p = clamp(p, 0, 1); const s = 2.2; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
        const win = (t, a, b) => ease((t - a) / (b - a));
        const rad = (x) => (x * Math.PI) / 180;
        const down = (a, f) => [Math.sin(rad(a)) * f, Math.cos(rad(a))];
        const up = (a, f) => [Math.sin(rad(a)) * f, -Math.cos(rad(a))];
        const r1 = (v) => Math.round(v * 10) / 10;
        const E = (id) => document.getElementById(id);
        let seed = 31;
        const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

        // ---------- rig v2 (from reel 05): blended poses, head/arm follow-through, breathing ----------
        function makeFig(parent, front, back, glow, id) {
          const g = svgEl("g", { id }, parent);
          if (glow) parent.insertBefore(svgEl("use", { href: "#" + id, filter: "url(#blur)", opacity: 0.45 }), g);
          const parts = { g };
          for (const [n, col] of [["armB", back], ["legB", back], ["torso", front], ["legF", front], ["armF", front]]) {
            const o = svgEl("path", { fill: "none", stroke: "#000", "stroke-width": 34, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            const w = svgEl("path", { fill: "none", stroke: col, "stroke-width": 22, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            parts[n] = [o, w];
          }
          parts.head = svgEl("circle", { r: HEADR, fill: front, stroke: "#000", "stroke-width": 6 }, g);
          return parts;
        }
        function ik(a, b, l1, l2, pick) {
          let dx = b[0] - a[0], dy = b[1] - a[1];
          let d = Math.hypot(dx, dy);
          const maxd = l1 + l2 - 0.5;
          if (d > maxd) {
            b = [a[0] + (dx / d) * maxd, a[1] + (dy / d) * maxd];
            dx = b[0] - a[0];
            dy = b[1] - a[1];
            d = maxd;
          }
          d = Math.max(d, Math.abs(l1 - l2) + 1);
          const al = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
          const base = Math.atan2(dy, dx);
          const c1 = [a[0] + Math.cos(base + al) * l1, a[1] + Math.sin(base + al) * l1];
          const c2 = [a[0] + Math.cos(base - al) * l1, a[1] + Math.sin(base - al) * l1];
          return [pick(c1, c2), b];
        }
        const P = (pts) => "M" + pts.map((p) => r1(p[0]) + " " + r1(p[1])).join("L");
        const setD = (pair, d) => {
          pair[0].setAttribute("d", d);
          pair[1].setAttribute("d", d);
        };
        // flat pose: hx hy torso head ax ay bx by | per arm a*/b*: sh el w tx ty
        function drawFig(parts, s, f) {
          const hip = [s.hx, s.hy];
          const tu = up(s.torso, f);
          const sh = [hip[0] + tu[0] * TORSO, hip[1] + tu[1] * TORSO];
          const nk = [hip[0] + tu[0] * (TORSO + NECK), hip[1] + tu[1] * (TORSO + NECK)];
          const hu = up(s.torso + s.head, f);
          const hc = [nk[0] + hu[0] * HEADR, nk[1] + hu[1] * HEADR];
          setD(parts.torso, P([hip, sh, nk]));
          parts.head.setAttribute("cx", r1(hc[0]));
          parts.head.setAttribute("cy", r1(hc[1]));
          const knee = (c1, c2) => (c1[0] * f > c2[0] * f ? c1 : c2);
          const elbow = (c1, c2) => (c1[1] - 0.5 * f * c1[0] > c2[1] - 0.5 * f * c2[0] ? c1 : c2);
          [["legF", [s.ax, s.ay]], ["legB", [s.bx, s.by]]].forEach(([n, ft]) => {
            const [kn, fo] = ik(hip, ft, THIGH, SHIN, knee);
            setD(parts[n], P([hip, kn, fo]));
          });
          const hands = [];
          [["armF", "a"], ["armB", "b"]].forEach(([n, k]) => {
            const u = down(s[k + "sh"], f);
            const el = [sh[0] + u[0] * UARM, sh[1] + u[1] * UARM];
            const v = down(s[k + "sh"] + s[k + "el"], f);
            const fk = [el[0] + v[0] * FARM, el[1] + v[1] * FARM];
            const w = clamp(s[k + "w"], 0, 1);
            const hand = [lerp(fk[0], s[k + "tx"], w), lerp(fk[1], s[k + "ty"], w)];
            const [e2, h2] = ik(sh, hand, UARM, FARM, elbow);
            setD(parts[n], P([sh, e2, h2]));
            hands.push(h2);
          });
          return { head: hc, hands, hip };
        }
        const KER = [-4, -3, -2, -1, 0, 1, 2, 3, 4].map((k) => [k * 0.03, Math.exp(-((k / 2.3) ** 2))]);
        function blend(raw, t) {
          const out = {};
          let ws = 0;
          for (const [dt, w] of KER) {
            const p = raw(clamp(t + dt, 0, DUR));
            for (const k in p) out[k] = (out[k] || 0) + p[k] * w;
            ws += w;
          }
          for (const k in out) out[k] /= ws;
          return out;
        }
        const LAGGED = ["head", "ash", "ael", "aw", "atx", "aty", "bsh", "bel", "bw", "btx", "bty"];
        function livePose(raw, t, phase) {
          const s = blend(raw, t);
          const lag = blend(raw, t - 0.05);
          for (const k of LAGGED) s[k] = lag[k];
          const br = Math.sin(t * 1.9 + phase);
          s.hy += br * 1.3;
          s.torso += br * 0.8;
          s.head += Math.sin(t * 1.2 + phase * 2) * 1.6;
          return s;
        }
        const ARMS = { ash: 8, ael: 12, aw: 0, atx: 0, aty: 0, bsh: -4, bel: 10, bw: 0, btx: 0, bty: 0 };
        const base = (o) => ({ hx: 0, hy: 0, torso: 3, head: 0, ax: 0, ay: FL, bx: 0, by: FL, ...ARMS, ...o });
        function standOn(x, f, fy) {
          return base({ hx: x, hy: fy - Math.sqrt(LEG * LEG - 15 * 15), ax: x + f * 15, ay: fy, bx: x - f * 15, by: fy });
        }
        const mixPose = (a, b, p) => {
          const o = {};
          for (const k in a) o[k] = lerp(a[k], b[k], p);
          return o;
        };

        // ---------- scene: four men hang from one bar; the one everybody doubted hangs on last ----------
        const S = 1.25;
        E("svg").children[1].setAttribute("transform", `translate(540 1400) scale(${S}) translate(-400 -600)`);
        const W = E("world");
        const beams = E("beams");
        const barG = svgEl("g", {}, W);
        const figG = svgEl("g", {}, W);
        const fxG = svgEl("g", {}, W);
        const BARY = 150, HY = BARY + 232;
        const XS = [130, 300, 470, 640];
        const DROP = [1.2, 2.4, 3.6, 9.0];          // TALENT, MOTIVATION, DOUBTED (first fall), DISCIPLINE
        const ORDER = [0, 1, 3, 2];                 // man index for each DROP time
        const dropT = [DROP[0], DROP[1], DROP[3], DROP[2]];
        const T_JUMP = 5.0, T_CATCH = 5.32;

        // the bar + posts
        for (const x of [40, 760]) {
          svgEl("rect", { x: x - 8, y: BARY - 10, width: 16, height: FL - BARY + 10, fill: "#555", stroke: "#000", "stroke-width": 5 }, barG);
          svgEl("rect", { x: x - 26, y: FL - 10, width: 52, height: 10, fill: "#444", stroke: "#000", "stroke-width": 4 }, barG);
        }
        svgEl("rect", { x: 30, y: BARY - 6, width: 740, height: 12, rx: 6, fill: "#bdbdbd", stroke: "#000", "stroke-width": 5 }, barG);
        const spots = XS.map((x) => svgEl("polygon", { points: `${x - 40},-200 ${x + 40},-200 ${x + 110},600 ${x - 110},600`, fill: "url(#beam)", filter: "url(#soft)", opacity: 0.4 }, beams));
        const pools = XS.map((x) => svgEl("ellipse", { cx: x, cy: FL, rx: 110, ry: 20, fill: "url(#pool)", opacity: 0.7 }, E("back")));

        const men = XS.map((x, i) => {
          const box = svgEl("g", {}, figG);
          return { x, box, parts: makeFig(box, "#ffffff", "#dedede", true, "m" + i) };
        });
        const tint = (parts, front, back) => {
          for (const n of ["torso", "legF", "armF"]) parts[n][1].setAttribute("stroke", front);
          for (const n of ["legB", "armB"]) parts[n][1].setAttribute("stroke", back);
          parts.head.setAttribute("fill", front);
        };
        const grey = (k, a = 255, b = 120) => { const v = Math.round(lerp(a, b, k)); return `rgb(${v},${v},${v})`; };
        const reds = [0, 1].map(() => svgEl("circle", { r: 9, fill: "#d62a2a", stroke: "#000", "stroke-width": 3, opacity: 0 }, fxG));

        function hang(x, t, ph, shake) {
          const sw = Math.sin(t * 1.7 + ph) * 3 + shake * Math.sin(t * 47 + ph) * 2.2;
          return base({
            hx: x + sw, hy: HY + Math.abs(sw) * 0.3, torso: 4 + sw * 0.4, head: 26 + sw * 0.5,
            ax: x + 8 + sw * 1.6, ay: HY + 150, bx: x - 6 + sw * 1.8, by: HY + 147,
            ash: 170, ael: 0, aw: 1, atx: x + 14, aty: BARY + 2,
            bsh: 170, bel: 0, bw: 1, btx: x - 30, bty: BARY + 2,
          });
        }
        const stand = FL - Math.sqrt(LEG * LEG - 15 * 15);
        const floorSit = (x, f) => base({ hx: x, hy: FL - 24, torso: 22, head: 26, ax: x + f * 70, ay: FL, bx: x + f * 56, by: FL, ash: 30, ael: 30, aw: 1, atx: x + f * 62, aty: FL - 92, bsh: 20, bel: 30, bw: 1, btx: x + f * 54, bty: FL - 88 });
        // falling: hands slip, body drops with gravity, crouch on landing
        function fall(x, t, t0) {
          const q = t - t0;
          const land = Math.sqrt((2 * (stand - HY)) / 2600);
          const s = hang(x, t0, 0, 1);
          if (q < land) { const y = HY + 0.5 * 2600 * q * q; s.hy = y; s.ay = y + 150; s.by = y + 147; s.aty = BARY + 2 + 0.5 * 2600 * q * q * 0.6; s.bty = s.aty; s.aw = 1 - q / land; s.bw = s.aw; s.ash = lerp(170, 40, q / land); s.bsh = s.ash; return s; }
          const c = Math.sin(Math.PI * clamp((q - land) / 0.35, 0, 1));
          const st = standOn(x, 1, FL);
          st.hy += 40 * c; st.torso = 10 + 20 * c; st.ash = 30; st.bsh = 20;
          return st;
        }
        function quitterRaw(i, tDrop) {
          const x = XS[i], fs = i < 2 ? -1 : 1;
          return (t) => {
            const shake = win(t, tDrop - 1.0, tDrop);
            if (t < tDrop) return hang(x, t, i * 1.3, shake);
            if (t < tDrop + 0.7) return fall(x, t, tDrop);
            return mixPose(standOn(x, 1, FL), floorSit(x - fs * 40, fs), win(t, tDrop + 0.7, tDrop + 1.3));
          };
        }
        // DOUBTED: falls, looks at his red hands, jumps back up and outlasts everyone
        function doubtedRaw(t) {
          const x = XS[3];
          if (t < DROP[2]) return hang(x, t, 4.1, win(t, DROP[2] - 0.8, DROP[2]));
          if (t < DROP[2] + 0.6) return fall(x, t, DROP[2]);
          if (t < T_JUMP - 0.4) {
            const s = standOn(x, 1, FL);
            const look = win(t, 4.1, 4.4);
            s.head = 26 * look; s.torso = 6 + 4 * look;
            s.aw = look; s.atx = x + 40; s.aty = stand - 46; s.bw = look; s.btx = x + 30; s.bty = stand - 40;
            return s;
          }
          if (t < T_JUMP) {
            const c = win(t, T_JUMP - 0.4, T_JUMP);
            const s = standOn(x, 1, FL);
            s.hy += 44 * c; s.torso = 10 + 16 * c; s.head = -10 * c; s.ash = lerp(8, -30, c); s.bsh = lerp(-4, -36, c);
            return s;
          }
          if (t < T_CATCH) {
            const q = clamp((t - T_JUMP) / (T_CATCH - T_JUMP), 0, 1);
            const s = hang(x, t, 4.1, 0);
            const y = lerp(stand + 44, HY, ease(q));
            s.hy = y; s.ay = y + 150 - 30 * (1 - q); s.by = y + 147 - 30 * (1 - q);
            s.aw = q; s.bw = q; s.ash = lerp(-30, 170, q); s.bsh = s.ash;
            return s;
          }
          const s = hang(x, t, 4.1, 0);
          s.hy += 6 * Math.exp(-(t - T_CATCH) * 5) * Math.sin((t - T_CATCH) * 20);
          return s;
        }
        const raws = [quitterRaw(0, DROP[0]), quitterRaw(1, DROP[1]), quitterRaw(2, DROP[3]), doubtedRaw];

        const typed = (id, text, t, t0, cps) => {
          const n = clamp(Math.floor((t - t0) * cps), 0, text.length);
          E(id).innerHTML = "<span>" + text.slice(0, n) + '</span><span class="ghost">' + text.slice(n) + "</span>";
        };
        XS.forEach((x, i) => (E("lb" + i).style.left = r1(540 + (x - 400) * S) + "px"));
        const fade = document.createElement("div");
        fade.style.cssText = "position:absolute;inset:0;background:#000;opacity:0";
        E("stage").appendChild(fade);
        const out = (i, t) => {
          if (i === 3) return win(t, DROP[2] + 0.2, DROP[2] + 0.6) * (1 - win(t, T_JUMP + 0.2, T_JUMP + 0.5));
          const td = i === 2 ? DROP[3] : DROP[i];
          return win(t, td + 0.2, td + 0.9);
        };

        // ---------- per-frame render ----------
        function render(t) {
          men.forEach((m, i) => {
            const j = drawFig(m.parts, livePose(raws[i], t, i * 0.9), i < 2 ? -1 : 1);
            const o = out(i, t);
            tint(m.parts, grey(o), grey(o, 222, 100));
            spots[i].setAttribute("opacity", (0.4 * (1 - o) + (i === 3 ? 0.25 * win(t, 9.2, 10.0) : 0)).toFixed(3));
            pools[i].setAttribute("opacity", (0.7 * (1 - o)).toFixed(3));
            E("lb" + i).style.color = grey(o, 255, 95);
            if (i === 3) {
              const rd = win(t, 4.3, 4.6);
              j.hands.forEach((h, k) => { reds[k].setAttribute("cx", r1(h[0])); reds[k].setAttribute("cy", r1(h[1])); reds[k].setAttribute("opacity", rd.toFixed(3)); });
            }
          });
          // "TOLD YOU." from the man who quit first
          const to = win(t, 3.95, 4.15) * (1 - win(t, 4.9, 5.1));
          E("told").style.opacity = to.toFixed(3);
          E("told").style.left = r1(540 + (XS[0] - 400) * S - 20) + "px";
          E("told").style.top = r1(1400 + (FL - 250 - 600) * S) + "px";
          E("told").style.transform = `scale(${backOut(clamp((t - 3.95) / 0.25, 0, 1)).toFixed(3)})`;

          const sec = Math.floor(7 + Math.min(t, 12.5) * 24);
          E("tmr").textContent = Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");

          typed("h1", "WHO HOLDS ON LONGEST?", t, 0.3, 24);
          typed("h2", "THE ONE THEY SAID COULDN'T.", t, 10.2, 22);
          E("h1").style.color = `rgba(255,255,255,${(1 - 0.55 * win(t, 10.0, 10.4)).toFixed(3)})`;
          fade.style.opacity = win(t, 13.35, 13.95).toFixed(3);
        }

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
        window.__timelines["main"] = tl;
        render(0);
        tl.seek(0);
      })();
    </script>
