<!doctype html>
<html lang="en">

    <style>
      @font-face {
        font-family: "HFMono";

        margin: 0;

        box-sizing: border-box;

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;

        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      #stage svg {
        position: absolute;

      }
      .mono {
        position: absolute;
        font-family: "HFMono", monospace;
        font-weight: 700;
        white-space: nowrap;
      }
      /* everything readable stays inside the Instagram safe area: x 120-960, y 220-1500 */
      #head {
        position: absolute;
        left: 0;
        right: 0;
        top: 222px;
        text-align: center;
        font-family: "HFMono", monospace;
        font-weight: 700;
        font-size: 38px;
        letter-spacing: 0.12em;
        line-height: 1.45;
        color: #fff;

        visibility: hidden;

      #ctr {
        position: absolute;
        left: 0;

      #ctr .lbl {
        font-size: 26px;

      #num {
        display: inline-block;
        min-width: 2.4ch;

        display: inline-block;

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="16" data-track-index="0">
        <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
              <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.12" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0.04" />
            </linearGradient>
            <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.32" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="dustG" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#b5b5b5" stop-opacity="0.8" />
              <stop offset="1" stop-color="#b5b5b5" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="ply" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#d9c29b" />
              <stop offset="1" stop-color="#8f7858" />
            </linearGradient>
            <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#000" stop-opacity="0.45" />
              <stop offset="1" stop-color="#000" stop-opacity="1" />
            </linearGradient>
            <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="12" />

            <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="16" />
            </filter>
                      <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#0c0c0e" />
              <stop offset="1" stop-color="#111318" />
            </linearGradient>
            <linearGradient id="abyss" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#05070a" />
              <stop offset="1" stop-color="#1c2433" />
            </linearGradient>
            <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ddd6c6" />
              <stop offset="1" stop-color="#a39a88" />
            </linearGradient>
            <linearGradient id="redBeam" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ff4a4a" stop-opacity="0.75" />
              <stop offset="0.7" stop-color="#ff6a6a" stop-opacity="0.2" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0.08" />
            </linearGradient>
            <radialGradient id="redGlow" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#ff3b30" stop-opacity="0.7" />
              <stop offset="1" stop-color="#ff3b30" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="phoneGlow" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#6aa8ff" stop-opacity="0.75" />
              <stop offset="0.5" stop-color="#4f8cff" stop-opacity="0.28" />
              <stop offset="1" stop-color="#4f8cff" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#6e665a" />
              <stop offset="0.25" stop-color="#3a352f" />
              <stop offset="1" stop-color="#0c0b0a" />
            </linearGradient>
            <radialGradient id="fireGlow" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#ffb347" stop-opacity="0.75" />
              <stop offset="0.4" stop-color="#ff7a1a" stop-opacity="0.28" />
              <stop offset="1" stop-color="#ff5a00" stop-opacity="0" />
            </radialGradient>
          </defs>
          <!-- world: floor at world y 600 -> screen y 1400, world x 400 -> screen x 540 -->
          <g transform="translate(540 1400) scale(1.45) translate(-400 -600)">
            <g id="beams"></g>
            <g id="back"></g>
            
            <use href="#world" transform="translate(0 1200) scale(1 -1)" opacity="0.16" />
            <rect x="-200" y="600" width="1200" height="260" fill="url(#floorFade)" />
            <rect x="-600" y="858" width="2000" height="1400" fill="#000" />
            <rect x="-200" y="599" width="1200" height="2" fill="#2a2a2a" />
            <g id="world"></g>
          </g>
        </svg>
        <style>
  #fx { position: absolute; inset: 0; pointer-events: none; }
</style>
        <div id="head">
          <div id="h1"></div>
          <div id="h2"></div>
        </div>
      </div>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="16" data-track-index="1"></audio>
    </div>

    <script>
      (function () {
        const DUR = 16;
        const FL = 600, BX0 = 380, BX1 = 520, BTOP = 410, TOPF = 404, SX = 250;
        const THIGH = 80, SHIN = 78, LEG = 154;
        const UARM = 64, FARM = 60, TORSO = 116, NECK = 12, HEADR = 31;
        const NS = "http://www.w3.org/2000/svg";
        const svgEl = (tag, attrs, parent) => {
          const e = document.createElementNS(NS, tag);
          for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(e);
          return e;
        };
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, p) => a + (b - a) * p;
        const ease = (p) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(p, 0, 1));
        const backOut = (p) => { p = clamp(p, 0, 1); const s = 2.2; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
        const win = (t, a, b) => ease((t - a) / (b - a));
        const rad = (x) => (x * Math.PI) / 180;
        const down = (a, f) => [Math.sin(rad(a)) * f, Math.cos(rad(a))];
        const up = (a, f) => [Math.sin(rad(a)) * f, -Math.cos(rad(a))];
        const r1 = (v) => Math.round(v * 10) / 10;
        const E = (id) => document.getElementById(id);
        let seed = 31;
        const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

        // ---------- rig v2 (from reel 05): blended poses, head/arm follow-through, breathing ----------
        function makeFig(parent, front, back, glow, id) {
          const g = svgEl("g", { id }, parent);
          if (glow) parent.insertBefore(svgEl("use", { href: "#" + id, filter: "url(#blur)", opacity: 0.45 }), g);
          const parts = { g };
          for (const [n, col] of [["armB", back], ["legB", back], ["torso", front], ["legF", front], ["armF", front]]) {
            const o = svgEl("path", { fill: "none", stroke: "#000", "stroke-width": 34, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            const w = svgEl("path", { fill: "none", stroke: col, "stroke-width": 22, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            parts[n] = [o, w];
          }
          parts.head = svgEl("circle", { r: HEADR, fill: front, stroke: "#000", "stroke-width": 6 }, g);
          return parts;
        }
        function ik(a, b, l1, l2, pick) {
          let dx = b[0] - a[0], dy = b[1] - a[1];
          let d = Math.hypot(dx, dy);
          const maxd = l1 + l2 - 0.5;
          if (d > maxd) {
            b = [a[0] + (dx / d) * maxd, a[1] + (dy / d) * maxd];
            dx = b[0] - a[0];
            dy = b[1] - a[1];
            d = maxd;
          }
          d = Math.max(d, Math.abs(l1 - l2) + 1);
          const al = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
          const base = Math.atan2(dy, dx);
          const c1 = [a[0] + Math.cos(base + al) * l1, a[1] + Math.sin(base + al) * l1];
          const c2 = [a[0] + Math.cos(base - al) * l1, a[1] + Math.sin(base - al) * l1];
          return [pick(c1, c2), b];
        }
        const P = (pts) => "M" + pts.map((p) => r1(p[0]) + " " + r1(p[1])).join("L");
        const setD = (pair, d) => {
          pair[0].setAttribute("d", d);
          pair[1].setAttribute("d", d);
        };
        // flat pose: hx hy torso head ax ay bx by | per arm a*/b*: sh el w tx ty
        function drawFig(parts, s, f) {
          const hip = [s.hx, s.hy];
          const tu = up(s.torso, f);
          const sh = [hip[0] + tu[0] * TORSO, hip[1] + tu[1] * TORSO];
          const nk = [hip[0] + tu[0] * (TORSO + NECK), hip[1] + tu[1] * (TORSO + NECK)];
          const hu = up(s.torso + s.head, f);
          const hc = [nk[0] + hu[0] * HEADR, nk[1] + hu[1] * HEADR];
          setD(parts.torso, P([hip, sh, nk]));
          parts.head.setAttribute("cx", r1(hc[0]));
          parts.head.setAttribute("cy", r1(hc[1]));
          const knee = (c1, c2) => (c1[0] * f > c2[0] * f ? c1 : c2);
          const elbow = (c1, c2) => (c1[1] - 0.5 * f * c1[0] > c2[1] - 0.5 * f * c2[0] ? c1 : c2);
          [["legF", [s.ax, s.ay]], ["legB", [s.bx, s.by]]].forEach(([n, ft]) => {
            const [kn, fo] = ik(hip, ft, THIGH, SHIN, knee);
            setD(parts[n], P([hip, kn, fo]));
          });
          const hands = [];
          [["armF", "a"], ["armB", "b"]].forEach(([n, k]) => {
            const u = down(s[k + "sh"], f);
            const el = [sh[0] + u[0] * UARM, sh[1] + u[1] * UARM];
            const v = down(s[k + "sh"] + s[k + "el"], f);
            const fk = [el[0] + v[0] * FARM, el[1] + v[1] * FARM];
            const w = clamp(s[k + "w"], 0, 1);
            const hand = [lerp(fk[0], s[k + "tx"], w), lerp(fk[1], s[k + "ty"], w)];
            const [e2, h2] = ik(sh, hand, UARM, FARM, elbow);
            setD(parts[n], P([sh, e2, h2]));
            hands.push(h2);
          });
          return { head: hc, hands, hip };
        }
        const KER = [-4, -3, -2, -1, 0, 1, 2, 3, 4].map((k) => [k * 0.03, Math.exp(-((k / 2.3) ** 2))]);
        function blend(raw, t) {
          const out = {};
          let ws = 0;
          for (const [dt, w] of KER) {
            const p = raw(clamp(t + dt, 0, DUR));
            for (const k in p) out[k] = (out[k] || 0) + p[k] * w;
            ws += w;
          }
          for (const k in out) out[k] /= ws;
          return out;
        }
        const LAGGED = ["head", "ash", "ael", "aw", "atx", "aty", "bsh", "bel", "bw", "btx", "bty"];
        function livePose(raw, t, phase) {
          const s = blend(raw, t);
          const lag = blend(raw, t - 0.05);
          for (const k of LAGGED) s[k] = lag[k];
          const br = Math.sin(t * 1.9 + phase);
          s.hy += br * 1.3;
          s.torso += br * 0.8;
          s.head += Math.sin(t * 1.2 + phase * 2) * 1.6;
          return s;
        }
        const ARMS = { ash: 8, ael: 12, aw: 0, atx: 0, aty: 0, bsh: -4, bel: 10, bw: 0, btx: 0, bty: 0 };
        const base = (o) => ({ hx: 0, hy: 0, torso: 3, head: 0, ax: 0, ay: FL, bx: 0, by: FL, ...ARMS, ...o });
        function standOn(x, f, fy) {
          return base({ hx: x, hy: fy - Math.sqrt(LEG * LEG - 15 * 15), ax: x + f * 15, ay: fy, bx: x - f * 15, by: fy });
        }
        const mixPose = (a, b, p) => {
          const o = {};
          for (const k in a) o[k] = lerp(a[k], b[k], p);
          return o;
        };

        // ---------- "share the load": winner format of reel 36 (two panels). BOTH CARRY: they carry the boxes (dishes, laundry, bills, dinner) to the shelf together, then sit close (red heart). ONE CARRIES: she carries everything, he scrolls on the couch; when he reaches for her she pulls away: too tired. Remake of "why she pulls away" (viral/2026-10-30-check.md) ----------
        E("svg").children[1].style.display = "none";
        const SVG = E("svg");
        const frac = (v) => v - Math.floor(v);
        const stand = FL - Math.sqrt(LEG * LEG - 15 * 15);

        // ---------- panel geometry: world 0..1233 x 98..815, ground at 600 ----------
        const PW = 1233, PY0 = 98, PY1 = 815, PK = 535 / 717, PX = 81;
        const PILE = 300, SHELF = 930, COUCH = 615;
        function makePanel(y0, id) {
          const clip = svgEl("clipPath", { id: "clip" + id }, SVG.querySelector("defs"));
          svgEl("rect", { x: 0, y: PY0, width: PW, height: PY1 - PY0 }, clip);
          const g = svgEl("g", { transform: `translate(${PX} ${y0}) scale(${PK}) translate(0 ${-PY0})` }, SVG);
          const inner = svgEl("g", { "clip-path": `url(#clip${id})` }, g);
          svgEl("rect", { x: 0, y: PY0, width: PW, height: PY1 - PY0, fill: "url(#panelBg)" }, inner);
          const beams = svgEl("g", {}, inner);
          for (const bx of [300, 1000]) svgEl("polygon", { points: `${bx - 50},${PY0} ${bx + 50},${PY0} ${bx + 150},${FL} ${bx - 150},${FL}`, fill: "url(#beam)", filter: "url(#soft)", opacity: 0.3 }, beams);
          svgEl("rect", { x: 0, y: FL, width: PW, height: PY1 - FL, fill: "url(#ground)" }, inner);
          svgEl("rect", { x: 0, y: FL - 2, width: PW, height: 3, fill: "#8a8172" }, inner);
          // shelf
          for (const y of [FL - 8, FL - 118, FL - 228]) svgEl("rect", { x: SHELF - 20, y, width: 260, height: 12, fill: "#6b4f36", stroke: "#000", "stroke-width": 4 }, inner);
          for (const x of [SHELF - 20, SHELF + 228]) svgEl("rect", { x, y: FL - 240, width: 12, height: 240, fill: "#5a4330", stroke: "#000", "stroke-width": 4 }, inner);
          // couch
          svgEl("rect", { x: COUCH - 110, y: FL - 120, width: 220, height: 70, rx: 18, fill: "#4a4f6a", stroke: "#000", "stroke-width": 5 }, inner);
          svgEl("rect", { x: COUCH - 120, y: FL - 64, width: 240, height: 50, rx: 12, fill: "#5a6080", stroke: "#000", "stroke-width": 5 }, inner);
          for (const x of [COUCH - 130, COUCH + 106]) svgEl("rect", { x, y: FL - 90, width: 24, height: 80, rx: 10, fill: "#4a4f6a", stroke: "#000", "stroke-width": 5 }, inner);
          for (const x of [COUCH - 106, COUCH + 96]) svgEl("rect", { x, y: FL - 16, width: 10, height: 16, fill: "#222", stroke: "#000", "stroke-width": 3 }, inner);
          const boxes = svgEl("g", {}, inner);
          const figs = svgEl("g", {}, inner);
          const fx = svgEl("g", {}, inner);
          svgEl("rect", { x: 0, y: PY0, width: PW, height: PY1 - PY0, fill: "none", stroke: "#2c2c30", "stroke-width": 5 }, g);
          return { beams, boxes, figs, fx };
        }
        const top = makePanel(412, "T");
        const bot = makePanel(1010, "B");

        // ---------- the boxes: start stacked in a pile, end up on the shelf ----------
        const LABELS = ["DISHES", "LAUNDRY", "BILLS", "DINNER"], BCOL = ["#c9a46a", "#b8946a", "#c2a06e", "#b48c5e"];
        const BW = 116, BH = 80;
        const PILE_AT = (i) => [PILE + (i % 2 ? 8 : -6), FL - i * BH];          // bottom-centre of box i in the pile (3 on top)
        const SHELF_AT = (i) => [SHELF + 47 + (i % 2) * 126, FL - 8 - (i < 2 ? 110 : 0)];
        function makeBoxes(panel) {
          return LABELS.map((l, i) => {
            const g = svgEl("g", {}, panel.boxes);
            svgEl("rect", { x: -BW / 2, y: -BH, width: BW, height: BH, rx: 4, fill: BCOL[i], stroke: "#000", "stroke-width": 5 }, g);
            svgEl("line", { x1: -BW / 2, y1: -BH + 14, x2: BW / 2, y2: -BH + 14, stroke: "#8a6a40", "stroke-width": 3 }, g);
            const tx = svgEl("text", { x: 0, y: -22, "font-family": "HFMono, monospace", "font-weight": 700, "font-size": 21, fill: "#2a1e10", "text-anchor": "middle" }, g);
            tx.textContent = l;
            return g;
          });
        }
        const tBoxes = makeBoxes(top), bBoxes = makeBoxes(bot);

        // ---------- poses ----------
        function feetOn(x0, hx, ST, lift) {
          const p = (hx - x0) / ST;
          return [0, 0.5].map((o) => {
            const q = frac(Math.abs(p) + o + 1e-6), d = Math.sign(hx - x0) || 1;
            if (q < 0.5) return [hx + d * ST * (0.25 - q), FL];
            const ss = (q - 0.5) / 0.5;
            return [hx + d * ST * (-0.25 + 0.5 * ease(ss)), FL - Math.sin(Math.PI * ss) * lift];
          });
        }
        const walking = (x0, x, ST = 120, lift = 14) => {
          const ft = feetOn(x0, x, ST, lift), sw = Math.sin((Math.PI * 2 * (x - x0)) / ST);
          return base({ hx: x, hy: stand + 3 + 3 * Math.abs(sw), torso: 4, head: 4, ax: ft[0][0], ay: ft[0][1], bx: ft[1][0], by: ft[1][1], ash: 8 + 30 * sw, ael: 20, bsh: -4 - 30 * sw, bel: 20 });
        };
        const reachTo = (s, k, p, hand = "a") => { s[hand + "w"] = Math.max(s[hand + "w"], k); s[hand + "tx"] = lerp(s[hand + "tx"], p[0], k); s[hand + "ty"] = lerp(s[hand + "ty"], p[1], k); return s; };
        const hold = (s, a, b, r = 0.2) => win(s, a, a + r) * (1 - win(s, b - r, b));
        const bend = (x, f, k) => { const s = standOn(x, f, FL); s.hy += 40 * k; s.torso = 3 + 60 * k; s.head = 16 * k; s.ax += f * 6 * k; s.bx -= f * 14 * k; return s; };
        const couchSit = (x, f) => base({ hx: x, hy: FL - 70, torso: -6, head: 0, ax: x + f * 70, ay: FL, bx: x + f * 56, by: FL, aw: 1, atx: x + f * 46, aty: FL - 150, bw: 1, btx: x + f * 38, bty: FL - 144 });

        // one carrying trip: pick up n boxes at the pile, walk to the shelf, put them up, walk back
        // returns pose, facing, and where the carried boxes are (null when not carrying)
        function trip(t, t0, n, W, heavy) {
          const PK0 = 0.45 + 0.15 * heavy, PL = 0.5 + 0.15 * heavy;
          const p = t - t0, f = 1;
          const carryY = stand - 104 + 18 * heavy;
          const carry = (s) => { s.torso = 4 + 14 * heavy; s.head = 6 + 10 * heavy; reachTo(s, 1, [s.hx + 40, carryY]); reachTo(s, 1, [s.hx + 26, carryY + 6], "b"); s.hy += 8 * heavy; return s; };
          if (p < PK0) { const k = Math.sin(Math.PI * clamp(p / PK0, 0, 1)); const s = bend(PILE - 70, 1, k); reachTo(s, k, [PILE - 40, FL - 40], "a"); return { pose: s, f, carry: p > PK0 * 0.5 ? 1 : 0, box: [PILE - 30, carryY + 40] }; }
          if (p < PK0 + W) { const x = lerp(PILE - 70, SHELF - 90, ease((p - PK0) / W)); const s = carry(walking(PILE - 70, x, 110 - 20 * heavy, 12 - 6 * heavy)); return { pose: s, f, carry: 1, box: [x + 46, carryY + 34] }; }
          if (p < PK0 + W + PL) { const q = (p - PK0 - W) / PL, k = Math.sin(Math.PI * q); const s = carry(standOn(SHELF - 90, 1, FL)); reachTo(s, k, [SHELF - 10, FL - 200], "a"); reachTo(s, k, [SHELF - 20, FL - 196], "b"); return { pose: s, f, carry: q < 0.5 ? 1 : 0, box: [s.atx + 30, s.aty + 40], q }; }
          const x = lerp(SHELF - 90, PILE - 70, ease((p - PK0 - W - PL) / W)), s = walking(SHELF - 90, x, 120, 12);
          if (heavy) { s.torso += 16 * heavy; s.head += 14 * heavy; s.hy += 6 * heavy; }
          return { pose: s, f: -1, carry: 0 };
        }
        const tripLen = (W, heavy) => 0.45 + 0.15 * heavy + W + 0.5 + 0.15 * heavy + W;

        // ---------- people ----------
        const redSpot = svgEl("polygon", { points: `${COUCH - 56},${PY0} ${COUCH + 56},${PY0} ${COUCH + 150},${FL} ${COUCH - 150},${FL}`, fill: "url(#redBeam)", filter: "url(#soft)", opacity: 0 }, top.beams);
        const tBun = svgEl("circle", { r: 15, fill: "#fff", stroke: "#000", "stroke-width": 6 }, top.figs);
        const tHer = makeFig(top.figs, "#ffffff", "#e2e2e2", true, "tHer");
        top.figs.insertBefore(tBun, tHer.g);
        const tHim = makeFig(top.figs, "#ffffff", "#dedede", true, "tHim");
        const heartGlow = svgEl("circle", { r: 70, fill: "url(#redGlow)", opacity: 0 }, top.fx);
        const heart = svgEl("path", { d: "M0 18 C-40 -8 -30 -40 0 -22 C30 -40 40 -8 0 18 Z", fill: "#ff3b30", stroke: "#000", "stroke-width": 4, opacity: 0 }, top.fx);
        const bBun = svgEl("circle", { r: 15, fill: "#8e8e8e", stroke: "#000", "stroke-width": 6 }, bot.figs);
        const bHer = makeFig(bot.figs, "#9a9a9a", "#7e7e7e", false, "bHer");
        bot.figs.insertBefore(bBun, bHer.g);
        const bHim = makeFig(bot.figs, "#8e8e8e", "#767676", false, "bHim");
        const phoneGlow = svgEl("circle", { r: 78, fill: "url(#phoneGlow)" }, bot.fx);
        const phone = svgEl("rect", { x: -9, y: -15, width: 18, height: 30, rx: 4, fill: "#bfe0ff", stroke: "#000", "stroke-width": 4 }, bot.fx);
        const sweat = Array.from({ length: 3 }, () => svgEl("path", { d: "M0 -8 Q6 2 0 6 Q-6 2 0 -8 Z", fill: "#9fd0ff", stroke: "#000", "stroke-width": 2, opacity: 0 }, bot.fx));

        // ---------- beats ----------
        const TW = 1.25;                                   // top: each carries 2 boxes, one per trip
        const TS = [0.4, 0.4 + tripLen(TW, 0)], TM = [0.8, 0.8 + tripLen(TW, 0)];
        const T_TOP_DONE_S = TS[1] + 0.45 + TW + 0.5, T_TOP_DONE_M = TM[1] + 0.45 + TW + 0.5;
        const T_SIT = 7.55, T_HOLD = 8.2, SITL = COUCH - 40, SITR = COUCH + 40;
        const BWK = 1.55;                                  // bottom: she carries 2 boxes per trip, heavy and slow
        const BS = [0.5, 0.5 + tripLen(BWK, 1)];
        const T_BOT_DONE = BS[1] + 0.6 + BWK + 0.65;
        const T_REACH = 8.35, T_AWAY = 8.85, T_SLUMP = 9.3;
        // which trip carries which boxes (top of the pile first)
        const TOPCARRY = [[3, TS[0]], [2, TM[0]], [1, TS[1]], [0, TM[1]]];
        const BOTCARRY = [[[3, 2], BS[0]], [[1, 0], BS[1]]];

        function topWorker(t, starts, done, sitX, f0) {
          for (let k = 0; k < 2; k++) {
            const t0 = starts[k], len = k === 0 ? tripLen(TW, 0) : 0.45 + TW + 0.5;
            if (t >= t0 && t < t0 + len) return trip(t, t0, 1, TW, 0);
          }
          if (t < starts[0]) return { pose: standOn(PILE - 70 - (f0 < 0 ? 0 : 0), 1, FL), f: 1, carry: 0 };
          if (t < T_SIT) { const x = lerp(SHELF - 90, sitX, ease((t - done) / (T_SIT - done))); const s = walking(SHELF - 90, x); return { pose: s, f: -1, carry: 0 }; }
          const s = couchSit(sitX, sitX < COUCH ? 1 : -1);
          const k = win(t, T_SIT, T_SIT + 0.5);
          return { pose: mixPose(standOn(sitX, -1, FL), s, k), f: sitX < COUCH ? 1 : -1, carry: 0, sit: k };
        }
        const topHer = (t) => { const r = topWorker(t, TS, T_TOP_DONE_S, SITL, 1); if (t > T_HOLD - 0.4) { r.pose.torso = lerp(r.pose.torso, 22, win(t, T_HOLD - 0.4, T_HOLD)); r.pose.head = lerp(r.pose.head, 14, win(t, T_HOLD - 0.4, T_HOLD)); reachTo(r.pose, win(t, T_HOLD - 0.4, T_HOLD), [SITR - 10, FL - 170]); } return r; };
        const topHim = (t) => { const r = topWorker(t, TM, T_TOP_DONE_M, SITR, -1); if (t > T_HOLD - 0.4) reachTo(r.pose, win(t, T_HOLD - 0.4, T_HOLD), [SITL + 10, FL - 196]); return r; };

        function botHer(t) {
          for (let k = 0; k < 2; k++) {
            const t0 = BS[k], len = k === 0 ? tripLen(BWK, 1) : 0.6 + BWK + 0.65;
            if (t >= t0 && t < t0 + len) return trip(t, t0, 2, BWK, 1);
          }
          if (t < BS[0]) return { pose: standOn(PILE - 70, 1, FL), f: 1, carry: 0 };
          // drags herself back toward the couch, bent
          const X1 = COUCH + 200;
          if (t < T_REACH + 0.1) { const x = lerp(SHELF - 90, X1, ease((t - T_BOT_DONE) / (T_REACH + 0.1 - T_BOT_DONE))); const s = walking(SHELF - 90, x, 90, 6); s.torso = 26; s.head = 22; s.hy += 10; return { pose: s, f: -1, carry: 0 }; }
          const s = standOn(X1, -1, FL); s.torso = 26; s.head = 22; s.hy += 10;
          // pulls away from his hand
          const away = win(t, T_AWAY, T_AWAY + 0.3);
          s.torso -= 30 * away; s.hx += 24 * away; s.head -= 8 * away;
          reachTo(s, away * (1 - win(t, T_SLUMP, T_SLUMP + 0.3)), [X1 - 40, stand - 150]);
          // slides down to the floor, back against nothing, head down
          const sl = win(t, T_SLUMP, T_SLUMP + 0.7);
          const sit = base({ hx: X1 + 30, hy: FL - 28, torso: 24, head: 34, ax: X1 + 30 - 88, ay: FL, bx: X1 + 30 - 74, by: FL, aw: 1, atx: X1 + 30 - 80, aty: FL - 80, bw: 1, btx: X1 + 30 - 70, bty: FL - 74 });
          sit.torso += 2 * Math.sin(t * 2.4);
          return { pose: mixPose(s, sit, sl), f: -1, carry: 0 };
        }
        function botHim(t) {
          const sit = couchSit(COUCH - 20, 1);
          sit.head = 30 + 2 * Math.sin(t * 1.3); sit.torso = 6;
          sit.atx = COUCH - 20 + 44; sit.aty = FL - 160; sit.btx = COUCH - 20 + 36; sit.bty = FL - 154;
          sit.atx += 3 * Math.sin(t * 7) * (frac(t * 0.6) < 0.3 ? 1 : 0);
          if (t < T_REACH - 0.5) return sit;
          // gets up and reaches for her (finally wants closeness)
          const st = standOn(COUCH + 50, 1, FL); st.head = 4;
          const r = win(t, T_REACH, T_REACH + 0.35) * (1 - 0.7 * win(t, T_AWAY + 0.2, T_AWAY + 0.6));
          reachTo(st, r, [COUCH + 200 - 20, stand - 120]);
          if (t > T_AWAY + 0.3) { st.head = 4 + 18 * win(t, T_AWAY + 0.3, T_AWAY + 0.8); }
          return mixPose(sit, st, win(t, T_REACH - 0.5, T_REACH - 0.05));
        }

        // ---------- labels (typed) ----------
        const label = (x, y, size, col) => { const d = document.createElement("div"); d.className = "mono"; d.style.cssText = `left:${x}px;top:${y}px;font-size:${size}px;letter-spacing:0.16em;color:${col}`; E("stage").appendChild(d); return d; };
        const topT = label(PX + 44, 412 + 26, 30, "#ffffff"), topS = label(PX + 44, 412 + 66, 19, "#c8c8c8");
        const botT = label(PX + 44, 1010 + 26, 30, "#a8a8a8"), botS = label(PX + 44, 1010 + 66, 19, "#a8a8a8");
        topT.textContent = "BOTH CARRY"; botT.textContent = "ONE CARRIES";
        topT.style.textShadow = "0 0 12px rgba(255,255,255,0.35)";
        const typed = (seq, t, cps = 16) => { let cur = null; for (const s of seq) if (t >= s[0]) cur = s; if (!cur) return ["", "#c8c8c8"]; const n = Math.floor((t - cur[0]) * cps); return [cur[1].slice(0, n), cur[2] || null]; };
        const TOPSEQ = [[0.45, "BOX BY BOX"], [T_SIT, "DONE TOGETHER"], [T_HOLD, "CLOSE"]];
        const BOTSEQ = [[0.5, "SHE CARRIES IT"], [1.9, "HE SCROLLS"], [5.2, "ALL OF IT", "#ff3b30"], [T_AWAY, "TOO TIRED", "#ff3b30"]];
        const HEAD = [[0, "LOVE IS A TEAM."], [10.6, "SHE'S NOT COLD."], [11.3, "SHE'S EXHAUSTED."]];
        E("head").style.top = "236px";
        E("head").style.fontSize = "30px";
        E("head").style.letterSpacing = "0.16em";
        E("head").style.lineHeight = "1.6";

        // ---------- end card ----------
        const T_CARD = 12.7;
        const dim = document.createElement("div");
        dim.style.cssText = "position:absolute;inset:0;background:#000;opacity:0";
        E("stage").appendChild(dim);
        const card = document.createElement("div");
        card.id = "card";
        card.style.cssText = "position:absolute;left:100px;right:100px;top:640px;text-align:center;font-family:HFMono,monospace;font-weight:700;color:#fff;letter-spacing:0.08em";
        card.innerHTML = `<div id="cm1" style="font-size:60px;line-height:1.25;text-shadow:0 0 18px rgba(255,255,255,0.35)"></div>
          <div id="cm2" style="font-size:40px;line-height:1.35;margin-top:26px;text-shadow:0 0 14px rgba(255,255,255,0.25)"></div>
          <div id="cq" style="opacity:0;margin-top:120px;font-size:30px;line-height:1.5;color:#bdbdbd;letter-spacing:0.05em">"ALONE WE CAN DO SO LITTLE;<br/>TOGETHER WE CAN DO SO MUCH."<div style="margin-top:22px;font-size:24px;color:#8a8a8a;letter-spacing:0.2em">HELEN KELLER</div></div>`;
        const cardCss = document.createElement("style");
        cardCss.textContent = "#card span.w { display: inline-block; margin: 0 0.16em; }";
        document.head.appendChild(cardCss);
        E("stage").appendChild(card);
        const slam = (words, times, t, red) => words.map((w, i) => {
          const q = clamp((t - times[i]) / 0.2, 0, 1);
          if (q <= 0) return `<span class="w" style="opacity:0">${w}</span>`;
          const sc = lerp(2.3, 1, backOut(q)), bl = (1 - q) * 6;
          return `<span class="w" style="transform:scale(${sc.toFixed(3)});filter:blur(${bl.toFixed(1)}px);${red.includes(i) ? "color:#ff3b30;" : ""}">${w}</span>`;
        }).join("");
        const fade = document.createElement("div");
        fade.style.cssText = "position:absolute;inset:0;background:#000;opacity:0";
        E("stage").appendChild(fade);

        // place a box: in the pile, carried (stacked on top of each other), or on the shelf
        function placeBoxes(els, t, plan, carriedBy) {
          els.forEach((g, i) => {
            let pos = PILE_AT(i), rot = 0;
            for (const [who, t0] of plan) {
              const list = Array.isArray(who) ? who : [who];
              const j = list.indexOf(i);
              if (j < 0 || t < t0) continue;
              const r = carriedBy(t0, t);
              if (r && r.inTrip && r.carry) { pos = [r.box[0], r.box[1] - j * (BH - 4)]; rot = 3 * Math.sin(t * 5 + i); }
              else if (r && r.inTrip && !r.carry && r.picked === false) pos = PILE_AT(i);
              else if (!r || !r.inTrip || r.placed) pos = SHELF_AT(i);
            }
            g.setAttribute("transform", `translate(${r1(pos[0])} ${r1(pos[1])}) rotate(${r1(rot)})`);
          });
        }

        // ---------- per-frame render ----------
        function render(t) {
          // top panel
          const rh = topHer(t), rm = topHim(t);
          const hp = drawFig(tHer, livePose((x) => topHer(x).pose, t, 0.4), rh.f);
          const mp = drawFig(tHim, livePose((x) => topHim(x).pose, t, 1.3), rm.f);
          tBun.setAttribute("cx", r1(hp.head[0] - rh.f * 25)); tBun.setAttribute("cy", r1(hp.head[1] - 16));
          placeBoxes(tBoxes, t, TOPCARRY.map(([b, t0]) => [b, t0]), (t0, tt) => {
            const isHer = TS.includes(t0), len = (t0 === TS[1] || t0 === TM[1]) ? 0.45 + TW + 0.5 : tripLen(TW, 0);
            if (tt > t0 + len) return null;
            const r = trip(tt, t0, 1, TW, 0), fp = isHer ? hp : mp;
            const p = tt - t0, picked = p > 0.22, placed = p > 0.45 + TW + 0.25;
            const box = [(fp.hands[0][0] + fp.hands[1][0]) / 2 + 8, (fp.hands[0][1] + fp.hands[1][1]) / 2 + 36];
            return { inTrip: true, carry: picked && !placed, picked, placed, box };
          });
          const hq = clamp((t - T_HOLD) / 0.35, 0, 1), beat = 1 + 0.08 * Math.max(0, Math.sin(t * 7)) * (t > T_HOLD + 0.4 ? 1 : 0);
          const hc = [(hp.head[0] + mp.head[0]) / 2, Math.min(hp.head[1], mp.head[1]) - 90];
          heart.setAttribute("opacity", t > T_HOLD ? 1 : 0);
          heart.setAttribute("transform", `translate(${r1(hc[0])} ${r1(hc[1])}) scale(${(backOut(hq) * 0.9 * beat).toFixed(3)})`);
          heartGlow.setAttribute("cx", r1(hc[0])); heartGlow.setAttribute("cy", r1(hc[1] - 4));
          heartGlow.setAttribute("opacity", (0.9 * hq).toFixed(3));
          redSpot.setAttribute("opacity", (0.5 * win(t, T_HOLD, T_HOLD + 0.5)).toFixed(3));

          // bottom panel
          const rb = botHer(t);
          const sp = drawFig(bHer, livePose((x) => botHer(x).pose, t, 0.9), rb.f);
          const bp = drawFig(bHim, livePose(botHim, t, 2.0), 1);
          bBun.setAttribute("cx", r1(sp.head[0] - rb.f * 25)); bBun.setAttribute("cy", r1(sp.head[1] - 16));
          placeBoxes(bBoxes, t, BOTCARRY, (t0, tt) => {
            const len = t0 === BS[1] ? 0.6 + BWK + 0.65 : tripLen(BWK, 1);
            if (tt > t0 + len) return null;
            const p = tt - t0, picked = p > 0.3, placed = p > 0.6 + BWK + 0.32;
            const box = [(sp.hands[0][0] + sp.hands[1][0]) / 2 + 8, (sp.hands[0][1] + sp.hands[1][1]) / 2 + 36];
            return { inTrip: true, carry: picked && !placed, picked, placed, box };
          });
          const onCouch = t < T_REACH - 0.3;
          const ph = [(bp.hands[0][0] + bp.hands[1][0]) / 2, (bp.hands[0][1] + bp.hands[1][1]) / 2];
          phone.setAttribute("transform", `translate(${r1(ph[0] + 6)} ${r1(ph[1] - 6)})`);
          phoneGlow.setAttribute("cx", r1(ph[0] + 6)); phoneGlow.setAttribute("cy", r1(ph[1] - 10));
          phoneGlow.setAttribute("opacity", (onCouch && t > 0.45 ? 0.85 + 0.15 * Math.sin(t * 5) : 0).toFixed(3));
          phone.setAttribute("opacity", onCouch && t > 0.45 ? 1 : 0);
          // sweat drops on the second, heavy trip
          sweat.forEach((d, i) => {
            const q = frac(t * 0.9 + i / 3), on = t > 4.5 && t < T_SLUMP + 1.2;
            d.setAttribute("transform", `translate(${r1(sp.head[0] + (i - 1) * 22)} ${r1(sp.head[1] - 20 + 50 * q)})`);
            d.setAttribute("opacity", on ? Math.sin(Math.PI * q).toFixed(3) : 0);
          });

          // labels and headline
          topS.textContent = typed(TOPSEQ, t)[0];
          const [bs, bc] = typed(BOTSEQ, t);
          botS.textContent = bs; botS.style.color = bc || "#a8a8a8";
          E("head").innerHTML = HEAD.map(([t0, s], i) => `<div>${i === 0 ? s : s.slice(0, Math.max(0, Math.floor((t - t0) * 30)))}&nbsp;</div>`).join("");

          // end card
          dim.style.opacity = (0.8 * win(t, T_CARD - 0.4, T_CARD)).toFixed(3);
          E("cm1").innerHTML = slam(["SHARE", "THE", "LOAD."], [T_CARD, T_CARD + 0.15, T_CARD + 0.3], t, []);
          E("cm2").innerHTML = slam(["LOVE", "NEEDS", "ENERGY", "TOO."], [T_CARD + 0.7, T_CARD + 0.84, T_CARD + 0.98, T_CARD + 1.12], t, [2]);
          E("cq").style.opacity = win(t, T_CARD + 1.6, T_CARD + 2.1).toFixed(3);
          fade.style.opacity = win(t, DUR - 0.3, DUR - 0.02).toFixed(3);
        }

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
        window.__timelines["main"] = tl;
        render(0);
        tl.seek(0);
      })();
    </script>
  </body>
</html>
