    <style>
      @font-face {
        font-family: "HFMono";
        src: url("assets/fonts/consolab.ttf") format("truetype");
        font-weight: 700;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      #stage svg {
        position: absolute;
        inset: 0;
      }
      .mono {
        position: absolute;
        font-family: "HFMono", monospace;
        font-weight: 700;
        white-space: nowrap;
      }
      /* everything readable stays inside the Instagram safe area: x 120-960, y 220-1500 */
      #head {
        position: absolute;
        left: 0;
        right: 0;
        top: 222px;
        text-align: center;
        font-family: "HFMono", monospace;
        font-weight: 700;
        font-size: 38px;
        letter-spacing: 0.12em;

        color: #fff;

      #head .ghost {
        visibility: hidden;

      #ctr {
        position: absolute;
        left: 0;
        right: 0;

      #num {

        min-width: 2.4ch;

        color: #fff;
        vertical-align: middle;
        text-shadow: 0 0 14px rgba(255, 255, 255, 0.35);
      }
      #tag {
        display: inline-block;
        min-width: 5.2ch;
        padding: 6px 12px 4px;
        font-size: 26px;
        letter-spacing: 0.18em;
        vertical-align: middle;
        visibility: hidden;
      }
      #tag.fail {
        visibility: visible;
        background: #d62a2a;
        color: #fff;
      }
      #tag.pass {
        visibility: visible;
        background: #fff;
        color: #000;
        box-shadow: 0 0 22px rgba(255, 255, 255, 0.6);
      }

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="18" data-track-index="0">
        <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
              <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.12" />

            </linearGradient>
            <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.32" />

            </radialGradient>
            <radialGradient id="dustG" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#b5b5b5" stop-opacity="0.8" />

            <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">

            <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">

            </filter>
                      <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#0c0c0e" />
              <stop offset="1" stop-color="#111318" />

            <linearGradient id="abyss" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#05070a" />
              <stop offset="1" stop-color="#1c2433" />
            </linearGradient>
            <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ddd6c6" />
              <stop offset="1" stop-color="#a39a88" />
            </linearGradient>
            <linearGradient id="redBeam" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ff4a4a" stop-opacity="0.75" />
              <stop offset="0.7" stop-color="#ff6a6a" stop-opacity="0.2" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0.08" />
            </linearGradient>
            <radialGradient id="redGlow" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#ff3b30" stop-opacity="0.7" />
              <stop offset="1" stop-color="#ff3b30" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="phoneGlow" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#6aa8ff" stop-opacity="0.75" />
              <stop offset="0.5" stop-color="#4f8cff" stop-opacity="0.28" />
              <stop offset="1" stop-color="#4f8cff" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#6e665a" />

            </linearGradient>
            <radialGradient id="fireGlow" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#ffb347" stop-opacity="0.75" />
              <stop offset="0.4" stop-color="#ff7a1a" stop-opacity="0.28" />
              <stop offset="1" stop-color="#ff5a00" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="brickT" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#d0704a" />

            </linearGradient>
            <linearGradient id="brickB" x1="0" y1="0" x2="0" y2="1">

            <linearGradient id="roofT" x1="0" y1="0" x2="0" y2="1">

            </linearGradient>
            <radialGradient id="winGlow" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#ffd27a" stop-opacity="0.8" />
              <stop offset="0.5" stop-color="#ffb347" stop-opacity="0.25" />

            </radialGradient>
            <linearGradient id="fabT" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f2ead8" />

            </linearGradient>
            <linearGradient id="fabB" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#9a958a" />

            </linearGradient>
          </defs>
          <!-- world: floor at world y 600 -> screen y 1400, world x 400 -> screen x 540 -->
          <g transform="translate(540 1400) scale(1.45) translate(-400 -600)">
            <g id="beams"></g>
            <g id="back"></g>
            
            <use href="#world" transform="translate(0 1200) scale(1 -1)" opacity="0.16" />
            <rect x="-200" y="600" width="1200" height="260" fill="url(#floorFade)" />
            <rect x="-600" y="858" width="2000" height="1400" fill="#000" />

        <style>
  #fx { position: absolute; inset: 0; pointer-events: none; }
</style>
        <div id="head">
          <div id="h1"></div>

    <script>
      (function () {
        const DUR = 18;
        const FL = 600, BX0 = 380, BX1 = 520, BTOP = 410, TOPF = 404, SX = 250;
        const THIGH = 80, SHIN = 78, LEG = 154;
        const UARM = 64, FARM = 60, TORSO = 116, NECK = 12, HEADR = 31;
        const NS = "http://www.w3.org/2000/svg";
        const svgEl = (tag, attrs, parent) => {
          const e = document.createElementNS(NS, tag);
          for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(e);
          return e;
        };
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, p) => a + (b - a) * p;
        const ease = (p) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(p, 0, 1));
        const backOut = (p) => { p = clamp(p, 0, 1); const s = 2.2; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
        const win = (t, a, b) => ease((t - a) / (b - a));
        const rad = (x) => (x * Math.PI) / 180;
        const down = (a, f) => [Math.sin(rad(a)) * f, Math.cos(rad(a))];
        const up = (a, f) => [Math.sin(rad(a)) * f, -Math.cos(rad(a))];
        const r1 = (v) => Math.round(v * 10) / 10;
        const E = (id) => document.getElementById(id);
        let seed = 31;
        const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

        // ---------- rig v2 (from reel 05): blended poses, head/arm follow-through, breathing ----------
        function makeFig(parent, front, back, glow, id) {
          const g = svgEl("g", { id }, parent);
          if (glow) parent.insertBefore(svgEl("use", { href: "#" + id, filter: "url(#blur)", opacity: 0.45 }), g);
          const parts = { g };
          for (const [n, col] of [["armB", back], ["legB", back], ["torso", front], ["legF", front], ["armF", front]]) {
            const o = svgEl("path", { fill: "none", stroke: "#000", "stroke-width": 34, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            const w = svgEl("path", { fill: "none", stroke: col, "stroke-width": 22, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            parts[n] = [o, w];
          }
          parts.head = svgEl("circle", { r: HEADR, fill: front, stroke: "#000", "stroke-width": 6 }, g);
          return parts;
        }
        function ik(a, b, l1, l2, pick) {
          let dx = b[0] - a[0], dy = b[1] - a[1];
          let d = Math.hypot(dx, dy);
          const maxd = l1 + l2 - 0.5;
          if (d > maxd) {
            b = [a[0] + (dx / d) * maxd, a[1] + (dy / d) * maxd];
            dx = b[0] - a[0];
            dy = b[1] - a[1];
            d = maxd;
          }
          d = Math.max(d, Math.abs(l1 - l2) + 1);
          const al = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
          const base = Math.atan2(dy, dx);
          const c1 = [a[0] + Math.cos(base + al) * l1, a[1] + Math.sin(base + al) * l1];
          const c2 = [a[0] + Math.cos(base - al) * l1, a[1] + Math.sin(base - al) * l1];
          return [pick(c1, c2), b];
        }
        const P = (pts) => "M" + pts.map((p) => r1(p[0]) + " " + r1(p[1])).join("L");
        const setD = (pair, d) => {
          pair[0].setAttribute("d", d);
          pair[1].setAttribute("d", d);
        };
        // flat pose: hx hy torso head ax ay bx by | per arm a*/b*: sh el w tx ty
        function drawFig(parts, s, f) {
          const hip = [s.hx, s.hy];
          const tu = up(s.torso, f);
          const sh = [hip[0] + tu[0] * TORSO, hip[1] + tu[1] * TORSO];
          const nk = [hip[0] + tu[0] * (TORSO + NECK), hip[1] + tu[1] * (TORSO + NECK)];
          const hu = up(s.torso + s.head, f);
          const hc = [nk[0] + hu[0] * HEADR, nk[1] + hu[1] * HEADR];
          setD(parts.torso, P([hip, sh, nk]));
          parts.head.setAttribute("cx", r1(hc[0]));
          parts.head.setAttribute("cy", r1(hc[1]));
          const knee = (c1, c2) => (c1[0] * f > c2[0] * f ? c1 : c2);
          const elbow = (c1, c2) => (c1[1] - 0.5 * f * c1[0] > c2[1] - 0.5 * f * c2[0] ? c1 : c2);
          [["legF", [s.ax, s.ay]], ["legB", [s.bx, s.by]]].forEach(([n, ft]) => {
            const [kn, fo] = ik(hip, ft, THIGH, SHIN, knee);
            setD(parts[n], P([hip, kn, fo]));
          });
          const hands = [];
          [["armF", "a"], ["armB", "b"]].forEach(([n, k]) => {
            const u = down(s[k + "sh"], f);
            const el = [sh[0] + u[0] * UARM, sh[1] + u[1] * UARM];
            const v = down(s[k + "sh"] + s[k + "el"], f);
            const fk = [el[0] + v[0] * FARM, el[1] + v[1] * FARM];
            const w = clamp(s[k + "w"], 0, 1);
            const hand = [lerp(fk[0], s[k + "tx"], w), lerp(fk[1], s[k + "ty"], w)];
            const [e2, h2] = ik(sh, hand, UARM, FARM, elbow);
            setD(parts[n], P([sh, e2, h2]));
            hands.push(h2);
          });
          return { head: hc, hands, hip };
        }
        const KER = [-4, -3, -2, -1, 0, 1, 2, 3, 4].map((k) => [k * 0.03, Math.exp(-((k / 2.3) ** 2))]);
        function blend(raw, t) {
          const out = {};
          let ws = 0;
          for (const [dt, w] of KER) {
            const p = raw(clamp(t + dt, 0, DUR));
            for (const k in p) out[k] = (out[k] || 0) + p[k] * w;
            ws += w;
          }
          for (const k in out) out[k] /= ws;
          return out;
        }
        const LAGGED = ["head", "ash", "ael", "aw", "atx", "aty", "bsh", "bel", "bw", "btx", "bty"];
        function livePose(raw, t, phase) {
          const s = blend(raw, t);
          const lag = blend(raw, t - 0.05);
          for (const k of LAGGED) s[k] = lag[k];
          const br = Math.sin(t * 1.9 + phase);
          s.hy += br * 1.3;
          s.torso += br * 0.8;
          s.head += Math.sin(t * 1.2 + phase * 2) * 1.6;
          return s;
        }
        const ARMS = { ash: 8, ael: 12, aw: 0, atx: 0, aty: 0, bsh: -4, bel: 10, bw: 0, btx: 0, bty: 0 };
        const base = (o) => ({ hx: 0, hy: 0, torso: 3, head: 0, ax: 0, ay: FL, bx: 0, by: FL, ...ARMS, ...o });
        function standOn(x, f, fy) {
          return base({ hx: x, hy: fy - Math.sqrt(LEG * LEG - 15 * 15), ax: x + f * 15, ay: fy, bx: x - f * 15, by: fy });
        }
        const mixPose = (a, b, p) => {
          const o = {};
          for (const k in a) o[k] = lerp(a[k], b[k], p);
          return o;
        };

        // ---------- "love is a hammock. #29": winner split-screen format. Two trees at dusk, a hammock between them. BOTH TIE: each ties one end to a tree, they sit in it together, it swings, she leans on him, heart. ONE TIES: he ties his end; she only holds hers in one hand and scrolls; he sits down, she lets go, he falls to the ground; she walks away. FOLLOW: a leaf "+ FOLLOW" floats down from the tree, she taps it → "FOLLOWING ✓" + leaves. ----------
        E("svg").children[1].style.display = "none";
        const SVG = E("svg");
        const sm = (t, a, b) => { const p = clamp((t - a) / (b - a), 0, 1); return p * p * (3 - 2 * p); };
        const PW = 1233, PY0 = 98, PY1 = 815, PK = 535 / 717, PX = 81;
        const G = 700, TL = 170, TR = 1060, TY = G - 310;
        const reachTo = (s, k, p, hand = "a") => { if (s[hand + "w"] < 1e-6) { s[hand + "tx"] = p[0]; s[hand + "ty"] = p[1]; s[hand + "w"] = k; return s; } s[hand + "w"] = Math.max(s[hand + "w"], k); s[hand + "tx"] = lerp(s[hand + "tx"], p[0], k); s[hand + "ty"] = lerp(s[hand + "ty"], p[1], k); return s; };
        const hold = (s, a, b, r = 0.2) => win(s, a, a + r) * (1 - win(s, b - r, b));
        const stY = G - Math.sqrt(LEG * LEG - 15 * 15);

        // ---------- beats ----------
        const T_TIE = 0.4, T_TIED = 1.6, T_GO = 2.0, T_ARR = 3.2, T_SIT = 3.4, T_SAT = 4.0, T_LEAN = 5.0, T_HEART = 6.8;
        const T_BTIED = 1.6, T_BGO = 2.0, T_BARR = 3.4, T_LOOK = 3.6, T_BSIT = 4.4, T_BSAT = 5.0, T_LET = 6.2, T_FALL = 6.45, T_WALK = 7.6, T_GONE = 9.4;
        const T_H2 = 9.6, T_H3 = 10.8;
        const T_CTA = 12.6, T_TAG = 13.0, T_TAP = 14.9;
        const HERX0 = TL + 80, HIMX0 = TR - 80, SHE = 525, HE = 735, BHE = 640;

        function makePanel(y0, id) {
          const clip = svgEl("clipPath", { id: "clip" + id }, SVG.querySelector("defs"));
          svgEl("rect", { x: 0, y: PY0, width: PW, height: PY1 - PY0 }, clip);
          const g = svgEl("g", { transform: `translate(${PX} ${y0}) scale(${PK}) translate(0 ${-PY0})` }, SVG);
          const inner = svgEl("g", { "clip-path": `url(#clip${id})` }, g);
          svgEl("rect", { x: 0, y: PY0, width: PW, height: PY1 - PY0, fill: "url(#panelBg)" }, inner);
          svgEl("circle", { cx: 616, cy: 190, r: 40, fill: "#e8e4d8", stroke: "#000", "stroke-width": 4, opacity: 0.8 }, inner);
          for (let i = 0; i < 16; i++) svgEl("ellipse", { cx: 40 + i * 80, cy: G - 30, rx: 70, ry: 40 + ((i * 37) % 40), fill: "#12161c" }, inner);
          const beams = svgEl("g", {}, inner);
          svgEl("rect", { x: 0, y: G, width: PW, height: PY1 - G, fill: "#1a1e22" }, inner);
          svgEl("path", { d: `M0 ${G} L${PW} ${G}`, stroke: "#000", "stroke-width": 6 }, inner);
          for (let i = 0; i < 30; i++) { const x = 20 + i * 41 + ((i * 17) % 13); svgEl("path", { d: `M${x} ${G} l-4 -12 M${x + 4} ${G} l3 -14 M${x + 8} ${G} l6 -10`, stroke: "#2e3a2e", "stroke-width": 3 }, inner); }
          const glow = svgEl("circle", { r: 260, fill: "url(#redGlow)", opacity: 0 }, inner);
          // trees
          const trees = svgEl("g", {}, inner);
          for (const x of [TL, TR]) {
            svgEl("path", { d: `M${x - 22} ${G} L${x - 14} ${G - 380} L${x + 14} ${G - 380} L${x + 22} ${G} Z`, fill: "#3a2e26", stroke: "#000", "stroke-width": 6 }, trees);
            svgEl("path", { d: `M${x} ${G - 330} L${x + (x < 600 ? 70 : -70)} ${G - 420}`, stroke: "#000", "stroke-width": 16, "stroke-linecap": "round" }, trees);
            svgEl("path", { d: `M${x} ${G - 330} L${x + (x < 600 ? 70 : -70)} ${G - 420}`, stroke: "#3a2e26", "stroke-width": 8, "stroke-linecap": "round" }, trees);
            for (const [dx, dy, r] of [[-60, -440, 90], [50, -470, 100], [0, -520, 90], [x < 600 ? 120 : -120, -440, 70]]) svgEl("circle", { cx: x + dx, cy: G + dy, r, fill: "#24342a", stroke: "#000", "stroke-width": 6 }, trees);
            for (const [dx, dy, r] of [[-60, -440, 90], [50, -470, 100], [0, -520, 90], [x < 600 ? 120 : -120, -440, 70]]) svgEl("circle", { cx: x + dx, cy: G + dy, r: r - 6, fill: "#2c4032" }, trees);
          }
          const ham = svgEl("g", {}, inner);
          const figs = svgEl("g", {}, inner);
          const fx = svgEl("g", {}, inner);
          const dark = svgEl("rect", { x: 0, y: PY0, width: PW, height: PY1 - PY0, fill: "#05070c", opacity: 0 }, inner);
          svgEl("rect", { x: 0, y: PY0, width: PW, height: PY1 - PY0, fill: "none", stroke: "#2c2c30", "stroke-width": 5 }, g);
          return { g, y0, beams, glow, ham, figs, fx, dark };
        }
        const top = makePanel(412, "T");
        const bot = makePanel(1010, "B");
        const mkHam = (P2, fab) => {
          const ropeL = svgEl("path", { fill: "none", stroke: "#000", "stroke-width": 9, "stroke-linecap": "round" }, P2.ham);
          const ropeL2 = svgEl("path", { fill: "none", stroke: "#d8c8a0", "stroke-width": 4, "stroke-linecap": "round" }, P2.ham);
          const ropeR = svgEl("path", { fill: "none", stroke: "#000", "stroke-width": 9, "stroke-linecap": "round" }, P2.ham);
          const ropeR2 = svgEl("path", { fill: "none", stroke: "#d8c8a0", "stroke-width": 4, "stroke-linecap": "round" }, P2.ham);
          const fabric = svgEl("path", { fill: fab, stroke: "#000", "stroke-width": 6, "stroke-linejoin": "round" }, P2.ham);
          const stripe = svgEl("path", { fill: "none", stroke: "#ff3b30", "stroke-width": 6, opacity: 0.85 }, P2.ham);
          const knotL = svgEl("circle", { r: 0, fill: "#d8c8a0", stroke: "#000", "stroke-width": 4 }, P2.ham);
          const knotR = svgEl("circle", { r: 0, fill: "#d8c8a0", stroke: "#000", "stroke-width": 4 }, P2.ham);
          return { ropeL, ropeL2, ropeR, ropeR2, fabric, stripe, knotL, knotR };
        };
        const HT = mkHam(top, "url(#fabT)"), HB = mkHam(bot, "url(#fabB)");
        HB.stripe.setAttribute("stroke", "#8a5a5a");
        // a: left rope anchor, b: right rope anchor, l/r: fabric ends, lowX/lowY: sag point
        const qp = (a, c, b, q) => [(1 - q) * (1 - q) * a[0] + 2 * q * (1 - q) * c[0] + q * q * b[0], (1 - q) * (1 - q) * a[1] + 2 * q * (1 - q) * c[1] + q * q * b[1]];
        function drawHam(H, a, l, r, b, low, kL, kR) {
          const rp = (p, q) => `M${r1(p[0])} ${r1(p[1])} L${r1(q[0])} ${r1(q[1])}`;
          H.ropeL.setAttribute("d", rp(a, l)); H.ropeL2.setAttribute("d", rp(a, l));
          H.ropeR.setAttribute("d", rp(r, b)); H.ropeR2.setAttribute("d", rp(r, b));
          const c = [2 * low[0] - (l[0] + r[0]) / 2, 2 * low[1] - (l[1] + r[1]) / 2];
          const c2 = [c[0], c[1] - 95];
          H.fabric.setAttribute("d", `M${r1(l[0])} ${r1(l[1])} Q${r1(c[0])} ${r1(c[1])} ${r1(r[0])} ${r1(r[1])} Q${r1(c2[0])} ${r1(c2[1])} ${r1(l[0])} ${r1(l[1])} Z`);
          const s1 = qp(l, c, r, 0.12), s2 = qp(l, c, r, 0.88);
          const cs = [2 * low[0] - (s1[0] + s2[0]) / 2, 2 * (low[1] - 14) - (s1[1] + s2[1]) / 2];
          H.stripe.setAttribute("d", `M${r1(s1[0])} ${r1(s1[1] - 14)} Q${r1(cs[0])} ${r1(cs[1])} ${r1(s2[0])} ${r1(s2[1] - 14)}`);
          H.knotL.setAttribute("cx", r1(a[0])); H.knotL.setAttribute("cy", r1(a[1])); H.knotL.setAttribute("r", r1(9 * kL));
          H.knotR.setAttribute("cx", r1(b[0])); H.knotR.setAttribute("cy", r1(b[1])); H.knotR.setAttribute("r", r1(9 * kR));
        }
        // FOLLOW leaf
        const leafF = svgEl("g", { opacity: 0 }, top.fx);
        const leafB = svgEl("path", { d: "M-110 0 C-70 -52 70 -52 110 0 C70 52 -70 52 -110 0 Z", fill: "#3fa45a", stroke: "#000", "stroke-width": 5 }, leafF);
        svgEl("path", { d: "M-110 0 L-140 10", stroke: "#000", "stroke-width": 6, "stroke-linecap": "round" }, leafF);
        const leafV = svgEl("path", { d: "M-100 0 L100 0", stroke: "#1f5a2e", "stroke-width": 3, opacity: 0.6 }, leafF);
        const leafT = svgEl("text", { x: 0, y: 10, "font-family": "HFMono, monospace", "font-weight": 700, "font-size": 28, fill: "#fff", "text-anchor": "middle" }, leafF);
        const minis = Array.from({ length: 12 }, () => svgEl("path", { d: "M-14 0 C-8 -8 8 -8 14 0 C8 8 -8 8 -14 0 Z", fill: "#4fc46a", stroke: "#000", "stroke-width": 2.5, opacity: 0 }, top.fx));
        const fall = Array.from({ length: 5 }, () => svgEl("path", { d: "M-10 0 C-6 -6 6 -6 10 0 C6 6 -6 6 -10 0 Z", fill: "#2f5a3a", stroke: "#000", "stroke-width": 2, opacity: 0.8 }, bot.fx));

        // ---------- poses ----------
        const walkPose = (x, f, t, t0) => { const st = standOn(x, f, G); const ph = (t - t0) * 7.5; st.ax = x + 22 * Math.sin(ph); st.bx = x - 22 * Math.sin(ph); st.ay = G - 10 * Math.max(0, Math.cos(ph)); st.by = G - 10 * Math.max(0, -Math.cos(ph)); return st; };
        const sitPose = (x, y, f) => base({ hx: x, hy: y, torso: -6, head: 2, ax: x + 70 * f, ay: y + 134, bx: x + 52 * f, by: y + 140 });
        const sway = (t) => 10 * Math.sin((t - T_SAT) * 1.7) * sm(t, T_SAT, T_SAT + 0.8);
        const lowT = (t) => G - 265 + 35 * sm(t, T_SIT, T_SAT);
        const topSheX = (t) => lerp(HERX0, SHE, sm(t, T_GO, T_ARR));
        const topHeX = (t) => lerp(HIMX0, HE, sm(t, T_GO, T_ARR));
        function topHer(t) {
          const x = topSheX(t), walking = t > T_GO && t < T_ARR;
          let st = walking ? walkPose(x, 1, t, T_GO) : standOn(x, t < T_GO ? -1 : 1, G);
          if (t >= T_ARR - 0.01) { const sk = sm(t, T_SIT, T_SAT); st = mixPose(standOn(SHE, 1, G), sitPose(SHE + sway(t), lowT(t) - 8, 1), sk); }
          const tie = hold(t, T_TIE - 0.3, T_TIED + 0.2, 0.25);
          reachTo(st, tie, [TL + 18 + 8 * Math.sin(t * 14) * win(t, T_TIE, T_TIED), TY + 6 * Math.cos(t * 14) * win(t, T_TIE, T_TIED)]);
          reachTo(st, 1 - tie, t < T_TIE ? [x - 40, stY - 40] : [x + 30, stY - 30]);
          const ln = win(t, T_LEAN, T_LEAN + 0.6); st.torso = lerp(st.torso, 20, ln); st.head = lerp(st.head, 22, ln);
          if (t > T_SAT) reachTo(st, win(t, T_SAT, T_SAT + 0.5), [st.hx + 110, st.hy - 150], "b");
          const tap = hold(t, T_TAP - 0.55, T_TAP + 0.4, 0.3); reachTo(st, tap, [SHE + 40, G - 520 + 14 * win(t, T_TAP - 0.1, T_TAP)]);
          return st;
        }
        function topHim(t) {
          const x = topHeX(t), walking = t > T_GO && t < T_ARR;
          let st = walking ? walkPose(x, -1, t, T_GO) : standOn(x, t < T_GO ? 1 : -1, G);
          if (t >= T_ARR - 0.01) { const sk = sm(t, T_SIT, T_SAT); st = mixPose(standOn(HE, -1, G), sitPose(HE + sway(t), lowT(t) - 8, -1), sk); }
          const tie = hold(t, T_TIE - 0.3, T_TIED + 0.2, 0.25);
          reachTo(st, tie, [TR - 18 + 8 * Math.sin(t * 14 + 1) * win(t, T_TIE, T_TIED), TY + 6 * Math.cos(t * 14 + 1) * win(t, T_TIE, T_TIED)]);
          reachTo(st, 1 - tie, t < T_TIE ? [x + 40, stY - 40] : [x - 30, stY - 30]);
          if (t > T_LEAN) reachTo(st, win(t, T_LEAN, T_LEAN + 0.5), [SHE + 60 + sway(t), lowT(t) - 160], "b");
          st.head = lerp(st.head, -6, win(t, T_LEAN, T_LEAN + 0.5)); st.torso = lerp(st.torso, 10, win(t, T_LEAN, T_LEAN + 0.5));
          return st;
        }
        const botSheX = (t) => lerp(HERX0, -200, sm(t, T_WALK, T_GONE));
        const fallK = (t) => sm(t, T_FALL, T_FALL + 0.35);
        const lowB = (t) => G - 265 + 35 * sm(t, T_BSIT, T_BSAT);
        function botHim(t) {
          const x = lerp(HIMX0, BHE, sm(t, T_BGO, T_BARR)), walking = t > T_BGO && t < T_BARR;
          let st = walking ? walkPose(x, -1, t, T_BGO) : standOn(x, t < T_BGO ? 1 : -1, G);
          if (t >= T_BARR - 0.01) {
            const sk = sm(t, T_BSIT, T_BSAT); st = mixPose(standOn(BHE, -1, G), sitPose(BHE, lowB(t) - 8, -1), sk);
            const fk = fallK(t);
            if (fk > 0) st = mixPose(st, base({ hx: BHE - 20, hy: G - 36, torso: -24, head: 30, ax: BHE - 160, ay: G, bx: BHE - 140, by: G - 6 }), fk);
          }
          const tie = hold(t, T_TIE - 0.3, T_BTIED + 0.2, 0.25);
          reachTo(st, tie, [TR - 18 + 8 * Math.sin(t * 14 + 1) * win(t, T_TIE, T_BTIED), TY + 6 * Math.cos(t * 14 + 1) * win(t, T_TIE, T_BTIED)]);
          reachTo(st, 1 - tie, t < T_TIE ? [x + 40, stY - 40] : [x - 30, stY - 30]);
          st.head = lerp(st.head, -10, hold(t, T_LOOK, T_BSIT, 0.3));
          if (t > T_FALL + 0.3) { reachTo(st, win(t, T_FALL + 0.3, T_FALL + 0.7), [BHE - 60, G - 6]); reachTo(st, win(t, T_FALL + 0.3, T_FALL + 0.7), [BHE + 20, G - 6], "b"); }
          st.head = lerp(st.head, 34, win(t, T_GONE - 0.6, T_GONE));
          return st;
        }
        function botHer(t) {
          const x = botSheX(t), walk = t > T_WALK;
          const st = walk ? walkPose(x, -1, t, T_WALK) : standOn(x, 1, G);
          st.head = 26; st.torso = 6;
          const f = walk ? -1 : 1;
          reachTo(st, 1, [x + 40 * f, stY - 120], "b");
          const loose = t < T_LET ? 1 : 1 - win(t, T_LET, T_LET + 0.3);
          reachTo(st, loose, [x + 46, stY - 40 + 3 * Math.sin(t * 2)]);
          reachTo(st, 1 - loose, [x + 46 * f, stY - 116]);
          st.torso = lerp(st.torso, 2, hold(t, T_LET - 0.4, T_LET + 0.4, 0.2));
          return st;
        }
        const mkFig = (P2, white, kind) => makeFig(P2.figs, white ? "#ffffff" : kind === "her" ? "#8e8e8e" : "#9a9a9a", white ? "#e0e0e0" : "#767676", white, kind + (white ? "T" : "B"));
        const TF = { bun: svgEl("circle", { r: 15, fill: "#fff", stroke: "#000", "stroke-width": 6 }, top.figs), her: mkFig(top, true, "her"), him: mkFig(top, true, "him") };
        const BF = { bun: svgEl("circle", { r: 15, fill: "#8e8e8e", stroke: "#000", "stroke-width": 6 }, bot.figs), her: mkFig(bot, false, "her"), him: mkFig(bot, false, "him") };
        const phone = svgEl("rect", { x: -10, y: -16, width: 20, height: 32, rx: 4, fill: "#bfe0ff", stroke: "#000", "stroke-width": 4 }, bot.fx);
        const phoneGlow = svgEl("circle", { r: 70, fill: "url(#phoneGlow)", opacity: 0.8 }, bot.fx);
        const redSpot = svgEl("polygon", { fill: "url(#redBeam)", filter: "url(#soft)", opacity: 0 }, top.beams);
        const bigHeart = svgEl("path", { d: "M0 12 C-26 -4 -19 -26 0 -14 C19 -26 26 -4 0 12 Z", fill: "#ff3b30", stroke: "#000", "stroke-width": 3, opacity: 0 }, top.fx);

        // ---------- labels ----------
        const label = (x, y, size, col) => { const d = document.createElement("div"); d.className = "mono"; d.style.cssText = `left:${x}px;top:${y}px;font-size:${size}px;letter-spacing:0.16em;color:${col}`; E("stage").appendChild(d); return d; };
        const topT = label(PX + 44, 412 + 26, 30, "#ffffff"), topS = label(PX + 44, 412 + 66, 19, "#c8c8c8");
        const botT = label(PX + 44, 1010 + 26, 30, "#a8a8a8"), botS = label(PX + 44, 1010 + 66, 19, "#a8a8a8");
        topT.textContent = "BOTH TIE"; botT.textContent = "ONE TIES";
        topT.style.textShadow = "0 0 12px rgba(255,255,255,0.35)";
        const typed = (seq, t, cps = 16) => { let cur = null; for (const s of seq) if (t >= s[0]) cur = s; if (!cur) return ["", null]; const n = Math.floor((t - cur[0]) * cps); return [cur[1].slice(0, n), cur[2] || null]; };
        const TOPSEQ = [[0.05, "EACH TIES ONE END"], [T_SIT, "IT HOLDS THEM BOTH"], [T_LEAN, "AND IT SWINGS", "#ff6a60"]];
        const BOTSEQ = [[0.05, "HE TIES HIS END"], [T_BARR - 0.4, "SHE JUST HOLDS HERS", "#ff3b30"], [T_LET, "SHE LETS GO", "#ff3b30"], [T_WALK, "AND WALKS AWAY", "#ff3b30"]];
        E("head").style.top = "236px";
        E("head").style.fontSize = "30px";
        E("head").style.letterSpacing = "0.16em";
        E("head").style.lineHeight = "1.6";
        const tom = label(0, 590, 26, "#ffcf7a"); tom.style.width = "1080px"; tom.style.textAlign = "center";
        const fade = document.createElement("div");
        fade.style.cssText = "position:absolute;inset:0;background:#000;opacity:0";
        E("stage").appendChild(fade);

        const CF = [630, G - 260], CS = [540, 1080], ZK = 1.25;
        const zoomK = (t) => sm(t, T_CTA - 0.1, T_CTA + 1.0);
        const cam = (t) => { const q = zoomK(t), z = lerp(PK, ZK, q), s0 = [PX + CF[0] * PK, top.y0 + (CF[1] - PY0) * PK]; return { z, ox: lerp(s0[0], CS[0], q) - CF[0] * z, oy: lerp(s0[1], CS[1], q) - (CF[1] - PY0) * z }; };
        const LEAF0 = [TL + 60, G - 470], LEAFP = [SHE + 40, G - 530];

        function render(t) {
          // ---- top
          const hp = drawFig(TF.her, livePose(topHer, t, 0.4), t < T_GO ? -1 : 1);
          const mp = drawFig(TF.him, livePose(topHim, t, 1.3), t < T_GO ? 1 : -1);
          const fb = t < T_GO ? -1 : 1;
          TF.bun.setAttribute("cx", r1(hp.head[0] - 25 * fb)); TF.bun.setAttribute("cy", r1(hp.head[1] - 16));
          {
            const tk = sm(t, T_TIE + 0.2, T_TIED);
            const aL = [lerp(hp.hands[0][0], TL + 14, tk), lerp(hp.hands[0][1], TY, tk)], aR = [lerp(mp.hands[0][0], TR - 14, tk), lerp(mp.hands[0][1], TY, tk)];
            const tied = t > T_TIED;
            const A = tied ? [TL + 14, TY] : aL, B = tied ? [TR - 14, TY] : aR;
            const l = [lerp(A[0] + 90, TL + 110, tied ? 1 : 0), lerp(A[1] + 60, TY + 40, tied ? 1 : 0)], r = [lerp(B[0] - 90, TR - 110, tied ? 1 : 0), lerp(B[1] + 60, TY + 40, tied ? 1 : 0)];
            const slack = 1 - sm(t, T_TIE, T_TIED);
            const low = [(l[0] + r[0]) / 2 + sway(t), lerp(lowT(t), G - 30, slack)];
            drawHam(HT, A, l, r, B, low, sm(t, T_TIED - 0.3, T_TIED), sm(t, T_TIED - 0.3, T_TIED));
          }
          top.glow.setAttribute("cx", 630); top.glow.setAttribute("cy", G - 200); top.glow.setAttribute("opacity", (0.55 * win(t, T_LEAN, T_LEAN + 0.8)).toFixed(3));
          redSpot.setAttribute("points", `${570},${PY0} ${690},${PY0} ${890},${G} ${370},${G}`);
          redSpot.setAttribute("opacity", (0.4 * win(t, T_HEART, T_HEART + 0.5)).toFixed(3));
          const hq = sm(t, T_HEART, T_HEART + 0.6);
          bigHeart.setAttribute("opacity", (hq * (1 - sm(t, T_CTA, T_CTA + 0.5))).toFixed(3));
          bigHeart.setAttribute("transform", `translate(630 ${r1(G - 480 - 10 * hq)}) scale(${(backOut(hq) * 1.5).toFixed(3)})`);
          // FOLLOW leaf: drifts down from the left tree to above them
          const lq = clamp((t - T_TAG) / 1.5, 0, 1), popped = t > T_TAP;
          const lx = lerp(LEAF0[0], LEAFP[0], ease(lq)) + 50 * Math.sin(lq * Math.PI * 2.2) * (1 - lq), ly = lerp(LEAF0[1], LEAFP[1], ease(lq));
          const rot = 22 * Math.sin(lq * Math.PI * 2.2) * (1 - lq) + 3 * Math.sin(t * 2.4) * (popped ? 0 : 1);
          const pk = popped ? 1 + 0.12 * Math.sin(Math.PI * clamp((t - T_TAP) / 0.25, 0, 1)) : 1;
          leafF.setAttribute("opacity", sm(t, T_TAG, T_TAG + 0.3).toFixed(3));
          leafF.setAttribute("transform", `translate(${r1(lx)} ${r1(ly)}) rotate(${r1(rot)}) scale(${(pk * (0.8 + 0.2 * lq)).toFixed(3)})`);
          leafB.setAttribute("fill", popped ? "#ff3b30" : "#3fa45a"); leafV.setAttribute("opacity", popped ? 0 : 0.6);
          leafT.textContent = popped ? "FOLLOWING ✓" : "+ FOLLOW"; leafT.setAttribute("font-size", popped ? 22 : 28);
          minis.forEach((h, i) => { const q = clamp((t - T_TAP) / 1.3, 0, 1), a = (i / 12) * Math.PI * 2; h.setAttribute("opacity", popped && q < 1 ? (1 - q).toFixed(3) : 0); h.setAttribute("transform", `translate(${r1(LEAFP[0] + Math.cos(a) * 190 * Math.sqrt(q))} ${r1(LEAFP[1] + Math.sin(a) * 120 * Math.sqrt(q) + 80 * q * q)}) rotate(${r1(a * 57 + 200 * q)})`); });
          const c = cam(t);
          top.g.setAttribute("transform", `translate(${r1(c.ox)} ${r1(c.oy)}) scale(${c.z.toFixed(4)}) translate(0 ${-PY0})`);
          const zq = zoomK(t);
          bot.g.setAttribute("opacity", (1 - zq).toFixed(3));
          [topT, topS, botT, botS].forEach((d) => (d.style.opacity = (1 - zq).toFixed(3)));

          // ---- bottom
          const bf = t > T_WALK ? -1 : 1;
          const sp = drawFig(BF.her, livePose(botHer, t, 0.9), bf);
          const hf = t < T_BGO ? 1 : -1;
          const bp = drawFig(BF.him, livePose(botHim, t, 2.0), hf);
          BF.bun.setAttribute("cx", r1(sp.head[0] - 25 * bf)); BF.bun.setAttribute("cy", r1(sp.head[1] - 16));
          {
            const tk = sm(t, T_TIE + 0.2, T_BTIED), tied = t > T_BTIED;
            const B = tied ? [TR - 14, TY] : [lerp(bp.hands[0][0], TR - 14, tk), lerp(bp.hands[0][1], TY, tk)];
            const r = tied ? [TR - 110, TY + 40] : [B[0] - 90, B[1] + 60];
            const fk = fallK(t), let_ = t > T_LET;
            // her end: in her loose hand until she lets go, then it falls to the ground
            const hand = t < T_LET + 0.05 ? sp.hands[0] : null;
            const dq = clamp((t - T_LET) / 0.4, 0, 1);
            const A = hand ? [hand[0], hand[1]] : [lerp(HERX0 + 46, HERX0 + 90, dq), lerp(stY - 40, G - 6, dq * dq)];
            const l = [A[0] + 60, lerp(A[1] + 30, G - 8, let_ ? dq * dq : 0)];
            let low = [(l[0] + r[0]) / 2, lowB(t) + 6];
            low = [lerp(low[0], BHE - 30, fk), lerp(low[1], G - 10, fk)];
            drawHam(HB, A, l, r, B, low, 0, sm(t, T_BTIED - 0.3, T_BTIED));
          }
          const ph = sp.hands[1];
          phone.setAttribute("transform", `translate(${r1(ph[0])} ${r1(ph[1] - 6)})`);
          phoneGlow.setAttribute("cx", r1(ph[0])); phoneGlow.setAttribute("cy", r1(ph[1])); phoneGlow.setAttribute("opacity", (0.75 + 0.15 * Math.sin(t * 5)).toFixed(3));
          fall.forEach((h, i) => { const tt = (t * 0.35 + i * 0.21) % 1; h.setAttribute("transform", `translate(${r1(250 + i * 190 + 40 * Math.sin(tt * 7 + i))} ${r1(PY0 + 60 + tt * (G - PY0 - 60))}) rotate(${r1(tt * 400 + i * 50)})`); h.setAttribute("opacity", t > T_FALL ? (0.8 * Math.min(1, (t - T_FALL) / 0.6)).toFixed(3) : 0); });
          bot.dark.setAttribute("opacity", (0.32 * win(t, T_WALK, T_GONE + 0.5)).toFixed(3));

          const [ts, tc] = typed(TOPSEQ, t); topS.textContent = ts; topS.style.color = tc || "#c8c8c8";
          const [bs, bc] = typed(BOTSEQ, t); botS.textContent = bs; botS.style.color = bc || "#a8a8a8";
          const L2 = "HE TIED HIS END.", L3 = "SHE JUST LET GO.";
          E("head").innerHTML = `<div>LOVE IS A HAMMOCK. #29</div><div>${L2.slice(0, Math.max(0, Math.floor((t - T_H2) * 30)))}&nbsp;</div><div style="color:#ff6a60">${L3.slice(0, Math.max(0, Math.floor((t - T_H3) * 30)))}&nbsp;</div>`;
          const TT = "LOVE IS A ... #30 TOMORROW";
          tom.textContent = TT.slice(0, Math.max(0, Math.floor((t - T_TAP - 0.5) * 28)));
          fade.style.opacity = win(t, DUR - 0.35, DUR - 0.02).toFixed(3);
        }
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
        window.__timelines["main"] = tl;
        render(0);
        tl.seek(0);
      })();
    </script>
