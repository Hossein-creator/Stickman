<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "HFMono";
        src: url("assets/fonts/consolab.ttf") format("truetype");
        font-weight: 700;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      #stage svg {
        position: absolute;
        inset: 0;
      }
      .mono {
        position: absolute;
        font-family: "HFMono", monospace;
        font-weight: 700;
        white-space: nowrap;
      }
      /* everything readable stays inside the Instagram safe area: x 120-960, y 220-1500 */
      #head {
        position: absolute;
        left: 0;
        right: 0;
        top: 222px;
        text-align: center;
        font-family: "HFMono", monospace;
        font-weight: 700;
        font-size: 38px;
        letter-spacing: 0.12em;
        line-height: 1.45;
        color: #fff;
        text-shadow: 0 0 16px rgba(255, 255, 255, 0.3);
      }
      #head .ghost {
        visibility: hidden;
      }
      #ctr {
        position: absolute;
        left: 0;
        right: 0;
        top: 430px;
        text-align: center;
        font-family: "HFMono", monospace;
        font-weight: 700;
        white-space: nowrap;
      }
      #ctr .lbl {
        font-size: 26px;
        letter-spacing: 0.24em;
        color: #9a9a9a;
        vertical-align: middle;
      }
      #num {
        display: inline-block;
        min-width: 2.4ch;
        font-size: 58px;
        letter-spacing: 0.08em;
        color: #fff;
        vertical-align: middle;
        text-shadow: 0 0 14px rgba(255, 255, 255, 0.35);
      }
      #tag {
        display: inline-block;
        min-width: 5.2ch;
        padding: 6px 12px 4px;
        font-size: 26px;
        letter-spacing: 0.18em;
        vertical-align: middle;
        visibility: hidden;
      }
      #tag.fail {
        visibility: visible;
        background: #d62a2a;
        color: #fff;
      }
      #tag.pass {
        visibility: visible;
        background: #fff;
        color: #000;
        box-shadow: 0 0 22px rgba(255, 255, 255, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="15" data-track-index="0">
        <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
              <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.12" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0.04" />
            </linearGradient>
            <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.32" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="dustG" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#b5b5b5" stop-opacity="0.8" />
              <stop offset="1" stop-color="#b5b5b5" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="ply" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#d9c29b" />
              <stop offset="1" stop-color="#8f7858" />
            </linearGradient>
            <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#000" stop-opacity="0.45" />
              <stop offset="1" stop-color="#000" stop-opacity="1" />
            </linearGradient>
            <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="12" />
            </filter>
            <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="16" />
            </filter>
                      <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#0c0c0e" />
              <stop offset="1" stop-color="#111318" />
            </linearGradient>
            <linearGradient id="abyss" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#05070a" />
              <stop offset="1" stop-color="#1c2433" />
            </linearGradient>
            <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ddd6c6" />
              <stop offset="1" stop-color="#a39a88" />
            </linearGradient>
            <linearGradient id="redBeam" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ff4a4a" stop-opacity="0.75" />
              <stop offset="0.7" stop-color="#ff6a6a" stop-opacity="0.2" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0.08" />
            </linearGradient>
            <radialGradient id="redGlow" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#ff3b30" stop-opacity="0.7" />
              <stop offset="1" stop-color="#ff3b30" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="phoneGlow" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#6aa8ff" stop-opacity="0.75" />
              <stop offset="0.5" stop-color="#4f8cff" stop-opacity="0.28" />
              <stop offset="1" stop-color="#4f8cff" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#6e665a" />
              <stop offset="0.25" stop-color="#3a352f" />
              <stop offset="1" stop-color="#0c0b0a" />
            </linearGradient>
            <radialGradient id="fireGlow" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#ffb347" stop-opacity="0.75" />
              <stop offset="0.4" stop-color="#ff7a1a" stop-opacity="0.28" />
              <stop offset="1" stop-color="#ff5a00" stop-opacity="0" />
            </radialGradient>
          </defs>
          <!-- world: floor at world y 600 -> screen y 1400, world x 400 -> screen x 540 -->
          <g transform="translate(540 1400) scale(1.45) translate(-400 -600)">
            <g id="beams"></g>
            <g id="back"></g>
            
            <use href="#world" transform="translate(0 1200) scale(1 -1)" opacity="0.16" />
            <rect x="-200" y="600" width="1200" height="260" fill="url(#floorFade)" />
            <rect x="-600" y="858" width="2000" height="1400" fill="#000" />
            <rect x="-200" y="599" width="1200" height="2" fill="#2a2a2a" />
            <g id="world"></g>
          </g>
        </svg>
        <style>
  #fx { position: absolute; inset: 0; pointer-events: none; }
</style>
        <div id="head">
          <div id="h1"></div>
          <div id="h2"></div>
        </div>
      </div>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="15" data-track-index="1"></audio>
    </div>

    <script>
      (function () {
        const DUR = 15;
        const FL = 600, BX0 = 380, BX1 = 520, BTOP = 410, TOPF = 404, SX = 250;
        const THIGH = 80, SHIN = 78, LEG = 154;
        const UARM = 64, FARM = 60, TORSO = 116, NECK = 12, HEADR = 31;
        const NS = "http://www.w3.org/2000/svg";
        const svgEl = (tag, attrs, parent) => {
          const e = document.createElementNS(NS, tag);
          for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(e);
          return e;
        };
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, p) => a + (b - a) * p;
        const ease = (p) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(p, 0, 1));
        const backOut = (p) => { p = clamp(p, 0, 1); const s = 2.2; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
        const win = (t, a, b) => ease((t - a) / (b - a));
        const rad = (x) => (x * Math.PI) / 180;
        const down = (a, f) => [Math.sin(rad(a)) * f, Math.cos(rad(a))];
        const up = (a, f) => [Math.sin(rad(a)) * f, -Math.cos(rad(a))];
        const r1 = (v) => Math.round(v * 10) / 10;
        const E = (id) => document.getElementById(id);
        let seed = 31;
        const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

        // ---------- rig v2 (from reel 05): blended poses, head/arm follow-through, breathing ----------
        function makeFig(parent, front, back, glow, id) {
          const g = svgEl("g", { id }, parent);
          if (glow) parent.insertBefore(svgEl("use", { href: "#" + id, filter: "url(#blur)", opacity: 0.45 }), g);
          const parts = { g };
          for (const [n, col] of [["armB", back], ["legB", back], ["torso", front], ["legF", front], ["armF", front]]) {
            const o = svgEl("path", { fill: "none", stroke: "#000", "stroke-width": 34, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            const w = svgEl("path", { fill: "none", stroke: col, "stroke-width": 22, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            parts[n] = [o, w];
          }
          parts.head = svgEl("circle", { r: HEADR, fill: front, stroke: "#000", "stroke-width": 6 }, g);
          return parts;
        }
        function ik(a, b, l1, l2, pick) {
          let dx = b[0] - a[0], dy = b[1] - a[1];
          let d = Math.hypot(dx, dy);
          const maxd = l1 + l2 - 0.5;
          if (d > maxd) {
            b = [a[0] + (dx / d) * maxd, a[1] + (dy / d) * maxd];
            dx = b[0] - a[0];
            dy = b[1] - a[1];
            d = maxd;
          }
          d = Math.max(d, Math.abs(l1 - l2) + 1);
          const al = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
          const base = Math.atan2(dy, dx);
          const c1 = [a[0] + Math.cos(base + al) * l1, a[1] + Math.sin(base + al) * l1];
          const c2 = [a[0] + Math.cos(base - al) * l1, a[1] + Math.sin(base - al) * l1];
          return [pick(c1, c2), b];
        }
        const P = (pts) => "M" + pts.map((p) => r1(p[0]) + " " + r1(p[1])).join("L");
        const setD = (pair, d) => {
          pair[0].setAttribute("d", d);
          pair[1].setAttribute("d", d);
        };
        // flat pose: hx hy torso head ax ay bx by | per arm a*/b*: sh el w tx ty
        function drawFig(parts, s, f) {
          const hip = [s.hx, s.hy];
          const tu = up(s.torso, f);
          const sh = [hip[0] + tu[0] * TORSO, hip[1] + tu[1] * TORSO];
          const nk = [hip[0] + tu[0] * (TORSO + NECK), hip[1] + tu[1] * (TORSO + NECK)];
          const hu = up(s.torso + s.head, f);
          const hc = [nk[0] + hu[0] * HEADR, nk[1] + hu[1] * HEADR];
          setD(parts.torso, P([hip, sh, nk]));
          parts.head.setAttribute("cx", r1(hc[0]));
          parts.head.setAttribute("cy", r1(hc[1]));
          const knee = (c1, c2) => (c1[0] * f > c2[0] * f ? c1 : c2);
          const elbow = (c1, c2) => (c1[1] - 0.5 * f * c1[0] > c2[1] - 0.5 * f * c2[0] ? c1 : c2);
          [["legF", [s.ax, s.ay]], ["legB", [s.bx, s.by]]].forEach(([n, ft]) => {
            const [kn, fo] = ik(hip, ft, THIGH, SHIN, knee);
            setD(parts[n], P([hip, kn, fo]));
          });
          const hands = [];
          [["armF", "a"], ["armB", "b"]].forEach(([n, k]) => {
            const u = down(s[k + "sh"], f);
            const el = [sh[0] + u[0] * UARM, sh[1] + u[1] * UARM];
            const v = down(s[k + "sh"] + s[k + "el"], f);
            const fk = [el[0] + v[0] * FARM, el[1] + v[1] * FARM];
            const w = clamp(s[k + "w"], 0, 1);
            const hand = [lerp(fk[0], s[k + "tx"], w), lerp(fk[1], s[k + "ty"], w)];
            const [e2, h2] = ik(sh, hand, UARM, FARM, elbow);
            setD(parts[n], P([sh, e2, h2]));
            hands.push(h2);
          });
          return { head: hc, hands, hip };
        }
        const KER = [-4, -3, -2, -1, 0, 1, 2, 3, 4].map((k) => [k * 0.03, Math.exp(-((k / 2.3) ** 2))]);
        function blend(raw, t) {
          const out = {};
          let ws = 0;
          for (const [dt, w] of KER) {
            const p = raw(clamp(t + dt, 0, DUR));
            for (const k in p) out[k] = (out[k] || 0) + p[k] * w;
            ws += w;
          }
          for (const k in out) out[k] /= ws;
          return out;
        }
        const LAGGED = ["head", "ash", "ael", "aw", "atx", "aty", "bsh", "bel", "bw", "btx", "bty"];
        function livePose(raw, t, phase) {
          const s = blend(raw, t);
          const lag = blend(raw, t - 0.05);
          for (const k of LAGGED) s[k] = lag[k];
          const br = Math.sin(t * 1.9 + phase);
          s.hy += br * 1.3;
          s.torso += br * 0.8;
          s.head += Math.sin(t * 1.2 + phase * 2) * 1.6;
          return s;
        }
        const ARMS = { ash: 8, ael: 12, aw: 0, atx: 0, aty: 0, bsh: -4, bel: 10, bw: 0, btx: 0, bty: 0 };
        const base = (o) => ({ hx: 0, hy: 0, torso: 3, head: 0, ax: 0, ay: FL, bx: 0, by: FL, ...ARMS, ...o });
        function standOn(x, f, fy) {
          return base({ hx: x, hy: fy - Math.sqrt(LEG * LEG - 15 * 15), ax: x + f * 15, ay: fy, bx: x - f * 15, by: fy });
        }
        const mixPose = (a, b, p) => {
          const o = {};
          for (const k in a) o[k] = lerp(a[k], b[k], p);
          return o;
        };

        // ---------- "love is a rope": winner split-screen format (reel 36). Both stuck in a dark pit. BOTH CLIMB: he lifts her out, she lies down at the edge and pulls him up, sunlight, red heart. ONE CLIMBS: he lifts her out, she walks away on her phone; he's left behind ----------
        E("svg").children[1].style.display = "none";
        const SVG = E("svg");
        const frac = (v) => v - Math.floor(v);
        const stand = FL - Math.sqrt(LEG * LEG - 15 * 15);

        const PW = 1233, PY0 = 98, PY1 = 815, PK = 535 / 717, PX = 81;
        const P0 = 500, P1 = 780, PF = FL + 175;
        const standP = PF - Math.sqrt(LEG * LEG - 15 * 15);
        function makePanel(y0, id) {
          const clip = svgEl("clipPath", { id: "clip" + id }, SVG.querySelector("defs"));
          svgEl("rect", { x: 0, y: PY0, width: PW, height: PY1 - PY0 }, clip);
          const g = svgEl("g", { transform: `translate(${PX} ${y0}) scale(${PK}) translate(0 ${-PY0})` }, SVG);
          const inner = svgEl("g", { "clip-path": `url(#clip${id})` }, g);
          svgEl("rect", { x: 0, y: PY0, width: PW, height: PY1 - PY0, fill: "url(#panelBg)" }, inner);
          const beams = svgEl("g", {}, inner);
          const sun = svgEl("polygon", { points: `${360 - 60},${PY0} ${360 + 60},${PY0} ${360 + 200},${FL} ${360 - 200},${FL}`, fill: "url(#fireGlow)", filter: "url(#soft)", opacity: 0 }, beams);
          svgEl("polygon", { points: `${640 - 50},${PY0} ${640 + 50},${PY0} ${640 + 150},${FL} ${640 - 150},${FL}`, fill: "url(#beam)", filter: "url(#soft)", opacity: 0.22 }, beams);
          svgEl("rect", { x: 0, y: FL, width: PW, height: PY1 - FL, fill: "url(#ground)" }, inner);
          svgEl("rect", { x: P0, y: FL, width: P1 - P0, height: PF - FL + 4, fill: "#06070a" }, inner);
          svgEl("rect", { x: P0, y: PF, width: P1 - P0, height: PY1 - PF, fill: "#15130f" }, inner);
          svgEl("path", { d: `M${P0} ${FL} L${P0 + 6} ${PF} M${P1} ${FL} L${P1 - 6} ${PF}`, stroke: "#3a352f", "stroke-width": 8 }, inner);
          for (const x of [0, P1]) svgEl("rect", { x, y: FL - 2, width: x ? PW - P1 : P0, height: 3, fill: "#8a8172" }, inner);
          const figs = svgEl("g", {}, inner);
          const fx = svgEl("g", {}, inner);
          const dark = svgEl("rect", { x: P0, y: FL, width: P1 - P0, height: PY1 - FL, fill: "#000", opacity: 0 }, inner);
          svgEl("rect", { x: 0, y: PY0, width: PW, height: PY1 - PY0, fill: "none", stroke: "#2c2c30", "stroke-width": 5 }, g);
          return { beams, sun, figs, fx, dark };
        }
        const top = makePanel(412, "T");
        const bot = makePanel(1010, "B");

        const reachTo = (s, k, p, hand = "a") => { s[hand + "w"] = Math.max(s[hand + "w"], k); s[hand + "tx"] = lerp(s[hand + "tx"], p[0], k); s[hand + "ty"] = lerp(s[hand + "ty"], p[1], k); return s; };
        const hold = (s, a, b, r = 0.2) => win(s, a, a + r) * (1 - win(s, b - r, b));
        function feetOn(x0, hx, ST, lift) {
          const p = (hx - x0) / ST;
          return [0, 0.5].map((o) => {
            const q = frac(Math.abs(p) + o + 1e-6), d = Math.sign(hx - x0) || 1;
            if (q < 0.5) return [hx + d * ST * (0.25 - q), FL];
            const ss = (q - 0.5) / 0.5;
            return [hx + d * ST * (-0.25 + 0.5 * ease(ss)), FL - Math.sin(Math.PI * ss) * lift];
          });
        }
        const walking = (x0, x) => { const ft = feetOn(x0, x, 120, 14), sw = Math.sin((Math.PI * 2 * (x - x0)) / 120); return base({ hx: x, hy: stand + 3 + 3 * Math.abs(sw), torso: 4, head: 4, ax: ft[0][0], ay: ft[0][1], bx: ft[1][0], by: ft[1][1], ash: 8 + 30 * sw, ael: 20, bsh: -4 - 30 * sw, bel: 20 }); };
        function hop(t, t0, d, x0, y0, x1, y1, f, h) {
          const p = clamp((t - t0) / d, 0, 1), e = ease(p), tuck = Math.sin(Math.PI * p);
          const st = standOn(lerp(x0, x1, e), f, lerp(y0, y1, e) - tuck * h);
          st.ay -= 44 * tuck; st.by -= 50 * tuck; st.ax += f * 12 * tuck; st.bx -= f * 10 * tuck; st.torso = 10 * tuck;
          return st;
        }

        // ---------- beats ----------
        const T_UP = 0.6, T_CROUCH = 1.7, T_LIFT = 2.3, T_OUT = 3.1, T_KNEEL = 3.5, T_GRAB = 4.2, T_CLIMB = 4.6, T_ON = 5.4, T_HUG = 6.0, T_HOLD = 6.6;
        const T_PHONE = 3.5, T_LEAVE = 4.2, T_JUMP1 = 4.9, T_JUMP2 = 5.5, T_SIT = 6.4;
        const T_T1 = 9.0, T_T2 = 9.7, T_CARD = 11.4;
        const SHE0 = 580, HE0 = 680, EDGE = P0 - 40, HUGL = 360, HUGR = 392;
        const pitStand = (x, f) => standOn(x, f, PF);

        function heRaw(t, both) {
          const st = pitStand(HE0, -1);
          st.head = -14 * win(t, T_UP, T_UP + 0.3);
          // crouches, hands cupped low, then lifts her up
          const cr = hold(t, T_CROUCH, T_OUT + 0.2, 0.25), lift = win(t, T_LIFT, T_LIFT + 0.5);
          st.hy += 40 * cr * (1 - lift); st.torso += 26 * cr * (1 - 0.7 * lift);
          reachTo(st, cr, [HE0 - 60, lerp(PF - 90, standP - 200, lift)]); reachTo(st, cr, [HE0 - 52, lerp(PF - 86, standP - 196, lift)], "b");
          if (both) {
            // grabs her hand, climbs up, hugs her
            const grab = hold(t, T_GRAB, T_CLIMB + 0.2, 0.2); reachTo(st, grab, [EDGE + 60, FL - 10]);
            if (t >= T_CLIMB && t < T_ON) { const h = hop(t, T_CLIMB, T_ON - T_CLIMB, HE0, PF, EDGE + 40, FL, -1, 30); reachTo(h, 1, [EDGE + 20, FL - 40]); return h; }
            if (t >= T_ON) {
              const x = lerp(EDGE + 40, HUGR, ease((t - T_ON) / (T_HUG - T_ON)));
              const hug = standOn(t < T_HUG ? x : HUGR, -1, FL); hug.head = 6;
              const k = win(t, T_HUG, T_HUG + 0.5); hug.torso = 4 * k; reachTo(hug, k, [HUGL - 10, stand - 130]); reachTo(hug, k, [HUGL + 4, stand - 100], "b");
              return hug;
            }
            return st;
          }
          // left behind: reaches up, two little jumps, sits down
          const reach = hold(t, T_LEAVE, T_SIT, 0.2); reachTo(st, reach, [HE0 - 100, standP - 230]); st.head = lerp(st.head, -24, reach);
          const j = Math.max(Math.sin(Math.PI * clamp((t - T_JUMP1) / 0.4, 0, 1)), Math.sin(Math.PI * clamp((t - T_JUMP2) / 0.4, 0, 1)));
          st.hy -= 50 * j; st.ay -= 50 * j; st.by -= 50 * j;
          const sit = base({ hx: HE0, hy: PF - 30, torso: 30, head: 34, ax: HE0 - 88, ay: PF, bx: HE0 - 74, by: PF, aw: 1, atx: HE0 - 80, aty: PF - 80, bw: 1, btx: HE0 - 70, bty: PF - 74 });
          return mixPose(st, sit, win(t, T_SIT, T_SIT + 0.6));
        }
        function sheRaw(t, both) {
          if (t < T_LIFT) { const st = pitStand(SHE0, 1); st.head = -14 * win(t, T_UP, T_UP + 0.3); const step = win(t, T_CROUCH + 0.2, T_LIFT); st.hx = lerp(SHE0, SHE0 + 20, step); reachTo(st, step, [SHE0 + 80, PF - 140]); return st; }
          if (t < T_OUT) { const h = hop(t, T_LIFT, T_OUT - T_LIFT, SHE0 + 20, PF, EDGE, FL, -1, 150); reachTo(h, 1, [EDGE - 10, FL - 30]); reachTo(h, 1, [EDGE + 6, FL - 40], "b"); return h; }
          if (both) {
            if (t < T_ON + 0.1) {
              // lies down at the edge and pulls him up
              const kn = base({ hx: EDGE - 60, hy: FL - 40, torso: 70, head: 20, ax: EDGE - 140, ay: FL, bx: EDGE - 150, by: FL - 4 });
              reachTo(kn, 1, [EDGE + 60, FL + 10]); reachTo(kn, 1, [EDGE + 50, FL + 4], "b");
              const pull = win(t, T_CLIMB, T_ON); kn.torso -= 30 * pull; kn.hy += 6 * pull; kn.atx -= 50 * pull; kn.aty -= 40 * pull; kn.btx -= 50 * pull; kn.bty -= 40 * pull;
              return mixPose(standOn(EDGE, 1, FL), kn, win(t, T_OUT, T_KNEEL + 0.2));
            }
            const x = lerp(EDGE - 60, HUGL, ease((t - T_ON - 0.1) / (T_HUG - T_ON - 0.1)));
            const hug = standOn(t < T_HUG ? x : HUGL, 1, FL); hug.head = -6;
            const k = win(t, T_HUG, T_HUG + 0.5); hug.torso = 8 * k; reachTo(hug, k, [HUGR + 10, stand - 150]); reachTo(hug, k, [HUGR - 6, stand - 120], "b");
            hug.hy += 2 * Math.sin(t * 2) * k;
            return hug;
          }
          // walks away on her phone
          const st = standOn(EDGE, -1, FL); st.head = 26; st.torso = 6;
          const ph = win(t, T_PHONE, T_PHONE + 0.3); reachTo(st, ph, [EDGE - 40, stand - 76]); reachTo(st, ph, [EDGE - 32, stand - 70], "b");
          if (t < T_LEAVE) return st;
          const p = walking(EDGE, lerp(EDGE, -200, ease((t - T_LEAVE) / 2.0))); p.head = 26; reachTo(p, 1, [p.hx - 40, stand - 76]); reachTo(p, 1, [p.hx - 32, stand - 70], "b");
          return p;
        }

        const tHe = makeFig(top.figs, "#ffffff", "#dedede", true, "tHe");
        const tBun = svgEl("circle", { r: 15, fill: "#fff", stroke: "#000", "stroke-width": 6 }, top.figs);
        const tShe = makeFig(top.figs, "#ffffff", "#e2e2e2", true, "tShe");
        top.figs.insertBefore(tBun, tShe.g.previousSibling);
        const heartGlow = svgEl("circle", { r: 70, fill: "url(#redGlow)", opacity: 0 }, top.fx);
        const heart = svgEl("path", { d: "M0 18 C-40 -8 -30 -40 0 -22 C30 -40 40 -8 0 18 Z", fill: "#ff3b30", stroke: "#000", "stroke-width": 4, opacity: 0 }, top.fx);
        const bHe = makeFig(bot.figs, "#9a9a9a", "#7e7e7e", false, "bHe");
        const bBun = svgEl("circle", { r: 15, fill: "#8e8e8e", stroke: "#000", "stroke-width": 6 }, bot.figs);
        const bShe = makeFig(bot.figs, "#8e8e8e", "#767676", false, "bShe");
        bot.figs.insertBefore(bBun, bShe.g.previousSibling);
        const ropeT = svgEl("path", { fill: "none", stroke: "#c8a060", "stroke-width": 7, "stroke-linecap": "round", opacity: 0 }, top.fx);
        const ropeB = svgEl("path", { fill: "none", stroke: "#b09060", "stroke-width": 7, "stroke-linecap": "round", opacity: 0 }, bot.fx);
        const coil = (panel) => { const g = svgEl("g", {}, panel.fx); for (let i = 0; i < 3; i++) svgEl("ellipse", { cx: EDGE - 90, cy: FL - 8 - i * 7, rx: 26, ry: 8, fill: "none", stroke: "#c8a060", "stroke-width": 6 }, g); return g; };
        const coilT = coil(top), coilB = coil(bot);
        const phoneGlow = svgEl("circle", { r: 78, fill: "url(#phoneGlow)", opacity: 0 }, bot.fx);
        const phone = svgEl("rect", { x: -9, y: -15, width: 18, height: 30, rx: 4, fill: "#bfe0ff", stroke: "#000", "stroke-width": 4, opacity: 0 }, bot.fx);

        const label = (x, y, size, col) => { const d = document.createElement("div"); d.className = "mono"; d.style.cssText = `left:${x}px;top:${y}px;font-size:${size}px;letter-spacing:0.16em;color:${col}`; E("stage").appendChild(d); return d; };
        const topT = label(PX + 44, 412 + 26, 30, "#ffffff"), topS = label(PX + 44, 412 + 66, 19, "#c8c8c8");
        const botT = label(PX + 44, 1010 + 26, 30, "#a8a8a8"), botS = label(PX + 44, 1010 + 66, 19, "#a8a8a8");
        topT.textContent = "BOTH CLIMB"; botT.textContent = "ONE CLIMBS";
        topT.style.textShadow = "0 0 12px rgba(255,255,255,0.35)";
        const typed = (seq, t, cps = 16) => { let cur = null; for (const s of seq) if (t >= s[0]) cur = s; if (!cur) return ["", "#c8c8c8"]; const n = Math.floor((t - cur[0]) * cps); return [cur[1].slice(0, n), cur[2] || null]; };
        const TOPSEQ = [[0.45, "STUCK TOGETHER"], [T_CROUCH, "HE LIFTS HER"], [T_KNEEL, "SHE PULLS HIM UP"], [T_HOLD, "OUT TOGETHER"]];
        const BOTSEQ = [[0.45, "STUCK TOGETHER"], [T_CROUCH, "HE LIFTS HER"], [T_LEAVE, "SHE WALKS AWAY", "#ff3b30"], [T_SIT, "LEFT BEHIND", "#ff3b30"]];
        const HEAD = [[0, "LOVE IS A ROPE."], [T_T1, "YOU CLIMB OUT TOGETHER"], [T_T2 + 0.3, "OR NOT AT ALL."]];
        E("head").style.top = "236px";
        E("head").style.fontSize = "30px";
        E("head").style.letterSpacing = "0.16em";
        E("head").style.lineHeight = "1.6";

        const dim = document.createElement("div");
        dim.style.cssText = "position:absolute;inset:0;background:#000;opacity:0";
        E("stage").appendChild(dim);
        const card = document.createElement("div");
        card.id = "card";
        card.style.cssText = "position:absolute;left:100px;right:100px;top:640px;text-align:center;font-family:HFMono,monospace;font-weight:700;color:#fff;letter-spacing:0.08em";
        card.innerHTML = `<div id="cm1" style="font-size:54px;line-height:1.25;text-shadow:0 0 18px rgba(255,255,255,0.35)"></div>
          <div id="cm2" style="font-size:42px;line-height:1.35;margin-top:26px;text-shadow:0 0 14px rgba(255,255,255,0.25)"></div>
          <div id="cq" style="opacity:0;margin-top:110px;font-size:29px;line-height:1.5;color:#bdbdbd;letter-spacing:0.05em">"WALKING WITH A FRIEND<br/>IN THE DARK IS BETTER THAN<br/>WALKING ALONE IN THE LIGHT."<div style="margin-top:22px;font-size:24px;color:#8a8a8a;letter-spacing:0.2em">HELEN KELLER</div></div>`;
        const cardCss = document.createElement("style");
        cardCss.textContent = "#card span.w { display: inline-block; margin: 0 0.16em; }";
        document.head.appendChild(cardCss);
        E("stage").appendChild(card);
        const slam = (words, times, t, red) => words.map((w, i) => {
          const q = clamp((t - times[i]) / 0.2, 0, 1);
          if (q <= 0) return `<span class="w" style="opacity:0">${w}</span>`;
          const sc = lerp(2.3, 1, backOut(q)), bl = (1 - q) * 6;
          return `<span class="w" style="transform:scale(${sc.toFixed(3)});filter:blur(${bl.toFixed(1)}px);${red.includes(i) ? "color:#ff3b30;" : ""}">${w}</span>`;
        }).join("");
        const fade = document.createElement("div");
        fade.style.cssText = "position:absolute;inset:0;background:#000;opacity:0";
        E("stage").appendChild(fade);

        const sheF = (t, both) => (t < T_LIFT ? 1 : t < T_OUT ? -1 : both ? 1 : -1);
        function render(t) {
          const mp = drawFig(tHe, livePose((x) => heRaw(x, true), t, 1.3), -1);
          const hf = sheF(t, true);
          const hp = drawFig(tShe, livePose((x) => sheRaw(x, true), t, 0.4), hf);
          tBun.setAttribute("cx", r1(hp.head[0] - hf * 25)); tBun.setAttribute("cy", r1(hp.head[1] - 16));
          // the rope: she lets it down and pulls him up
          const rOn = t > T_KNEEL && t < T_ON + 0.1;
          coilT.setAttribute("opacity", t < T_KNEEL ? 1 : 0);
          ropeT.setAttribute("opacity", rOn ? 1 : 0);
          if (rOn) { const a = hp.hands[0], b = t < T_GRAB ? [a[0] + 30, PF - 60] : mp.hands[0]; ropeT.setAttribute("d", `M${r1(a[0])} ${r1(a[1])} Q${r1((a[0] + b[0]) / 2 + 20)} ${r1((a[1] + b[1]) / 2 + 30)} ${r1(b[0])} ${r1(b[1])}`); }
          top.sun.setAttribute("opacity", (0.9 * win(t, T_ON, T_HOLD)).toFixed(3));
          const hq = clamp((t - T_HOLD) / 0.35, 0, 1), beat = 1 + 0.08 * Math.max(0, Math.sin(t * 7)) * (t > T_HOLD + 0.4 ? 1 : 0);
          const hc = [(hp.head[0] + mp.head[0]) / 2, Math.min(hp.head[1], mp.head[1]) - 90];
          heart.setAttribute("opacity", t > T_HOLD ? 1 : 0);
          heart.setAttribute("transform", `translate(${r1(hc[0])} ${r1(hc[1])}) scale(${(backOut(hq) * 0.9 * beat).toFixed(3)})`);
          heartGlow.setAttribute("cx", r1(hc[0])); heartGlow.setAttribute("cy", r1(hc[1] - 4)); heartGlow.setAttribute("opacity", (0.9 * hq).toFixed(3));

          drawFig(bHe, livePose((x) => heRaw(x, false), t, 2.0), -1);
          const bf = sheF(t, false);
          const sp = drawFig(bShe, livePose((x) => sheRaw(x, false), t, 0.9), bf);
          bBun.setAttribute("cx", r1(sp.head[0] - bf * 25)); bBun.setAttribute("cy", r1(sp.head[1] - 16));
          const pOn = t > T_PHONE + 0.2 ? 1 : 0;
          const ph = [(sp.hands[0][0] + sp.hands[1][0]) / 2, (sp.hands[0][1] + sp.hands[1][1]) / 2];
          phone.setAttribute("opacity", pOn); phone.setAttribute("transform", `translate(${r1(ph[0] - 6)} ${r1(ph[1] - 6)})`);
          phoneGlow.setAttribute("opacity", (pOn * (0.85 + 0.15 * Math.sin(t * 5))).toFixed(3)); phoneGlow.setAttribute("cx", r1(ph[0])); phoneGlow.setAttribute("cy", r1(ph[1] - 10));
          // she drops the rope into the pit and walks away
          coilB.setAttribute("opacity", t < T_KNEEL ? 1 : 0);
          ropeB.setAttribute("opacity", t > T_KNEEL ? 1 : 0);
          { const fall = win(t, T_LEAVE, T_LEAVE + 0.5); const a0 = [EDGE + 10, FL - 4], a = [lerp(a0[0], P0 + 30, fall), lerp(a0[1], PF - 6, fall)], b = [lerp(EDGE + 40, P0 + 200, fall), lerp(PF - 40, PF - 4, fall)]; ropeB.setAttribute("d", `M${r1(a[0])} ${r1(a[1])} Q${r1((a[0] + b[0]) / 2 + 30 * (1 - fall))} ${r1((a[1] + b[1]) / 2 + 10)} ${r1(b[0])} ${r1(b[1])}`); }
          bot.dark.setAttribute("opacity", (0.5 * win(t, T_LEAVE, T_SIT + 0.6)).toFixed(3));

          topS.textContent = typed(TOPSEQ, t)[0];
          const [bs, bc] = typed(BOTSEQ, t);
          botS.textContent = bs; botS.style.color = bc || "#a8a8a8";
          E("head").innerHTML = HEAD.map(([t0, s], i) => `<div>${i === 0 ? s : s.slice(0, Math.max(0, Math.floor((t - t0) * 30)))}&nbsp;</div>`).join("");
          dim.style.opacity = (0.8 * win(t, T_CARD - 0.4, T_CARD)).toFixed(3);
          E("cm1").innerHTML = slam(["PULL", "EACH", "OTHER", "UP."], [T_CARD, T_CARD + 0.13, T_CARD + 0.26, T_CARD + 0.4], t, []);
          E("cm2").innerHTML = slam(["DON'T", "CLIMB", "AND", "LEAVE."], [T_CARD + 0.8, T_CARD + 0.92, T_CARD + 1.04, T_CARD + 1.16], t, [3]);
          E("cq").style.opacity = win(t, T_CARD + 1.5, T_CARD + 2.0).toFixed(3);
          fade.style.opacity = win(t, DUR - 0.3, DUR - 0.02).toFixed(3);
        }

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
        window.__timelines["main"] = tl;
        render(0);
        tl.seek(0);
      })();
    </script>
  </body>
</html>
