<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "HFMono";
        src: url("assets/fonts/consolab.ttf") format("truetype");
        font-weight: 700;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      #stage svg {
        position: absolute;
        inset: 0;
      }
      .mono {
        position: absolute;
        font-family: "HFMono", monospace;
        font-weight: 700;
        white-space: nowrap;
      }
      /* everything readable stays inside the Instagram safe area: x 120-960, y 220-1500 */
      #head {
        position: absolute;
        left: 0;
        right: 0;
        top: 222px;
        text-align: center;
        font-family: "HFMono", monospace;
        font-weight: 700;
        font-size: 38px;
        letter-spacing: 0.12em;
        line-height: 1.45;
        color: #fff;
        text-shadow: 0 0 16px rgba(255, 255, 255, 0.3);
      }
      #head .ghost {
        visibility: hidden;
      }
      #ctr {
        position: absolute;
        left: 0;
        right: 0;
        top: 430px;
        text-align: center;
        font-family: "HFMono", monospace;
        font-weight: 700;
        white-space: nowrap;
      }
      #ctr .lbl {
        font-size: 26px;
        letter-spacing: 0.24em;
        color: #9a9a9a;
        vertical-align: middle;
      }
      #num {
        display: inline-block;
        min-width: 2.4ch;
        font-size: 58px;
        letter-spacing: 0.08em;
        color: #fff;
        vertical-align: middle;
        text-shadow: 0 0 14px rgba(255, 255, 255, 0.35);
      }
      #tag {
        display: inline-block;
        min-width: 5.2ch;
        padding: 6px 12px 4px;
        font-size: 26px;
        letter-spacing: 0.18em;
        vertical-align: middle;
        visibility: hidden;
      }
      #tag.fail {
        visibility: visible;
        background: #d62a2a;
        color: #fff;
      }
      #tag.pass {
        visibility: visible;
        background: #fff;
        color: #000;
        box-shadow: 0 0 22px rgba(255, 255, 255, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="14" data-track-index="0">
        <svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
              <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.12" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0.04" />
            </linearGradient>
            <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.32" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="dustG" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#b5b5b5" stop-opacity="0.8" />
              <stop offset="1" stop-color="#b5b5b5" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="ply" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#d9c29b" />
              <stop offset="1" stop-color="#8f7858" />
            </linearGradient>
            <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#000" stop-opacity="0.45" />
              <stop offset="1" stop-color="#000" stop-opacity="1" />
            </linearGradient>
            <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="12" />
            </filter>
            <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="16" />
            </filter>
                      <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#d8c39c" />
              <stop offset="1" stop-color="#9c8461" />
            </linearGradient>
            <linearGradient id="doorL" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" />
              <stop offset="1" stop-color="#fff2d0" />
            </linearGradient>
          </defs>
          <!-- world: floor at world y 600 -> screen y 1400, world x 400 -> screen x 540 -->
          <g transform="translate(540 1400) scale(1.45) translate(-400 -600)">
            <g id="beams"></g>
            <g id="back"></g>
            
            <use href="#world" transform="translate(0 1200) scale(1 -1)" opacity="0.16" />
            <rect x="-200" y="600" width="1200" height="260" fill="url(#floorFade)" />
            <rect x="-600" y="858" width="2000" height="1400" fill="#000" />
            <rect x="-200" y="599" width="1200" height="2" fill="#2a2a2a" />
            <g id="world"></g>
          </g>
        </svg>
        <style>
  .lab3 { position: absolute; top: 430px; width: 360px; margin-left: -180px; text-align: center; font-family: "HFMono", monospace; font-weight: 700; font-size: 28px; letter-spacing: 0.2em; color: #fff; }
</style>
<div class="lab3" id="labP" style="left: 300px">PERFECTIONIST</div>
<div class="lab3" id="labA" style="left: 760px">ACTION TAKER</div>
        <div id="head">
          <div id="h1"></div>
          <div id="h2"></div>
        </div>
      </div>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="14" data-track-index="1"></audio>
    </div>

    <script>
      (function () {
        const DUR = 14;
        const FL = 600, BX0 = 380, BX1 = 520, BTOP = 410, TOPF = 404, SX = 250;
        const THIGH = 80, SHIN = 78, LEG = 154;
        const UARM = 64, FARM = 60, TORSO = 116, NECK = 12, HEADR = 31;
        const NS = "http://www.w3.org/2000/svg";
        const svgEl = (tag, attrs, parent) => {
          const e = document.createElementNS(NS, tag);
          for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(e);
          return e;
        };
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, p) => a + (b - a) * p;
        const ease = (p) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(p, 0, 1));
        const backOut = (p) => { p = clamp(p, 0, 1); const s = 2.2; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
        const win = (t, a, b) => ease((t - a) / (b - a));
        const rad = (x) => (x * Math.PI) / 180;
        const down = (a, f) => [Math.sin(rad(a)) * f, Math.cos(rad(a))];
        const up = (a, f) => [Math.sin(rad(a)) * f, -Math.cos(rad(a))];
        const r1 = (v) => Math.round(v * 10) / 10;
        const E = (id) => document.getElementById(id);
        let seed = 31;
        const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

        // ---------- rig v2 (from reel 05): blended poses, head/arm follow-through, breathing ----------
        function makeFig(parent, front, back, glow, id) {
          const g = svgEl("g", { id }, parent);
          if (glow) parent.insertBefore(svgEl("use", { href: "#" + id, filter: "url(#blur)", opacity: 0.45 }), g);
          const parts = { g };
          for (const [n, col] of [["armB", back], ["legB", back], ["torso", front], ["legF", front], ["armF", front]]) {
            const o = svgEl("path", { fill: "none", stroke: "#000", "stroke-width": 34, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            const w = svgEl("path", { fill: "none", stroke: col, "stroke-width": 22, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            parts[n] = [o, w];
          }
          parts.head = svgEl("circle", { r: HEADR, fill: front, stroke: "#000", "stroke-width": 6 }, g);
          return parts;
        }
        function ik(a, b, l1, l2, pick) {
          let dx = b[0] - a[0], dy = b[1] - a[1];
          let d = Math.hypot(dx, dy);
          const maxd = l1 + l2 - 0.5;
          if (d > maxd) {
            b = [a[0] + (dx / d) * maxd, a[1] + (dy / d) * maxd];
            dx = b[0] - a[0];
            dy = b[1] - a[1];
            d = maxd;
          }
          d = Math.max(d, Math.abs(l1 - l2) + 1);
          const al = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
          const base = Math.atan2(dy, dx);
          const c1 = [a[0] + Math.cos(base + al) * l1, a[1] + Math.sin(base + al) * l1];
          const c2 = [a[0] + Math.cos(base - al) * l1, a[1] + Math.sin(base - al) * l1];
          return [pick(c1, c2), b];
        }
        const P = (pts) => "M" + pts.map((p) => r1(p[0]) + " " + r1(p[1])).join("L");
        const setD = (pair, d) => {
          pair[0].setAttribute("d", d);
          pair[1].setAttribute("d", d);
        };
        // flat pose: hx hy torso head ax ay bx by | per arm a*/b*: sh el w tx ty
        function drawFig(parts, s, f) {
          const hip = [s.hx, s.hy];
          const tu = up(s.torso, f);
          const sh = [hip[0] + tu[0] * TORSO, hip[1] + tu[1] * TORSO];
          const nk = [hip[0] + tu[0] * (TORSO + NECK), hip[1] + tu[1] * (TORSO + NECK)];
          const hu = up(s.torso + s.head, f);
          const hc = [nk[0] + hu[0] * HEADR, nk[1] + hu[1] * HEADR];
          setD(parts.torso, P([hip, sh, nk]));
          parts.head.setAttribute("cx", r1(hc[0]));
          parts.head.setAttribute("cy", r1(hc[1]));
          const knee = (c1, c2) => (c1[0] * f > c2[0] * f ? c1 : c2);
          const elbow = (c1, c2) => (c1[1] - 0.5 * f * c1[0] > c2[1] - 0.5 * f * c2[0] ? c1 : c2);
          [["legF", [s.ax, s.ay]], ["legB", [s.bx, s.by]]].forEach(([n, ft]) => {
            const [kn, fo] = ik(hip, ft, THIGH, SHIN, knee);
            setD(parts[n], P([hip, kn, fo]));
          });
          const hands = [];
          [["armF", "a"], ["armB", "b"]].forEach(([n, k]) => {
            const u = down(s[k + "sh"], f);
            const el = [sh[0] + u[0] * UARM, sh[1] + u[1] * UARM];
            const v = down(s[k + "sh"] + s[k + "el"], f);
            const fk = [el[0] + v[0] * FARM, el[1] + v[1] * FARM];
            const w = clamp(s[k + "w"], 0, 1);
            const hand = [lerp(fk[0], s[k + "tx"], w), lerp(fk[1], s[k + "ty"], w)];
            const [e2, h2] = ik(sh, hand, UARM, FARM, elbow);
            setD(parts[n], P([sh, e2, h2]));
            hands.push(h2);
          });
          return { head: hc, hands, hip };
        }
        const KER = [-4, -3, -2, -1, 0, 1, 2, 3, 4].map((k) => [k * 0.03, Math.exp(-((k / 2.3) ** 2))]);
        function blend(raw, t) {
          const out = {};
          let ws = 0;
          for (const [dt, w] of KER) {
            const p = raw(clamp(t + dt, 0, DUR));
            for (const k in p) out[k] = (out[k] || 0) + p[k] * w;
            ws += w;
          }
          for (const k in out) out[k] /= ws;
          return out;
        }
        const LAGGED = ["head", "ash", "ael", "aw", "atx", "aty", "bsh", "bel", "bw", "btx", "bty"];
        function livePose(raw, t, phase) {
          const s = blend(raw, t);
          const lag = blend(raw, t - 0.05);
          for (const k of LAGGED) s[k] = lag[k];
          const br = Math.sin(t * 1.9 + phase);
          s.hy += br * 1.3;
          s.torso += br * 0.8;
          s.head += Math.sin(t * 1.2 + phase * 2) * 1.6;
          return s;
        }
        const ARMS = { ash: 8, ael: 12, aw: 0, atx: 0, aty: 0, bsh: -4, bel: 10, bw: 0, btx: 0, bty: 0 };
        const base = (o) => ({ hx: 0, hy: 0, torso: 3, head: 0, ax: 0, ay: FL, bx: 0, by: FL, ...ARMS, ...o });
        function standOn(x, f, fy) {
          return base({ hx: x, hy: fy - Math.sqrt(LEG * LEG - 15 * 15), ax: x + f * 15, ay: fy, bx: x - f * 15, by: fy });
        }
        const mixPose = (a, b, p) => {
          const o = {};
          for (const k in a) o[k] = lerp(a[k], b[k], p);
          return o;
        };

        // ---------- scene: one man polishes one perfect block; the other builds rough stairs up to a lit door ----------
        const cam = E("svg").children[1];
        const W = E("world");
        const beams = E("beams");
        const backG = E("back");
        const stairG = svgEl("g", {}, W);
        const figG = svgEl("g", {}, W);
        const fxG = svgEl("g", {}, W);
        const NB = 9, RUN = 50, RISE = 55, SBX = 500, T0 = 0.6, PER = 0.9;
        const TEND = T0 + NB * PER;                       // 8.7
        const lvl = (k) => FL - RISE * k;
        const px = (k) => (k === 0 ? 450 : SBX + RUN * (k - 1) + RUN / 2);

        // the lit door at the top of the stairs
        const DX = SBX + RUN * NB + 6, DY = lvl(NB);
        const doorBeam = svgEl("polygon", { points: `${DX + 10},-900 ${DX + 70},-900 ${DX + 140},${DY} ${DX - 60},${DY}`, fill: "url(#beam)", filter: "url(#soft)", opacity: 0.4 }, beams);
        const doorHalo = svgEl("rect", { x: DX - 30, y: DY - 170, width: 130, height: 180, rx: 24, fill: "#fff6dc", filter: "url(#soft)", opacity: 0.35 }, backG);
        svgEl("rect", { x: DX, y: DY - 140, width: 70, height: 140, fill: "url(#doorL)", stroke: "#000", "stroke-width": 6 }, backG);
        svgEl("rect", { x: DX - 6, y: DY, width: 120, height: FL - DY, fill: "#1a1a1a", stroke: "#000", "stroke-width": 5 }, backG);
        const pBeam = svgEl("polygon", { points: "120,-400 240,-400 330,600 30,600", fill: "url(#beam)", filter: "url(#soft)", opacity: 0.22 }, beams);

        // rough stairs: every block a little crooked
        const blocks = [];
        for (let k = 1; k <= NB; k++) {
          const g = svgEl("g", {}, stairG);
          const x = SBX + RUN * (k - 1), tilt = ((k * 37) % 7) - 3;
          svgEl("rect", { x, y: lvl(k) + 4, width: RUN, height: RISE * k - 4, fill: "#2a2520", stroke: "#000", "stroke-width": 4 }, g);
          svgEl("rect", { x: x - 2, y: lvl(k), width: RUN + 4, height: 18, rx: 3, fill: "url(#wood)", stroke: "#000", "stroke-width": 4, transform: `rotate(${tilt} ${x + RUN / 2} ${lvl(k) + 9})` }, g);
          blocks.push({ g, x, k });
        }
        // the perfect block + red level
        const PB = 210;
        svgEl("rect", { x: PB, y: FL - 54, width: 70, height: 54, rx: 3, fill: "url(#wood)", stroke: "#000", "stroke-width": 5 }, stairG);
        const shine = svgEl("rect", { x: PB + 8, y: FL - 50, width: 18, height: 4, rx: 2, fill: "#fff", opacity: 0.7 }, stairG);
        const level = svgEl("g", { opacity: 0 }, fxG);
        svgEl("rect", { x: -40, y: -10, width: 80, height: 12, rx: 3, fill: "#d62a2a", stroke: "#000", "stroke-width": 4 }, level);
        svgEl("rect", { x: -10, y: -8, width: 20, height: 8, rx: 3, fill: "#e8f6c0", stroke: "#000", "stroke-width": 2 }, level);
        const bubble = svgEl("circle", { cx: 0, cy: -4, r: 2.6, fill: "#2a2a2a" }, level);
        const dust = [];
        for (let i = 0; i < 6; i++) dust.push(svgEl("circle", { r: 2.4, fill: "#e0d2b2" }, fxG));

        const per = makeFig(figG, "#ffffff", "#dedede", true, "per");
        const act = makeFig(figG, "#ffffff", "#dedede", true, "act");
        const legH = Math.sqrt(LEG * LEG - 15 * 15);
        const LEVELS = [[2.0, 2.9], [5.0, 5.9], [8.0, 8.9], [11.0, 12.6]];
        const levelOn = (t) => LEVELS.some(([a, b]) => t > a && t < b);
        // perfectionist: kneels at the block and sands it, checks the level, shakes his head, sands again
        function perRaw(t) {
          const x = 150;
          const s = standOn(x, 1, FL);
          s.hy += 56; s.torso = 30; s.head = 18;
          s.ax = x + 40; s.bx = x - 30;
          const chk = LEVELS.reduce((v, [a, b]) => Math.max(v, win(t, a, a + 0.3) * (1 - win(t, b - 0.3, b))), 0);
          const sand = Math.sin(t * 14) * (1 - chk);
          s.aw = 1; s.atx = PB + 34 + 22 * sand; s.aty = FL - 58;
          s.bw = 1; s.btx = PB + 10 + 10 * sand; s.bty = FL - 56;
          // checking: hands off, leans in to read the level, shakes head
          s.atx = lerp(s.atx, PB + 30, chk); s.aty = lerp(s.aty, FL - 70, chk);
          s.head += chk * (10 + 14 * Math.sin(t * 9) * win(t % 3, 2.4, 2.6));
          s.torso += 8 * chk;
          return s;
        }
        // action taker: places a block, steps up, places the next one
        function actRaw(t) {
          if (t < T0) return standOn(px(0), 1, FL);
          if (t >= TEND) {
            const p = win(t, TEND + 0.2, TEND + 1.0);
            const s = standOn(lerp(px(NB), DX + 34, p), 1, lvl(NB));
            s.head = -10;
            return s;
          }
          const k = Math.floor((t - T0) / PER), q = (t - T0 - k * PER) / PER;
          const L0 = lvl(k), L1 = lvl(k + 1), X0 = px(k), X1 = px(k + 1);
          if (q < 0.45) {
            const b = Math.sin((Math.PI * q) / 0.45);
            const s = standOn(X0, 1, L0);
            s.torso = 8 + 34 * b; s.hy += 22 * b; s.head = 10 + 8 * b;
            s.aw = 1; s.atx = lerp(X0 + 30, X1 + 4, b); s.aty = lerp(L0 - 120, L1 + 6, b);
            s.bw = 1; s.btx = lerp(X0 + 20, X1 - 10, b); s.bty = lerp(L0 - 112, L1 + 10, b);
            return s;
          }
          const a = win(q, 0.45, 0.68), h = win(q, 0.55, 0.9), c = win(q, 0.68, 0.95);
          const s = standOn(lerp(X0, X1, h), 1, lerp(L0, L1, h));
          s.ax = lerp(X0 + 15, X1 + 15, a); s.ay = lerp(L0, L1, a) - Math.sin(Math.PI * a) * 26;
          s.bx = lerp(X0 - 15, X1 - 15, c); s.by = lerp(L0, L1, c) - Math.sin(Math.PI * c) * 22;
          s.hy = lerp(L0, L1, h) - legH + 6 * Math.sin(Math.PI * h);
          s.torso = 10 - 6 * h;
          return s;
        }
        const typed = (id, text, t, t0, cps) => {
          const n = clamp(Math.floor((t - t0) * cps), 0, text.length);
          E(id).innerHTML = "<span>" + text.slice(0, n) + '</span><span class="ghost">' + text.slice(n) + "</span>";
        };
        const fade = document.createElement("div");
        fade.style.cssText = "position:absolute;inset:0;background:#000;opacity:0";
        E("stage").appendChild(fade);

        // ---------- per-frame render ----------
        function render(t) {
          // camera: close on both, then follows the climb up and right, ending on the wide shot
          const z = win(t, 1.5, 9.4);
          const s = lerp(1.3, 1.0, z), cx = lerp(380, 560, z), sy = lerp(1400, 1520, z);
          cam.setAttribute("transform", `translate(540 ${r1(sy)}) scale(${s.toFixed(4)}) translate(${r1(-cx)} -600)`);

          // blocks pop in as he places them
          blocks.forEach((b) => {
            const tp = T0 + (b.k - 1) * PER + 0.2;
            const g = backOut(clamp((t - tp) / 0.25, 0, 1));
            b.g.setAttribute("opacity", t < tp ? 0 : 1);
            b.g.setAttribute("transform", `translate(${r1(b.x + RUN / 2)} ${lvl(b.k)}) scale(${g.toFixed(3)}) translate(${r1(-b.x - RUN / 2)} ${-lvl(b.k)})`);
          });
          drawFig(per, livePose(perRaw, t, 0.3), 1);
          const ja = drawFig(act, livePose(actRaw, t, 1.5), 1);
          act.g.setAttribute("opacity", (1 - win(t, TEND + 0.9, TEND + 1.4)).toFixed(3));
          const lo = levelOn(t);
          level.setAttribute("opacity", lo ? 1 : 0);
          level.setAttribute("transform", `translate(${PB + 35} ${FL - 54})`);
          bubble.setAttribute("cx", r1(6 + 2 * Math.sin(t * 3)));
          shine.setAttribute("opacity", (0.4 + 0.4 * Math.sin(t * 5)).toFixed(3));
          dust.forEach((d, i) => {
            const ph = (t * 2.5 + i / 6) % 1;
            d.setAttribute("cx", r1(PB + 20 + i * 8 + ph * 20));
            d.setAttribute("cy", r1(FL - 58 - ph * 30));
            d.setAttribute("opacity", lo ? 0 : (1 - ph).toFixed(3));
          });
          const inn = win(t, TEND + 0.6, TEND + 1.4);
          doorHalo.setAttribute("opacity", (0.35 + 0.45 * inn).toFixed(3));
          doorBeam.setAttribute("opacity", (0.4 + 0.3 * inn).toFixed(3));

          typed("h1", "NO STEP WAS PERFECT.", t, 9.4, 22);
          typed("h2", "EVERY STEP WAS TAKEN.", t, 10.6, 22);
          E("h1").style.color = `rgba(255,255,255,${(1 - 0.55 * win(t, 10.4, 10.8)).toFixed(3)})`;
