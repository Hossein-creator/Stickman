                      <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">

              <feOffset id="chR" in="SourceGraphic" dx="0" dy="0" result="r" />
              <feColorMatrix in="r" type="matrix" values="1 0 0 0 0  0 0.15 0 0 0  0 0 0.2 0 0  0 0 0 0.85 0" result="rr" />
              <feOffset id="chB" in="SourceGraphic" dx="0" dy="0" result="b" />

<svg id="fx" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>

    <script>
      (function () {
        const DUR = 28;
        const FL = 600, BX0 = 380, BX1 = 520, BTOP = 410, TOPF = 404, SX = 250;
        const THIGH = 80, SHIN = 78, LEG = 154;
        const UARM = 64, FARM = 60, TORSO = 116, NECK = 12, HEADR = 31;
        const NS = "http://www.w3.org/2000/svg";
        const svgEl = (tag, attrs, parent) => {
          const e = document.createElementNS(NS, tag);
          for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
          if (parent) parent.appendChild(e);
          return e;
        };
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const lerp = (a, b, p) => a + (b - a) * p;
        const ease = (p) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(p, 0, 1));
        const backOut = (p) => { p = clamp(p, 0, 1); const s = 2.2; return 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); };
        const win = (t, a, b) => ease((t - a) / (b - a));
        const rad = (x) => (x * Math.PI) / 180;
        const down = (a, f) => [Math.sin(rad(a)) * f, Math.cos(rad(a))];
        const up = (a, f) => [Math.sin(rad(a)) * f, -Math.cos(rad(a))];
        const r1 = (v) => Math.round(v * 10) / 10;
        const E = (id) => document.getElementById(id);
        let seed = 31;
        const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

        // ---------- rig v2 (from reel 05): blended poses, head/arm follow-through, breathing ----------
        function makeFig(parent, front, back, glow, id) {
          const g = svgEl("g", { id }, parent);
          if (glow) parent.insertBefore(svgEl("use", { href: "#" + id, filter: "url(#blur)", opacity: 0.45 }), g);
          const parts = { g };
          for (const [n, col] of [["armB", back], ["legB", back], ["torso", front], ["legF", front], ["armF", front]]) {
            const o = svgEl("path", { fill: "none", stroke: "#000", "stroke-width": 34, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            const w = svgEl("path", { fill: "none", stroke: col, "stroke-width": 22, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
            parts[n] = [o, w];
          }
          parts.head = svgEl("circle", { r: HEADR, fill: front, stroke: "#000", "stroke-width": 6 }, g);
          return parts;
        }
        function ik(a, b, l1, l2, pick) {
          let dx = b[0] - a[0], dy = b[1] - a[1];
          let d = Math.hypot(dx, dy);
          const maxd = l1 + l2 - 0.5;
          if (d > maxd) {
            b = [a[0] + (dx / d) * maxd, a[1] + (dy / d) * maxd];
            dx = b[0] - a[0];
            dy = b[1] - a[1];
            d = maxd;
          }
          d = Math.max(d, Math.abs(l1 - l2) + 1);
          const al = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
          const base = Math.atan2(dy, dx);
          const c1 = [a[0] + Math.cos(base + al) * l1, a[1] + Math.sin(base + al) * l1];
          const c2 = [a[0] + Math.cos(base - al) * l1, a[1] + Math.sin(base - al) * l1];
          return [pick(c1, c2), b];
        }
        const P = (pts) => "M" + pts.map((p) => r1(p[0]) + " " + r1(p[1])).join("L");
        const setD = (pair, d) => {
          pair[0].setAttribute("d", d);
          pair[1].setAttribute("d", d);
        };
        // flat pose: hx hy torso head ax ay bx by | per arm a*/b*: sh el w tx ty
        function drawFig(parts, s, f) {
          const hip = [s.hx, s.hy];
          const tu = up(s.torso, f);
          const sh = [hip[0] + tu[0] * TORSO, hip[1] + tu[1] * TORSO];
          const nk = [hip[0] + tu[0] * (TORSO + NECK), hip[1] + tu[1] * (TORSO + NECK)];
          const hu = up(s.torso + s.head, f);
          const hc = [nk[0] + hu[0] * HEADR, nk[1] + hu[1] * HEADR];
          setD(parts.torso, P([hip, sh, nk]));
          parts.head.setAttribute("cx", r1(hc[0]));
          parts.head.setAttribute("cy", r1(hc[1]));
          const knee = (c1, c2) => (c1[0] * f > c2[0] * f ? c1 : c2);
          const elbow = (c1, c2) => (c1[1] - 0.5 * f * c1[0] > c2[1] - 0.5 * f * c2[0] ? c1 : c2);
          [["legF", [s.ax, s.ay]], ["legB", [s.bx, s.by]]].forEach(([n, ft]) => {
            const [kn, fo] = ik(hip, ft, THIGH, SHIN, knee);
            setD(parts[n], P([hip, kn, fo]));
          });
          const hands = [];
          [["armF", "a"], ["armB", "b"]].forEach(([n, k]) => {
            const u = down(s[k + "sh"], f);
            const el = [sh[0] + u[0] * UARM, sh[1] + u[1] * UARM];
            const v = down(s[k + "sh"] + s[k + "el"], f);
            const fk = [el[0] + v[0] * FARM, el[1] + v[1] * FARM];
            const w = clamp(s[k + "w"], 0, 1);
            const hand = [lerp(fk[0], s[k + "tx"], w), lerp(fk[1], s[k + "ty"], w)];
            const [e2, h2] = ik(sh, hand, UARM, FARM, elbow);
            setD(parts[n], P([sh, e2, h2]));
            hands.push(h2);
          });
          return { head: hc, hands, hip };
        }
        const KER = [-4, -3, -2, -1, 0, 1, 2, 3, 4].map((k) => [k * 0.03, Math.exp(-((k / 2.3) ** 2))]);
        function blend(raw, t) {
          const out = {};
          let ws = 0;
          for (const [dt, w] of KER) {
            const p = raw(clamp(t + dt, 0, DUR));
            for (const k in p) out[k] = (out[k] || 0) + p[k] * w;
            ws += w;
          }
          for (const k in out) out[k] /= ws;
          return out;
        }
        const LAGGED = ["head", "ash", "ael", "aw", "atx", "aty", "bsh", "bel", "bw", "btx", "bty"];
        function livePose(raw, t, phase) {
          const s = blend(raw, t);
          const lag = blend(raw, t - 0.05);
          for (const k of LAGGED) s[k] = lag[k];
          const br = Math.sin(t * 1.9 + phase);
          s.hy += br * 1.3;
          s.torso += br * 0.8;
          s.head += Math.sin(t * 1.2 + phase * 2) * 1.6;
          return s;
        }
        const ARMS = { ash: 8, ael: 12, aw: 0, atx: 0, aty: 0, bsh: -4, bel: 10, bw: 0, btx: 0, bty: 0 };
        const base = (o) => ({ hx: 0, hy: 0, torso: 3, head: 0, ax: 0, ay: FL, bx: 0, by: FL, ...ARMS, ...o });
        function standOn(x, f, fy) {
          return base({ hx: x, hy: fy - Math.sqrt(LEG * LEG - 15 * 15), ax: x + f * 15, ay: fy, bx: x - f * 15, by: fy });
        }
        const mixPose = (a, b, p) => {
          const o = {};
          for (const k in a) o[k] = lerp(a[k], b[k], p);
          return o;
        };

        // ---------- "seen." (ONE-SIDED LOVE, format 2, he loves, she ignores): two rooms, a wall between them. DAY 1 "GOOD MORNING" -> seen. DAY 30 "HOW WAS YOUR DAY?" -> "k". DAY 90 he calls -> declined. DAY 365 "HAPPY 1 YEAR. I LOVE YOU." -> seen; his heart shatters, he puts the phone on the table and walks out. DAY 366 no good morning; she texts first; his phone lights up in an empty room. FOLLOW: he walks back in with a paper sign "DON'T LEAVE ME ON SEEN", flips it to "+ FOLLOW", a heart flies from her phone through the wall and hits it: "FOLLOWING". ----------
        const cam = E("svg").children[1];
        for (const el of Array.from(cam.children)) {
          const fill = el.getAttribute("fill") || "";
          if (fill.includes("floorFade") || fill === "#2a2a2a") { el.setAttribute("x", -1400); el.setAttribute("width", 3400); }
        }
        const W = E("world");
        const backG = E("back");
        const beams = E("beams");
        const roomG = svgEl("g", {}, W);
        const propG = svgEl("g", {}, W);
        const figG = svgEl("g", {}, W);
        const fxG = svgEl("g", {}, W);
        const frac = (v) => v - Math.floor(v);
        const sm = (t, a, b) => { const p = clamp((t - a) / (b - a), 0, 1); return p * p * (3 - 2 * p); };
        const stand = FL - Math.sqrt(LEG * LEG - 15 * 15);
        const reachTo = (s, k, p, hand = "a") => { if (s[hand + "w"] < 1e-6) { s[hand + "tx"] = p[0]; s[hand + "ty"] = p[1]; s[hand + "w"] = k; return s; } s[hand + "w"] = Math.max(s[hand + "w"], k); s[hand + "tx"] = lerp(s[hand + "tx"], p[0], k); s[hand + "ty"] = lerp(s[hand + "ty"], p[1], k); return s; };
        const hold = (s, a, b, r = 0.2) => win(s, a, a + r) * (1 - win(s, b - r, b));

        // ---------- beats ----------
        const C = [0, 4.3, 8.4, 12.2, 17.8];                  // DAY 1 / 30 / 90 / 365 / 366, max 2 s after each rejection
        const T_S1 = 0.9, T_A1 = 1.8, T_IG1 = 2.4, T_C1 = 2.6;
        const T_S2 = 4.9, T_A2 = 5.6, T_IG2 = 6.6, T_C2 = 6.8;
        const T_RING = 8.8, T_IG3 = 10.2, T_C3 = 10.4;
        const T_S4 = 12.8, T_A4 = 13.6, T_IG4 = 14.4, T_SHAT = 14.8, T_PUT = 15.5, T_GO = 16.0, T_OUT = 17.6;
        const T_WAKE = 18.2, T_HS = 19.0, T_HA = 19.7, T_L2 = 20.4, T_L3 = 21.4;
        const T_CTA = 23.6, T_IN = 23.9, T_FLIP = 25.3, T_HEARTF = 26.0, T_TAP = 26.6;
        const HX = 330, SHE = 840, WALLX = 560, TBX = 170;
        const chap = (s) => (s < C[1] ? 0 : s < C[2] ? 1 : s < C[3] ? 2 : s < C[4] ? 3 : 4);

        // ---------- two rooms ----------
        const warm = svgEl("circle", { cx: 300, cy: FL - 260, r: 420, fill: "url(#fireGlow)", opacity: 0.16 }, backG);
        const morning = svgEl("circle", { cx: 860, cy: FL - 300, r: 420, fill: "#ffe2a8", filter: "url(#soft)", opacity: 0 }, backG);
        svgEl("polygon", { points: `250,${FL - 520} 400,${FL - 520} 500,${FL} 160,${FL}`, fill: "url(#beam)", filter: "url(#soft)", opacity: 0.14 }, beams);
        svgEl("polygon", { points: `780,${FL - 520} 930,${FL - 520} 1030,${FL} 690,${FL}`, fill: "url(#beam)", filter: "url(#soft)", opacity: 0.14 }, beams);
        const cold = svgEl("rect", { x: -1400, y: -1400, width: 3400, height: 3400, fill: "#0c1428", opacity: 0 }, backG);
        svgEl("rect", { x: WALLX - 14, y: FL - 560, width: 28, height: 560, fill: "#1a1b20", stroke: "#3a3a42", "stroke-width": 6 }, roomG);
        // his door (left) + table
        svgEl("rect", { x: 20, y: FL - 300, width: 110, height: 300, fill: "#15171c", stroke: "#3a3a42", "stroke-width": 8 }, roomG);
        svgEl("circle", { cx: 112, cy: FL - 150, r: 7, fill: "#8a8a92" }, roomG);
        svgEl("rect", { x: TBX - 60, y: FL - 112, width: 120, height: 14, rx: 4, fill: "#5a4636", stroke: "#000", "stroke-width": 4 }, roomG);
        for (const dx of [-48, 40]) svgEl("rect", { x: TBX + dx, y: FL - 98, width: 10, height: 98, fill: "#4a3a2e", stroke: "#000", "stroke-width": 3 }, roomG);
        // her sofa (right room)
        svgEl("rect", { x: 760, y: FL - 104, width: 250, height: 54, rx: 14, fill: "#4a3e5a", stroke: "#000", "stroke-width": 5 }, roomG);
        svgEl("rect", { x: 950, y: FL - 210, width: 60, height: 160, rx: 16, fill: "#3e344c", stroke: "#000", "stroke-width": 5 }, roomG);
        svgEl("rect", { x: 770, y: FL - 50, width: 230, height: 50, fill: "#2e2638", stroke: "#000", "stroke-width": 5 }, roomG);

        // ---------- figures ----------
        const him = makeFig(figG, "#ffffff", "#dedede", true, "him");
        const bun = svgEl("circle", { r: 15, fill: "#ffffff", stroke: "#000", "stroke-width": 6 }, figG);
        const her = makeFig(figG, "#ffffff", "#e2e2e2", true, "her");
        figG.insertBefore(bun, her.g.previousSibling);
        const mkPhone = () => { const g = svgEl("g", {}, propG); const gl = svgEl("circle", { r: 70, fill: "url(#phoneGlow)", opacity: 0.6 }, g); const sc = svgEl("rect", { x: -10, y: -16, width: 20, height: 32, rx: 4, fill: "#bfe0ff", stroke: "#000", "stroke-width": 4 }, g); return { g, gl, sc }; };
        const phH = mkPhone(), phS = mkPhone();

        // heart meter above HIM: cracks one by one, shatters on DAY 365
        const HEART = "M0 30 C-66 -14 -50 -66 0 -36 C50 -66 66 -14 0 30 Z";
        const hm = svgEl("g", { opacity: 0 }, fxG);
        const hmGlow = svgEl("circle", { r: 60, fill: "url(#fireGlow)", opacity: 0.5 }, hm);
        const hmH = svgEl("path", { d: HEART, fill: "#ff3b30", stroke: "#000", "stroke-width": 5 }, hm);
        const cracks = ["M-2 -34 L6 -20 L-4 -8", "M-4 -8 L8 4 L-2 16", "M-2 16 L4 28 M-30 -30 L-18 -18 L-26 -6 M28 -28 L18 -14 L26 -2"].map((d) => svgEl("path", { d, fill: "none", stroke: "#000", "stroke-width": 5, "stroke-linejoin": "round", opacity: 0 }, hm));
        const shards = Array.from({ length: 6 }, (_, i) => svgEl("path", { d: ["M0 0 L-20 -16 L-6 -24 Z", "M0 0 L18 -18 L6 -26 Z", "M0 0 L-22 8 L-12 18 Z", "M0 0 L20 8 L10 20 Z", "M0 0 L-8 18 L6 22 Z", "M0 0 L-4 -20 L12 -14 Z"][i], fill: "#ff3b30", stroke: "#000", "stroke-width": 3, opacity: 0 }, fxG));

        // chat bubbles (world): blue = sent by him, grey = her
        const chat = (txt, w, blue, meta) => {
          const g = svgEl("g", { opacity: 0 }, fxG);
          svgEl("rect", { x: -w / 2, y: -36, width: w, height: 64, rx: 26, fill: blue ? "#2f7cf6" : "#e4e4e8", stroke: "#000", "stroke-width": 5 }, g);
          const tx = svgEl("text", { x: 0, y: 10, "font-family": "HFMono, monospace", "font-weight": 700, "font-size": 26, fill: blue ? "#fff" : "#222", "text-anchor": "middle" }, g);
          tx.textContent = txt;
          const mt = svgEl("text", { x: w / 2 - 6, y: 58, "font-family": "HFMono, monospace", "font-weight": 700, "font-size": 20, fill: "#9a9a9a", "text-anchor": "end", opacity: 0 }, g);
          mt.textContent = meta || "";
          return { g, mt };
        };
        const m1 = chat("GOOD MORNING ☀", 290, true, "SEEN 7:02"), m2 = chat("HOW WAS YOUR DAY? ♥", 350, true, "SEEN 18:40"), r2 = chat("k", 70, false);
        const m3 = chat("CALLING...", 210, true, "DECLINED"), m4 = chat("HAPPY 1 YEAR. I LOVE YOU ♥", 460, true, "SEEN 0:01"), h1 = chat("GOOD MORNING?", 270, false, "DELIVERED");
        m3.mt.setAttribute("fill", "#ff3b30");
        const env = svgEl("g", { opacity: 0 }, fxG);
        svgEl("rect", { x: -20, y: -14, width: 40, height: 28, rx: 4, fill: "#ffffff", stroke: "#000", "stroke-width": 4 }, env);
        svgEl("path", { d: "M-20 -14 L0 4 L20 -14", fill: "none", stroke: "#000", "stroke-width": 3 }, env);
        const rings = [0, 1, 2].map(() => svgEl("path", { fill: "none", stroke: "#7fb6ff", "stroke-width": 4, "stroke-linecap": "round", opacity: 0 }, fxG));

        // FOLLOW sign (world, in his hands)
        const sign = svgEl("g", { opacity: 0 }, fxG);
        const signInner = svgEl("g", {}, sign);
        const signBg = svgEl("rect", { x: -130, y: -70, width: 260, height: 140, rx: 10, fill: "#f6f2e8", stroke: "#000", "stroke-width": 6 }, signInner);
        const sT1 = svgEl("text", { x: 0, y: -14, "font-family": "HFMono, monospace", "font-weight": 700, "font-size": 30, fill: "#222", "text-anchor": "middle" }, signInner);
        const sT2 = svgEl("text", { x: 0, y: 30, "font-family": "HFMono, monospace", "font-weight": 700, "font-size": 30, fill: "#222", "text-anchor": "middle" }, signInner);
        const flyH = svgEl("path", { d: "M0 16 C-34 -6 -25 -34 0 -18 C25 -34 34 -6 0 16 Z", fill: "#ff3b30", stroke: "#000", "stroke-width": 4, opacity: 0 }, fxG);
        const burst = Array.from({ length: 10 }, () => svgEl("path", { d: "M0 10 C-22 -3 -16 -22 0 -12 C16 -22 22 -3 0 10 Z", fill: "#ff3b30", stroke: "#000", "stroke-width": 3, opacity: 0 }, fxG));

        function feetOn(x0, hx, STR, lift) {
          const p = (hx - x0) / STR;
          return [0, 0.5].map((o) => {
            const q = frac(Math.abs(p) + o + 1e-6), d = Math.sign(hx - x0) || 1;
            if (q < 0.5) return [hx + d * STR * (0.25 - q), FL];
            const ss = (q - 0.5) / 0.5;
            return [hx + d * STR * (-0.25 + 0.5 * ease(ss)), FL - Math.sin(Math.PI * ss) * lift];
          });
        }
        const walking = (x0, x) => { const ft = feetOn(x0, x, 100, 10), sw = Math.sin((Math.PI * 2 * (x - x0)) / 100); return base({ hx: x, hy: stand + 3 + 3 * Math.abs(sw), torso: 10, head: 26, ax: ft[0][0], ay: ft[0][1], bx: ft[1][0], by: ft[1][1], ash: 4 + 14 * sw, ael: 14, bsh: -4 - 14 * sw, bel: 14 }); };

        // ---- him ----
        const hisX = (s) => (s < T_GO ? HX : s < T_CTA ? lerp(HX, -120, sm(s, T_GO, T_OUT + 0.3)) : lerp(-120, 300, sm(s, T_IN, T_IN + 1.2)));
        const himDir = (s) => (s > T_GO + 0.1 && s < T_CTA ? -1 : 1);
        function himRaw(s) {
          const x = hisX(s);
          if (s > T_GO && s < T_OUT + 0.4) return walking(HX, x);
          if (s > T_IN && s < T_IN + 1.25) { const w = walking(-120, x); reachTo(w, 1, [x + 40, stand - 120]); reachTo(w, 1, [x - 20, stand - 120], "b"); return w; }
          const st = standOn(x, 1, FL);
          if (s < T_CTA) {
            // phone at chest, head down; typing taps before each send
            const tp = [T_S1, T_S2, T_S4].reduce((a, ts) => a + hold(s, ts - 0.6, ts, 0.1) * 3 * Math.sin(s * 40), 0);
            const look = s > T_SHAT - 0.2 ? 1 : 0;
            const put = win(s, T_PUT - 0.4, T_PUT);
            st.head = 24; st.torso = 6;
            reachTo(st, 1, [lerp(x + 40, TBX + 70, put), lerp(stand - 118 + tp, FL - 130, put)]);
            reachTo(st, 1 - put, [x + 30, stand - 112], "b");
            // DAY 90: phone at the ear
            const ear = hold(s, T_RING - 0.3, T_IG3 + 0.4, 0.25); reachTo(st, ear, [x + 26, stand - 150]); st.head = lerp(st.head, 4, ear);
            // after the shatter: head drops
            st.head = lerp(st.head, 38, win(s, T_SHAT, T_SHAT + 0.5) * look); st.torso += 10 * win(s, T_SHAT, T_SHAT + 0.5);
            return st;
          }
          // CTA: holds the sign up to the camera
          st.head = -4;
          reachTo(st, 1, [x + 110, stand + 20]); reachTo(st, 1, [x - 90, stand + 20], "b");
          return st;
        }
        // ---- her: on the sofa, phone ----
        function herRaw(s) {
          const st = base({ hx: SHE, hy: FL - 112, torso: 8, head: 26 + 2 * Math.sin(s * 1.3), ax: SHE - 70, ay: FL, bx: SHE - 50, by: FL });
          const glance = [T_A1, T_A2, T_A4].reduce((a, ta) => Math.max(a, hold(s, ta, ta + 0.8, 0.15)), 0);
          st.head += 6 * glance;
          const lol = hold(s, T_A4 + 0.9, T_IG4 + 0.9, 0.2); st.hy -= 4 * Math.abs(Math.sin(s * 18)) * lol;
          const tap = [T_IG2 - 0.4, T_IG3 - 0.15, T_HS - 0.4].reduce((a, tt) => a + hold(s, tt, tt + 0.35, 0.08) * 4 * Math.sin(s * 40), 0);
          reachTo(st, 1, [SHE - 44, FL - 230 + tap]); reachTo(st, 1, [SHE - 36, FL - 224], "b");
          if (s > C[4]) { st.head = lerp(st.head, 18, win(s, T_WAKE, T_WAKE + 0.4)); st.hy += 0; }
          return st;
        }

        // ---------- HTML overlays ----------
        const capCss = document.createElement("style");
        capCss.textContent = "#cap span.w { display: inline-block; margin: 0 0.16em; }";
        document.head.appendChild(capCss);
        const tag = document.createElement("div");
        tag.style.cssText = "position:absolute;left:120px;top:1450px;font-family:HFMono,monospace;font-weight:700;font-size:30px;letter-spacing:0.22em;color:#ff6a60";
        E("stage").appendChild(tag);
        const cap = document.createElement("div"); cap.id = "cap";
        cap.style.cssText = "position:absolute;left:110px;right:110px;top:320px;text-align:center;font-family:HFMono,monospace;font-weight:700;font-size:44px;color:#fff;letter-spacing:0.06em;text-shadow:0 0 14px rgba(255,255,255,0.3)";
        E("stage").appendChild(cap);
        const cut = document.createElement("div");
        cut.style.cssText = "position:absolute;inset:0;background:#000;opacity:0";
        E("stage").appendChild(cut);
        const fade = document.createElement("div");
        fade.style.cssText = "position:absolute;inset:0;background:#000;opacity:0";
        E("stage").appendChild(fade);

        // ---------- camera: one shot per chapter, hard cuts ----------
        const SHOTS = [[0, 1.12, 560, 400, 1.18], [C[1], 1.75, 790, 380, 1.85], [C[2], 1.75, 360, 380, 1.85], [C[3], 1.12, 560, 400, 1.16], [T_SHAT + 0.7, 1.4, 260, 400, 1.45], [C[4], 1.7, 800, 390, 1.8], [T_HA - 0.1, 1.6, 240, 400, 1.68], [T_L2 - 0.1, 1.12, 560, 400, 1.16], [T_CTA, 1.6, 300, 340, 1.85]];
        function camAt(s) {
          let k = 0; for (let i = 0; i < SHOTS.length; i++) if (s >= SHOTS[i][0]) k = i;
          const [a, z0, cx, cy, z1] = SHOTS[k], b = k + 1 < SHOTS.length ? SHOTS[k + 1][0] : DUR;
          return [lerp(z0, z1, sm(s, a, b)), cx, cy];
        }
        const CAPS = [[0.3, "HE TEXTS GOOD MORNING."], [T_IG1, "SHE LEAVES IT ON SEEN.", 4], [C[1] + 0.3, "HE ASKS ABOUT HER DAY."], [T_IG2, "SHE ANSWERS \"K.\"", 2], [C[2] + 0.3, "HE CALLS HER."], [T_IG3, "SHE DECLINES.", 1], [C[3] + 0.3, "ONE YEAR. HE STILL TRIES."], [T_IG4, "SEEN. NO ANSWER.", 0], [T_GO + 0.1, "HE PUTS THE PHONE DOWN."], [C[4] + 0.3, "THE NEXT MORNING..."], [T_HA, "NOW SHE TEXTS FIRST.", 3]];
        const TAGS = ["DAY 1", "DAY 30", "DAY 90", "DAY 365", "DAY 366"];
        function slamHTML(txt, t0, t, red) {
          return txt.split(" ").map((w, i) => {
            const q = clamp((t - t0 - i * 0.09) / 0.2, 0, 1);
            if (q <= 0) return `<span class="w" style="opacity:0">${w}</span>`;
            return `<span class="w" style="transform:scale(${lerp(1.8, 1, backOut(q)).toFixed(3)});filter:blur(${((1 - q) * 5).toFixed(1)}px);${red !== undefined && i === red ? "color:#ff3b30;" : ""}">${w}</span>`;
          }).join("");
        }
        const LIGHT = [1, 0.82, 0.66, 0.52, 0.38];
        E("head").style.top = "236px";
        E("head").style.fontSize = "30px";
        E("head").style.letterSpacing = "0.14em";
        E("head").style.lineHeight = "1.6";

        function render(t) {
          const s = t, c = camAt(s);
          cam.setAttribute("transform", `translate(540 1180) scale(${c[0].toFixed(4)}) translate(${r1(-c[1])} ${r1(-c[2])})`);
          const ch = chap(s);
          const mp = drawFig(him, livePose(himRaw, s, 0.3), himDir(s));
          const hp = drawFig(her, livePose(herRaw, s, 1.4), -1);
          bun.setAttribute("cx", r1(hp.head[0] + 25)); bun.setAttribute("cy", r1(hp.head[1] - 16));
          const away = s > T_OUT - 0.3 && s < T_IN + 0.2;
          him.g.setAttribute("opacity", away ? 0 : 1);
          if (him.g.previousSibling) him.g.previousSibling.setAttribute("opacity", away ? 0 : 0.45);
          const lvl = (s > T_C1 ? 1 : 0) + (s > T_C2 ? 1 : 0) + (s > T_C3 ? 1 : 0) + (s > T_SHAT ? 1 : 0);
          const TC = [T_C1, T_C2, T_C3, T_SHAT];
          const light = s > T_CTA ? 1 : lerp(LIGHT[Math.max(0, lvl - 1)], LIGHT[lvl], lvl ? win(s, TC[lvl - 1], TC[lvl - 1] + 0.6) : 1);
          him.g.style.filter = `brightness(${light.toFixed(3)})`;
          // phones
          const pH = s < T_PUT ? [mp.hands[0][0], mp.hands[0][1] - 6] : [TBX + 30, FL - 122];
          phH.g.setAttribute("transform", `translate(${r1(pH[0])} ${r1(pH[1])}) rotate(${s < T_PUT ? 0 : 90})`);
          phH.g.setAttribute("opacity", s > T_IN ? 0 : 1);
          const lit = s > T_HA && s < T_CTA;
          phH.gl.setAttribute("opacity", s < T_PUT ? 0.55 : lit ? (0.6 + 0.3 * Math.sin(s * 9)).toFixed(3) : 0);
          phH.sc.setAttribute("fill", s < T_PUT || lit ? "#bfe0ff" : "#2a2a30");
          const pS = [(hp.hands[0][0] + hp.hands[1][0]) / 2, (hp.hands[0][1] + hp.hands[1][1]) / 2 - 8];
          const buzz = [T_A1, T_A2, T_A4].reduce((a, ta) => a + (s > ta && s < ta + 0.3 ? 4 * Math.sin(s * 90) : 0), 0) + (s > T_RING && s < T_IG3 ? 3 * Math.sin(s * 80) : 0);
          phS.g.setAttribute("transform", `translate(${r1(pS[0] + buzz)} ${r1(pS[1])})`);
          phS.gl.setAttribute("opacity", (0.7 + 0.15 * Math.sin(s * 5)).toFixed(3));
          rings.forEach((r, i) => { const q = frac(s * 1.6 + i / 3), on = s > T_RING && s < T_IG3; const rr = 24 + 46 * q; r.setAttribute("d", `M${r1(pS[0] - rr)} ${r1(pS[1] - rr * 0.8)} A${r1(rr)} ${r1(rr)} 0 0 1 ${r1(pS[0] + rr)} ${r1(pS[1] - rr * 0.8)}`); r.setAttribute("opacity", on ? (1 - q).toFixed(3) : 0); });
          // envelope flights: his phone -> her phone (and hers -> his on DAY 366)
          const fl = [[T_S1, T_A1, 1], [T_S2, T_A2, 1], [T_IG2, T_IG2 + 0.6, -1], [T_S4, T_A4, 1], [T_HS, T_HA, -1]].find(([a, b]) => s >= a && s < b);
          if (fl) { const q = (s - fl[0]) / (fl[1] - fl[0]), A = fl[2] > 0 ? [mp.hands[0][0], mp.hands[0][1] - 20] : pS, B = fl[2] > 0 ? pS : [TBX + 30, FL - 130]; env.setAttribute("opacity", 1); env.setAttribute("transform", `translate(${r1(lerp(A[0], B[0], q))} ${r1(lerp(A[1], B[1], q) - 200 * Math.sin(Math.PI * q))}) rotate(${r1(20 * Math.sin(q * 6))})`); } else env.setAttribute("opacity", 0);
          // chat bubbles
          const above = (fig) => [fig.head[0], fig.head[1] - 120];
          const hb = above(mp), sb = above(hp);
          const bub = (B, a, b, p, ma) => { const k = hold(s, a, b, 0.1); B.g.setAttribute("opacity", k.toFixed(3)); B.g.setAttribute("transform", `translate(${r1(p[0])} ${r1(p[1])}) scale(${(0.6 + 0.4 * backOut(k)).toFixed(3)})`); B.mt.setAttribute("opacity", ma !== undefined && s > ma ? 1 : 0); };
          bub(m1, T_S1, C[1] - 0.05, [hb[0] + 40, hb[1]], T_IG1);
          bub(m2, T_S2, C[2] - 0.05, [hb[0] + 30, hb[1]], T_A2 + 0.3);
          bub(r2, T_IG2, C[2] - 0.05, [sb[0], sb[1]]);
          bub(m3, T_RING - 0.2, C[3] - 0.05, [hb[0] + 60, hb[1] - 30], T_IG3);
          bub(m4, T_S4, T_GO + 0.3, [hb[0] + 120, hb[1] - 10], T_IG4);
          bub(h1, T_HS - 0.2, T_CTA, [sb[0] - 40, sb[1]], T_HA);
          // heart meter above him
          const hx = mp.head[0], hy = mp.head[1] - 230, shat = s > T_SHAT;
          hm.setAttribute("opacity", s > 0.3 && !shat ? 1 : 0);
          const pulse = 1 + 0.06 * Math.max(0, Math.sin(s * 7)) * (lvl === 0 ? 1 : 0.4);
          const jolt = [T_C1, T_C2, T_C3].reduce((j, tc) => j + (s > tc && s < tc + 0.25 ? 6 * Math.sin((s - tc) * 80) * (1 - (s - tc) / 0.25) : 0), 0);
          hm.setAttribute("transform", `translate(${r1(hx + jolt)} ${r1(hy)}) scale(${(0.8 * pulse).toFixed(3)})`);
          cracks.forEach((e, i) => e.setAttribute("opacity", s > [T_C1, T_C2, T_C3][i] ? 1 : 0));
          hmH.setAttribute("fill", ["#ff3b30", "#e8332a", "#c42c26", "#9e2622"][Math.min(3, lvl)]);
          hmGlow.setAttribute("opacity", (0.5 * LIGHT[lvl]).toFixed(3));
          shards.forEach((e, i) => { const q = clamp((s - T_SHAT) / 1.2, 0, 1), a = (i / 6) * Math.PI * 2 + 0.4; const sx = HX + 70 * Math.cos(a) * q, sy = (stand - 330) + (-60 * Math.sin(a) - 30) * q + 520 * q * q; e.setAttribute("opacity", shat && q < 1 ? (1 - q * q).toFixed(3) : 0); e.setAttribute("transform", `translate(${r1(sx)} ${r1(sy)}) rotate(${r1(200 * q * (i % 2 ? 1 : -1))})`); });
          cold.setAttribute("opacity", (0.1 * Math.min(ch, 3) + 0.2 * win(s, T_GO, T_OUT) - 0.3 * win(s, T_CTA, T_CTA + 0.5)).toFixed(3));
          warm.setAttribute("opacity", (0.16 - 0.03 * Math.min(ch, 3) + 0.12 * win(s, T_CTA, T_CTA + 0.5)).toFixed(3));
          morning.setAttribute("opacity", (0.1 * hold(s, C[4], T_CTA, 0.4)).toFixed(3));

          tag.textContent = s < T_L2 - 0.2 ? TAGS[ch].slice(0, Math.floor((s - C[ch]) * 20) + 1) : "";
          let ci = -1; for (let i = 0; i < CAPS.length; i++) if (s >= CAPS[i][0]) ci = i;
          cap.innerHTML = ci >= 0 && s < T_L2 - 0.3 ? slamHTML(CAPS[ci][1], CAPS[ci][0], s, CAPS[ci][2]) : "";
          let cf = 0; for (const cc of [C[1], C[2], C[3], C[4]]) cf = Math.max(cf, 1 - Math.abs(s - cc) / 0.14);
          cut.style.opacity = clamp(cf, 0, 1).toFixed(3);
          const L2 = "SILENCE WAS HER ANSWER.", L3 = "NOW IT'S HIS.";
          E("head").innerHTML = `<div>HE TEXTED. SHE READ IT.</div><div>${L2.slice(0, Math.max(0, Math.floor((s - T_L2) * 26)))}&nbsp;</div><div style="color:#ff6a60">${L3.slice(0, Math.max(0, Math.floor((s - T_L3) * 26)))}&nbsp;</div>`;
          E("head").style.opacity = (1 - 0.8 * win(s, T_CTA + 1.0, T_CTA + 1.4)).toFixed(3);

          // ---- FOLLOW: the sign
          const sOn = s > T_IN + 1.0;
          sign.setAttribute("opacity", s > T_IN ? 1 : 0);
          const sc = [(mp.hands[0][0] + mp.hands[1][0]) / 2, (mp.hands[0][1] + mp.hands[1][1]) / 2 - 10];
          const fq = clamp((s - T_FLIP) / 0.4, 0, 1), sx = Math.abs(Math.cos(Math.PI * fq)), flipped = fq > 0.5;
          const tapped = s > T_TAP;
          const bump = tapped ? 1 + 0.1 * Math.sin(Math.PI * clamp((s - T_TAP) / 0.25, 0, 1)) : 1;
          sign.setAttribute("transform", `translate(${r1(sc[0])} ${r1(sc[1] - (sOn ? 0 : 0))}) scale(${bump.toFixed(3)})`);
          signInner.setAttribute("transform", `scale(${Math.max(0.02, sx).toFixed(3)} 1)`);
          signBg.setAttribute("fill", !flipped ? "#f6f2e8" : tapped ? "#ffffff" : "#ff3b30");
          sT1.textContent = !flipped ? "DON'T LEAVE ME" : tapped ? "FOLLOWING" : "+ FOLLOW";
          sT2.textContent = !flipped ? "ON SEEN." : tapped ? "✓ ✓" : "@SILENT.STICKMAN";
          sT1.setAttribute("font-size", flipped ? 40 : 30); sT2.setAttribute("font-size", flipped ? 22 : 30);
          sT1.setAttribute("fill", flipped && !tapped ? "#fff" : "#222"); sT2.setAttribute("fill", flipped && !tapped ? "#fff" : tapped ? "#2f7cf6" : "#222");
          sT1.setAttribute("y", flipped ? -4 : -14); sT2.setAttribute("y", flipped ? 40 : 30);
          // heart from her phone through the wall into the sign
          const hq = clamp((s - T_HEARTF) / (T_TAP - T_HEARTF), 0, 1);
          flyH.setAttribute("opacity", s > T_HEARTF && s < T_TAP ? 1 : 0);
          flyH.setAttribute("transform", `translate(${r1(lerp(pS[0], sc[0], hq))} ${r1(lerp(pS[1], sc[1], hq) - 160 * Math.sin(Math.PI * hq))}) scale(${(1 + 0.6 * hq).toFixed(2)})`);
          burst.forEach((e, i) => { const q = clamp((s - T_TAP) / 0.9, 0, 1), a = (i / 10) * Math.PI * 2; e.setAttribute("opacity", tapped && q < 1 ? (1 - q).toFixed(3) : 0); e.setAttribute("transform", `translate(${r1(sc[0] + Math.cos(a) * 220 * Math.sqrt(q))} ${r1(sc[1] + Math.sin(a) * 160 * Math.sqrt(q) + 40 * q)}) scale(${(1 - 0.5 * q).toFixed(2)})`); });
          fade.style.opacity = win(s, DUR - 0.4, DUR - 0.02).toFixed(3);
        }

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
        window.__timelines["main"] = tl;
        render(0);
        tl.seek(0);
      })();
    </script>
