<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>The Umbrella</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter Tight"; font-weight: 800; src: url("assets/fonts/inter-tight-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter Tight"; font-weight: 500; src: url("assets/fonts/inter-tight-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("assets/fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #04060c; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Inter Tight", sans-serif; }
      #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      /* keeps both families in use so the browser loads them for the canvas */
      #fontwarm { position: absolute; left: -9999px; font-family: "JetBrains Mono", monospace; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13" data-width="1080" data-height="1920">
      <canvas id="c" width="1080" height="1920"></canvas>
      <span id="fontwarm">0123456789</span>
      <audio id="score" src="assets/audio.wav" data-start="0" data-duration="13" data-track-index="1"></audio>
    </div>
    <script src="assets/engine.js"></script>
    <script src="scene.js"></script>
  </body>
</html>
